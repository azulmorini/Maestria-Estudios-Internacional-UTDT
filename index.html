s mercados, por ejemplo en el de vehículos eléctricos estadounidense, porque la IRA condiciona los beneficios a restringir encadenamientos con China. En julio de 2024 buscaba diversificar el origen de la IED. Además, el procesamiento usa energías contaminantes, implica deforestación y se sostiene con frágiles derechos laborales, lo que dificulta un acuerdo sobre minerales críticos con Estados Unidos y preocupa a la UE. El caso muestra que los países del Sur Global pueden desarrollar políticas autónomas y heterodoxas, y advierte sobre la importancia de incorporar la dimensión geopolítica.\n\n### México y la estrategia de soberanía energética\n\nLa estrategia productiva y comercial de México se centra casi íntegramente en la demanda estadounidense, por su membresía en el TLCAN, hoy T-MEC (desde 2020); entre 2014 y 2022 Estados Unidos explicó al menos el 75% de sus exportaciones de bienes (80% con Canadá), en una relación de interdependencia asimétrica. El petróleo es basal (reservas de unos 6 mil millones de barriles, producción de 1,9 millones diarios en 2022), aunque el 73% de la nafta se importa. Sin cuestionar íntegramente la interdependencia con Estados Unidos, López Obrador (AMLO), desde 2018, ensayó sorpresivamente una estrategia de «soberanía energética» y «autosuficiencia» para ganar autonomía: aumentar la producción petrolera y la participación estatal en el mercado eléctrico, garantizar el acceso a la energía, reducir la dependencia externa y preservarse de las «hegemonías». México pagó relativamente pocos costos por profundizar el uso de energías no renovables, contra las tendencias globales y las preferencias de los inversores, recurriendo a su posicionamiento estratégico. La autonomía estuvo muy presente en los discursos de la política petrolera, como lectura de la intensificación de las vulnerabilidades externas.\n\nAMLO revisó la reforma de Peña Nieto (2012-2018), que permitía a Pemex asociarse como empresa productiva, abrió contratos con privados para comprar electricidad, creó un regulador y licitaciones, y apuntaba a 35% de energías limpias para 2024. Durante su gobierno la inversión se orientó a hidrocarburos: en 2019 canceló las subastas de largo plazo con las que se proveían renovables, restringió los permisos de autoabastecimiento de grandes empresas (gran parte de la inversión renovable) y reformó el orden de despacho para dar prioridad a la CFE. El principal proyecto renovable, Puerto Peñasco, recibió el 2% de la inversión asignada a la refinería Olmeca; se modernizaron refinerías y Pemex recibió transferencias y reducción de impuestos. El litio fue nacionalizado con la estatal LitioMx, que aún no tiene explotaciones activas. Entre 2017 y 2022 la inversión en renovables cayó drásticamente: la participación de México en la inversión regional del sector pasó del 35% (2017) al 7% (2023).\n\nLas repercusiones internacionales negativas fueron pocas. La disputa con Iberdrola llevó a una «pausa» con España, resuelta diplomáticamente cuando Iberdrola transfirió el 55% de sus activos en México al Estado. Estados Unidos pidió en 2022 consultas bajo el T-MEC por trato discriminatorio y retrocesos en compromisos climáticos, sin avances significativos. La caída de la inversión privada en energía fue un costo previsto y aceptable, o incluso un objetivo, para dar protagonismo al Estado. La diplomacia económica activa con las empresas y sus países de origen ciñó los costos a la IED del sector energético, sin afectar el conjunto de la inserción internacional: la IED total alcanzó en 2023 su nivel más alto.\n\nLos gestos de autonomía se relacionan con el rol de México como proveedor industrial de Estados Unidos en tiempos en que este aleja de China la producción; en 2023 México aprobó beneficios fiscales a la inversión en diez sectores exportadores orientados al mercado estadounidense. A esto se suma la importancia de México en la gestión migratoria, prioritaria en la política doméstica estadounidense (acuerdo de 2019), que habría llevado a una política más laxa frente a las medidas energéticas de AMLO. En suma, México adoptó una estrategia energética nacionalista y estatista, centrada en fósiles, que frenó la inversión en renovables y afecta sus compromisos de París. Mediante capacidades nacionales, el aprovechamiento de la debilidad de la gobernanza internacional (bajo enforcement del régimen climático) y su posicionamiento frente a Estados Unidos (interdependencia, plataforma alternativa a China, migraciones y drogas), sostuvo una posición sui generis con costos relativamente bajos: la relación bilateral, que podría limitar la autonomía, funcionó a la inversa. La pertenencia al T-MEC, fruto de una inserción previa apoyada en instituciones e integración regional, le dio viabilidad. El caso sugiere una lectura con matices de la condicionalidad o permisividad del sistema, sin visiones maniqueas.\n\n## Comprender los cambios de la reconfiguración global para mejorar nuestra inserción internacional\n\n### Nuevo escenario internacional y reacción del Sur Global\n\nLos factores de competitividad y las reglas de las relaciones económicas internacionales ya no son los mismos: hay cambios profundos en las dinámicas de cooperación y competencia, un reposicionamiento de los sectores estratégicos y nuevos instrumentos de política. El status quo de la hiperglobalización ya no está en el horizonte. Los países desarrollados lideran el ritmo y la orientación de los cambios: sus capacidades de mercado, técnicas y fiscales les permiten anticiparse y moldear el camino, y recurren a acciones unilaterales antes que a una gobernanza multilateral que incluya a los de menor poder. Emerge un contexto de geopolítica, proteccionismo y fragmentación geoeconómica, con más riesgo e incertidumbre.\n\nSin embargo, el Sur Global no es mero espectador: los países de ingresos medios usan sus instrumentos de política comercial, industrial y de inversiones para reposicionarse, incorporando riesgos y oportunidades según sus sectores, la vulnerabilidad de sus cadenas y sus redes de cooperación. El momento presenta una ventana de oportunidad: el debilitamiento de la gobernanza económica internacional genera inestabilidad, pero también nuevos marcos de legitimidad para instrumentos como la política industrial, antes desfavorecidos en los organismos internacionales; y la atención a recursos del Sur Global (minerales críticos) y la interconexión entre geopolítica y economía le dan mecanismos de incidencia novedosos. Los instrumentos son tres y se combinan: fortalecimiento de capacidades nacionales, diversificación de riesgos y resiliencia, y aprovechamiento de acuerdos internacionales y diplomacia económica. Hay «agencia» para el Sur Global; la clave es configurar estrategias que reduzcan la vulnerabilidad externa e incrementen las capacidades nacionales y la proyección en sectores estratégicos.\n\nSudáfrica adoptó la diplomacia económica como componente clave de su política industrial, con cobertura y apalancamiento institucional para diversificar socios, promover la industria mediante TLC y cooperación y participar en foros multilaterales; ilustra la importancia de un buen diagnóstico, de las capacidades burocráticas, del uso estratégico de las redes de acuerdos y de la región como espacio prioritario. Brasil implementó Nova Indústria Brasil con seis misiones informadas por el diagnóstico de la reconfiguración, combinando subsidios y crédito con regulación y compras públicas, y buscando legitimidad mediante la diplomacia económica y ambiental. Indonesia fortaleció capacidades con la prohibición de exportar níquel e integración vertical hacia las baterías, facilitada por la jerarquización estratégica del sector y una gobernanza más permisiva, pero sin desarrollar cobertura o balanceo, lo que la expone al poder chino: ignorar los equilibrios internacionales puede poner en riesgo los objetivos económicos y el margen de maniobra. México priorizó la soberanía energética mediante la «repetrolización», contra la transición a renovables; la permisividad de la gobernanza y su poder relativo por la interdependencia con Estados Unidos le abrieron espacio, mostrando que una posición estratégica puede ser palanca suficiente para desviarse de las normas globales.\n\nLos cuatro combinan acciones para mejorar su inserción y reducir vulnerabilidad, aprovechando los espacios de política del contexto. Indonesia, Sudáfrica y Brasil fortalecen capacidades redefiniendo sectores estratégicos; México lo hace en otro sector en función de su autonomía. Indonesia, Sudáfrica y México subrayan sus regiones e integración regional; la ausencia total del Mercosur en los instrumentos de Brasil es un llamado de atención sobre el cambio en la geografía regional. En todos hay un aprovechamiento de la permisividad de la gobernanza y un uso estratégico de acuerdos y diplomacia económica para apalancar o legitimar proyectos. Policy-mix: Sudáfrica (principal: diplomacia económica; complementarias: acuerdos internacionales, diversificación de riesgos, capacidades nacionales); Brasil (reindustrialización: capacidades nacionales, acuerdos, diversificación); Indonesia (nacionalismo de recursos: capacidades nacionales, acuerdos, diversificación); México (soberanía energética: capacidades nacionales, diversificación, acuerdos).\n\n### ¿Qué significa esto para la Argentina?\n\nPara Argentina es urgente conocer estas experiencias y tener una mirada incisiva y proactiva sobre las tendencias globales y las trayectorias de países semejantes. El país atraviesa una de sus más profundas crisis económica, social y político-institucional; para salir de ella necesita exportar mucho más y tener una orientación clara de inserción internacional, en vez de relegar la agenda externa y pro-exportadora ante las urgencias macroeconómicas y monetarias. El debate económico actual no cuenta con una lectura adecuada del sistema internacional: los acontecimientos globales se analizan poco y, cuando sucede, en una lógica doméstica polarizada y poco informada. Faltan mapas para revertir la larga década perdida en exportaciones, y la discusión del modelo económico no puede separarse del diagnóstico del escenario global. No se provee un recetario, sino una contribución a comprender el entorno; seguir relegando la dimensión externa tiene un costo de oportunidad elevado. Conclusiones:\n\n1. **Un diagnóstico adecuado de la reconfiguración global es precondición para adaptar las estrategias de inserción.** No hay que caer en lecturas maniqueas: existen oportunidades institucionales y regulatorias (espacios en la OMC, la discusión de la nueva política industrial en el FMI) y estratégicas (minerales críticos, relocalización). Los nuevos acuerdos pueden potenciar industrias, mientras las regulaciones externas del proteccionismo emergente condicionan la proyección de productos y servicios nacionales; hace falta una mirada balanceada.\n2. **Los países del Sur Global tienen «agencia» y pueden generar estrategias para una mejor inserción.** Hay tres tipos de acciones que se combinan: fortalecimiento de capacidades nacionales, cobertura y diversificación de riesgos, y aprovechamiento de mecanismos internacionales institucionalizados. La geopolítica y las regulaciones ambientales deben contemplarse, y las estrategias requieren redefinir los sectores estratégicos, que orientan las políticas de inserción.\n3. **La política exterior es más importante que nunca en las estrategias productivas del Sur Global.** Las sinergias entre los objetivos de política económica e industrial y los instrumentos de política exterior y diplomacia económica son estratégicas; lo doméstico y lo sistémico son un continuum. Un vínculo estratégico o una inserción en múltiples plataformas pueden apalancar capacidades frente a los shocks. La integración regional fue un pilar en tres de los cuatro casos (desde Argentina, no puede dejar de subrayarse la falta de políticas hacia el Mercosur en la estrategia de Brasil).\n4. **La coordinación entre agencias del Estado y la articulación de las agendas de política exterior y desarrollo económico son capacidades clave.** El fortalecimiento de las capacidades de diagnóstico y la coordinación burocrática diferencian a los Estados; el nexo entre política económica y política exterior, errático en Argentina, tiene implicancias para el diseño institucional y para programas específicos que aprovechen las sinergias entre lo externo y lo interno."}}}, "EI03-c2": {"extras": [{"ejercicios": [], "leido": false, "resumen": "## Sesión 2 (10/3). Génesis y escuelas de la Economía Política Internacional\n\n### Conceptos básicos\n\nLa teoría de la dependencia surge en los sesenta; la EPI, en los países centrales en los setenta. Aparecen nuevos actores de identidad más difusa (FMI, BM), la desregulación bancaria da lugar a la esfera financiera y surgen grupos de coordinación (OPEP, integración europea, ONU): algo más mezclado que empresas y Estados. Estos cambios generan la globalización y nuevas preguntas; la economía internacional minimizaba el rol de la política.\n\n**Tres sucesos de los setenta muestran la insuficiencia de los marcos teóricos:** un pueblo pobre le gana a Estados Unidos (rompe los supuestos realistas); la caída de Bretton Woods cuestiona la mirada idealista de que los acuerdos dan estabilidad; la crisis del petróleo demuestra la interdependencia entre lo político y lo económico.\n\nLa economía internacional miraba mercados sin política y las RRII política sin economía: hay que hacerlas dialogar. La economía política antecede a la economía: Adam Smith habla de economía política, y la «castración» viene de los neoclásicos, una desviación. Autores retoman esa mirada a nivel nacional; Strange dice que hay que verla en el sistema internacional. Dentro de los mercados hay política y dentro de los Estados hay política. Ningún mercado, nacional o internacional, opera en el vacío: todos están regulados, aunque no haya una regulación global consensuada. No se puede separar la economía de la política ni lo doméstico de lo internacional. Alta política, cancillería; baja política, secretarios. **Internacional:** relaciones entre Estados. **Transnacional:** actores que se internacionalizan por afuera de los Estados.\n\n### Escuelas de las que se nutre la EPI\n\n• **Mercantilismo → realismo:** gano a costa de otro.\n• **Interdependencia → liberalismo:** el Estado garantiza los marcos regulatorios y el comercio puede generar beneficios mutuos (no convergencia).\n• **Marxismo:** la superestructura; supuestamente no entendía el colonialismo, luego se complejiza. Lenin usa el imperialismo para explicar Rusia y por qué falla (saltear etapas).\n• **Dependencia:** desarrollo y subdesarrollo; crítica a la «neutralidad» del mercado, que no es neutral porque hay poder.\n• **Neogramscianos (críticos):** hegemonía como coerción más consenso; rol central de la cultura y la sociedad civil; hegemonía global por consenso e instituciones.\n• **Constructivismo:** todo se construye socialmente; algunos ven protección donde otros ven amenaza, según la identidad desde la que se miran los comportamientos; los Estados son instituciones socialmente construidas.\n\nTeóricos no es lo mismo que escuelas (epistémicas). **Cox** hace hincapié en las identidades en la economía política: más gramsciano, supera la mirada marxista poniendo la cultura, el partido y los bloques históricos como protagonistas; esa sofisticación genera la hegemonía como consenso más coerción. El impacto del fordismo en la clase obrera como clase (Gramsci). La relación entre Estado y mercado se trata distinto en cada escuela.\n\n### Escuela norteamericana\n\nCuestiona al realismo por la competencia estratégica entre Estados, porque existe una lógica de cooperación con ventajas y más capas para observar y negociar. Ikenberry y Krasner están en la frontera porosa entre RRII y EPI. Su preocupación es la hegemonía: dado el problema de la anarquía, cómo la hegemonía puede resolverlo. Un Estado hegemónico para un orden liberal; para Kindleberger el hegemón debe generar beneficios para el resto: un líder que provea bienes públicos, que financie algo que le sirva a todos, y que lidere y arbitre esos bienes. Realismo periférico: Escudé.\n\nAparece una sociedad global que discute la fuerza y una nueva jerarquía que no es solo el PBI (lo nuclear), que genera nuevas guerras económicas; las guerras comerciales pueden escalar (en los ochenta, competencia entre Europa, Estados Unidos y Japón). La sociedad global está a medias (Huntington, «el choque de civilizaciones»). Teoría de juegos: gallina, dilema del prisionero. Grandes relatos (marxismo, religión) frente a miradas parciales. ¿Chomsky es EPI? Discute los Estados fallidos y pregunta cuál es el Estado fallido; la escuela americana también tiene autores críticos.\n\n### Escuela británica\n\nIntegra ciencia política, historia y sociología con métodos más amplios para entender las transformaciones sistémicas del mundo, el poder y la dominación global, con problemas éticos y políticos. Toma la producción y los pactos para la movilidad del capital, los bienes y el conocimiento: no dan estabilidad, sino que garantizan la demanda del capital. Niega que las instituciones sean equiparadoras: los liberales sostienen que la ley nos iguala y que las instituciones desarman los sistemas de poder en un orden basado en reglas; esa postulación es falsa, porque las relaciones de poder se cristalizan en las instituciones y las legitiman. La hegemonía es resabio de un imperialismo americano. Hay un único proceso de toma de decisiones en el que se vinculan política exterior y doméstica: buena parte de lo ocurrido con Bretton Woods y Vietnam es política de Estados Unidos, y la mirada sobre la cuestión hegemónica no sirve a nadie salvo a Estados Unidos.\n\nLos cuatro elementos constituyen el **poder estructural**, que funciona como un lobby: de ahí la relación entre política y economía. **Deep state:** grupos permanentes de poder, junto con el otro gran actor, la industria armamentística o conglomerado militar (Cox va más allá, más gramsciano); un lobby oculto, ni formal ni legalizado, fuera de las esferas de transparencia. No solo los Estados tienen poder.", "titulo": "Apuntes de clase · Sesión 2 (10/3): Génesis y escuelas de la EPI"}], "textos": {"0": {"ejercicios": [], "leido": false, "resumen": "## Introducción\n\nEn la obra de Oscar Wilde, Cecily llama «horrible» a la economía política. Pero buena parte de la economía política es dramática y casi toda es importante. El libro trata del campo académico de la Economía Política Internacional (EPI, o IPE en inglés), de su construcción como campo reconocido. Con mayúsculas, EPI designa el campo, un área de investigación intelectual que enseña a pensar las conexiones entre economía y política más allá de un solo Estado; sin mayúsculas, economía política internacional designa el mundo material, las múltiples conexiones entre economía y política en la vida real.\n\nEsas conexiones siempre fueron parte de las relaciones internacionales (RRII), pero la EPI como campo nació hace apenas unas décadas. Antes de los setenta, en el mundo anglófono, economía y ciencia política eran disciplinas completamente separadas, con pocos esfuerzos por unirlas, salvo excepciones sobre todo entre marxistas y otros fuera de la corriente «respetable». El movimiento amplio para integrar el estudio de los mercados y el análisis político es reciente; hoy se describe al campo como una «verdadera interdisciplina» (Lake). Su logro fue tender puentes entre disciplinas establecidas.\n\nUn campo académico existe cuando se desarrolla un cuerpo coherente de conocimiento que define un objeto de estudio, con estándares para formar y certificar especialistas, empleos en docencia e investigación, sociedades académicas y medios de publicación: una red institucionalizada de académicos, una comunidad de investigación con límites, recompensas y carreras propias. En ese sentido la EPI existe hace menos de medio siglo. El libro ofrece una historia intelectual del campo: cómo nació y por qué tomó la forma que tomó.\n\n### ¿A quién le importa?\n\nHay tres razones para una historia intelectual de la EPI. Primero, la importancia práctica del tema: todos somos afectados por el nexo entre economía y política en los asuntos internacionales. La gasolina viene de Arabia Saudita e Irán; las camisas de Wal-Mart, de China; gran parte del grano estadounidense se vende en Europa y Asia; más de la mitad de los billetes de la Reserva Federal circula fuera de Estados Unidos; el auto más popular del país lo produce Toyota. Todas estas relaciones de mercado tienen ramificaciones políticas.\n\nSegundo, el atractivo de las ideas con las que interpretamos el mundo. Un campo académico es un constructo mental que enseña a pensar la experiencia; una historia intelectual enseña de dónde vienen sus ideas. La construcción de un campo nunca está completa: refleja un mundo que cambia, y ideas y acontecimientos interactúan. Están en juego cuestiones de ontología (del griego «cosas que existen»: la naturaleza de la realidad; en ciencias sociales, cuáles son las unidades básicas de interés y sus relaciones clave) y de epistemología (del griego «conocimiento»: los métodos y fundamentos del conocer). Construir un campo requiere cierto consenso (una comprensión «intersubjetiva») sobre ambas, un lenguaje común; el proceso nunca es fácil.\n\nTercero, la calidad humana de la historia: las ideas no combaten en un vacío abstracto, son producto de la imaginación y enfrentan a unos académicos con otros. La historia intelectual es también una historia personal.\n\n### Diversidad\n\nLa EPI está unida por el esfuerzo de tender puentes entre la economía internacional y las RRII; ese es su común denominador. Pero no es un monolito: no hay consenso sobre qué es precisamente, y una vez nacida se desarrolló por caminos divergentes. Se la describe como «notoriamente diversa» (Payne) o directamente «esquizoide» (Underhill). Con demasiada frecuencia los estudiantes conocen una sola versión; el libro recuerda que hay varias, con aportes propios, y ayuda a entender por qué algunas ideas ganaron más peso.\n\nLa versión dominante, incluso hegemónica, es la desarrollada en Estados Unidos, apegada a las normas de la ciencia social convencional. En la «escuela estadounidense» se prioriza el método científico, un modelo de ciencia dura: positivismo y empirismo, según los cuales el conocimiento se acumula mediante observación objetiva y testeo sistemático. Para Krasner, la EPI está inserta en la metodología estándar de las ciencias sociales, que en lo esencial consiste en enunciar una proposición y contrastarla con evidencia externa. Se enfatiza la teoría de alcance medio, que evita las grandes visiones de la historia o la sociedad y se concentra en relaciones clave aisladas dentro de una estructura que se supone dada e inmutable (lo que los economistas llamarían equilibrio parcial frente a equilibrio general). Su ambición se limita conscientemente a lo que puede aprenderse por investigación racional y empírica. Aun sus críticos la reconocen como ortodoxia: en la cima de la jerarquía académica, fija el estándar mundial, y su historia es la del núcleo del campo. Por eso recibe más atención en el libro.\n\nPero no era la única forma posible de construir el campo; sus limitaciones autoimpuestas fueron cuestionadas en muchas partes del mundo: en Francia se enfatizan las cuestiones de regulación; en Alemania, las instituciones; en otros lugares, elementos marxistas. El libro se concentra en la alternativa surgida en Gran Bretaña y otros lugares del ex imperio como Canadá o Australia, más receptiva a vínculos con otras disciplinas y con mayor interés por cuestiones éticas o normativas: menos apegada al método científico y más ambiciosa en su agenda. Los contrastes son tan grandes que es legítimo hablar de una «escuela británica». La distinción no es estrictamente geográfica: son dos ramas de una comunidad común, que pueden integrar el mismo «colegio invisible» (Susan Strange, santa patrona de la escuela británica), pero con profundas diferencias ontológicas y epistemológicas. Cada estilo tiene fortalezas y debilidades; ninguno tiene la verdad exclusiva. Para completar la construcción de la EPI hay que tender puentes también entre sus escuelas.\n\n### Emprendedores intelectuales\n\nLos estudiantes dan por sentado el edificio de conceptos y teorías de la EPI, pero alguien tuvo que construirlo pieza por pieza, y sigue en construcción. Fue un logro colectivo, pero el liderazgo fue vital: una generación de investigadores pioneros que miraron más allá de sus disciplinas para ver la política y la economía de las RRII bajo una luz nueva. Son emprendedores intelectuales. Destacar su papel no implica una teoría de los Grandes Hombres, pero los individuos importan; como dijo Newton, vemos más lejos porque estamos sobre hombros de gigantes. Fueron economistas, politólogos e historiadores; algunos académicos de toda la vida, otros llegados tras otras carreras; algunos colaboraron, otros trabajaron aislados; discreparon y no siempre acertaron, pero de sus debates emergió el campo. El propio autor, formado en economía, entró a la EPI en 1970 al editar para Basic Books la primera serie de tratados sobre economía política internacional, que incluyó U.S. Power and the Multinational Corporation de Gilpin (1975) y dos libros suyos; trabajó casi siempre en dinero y finanzas internacionales («padrino de la mafia monetaria»), estuvo desde el comienzo y conoció a casi todos los involucrados.\n\n### Agencia y contingencia\n\nDos leitmotivs predominan. La agencia: el papel indispensable de la acción individual; las ideas pueden estar en el aire, pero hace falta iniciativa para tomarlas, y los pioneros contribuyeron escribiendo, formando estudiantes, animando colegas, editando o inspirando. La contingencia: la influencia inevitable del azar; no había nada inevitable en la forma específica del edificio, como muestran los contrastes entre escuelas. Los académicos son producto de muchas influencias (lugar, familia, formación, directores de tesis, trayectoria), y el emprendimiento depende de convicciones internas y de oportunidades y restricciones externas (serendipia). Otras circunstancias históricas habrían producido otras comprensiones: sin la Guerra Fría, que alentó una generosidad estadounidense sin precedentes, sin organizaciones como el GATT y el FMI o sin la memoria de la Gran Depresión, se habría pensado distinto sobre el poder, la gobernanza de los mercados o la cooperación. La sociología del conocimiento (Berger y Luckmann) da por sentado que «la realidad se define socialmente», siempre por individuos concretos en lugares concretos. Pero muchos en la EPI no reconocen cuánto su visión fue moldeada por individuos influyentes de otras épocas; como escribió Keynes, los locos con autoridad destilan su frenesí de algún escritorzuelo académico de años atrás.\n\n### El salón de la fama\n\nCualquier lista de emprendedores intelectuales generará disenso. Los nominados, en orden alfabético: Robert Cox, Robert Gilpin, Peter Katzenstein, Robert Keohane, Charles Kindleberger, Stephen Krasner y Susan Strange, los «Siete Magníficos». Son un grupo muy diverso: una británica (Strange), un canadiense (Cox), un estadounidense naturalizado (Katzenstein) y cuatro estadounidenses nativos; dos formados en economía (Kindleberger y Strange), uno en historia (Cox) y cuatro politólogos; solo cinco con doctorado; tres con largas carreras fuera de la academia (Cox, Kindleberger, Strange); nacidos entre 1910 y 1945. Pero comparten tres atributos: una amplia curiosidad intelectual que los llevó a buscar conexiones entre literaturas y tradiciones, prefiriendo tender puentes antes que especializarse en un nicho; una mente contraria, a veces iconoclasta, cómoda desafiando la sabiduría convencional; y una aguda sensibilidad a la experiencia, que los llevó a cuestionar teorías en desacuerdo con la evidencia, midiendo el valor de la erudición por cuánto aporta a entender el mundo real y no por la sofisticación del modelo. Sobre todo, los une la durabilidad de sus aportes: aunque temas como los «regímenes» o la teoría de la estabilidad hegemónica (TEH) parezcan pasados de moda, su influencia, sobre todo ontológica, es omnipresente; fijaron el lenguaje básico del campo.\n\n### Consenso\n\nHabrá quien critique omisiones o inclusiones. Pero la selección no es idiosincrática: el autor encuestó a 67 expertos, pidiendo hasta seis nombres de los más influyentes; de 45 respuestas surgieron 52 nombres, con votos concentrados en pocos. Keohane apareció en todas las respuestas; siguieron Gilpin (28), Katzenstein (20), Krasner (18), Strange (13) y Kindleberger (13). Solo faltó Cox (4 votos), probablemente porque la mayoría de los encuestados eran estadounidenses, que conocen poco su obra, pero se lo incluye por su impacto indeleble en la escuela británica. Una encuesta más formal a 1084 académicos de RRII en Estados Unidos (Peterson, Tierney y Maliniak) ubicó entre los veinte más influyentes a cinco de los Siete (Keohane primero, Gilpin décimo, Katzenstein undécimo, Krasner duodécimo, Cox decimoctavo); solo faltaron Kindleberger, economista, y Strange, británica.\n\n### Resumen\n\nNo es un libro de texto ni un relevamiento exhaustivo de la literatura, sino un ejercicio de análisis interpretativo, selectivo en cobertura y énfasis, centrado en los aportes a la teoría (conceptos, principios, proposiciones y conjeturas que forman el lenguaje común de la EPI). Está dirigido al «colegio invisible» y también a investigadores de disciplinas vecinas, estudiosos de la sociología del conocimiento y lectores generales, con un estilo accesible que entrelaza contexto histórico, semblanzas y algo de humor. Sostiene tres argumentos: el papel crítico de los emprendedores intelectuales, cuya agencia es indispensable; el papel igualmente crucial de la contingencia, que no hace todo arbitrario pero deja poco predeterminado dentro de los límites de la experiencia y la tradición; y la diversidad, que no es lamentable, porque la confrontación de perspectivas es fuente de crecimiento intelectual, siempre que haya compromiso y debate honesto: las escuelas estadounidense y británica son complementarias y tienen mucho que aprender una de otra.\n\n### Organización del libro\n\n**Capítulo 1:** nacimiento de la EPI en Estados Unidos, con Keohane (junto a Joseph Nye) y Gilpin. Pocos economistas tuvieron un papel inicial y la agenda fue tomada por politólogos; si la economía hubiera sido más proactiva, la EPI estadounidense podría haber evolucionado distinto. Irónicamente, la economía recuperó parte de la «propiedad» del campo en lo epistemológico: las metodologías de la escuela estadounidense imitan cada vez más a la economía, un «economicismo progresivo». **Capítulo 2:** desarrollo paralelo en Gran Bretaña desde el artículo de Strange de 1970, «International Economics and International Relations: A Case of Mutual Neglect», manifiesto por un «estudio moderno de la economía política internacional». La escuela británica acepta vínculos con otras disciplinas y se interesa por cuestiones normativas, en contraste con el positivismo y empirismo estadounidense; el resultado es un nuevo caso de negligencia mutua casi tan profundo como el que Strange deploraba. **Capítulo 3:** la Gran Pregunta de la transformación sistémica, de moda en los primeros años estadounidenses con la TEH siguiendo a Kindleberger, luego desvanecida, pese a que podríamos estar viviendo una transición histórica (la globalización); solo en la escuela británica, por influencia de Cox, sigue habiendo interés. Nada define mejor las diferencias entre escuelas. **Capítulo 4:** la gobernanza del sistema y la creciente «brecha de control» entre las aspiraciones y capacidades de los Estados por la interdependencia. Para la escuela estadounidense la respuesta son las instituciones internacionales, formas pautadas de cooperación entre Estados (los regímenes de Krasner, ampliados por Keohane); para la británica, un abanico más amplio de actores con autoridad. **Capítulo 5:** el Misterio del Estado: ¿es la unidad básica o un agente entre muchos? La tradición estadounidense da por sentado que la EPI trata de Estados y sus interacciones, pero no al modo realista tradicional de bolas de billar: Katzenstein abrió la caja negra a factores domésticos y luego ideacionales. Desde la perspectiva británica, la preocupación por el Estado revela la captura temprana del campo por politólogos (Keohane, Gilpin, Krasner); los británicos siguen a Strange y Cox y resisten subordinar la EPI al estudio de las RRII. **Capítulo 6:** ¿qué aprendimos? Si se mide por la capacidad de generalizar sin disputa, el éxito es escaso: ninguna teoría es aceptada universalmente. Si se mide por la capacidad de definir la agenda y hacer las preguntas correctas, el progreso es mayor, aunque las escuelas enseñan a hacer preguntas distintas: la estadounidense, sobre causas y consecuencias de las políticas públicas; la británica, sobre un rango más amplio de cuestiones sociales. El conocimiento creado es grande pero desordenado. **Capítulo 7:** ¿qué sigue? Hay que tender puentes entre pasado y presente, entre análisis racionalista y cognitivo y, sobre todo, entre las versiones estadounidense y británica.\n\n## Capítulo 3. Una Gran Pregunta\n\nEpígrafes: «Para que la economía mundial se estabilice, tiene que haber un estabilizador, uno solo» (Kindleberger). «La teoría es siempre para alguien y para algún propósito» (Cox).\n\nEl nacimiento de la EPI fue impulsado por la creciente interdependencia de las economías nacionales tras la Segunda Guerra. ¿Por qué cambió el entorno internacional, qué implicaba y qué cabía esperar? La transformación sistémica fue una de las primeras cuestiones del campo, una Gran Pregunta. Cada generación tiende a creer que vive una transición sin precedentes (quizás la mejor definición de transición sea el intervalo entre dos períodos de transición), pero pensar la transformación sistémica enriqueció el desarrollo del campo. En Estados Unidos estuvo de moda en los primeros años y luego se desvaneció, aun cuando esta vez podríamos estar viviendo una transición histórica, la era de la globalización; solo en la escuela británica persiste el interés. En ambas tradiciones el pensamiento fue moldeado por personas apasionadas por la historia: en Estados Unidos un economista, Kindleberger, cuyo primer amor fue la historia económica; en la británica el canadiense Cox, historiador de formación. Ambos pasaron años en el servicio público antes de la academia, lo que quizás alienta una perspectiva amplia.\n\n### Estabilidad hegemónica\n\n¿La economía impulsa a la política en la transformación del sistema o al revés? En Estados Unidos, donde los politólogos capturaron el campo, pareció natural pensar primero en la política y el Estado soberano. Incluso para liberales como Keohane y Nye, el Estado seguía siendo el actor central: el sistema se definía por el patrón de relaciones interestatales, función sobre todo de la distribución de capacidades. La variable clave era el poder de los Estados dominantes. En la posguerra el poder estaba concentrado en Estados Unidos, «Gulliver entre los liliputienses» (Keohane): un caso de manual de hegemonía, una preponderancia abrumadora de poder. Cuando nació la EPI, esa hegemonía parecía en declive y la transformación sistémica se equiparó con el declive hegemónico.\n\n¿Anunciaba el declive una era de inseguridad? La discusión se centró en la TEH, la idea de que la salud económica global depende de la presencia de una única potencia dominante. Durante dos décadas encabezó la agenda estadounidense antes de caer en el olvido. Se la describió como la primera teoría genuina de la EPI (los cínicos dirían que la única). Dominaron dos preguntas: una empírica (¿estaba realmente en declive la hegemonía estadounidense?) y una ontológica (¿era plausible la lógica de la teoría, era la hegemonía la clave de la estabilidad?). Para muchos británicos fue una distracción de académicos estadounidenses preocupados por el lugar de su país. Hoy se reconoce que la premisa fue siempre algo infundada: la distribución del poder no había cambiado tanto, y en términos empíricos el debate fue sobre una no-cuestión. Pero en términos ontológicos fue muy instructivo y aportó a la comprensión de cuestiones como la gobernanza del sistema: la teoría murió de muerte natural, pero su legado sigue.\n\n### Surgimiento de una teoría\n\nKeohane le dio nombre en 1980: la TEH sostiene que «las estructuras hegemónicas de poder, dominadas por un solo país, son las más propicias para el desarrollo de regímenes internacionales fuertes cuyas reglas son relativamente precisas y bien obedecidas». Keohane no la originó ni estaba de acuerdo; el crédito corresponde al economista Kindleberger y a los politólogos realistas Gilpin y Krasner, que escribieron tras el colapso de Bretton Woods, visto por muchos como el comienzo del fin de la hegemonía estadounidense. El temor era que el declive de las estructuras hegemónicas anunciara el debilitamiento de los regímenes económicos correspondientes.\n\nEl lugar de honor es para Kindleberger (1910-2003). Doctorado en Columbia en 1937, durante la guerra seleccionó blancos de bombardeo para la Oficina de Servicios Estratégicos y luego, en el Departamento de Estado, tuvo un papel central en el inicio del Plan Marshall. Enseñó economía internacional e historia económica en el MIT durante unos treinta y tres años y siguió escribiendo hasta su muerte. Como su amigo Galbraith, tenía poca paciencia con el romance de la economía con las matemáticas promovido por colegas como Samuelson; moldeado por la depresión y la guerra, valoraba las soluciones prácticas antes que los modelos elegantes y le interesaba el panorama general más que los detalles (sus alumnos recuerdan sus errores aritméticos; Bhagwati: «La técnica la aprendías de otros. De Charlie aprendías ideas»). Valoraba la mente abierta por sobre los modelos parsimoniosos, y era famoso por su humor. Escribió más de treinta libros, de la economía internacional a la del desarrollo y finalmente a la historia económica, su verdadera pasión.\n\nEn su estudio clásico The World in Depression, 1929-1939 (1973) planteó la lógica de la TEH: el sistema económico y monetario internacional necesita liderazgo, un país dispuesto a fijar estándares de conducta bajo reglas internalizadas, a lograr que otros los sigan, a asumir una porción indebida de las cargas del sistema y a sostenerlo en la adversidad absorbiendo sus bienes excedentes, manteniendo el flujo de capital de inversión y descontando su papel. En los dos siglos previos parecía haber una correlación entre dominio de una gran potencia y estabilidad: el patrón oro clásico bajo liderazgo británico (Pax Britannica) y Bretton Woods bajo liderazgo estadounidense (Pax Americana). Tras la Primera Guerra faltó liderazgo: Gran Bretaña quería pero ya no podía; Estados Unidos podía pero, por razones políticas, aún no quería. Para Kindleberger, la depresión de 1929 fue tan amplia, profunda y larga porque el sistema se volvió inestable por la incapacidad británica y la falta de voluntad estadounidense de estabilizarlo. De ahí su aforismo: tiene que haber un estabilizador, uno solo. El libro fue un hito «aplastantemente influyente», inspirado no por la teoría sino por la práctica, por la lectura de los hechos históricos y su propia experiencia de la Depresión y del gobierno. En 1947, al frente de la sección de Asuntos Económicos de Alemania y Austria, preparó con dos colegas la propuesta de recuperación europea que fue base del discurso de Marshall en Harvard, y luego fue secretario ejecutivo del comité que estimó las necesidades de los dieciséis países receptores. Esos años le mostraron cuánto puede hacer un Estado dominante para domar una economía mundial díscola: la TEH era el Plan Marshall en grande.\n\n### Dos versiones\n\nComo economista sin formación en ciencia política, Kindleberger no conectó su lógica estadocéntrica con el juego de la política. Fiel a la tradición liberal, sus propósitos eran normativos: describir lo esencial para evitar el colapso. El núcleo de su argumento se entiende con la lógica de la acción colectiva de Mancur Olson: la estabilidad sistémica es un bien público, con no exclusión (otros se benefician aunque no contribuyan) y no rivalidad (el uso de uno no disminuye lo disponible para otros), y por eso será subprovista sin el liderazgo de una potencia dominante. Tres funciones son críticas: mantener un mercado relativamente abierto a las importaciones, proveer préstamos de largo plazo contracíclicos y suministrar financiamiento de corto plazo en las crisis. El hegemón podría cargar una porción desproporcionada de los costos, sobre todo si otros se comportan como free riders, como precio de la responsabilidad. Su versión es benevolente, un ejercicio benigno del poder, identificada luego con el institucionalismo neoliberal: la versión de «bienes colectivos» (Webb y Krasner).\n\nLos politólogos conectaron sin dificultad esa lógica con la política, en particular con una hegemonía ejercida coercitivamente en beneficio del líder a expensas de otros: el poder económico como medio y no como fin; por ejemplo, abrir mercados por la fuerza según las necesidades de seguridad del hegemón o amenazar con cortar comercio e inversión para obligar a compartir costos. Surgió así una versión de «seguridad», más afín al realismo, desarrollada por Gilpin y Krasner, excepciones entre realistas poco interesados en el cambio. Ya en 1972 Gilpin sugirió una conexión entre el ejercicio del poder en lo económico y la seguridad; algunos colegas se preguntaron si era marxista, pero él, republicano de Vermont, descubrió en un libro sobre mercantilismo (influido por el estudio de Jacob Viner de 1948) que se podía tener una visión realista de la economía mundial sin ser marxista. En U.S. Power and the Multinational Corporation, «la gran apertura» que abrió el espacio analítico de la EPI de los setenta y ochenta, sostuvo que una economía internacional liberal requiere una potencia que la gestione y estabilice, pero agregó una generalización histórica: la economía mundial moderna evolucionó por el surgimiento sucesivo de grandes economías nacionales dominantes; todo sistema económico descansa en un orden político particular y no puede entenderse sin la política. A una proposición normativa sobre funciones de estabilidad le injertó una tesis positivista: el cambio histórico es impulsado por la conducta interesada de los Estados poderosos.\n\nEn War and Change in World Politics (1981) el argumento se volvió una teoría de la evolución sistémica: una estructura social se crea para promover los intereses de sus miembros más poderosos; cuando cambia la distribución de capacidades, las potencias ascendentes buscan alterar las reglas a su favor mientras los beneficios superen los costos. La precondición del cambio político es el desajuste entre el sistema social existente y la redistribución del poder hacia quienes más ganarían con el cambio; la estabilidad hegemónica dura mientras no haya retadores. En The Political Economy of International Relations (1987) el tema se volvió pesimista: la hegemonía estadounidense de posguerra pudo ser interesada, pero sirvió al mundo suprimiendo el proteccionismo y gestionando crisis financieras; en los ochenta se había erosionado, y cabía preguntar quién reemplazaría ese liderazgo o si colapsaría la economía liberal.\n\nKrasner se centró en la estructura del comercio internacional. En «State Power and the Structure of International Trade» (1976), evocando a Hirschman, revisó siglo y medio de historia comercial y encontró una relación sistemática entre hegemonía y apertura: la apertura es más probable cuando un Estado hegemónico está en ascenso; son el poder y las políticas de los Estados los que crean orden donde habría caos (un argumento de «poder estatal»). Keohane le atribuye, más que a Kindleberger o Gilpin, haber fijado los términos de más de una década de trabajo. Como en Gilpin, el poder se suponía interesado: la estructura del comercio la determinan los intereses y el poder de Estados que maximizan objetivos nacionales. Y terminaba con pesimismo: con un declive estadounidense relativo, ¿no se acercaba un giro hacia el cierre? Ambos reconocieron su deuda con Kindleberger y vieron su aporte como agregar la dimensión política. Según Gilpin, Kindleberger, economista liberal, veía a Estados Unidos persiguiendo metas cosmopolitas como proyección ideológica de la fe en el libre mercado; Krasner y él lo desplazaron hacia el interés nacional. Cuando Keohane la nombró, la TEH ya tenía dos versiones: una benevolente, liberal, y otra coercitiva, realista; ambas muy controvertidas.\n\n### ¿El declive de la hegemonía?\n\nIrónicamente, la controversia descansaba en una premisa falsa: el entorno cambiaba, pero mucho menos de lo que se creía. En su momento la evidencia del declive parecía obvia: en 1950 Estados Unidos generaba un tercio del producto mundial y veinticinco años después menos de un cuarto; en manufacturas pasó de casi la mitad a menos de un tercio; su crecimiento fue menor que el de Europa continental y Japón; su porción del comercio cayó de 33% en 1948 a menos de 24% a mediados de los setenta; en 1971 los déficits forzaron el fin de la convertibilidad y el colapso de Bretton Woods; el mayor acreedor del mundo se volvía deudor neto, y el ex exportador de petróleo dependía de la OPEP. La premisa se volvió sabiduría convencional, simbolizada por After Hegemony de Keohane (1984), según el cual el «Siglo Americano» llegaba a su fin y era improbable que el liderazgo hegemónico revivera en ese siglo. El autor mismo coincidía: en 1974 escribió que Estados Unidos ya no era la potencia económica dominante y en 1983, que seguía siendo «preeminente pero ya no predominante».\n\nPocos disintieron. Strange, con su iconoclasia, sostuvo que la pérdida de hegemonía era un «mito»: Estados Unidos seguía dominando todas las estructuras clave de la economía global, incluida la tecnológica; el dólar seguía siendo la principal moneda internacional; sus servicios representaban la mitad del mercado mundial; y previó que seguiría pudiendo actuar como hegemón por bastante tiempo. Russett, evocando a Mark Twain, escribió que la hegemonía estadounidense morirá, pero las noticias tempranas de su muerte eran muy exageradas. En retrospectiva, los disidentes tenían razón: la predominancia de mediados de siglo fue una aberración producto de la movilización bélica y la devastación de otras áreas industriales; el resto del mundo iba a alcanzarla con la recuperación, y a fines de los ochenta las tendencias a la baja se habían estabilizado: Nye habló del «efecto Segunda Guerra que se desvanece» y, separándose de Keohane, sostuvo que Estados Unidos estaba «destinado a liderar». Krasner fue de los primeros en reconocer el error: en 1989 admitió que la posición estadounidense se había estabilizado y sus capacidades seguían siendo formidables. Finalmente también Keohane concedió que su libro de 1984, o al menos su título, había sido prematuro.\nStrange creía que un libro titulado con propiedad After Hegemony tendría que tratar sobre un futuro lejano, «y tenía razón; debería haberla escuchado antes» (Keohane). Aun desvanecido el efecto de la guerra, Estados Unidos mantuvo una ventaja sustancial, que en los últimos años del siglo XX incluso se amplió con el colapso soviético, que lo dejó como única superpotencia. En los noventa tuvo su expansión más larga en tiempos de paz, sin el desempleo europeo, el estancamiento japonés tras la burbuja ni las crisis financieras de los emergentes. Al comenzar el milenio su primacía volvía a ser indiscutida y se hablaba de un «Segundo Siglo Americano». Ya no un Gulliver, pero sí el número uno: el hegemón envejecido había renovado su vigencia.\n\n### Declive de una teoría\n\nEsto no significa que el debate fuera una pérdida de tiempo: el sistema real no cambió tanto, pero las ideas de los académicos sí, y algunos elementos básicos de la EPI estadounidense se construyeron al calor de la discusión sobre la verdad lógica y la capacidad predictiva de la TEH. En su forma más cruda, la TEH sostiene que la hegemonía es necesaria y suficiente para la estabilidad global, una proposición demasiado categórica, por atractiva que sea su parsimonia; sus predicciones no fueron apoyadas ni por la evidencia histórica ni por el razonamiento teórico. El liderazgo importa, pero los resultados dependen de mucho más que la concentración de poder.\n\nHistóricamente, la correlación entre dominio y estabilidad durante la Pax Britannica y la Pax Americana no resiste el análisis detallado. Krasner admitió que su argumento del «poder estatal» explicaba solo la mitad de los seis períodos que examinó (1820 a los setenta). Barry Eichengreen, analizando la génesis, el funcionamiento y la desintegración de tres órdenes monetarios (patrón oro clásico, entreguerras y Bretton Woods), encontró evidencia a favor y en contra: la relación entre el poder de mercado de la economía líder y la estabilidad es mucho más compleja que en las variantes simples de la TEH; la hegemonía no parece ni necesaria ni suficiente.\n\nEn lo teórico, Keohane, en After Hegemony, hizo una crítica devastadora de la versión de bienes colectivos: nada en la lógica de la acción colectiva limita el liderazgo a un solo Estado; un núcleo de dos o más Estados que cooperan puede sostener la estabilidad. Olson hablaba de un «grupo privilegiado», un núcleo de uno o más Estados que obtendría un beneficio neto aun absorbiendo todos los costos; Schelling, con la teoría de juegos, desarrolló la noción de «grupo k», un núcleo pequeño en el que la contribución de cada miembro puede condicionarse a la de los demás (en Olson, un «grupo intermedio»: ningún miembro obtiene beneficio neto individual, pero es lo bastante pequeño para que todos vean el efecto de su no cooperación). La preocupación por la hegemonía queda fuera de foco: la cuestión real son las condiciones que facilitan la producción de bienes públicos, por uno o por varios Estados. Para Snidal, la TEH es un caso especial: como la acción colectiva puede ser base alternativa de cooperación, sus posibilidades y requisitos deben incorporarse al análisis.\n\nDavid Lake cerró el debate en 1993 distinguiendo dos vertientes: la teoría del liderazgo, basada en la acción colectiva y centrada en la producción de estabilidad, redefinida como «infraestructura económica internacional»; y la teoría de la hegemonía, que explica los patrones de apertura a partir de las preferencias comerciales nacionales. Ambas señalan la importancia de los fundamentos políticos de la economía global y del papel de la política en su gobernanza: el poder importa no porque esté concentrado sino porque es relevante para la gestión de las relaciones económicas. Para Lake, el programa saltó a la fama por su atractivo intuitivo, y hay que resistir el error igual de rechazarlo: sensibilizó a una generación sobre los fundamentos políticos de la economía internacional, una idea que debe preservarse y desarrollarse.\n\n## Globalización\n\nTras el debate de la TEH, la fascinación por la Gran Pregunta decayó en la EPI estadounidense, una lástima, porque esta vez podría estar ocurriendo una gran transformación. La diferencia es que ahora el motor del cambio es la economía, no la política: la transformación se equipara no con la hegemonía sino con las fuerzas del mercado, con vínculos cada vez más amplios e intensos entre economías nacionales. La integración que Keohane y Nye captaron en su visión de la interdependencia compleja se volvió tan densa que una diferencia de grado podría estar volviéndose una diferencia de naturaleza: ya no sería posible hablar de mercados nacionales separados conectados por flujos. Muchos sienten que se crea un mundo rearticulado, que las economías nacionales son subsumidas en un sistema globalizado de procesos y estructuras transnacionales: la era de la globalización.\n\n### ¿Globalunático?\n\nNo hay definición estándar, pero en su dimensión económica la globalización se equipara con una integración cada vez más estrecha de los mercados nacionales, una transformación fundamental de la geografía económica: de economías territorialmente distintas hacia un mercado verdaderamente global; procesos de producción y mercados financieros que trascienden el espacio, redes sin consideración de distancias o fronteras, transacciones que comprimen el tiempo y vínculos más profundos. Representa una nueva organización espacial de la actividad económica.\n\n¿Es real? En la imaginación popular estadounidense no hay duda, alimentada por textos como The Borderless World (Ohmae) o One World, Ready or Not (Greider); Thomas Friedman sostiene que será recordada como un cambio fundamental como el surgimiento del Estado nación o la Revolución Industrial, y que por la tecnología y la competencia el mundo se volvió «plano». Tampoco hay duda en los márgenes radicales, entre quienes trabajan en el materialismo histórico (que pone las relaciones económicas y la organización social de la producción en el centro): la globalización es la última etapa del capitalismo global, basada en una lógica capitalista que transforma la organización social de la producción, la casi culminación de siglos de expansión de la producción capitalista.\n\nEn la corriente principal estadounidense hay mucho más escepticismo: algo significativo ocurre, pero hay menos de lo que parece. La globalización estaría sobrevalorada, más palabra de moda que ruptura; para algunos es puro «globaloney» o incluso «globaloony», tan mito como la hegemonía perdida. No es casual que el número del cincuentenario de International Organization (1999) no tuviera un solo artículo sobre el tema.\n\nLas razones del escepticismo varían. Para realistas como Gilpin y Krasner, la noción supone que la economía impulsa a la política y que los mercados dominan a los Estados, algo demasiado determinista que subestima la centralidad del Estado soberano («para bien o para mal, este sigue siendo un mundo dominado por Estados», Gilpin) y sobreestima las consecuencias de los cambios («estos desafíos no son nuevos; los gobernantes siempre operaron en un entorno transnacional», Krasner). Para otros el razonamiento es empírico: se aceleró la integración y siguió difundiéndose la interdependencia, pero eso no implica una transformación sistémica; la globalización es más de lo mismo, una etiqueta de moda: para Keohane y Nye, la globalización es una intensificación de lo que describieron como interdependencia en 1977. Entendida así, la globalización capturó la atención del campo (Milner), pero hay resistencia a toda interpretación más amplia y esfuerzo por desmontar los «mitos de la globalización».\n\nSolo unos pocos estadounidenses, como Miles Kahler y Katzenstein, toman en serio la posibilidad de una transformación sistémica, y aun así suelen analizarla por actores o áreas temáticas específicas. Geoffrey Garrett desagrega la integración en comercio, producción multinacional y finanzas, y encuentra fuentes distintas para cada una: una perspectiva fragmentada, no holística. Lo mismo con las consecuencias: un grupo encuentra que las estructuras corporativas siguen insertas en sus entornos institucionales y culturales nacionales; otro, con casos acotados (Kahler y Lake), obtiene «hallazgos variados y contingentes»: en la gobernanza monetaria, cierta presión a delegar autoridad hacia arriba, hacia arreglos supranacionales; en otros casos, tendencias a delegarla hacia abajo, a unidades subnacionales, o hacia afuera, a actores de mercado. No emerge una visión amplia.\n\n### Una pérdida de ambición\n\nEl escepticismo no es malo en sí, pero el desinterés estadounidense por la transformación sistémica revela una pérdida de ambición, un achicamiento de horizontes. Podría atribuirse a razones personales (tras el bochorno de la hegemonía, no arriesgar reputaciones otra vez), pero hay factores más fundamentales, epistemológicos y ontológicos, ligados a cómo se construyó el campo en Estados Unidos.\n\nEn lo epistemológico, la creciente estandarización metodológica. En la economía estadounidense, la metodología reduccionista alentó una investigación cada vez más acotada: las teorías amplias pasaron de moda y los estudios se centran en pequeñas ideas sobre conductas en contextos estrechos («nos movimos a una visión mucho más micro del mundo», Levitt). En busca de respeto profesional, la EPI siguió el mismo camino: en los primeros días Kindleberger o Gilpin podían «pensar en grande», pero con la «profesionalización» y el economicismo progresivo, si el desafío es formular modelos parsimoniosos e hipótesis falsables, hay que desagregar para volver el análisis tratable; los grandes temas quedan fuera, la teoría de alcance medio adentro, sin lugar para pensar el sistema como un todo.\n\nEn lo ontológico, lo que Michael Zürn llama las «ataduras analíticas del nacionalismo metodológico», que ve la autodeterminación nacional como ontológicamente dada y como la principal división política. Para la escuela estadounidense, los gobiernos nacionales siguen siendo los actores centrales y el sistema se define por relaciones interestatales; la transformación sistémica no se concibe sin un cambio drástico en la distribución de capacidades entre Estados. Esto descuenta la importancia de actores transnacionales cada vez más relevantes. Keohane y Nye, con la interdependencia compleja, proponían incorporar a todos los agentes con recursos y acceso a canales de comunicación para participar en relaciones políticas transfronterizas, pero los actores estatales siguieron acaparando el escenario mientras los procesos de mercado se internacionalizaban. Con estas comprensiones básicas, la escuela estadounidense se lavó las manos de la Gran Pregunta; su actitud puede llamarse tímida. Para estudios más ambiciosos hay que mirar a otra parte.\n\n## Órdenes mundiales\n\nEn la escuela británica la Gran Pregunta sigue alta en la agenda: Strange y sus seguidores creen que el mundo está en transición. En su manifiesto de 1970 escribió que el ritmo de desarrollo del sistema económico internacional se aceleró, sigue acelerándose y probablemente continuará, y que la interdependencia económica deja atrás al sistema político internacional, más estático y rígido; el tema del cambio acelerado la acompañó hasta su muerte. Cuando le preguntaron por sus héroes, empezó por Kindleberger, un raro economista al que no sentía necesidad de atacar. Pero fueron otros quienes elaboraron explicaciones formales de causas y consecuencias del cambio, sobre todo Cox, ignorado en Estados Unidos pero venerado como segundo solo después de Strange en el panteón británico.\n\n### Un desafiante de ortodoxias\n\nComo Kindleberger, Cox tuvo una carrera en el servicio público: máster en historia en McGill (1946), veinticinco años en la Oficina Internacional del Trabajo (OIT) en Ginebra, como jefe de gabinete del director general y luego jefe de la División de Programa y Planificación; cinco años en Columbia y, desde 1977, la Universidad de York hasta su retiro en 1992, a menudo colaborando con su esposa Jessie. Modesto (alguna vez, llegado tarde a un seminario y sin silla, se sentó en el piso el resto de la sesión), íntegro y generoso, aunque no reacio a la buena vida (un chalet en los Alpes suizos, el Campari con soda).\n\nLo más notable es su feroz independencia de juicio y su disposición a desafiar verdades establecidas, que atribuye a haber crecido como anglocanadiense en el Montreal francés y católico: desde temprano tendió a ver las contradicciones de los valores de su medio y a desafiar sus ortodoxias. Hay pocas verdades universales; las ideas son históricamente contingentes, arraigadas en un tiempo y lugar: es relativista hasta la médula. En la OIT se sentía como un antropólogo, observador participante de su nueva tribu: «estaba en ella pero no podía ser enteramente de ella». Promovía a la OIT como defensora de los trabajadores, pero resistía la presión a adoptar un único marco mental comprometido con la universalidad de prácticas euro-estadounidenses de relaciones laborales, históricamente contingentes: ¿qué pasaba con las masas agrícolas o los trabajadores marginales de los sectores informales? No aceptaba que hubiera una sola manera de organizar la producción. En los sesenta diseñó y luego dirigió el Instituto Internacional de Estudios Laborales, pensado con plena libertad intelectual; cuando en 1970 un nuevo director general quiso restringirla con criterios análogos al imprimatur católico, renunció, advirtiendo que las organizaciones internacionales necesitaban espíritu autocrítico y apertura al cambio social. Como académico sintió «una especie de liberación».\n\nSus primeras publicaciones, en revistas estadounidenses, fueron convencionales y centradas en la toma de decisiones en organizaciones internacionales; luego se volcó a la economía política (llegó a presidir el consejo editorial de International Organization en 1979-1980 y escribió en Transnational Relations and World Politics de Keohane y Nye). En York reapareció su formación histórica y abordó temas más ambiciosos: «las estructuras que subyacen al mundo». Publicó cada vez más en Gran Bretaña, más receptiva a un «paradigma histórico-relativista», donde Strange ya había sentado precedente con Sterling and British Policy, y sus trabajos se enseñaron ampliamente.\n\n### Estructuras históricas y fuerzas sociales\n\nEn 1981 publicó «Social Forces, States, and World Orders: Beyond International Relations Theory», texto icónico de la escuela británica, más influyente incluso que su monumental Production, Power, and World Order (1987). Los cambios en la economía mundial eran profundos y debían verse en su totalidad: no solo más interdependencia, sino el surgimiento de un nuevo orden mundial, una nueva estructura histórica que refleja la expansión e integración transnacional de la producción, con un realineamiento de fuerzas sociales: una nueva «estructura global de clases junto a, o superpuesta a, las estructuras nacionales de clase».\n\nSu punto de partida es la distinción entre teoría de «resolución de problemas» (la ciencia social positivista, casi todo lo que hace la escuela estadounidense) y teoría crítica, cuya diferencia principal es el tiempo. La primera es de corto plazo: supone tímidamente que los componentes principales del sistema, sobre todo los Estados, no cambian fundamentalmente; las estructuras son parámetros, un «presente continuo» que fija los límites de la acción; es ahistórica, se concentra en la acción y no en los límites y busca soluciones dentro del sistema existente. La teoría crítica adopta un horizonte de décadas o generaciones: sale de las relaciones existentes para destacar los orígenes del sistema y su potencial de desarrollo; las estructuras no son parámetros. Es «teoría de la historia», preocupada por el proceso continuo de cambio histórico; permite analizar la relación entre estructura y agencia, cómo surgieron los sistemas, qué cambios ocurren, cómo podrían moldearse, cuáles son las fuentes de conflicto y los patrones posibles de cambio. Cox puede reclamar ser el primer gran académico en aplicar la teoría crítica a las RRII, una alternativa «contrahegemónica» al canon; su distinción podría ser una autocrítica de su trabajo temprano o un regreso a sus raíces de historiador.\n\nSu visión de la ciencia positivista era algo injusta, porque la teoría de resolución de problemas también puede abordar la interacción entre estructura y agencia, pero la clave para él era el cambio histórico: estudiar la política mundial como diálogo entre pasado y presente que ofrece futuros alternativos. La teoría crítica era también una salida legítima para su espíritu crítico: el análisis no tiene por qué separarse de la ética; como Strange, creía en el propósito moral de la investigación: «La teoría es siempre para alguien y para algún propósito». En vez de dar por sentadas las instituciones y relaciones de poder, la teoría crítica las cuestiona; en vez de desagregar, mira el sistema en su conjunto buscando contradicciones y conflictos. La teoría de resolución de problemas es conservadora, porque no cuestiona los intereses servidos por el sistema y se ocupa de gestionar el mundo tal como es; la crítica «permite una elección normativa a favor de un orden social y político distinto». La pregunta clave, como para Strange: Cui bono?\n\nLa respuesta está en el concepto de «órdenes mundiales», estructuras históricas que resultan de tres categorías de influencias: capacidades materiales, ideas e instituciones. Las capacidades materiales (tecnología, modos de producción) se integran rápidamente a través de las fronteras, y la internacionalización de la producción genera nuevas comprensiones intersubjetivas de las relaciones sociales e innovaciones en las instituciones de gobierno, con claras implicancias distributivas. Cox rechazó el estadocentrismo: el Estado no puede analizarse aislado; el cambio debe pensarse como relación recíproca de estructuras y actores dentro del «complejo Estado-sociedad». Los resultados dependerán de las «fuerzas sociales», los principales actores colectivos engendrados por las relaciones de producción en todas las esferas: la producción internacional moviliza fuerzas sociales, y por ellas pueden anticiparse sus consecuencias políticas sobre los Estados y los órdenes futuros. El imperativo era apoyar a las fuerzas sociales que negocien «un mejor trato dentro de la economía mundial».\n\n### Fuentes\n\nInfluyó su experiencia: en Ginebra presenció la recuperación de Europa y Japón, el Mercado Común y el aparente declive estadounidense; y desde la OIT era natural conceptualizar el cambio en términos de fuerzas sociales y trabajo (en las burocracias, dónde uno está parado depende de dónde está sentado). Intelectualmente, la influencia más obvia es el marxismo, con su énfasis en las relaciones de clase y las fuerzas materiales de producción: el cambio se entiende dialécticamente, cada orden genera las contradicciones que lo transforman. Fue clave Antonio Gramsci, que enfatizó el poder de las ideas y estructuras de conocimiento surgidas de los intereses materiales de las clases dominantes; como él, Cox vio el control hegemónico de las ideas como central para legitimar un orden social. Otra inspiración fue La gran transformación de Polanyi (1944), con su «doble movimiento»: primero la expansión del mercado y luego el intento de la sociedad de protegerse de sus consecuencias disruptivas, de evidente parecido con la dinámica de los órdenes mundiales. También influyeron el enfoque de sistema-mundo de Wallerstein (la economía internacional como sistema integrado que resta peso a la política interestatal), la teoría de la dependencia, los ciclos largos de Modelski y el término «estructura histórica» de Braudel. Su erudición es ecléctica, pero también original y difícil de clasificar, por su disposición a tomar de tradiciones discordantes para crear un método. Él prefería ubicarse en el materialismo histórico, y se definió como «conservador» en el sentido de historicista: ideas y acontecimientos ligados en totalidades estructurales que condicionan las posibilidades de cambio, la necessità de Maquiavelo. Se lo llamó de todo, de neorrealista a neogramsciano, marxista «convencional» o de marxismo «aguado», en parte porque su noción de fuerzas sociales es más amplia que la de clase. Strange lo llamó «excéntrico» en el mejor sentido inglés, un solitario fugitivo de los campos intelectuales; él le devolvió el elogio.\n\n### Recepción\n\nEn Estados Unidos fue recibido con frialdad e incluso desprecio (una reseña dijo que su libro fracasaba tan completamente que ni el fracaso era interesante); entre los británicos su obra es tenida en la más alta estima. El rechazo estadounidense se explica por el desinterés en la Gran Pregunta tras la TEH, por una ontología que pone los modos de producción y no las relaciones estatales en el centro (el complejo Estado-sociedad choca con el nacionalismo metodológico) y, sobre todo, por la frustración con un enfoque tan distante de los estándares de la ciencia social estadounidense: un modo de conocimiento interpretativo, hermenéutico e historicista se presta al epíteto «no científico». Su eclecticismo denso en detalle histórico no encaja con la epistemología reduccionista; por la contingencia histórica, es difícil reducirlo a teoremas; por el horizonte largo, difícil convertirlo en proposiciones falsables; por mezclar observación y juicio moral, difícil evaluar la solidez de su razonamiento. Es más fácil descartarlo o ignorarlo.\n\nEn Gran Bretaña y otros puestos de la escuela británica, su materialismo histórico es quizás la alternativa más importante al realismo y al liberalismo, y muchos parten de él: Gill y Law (1989) se basan en su dinámica para explicar el poder estructural del capitalismo, más flexible que los «modos de economicismo» mecanicistas; Palan y Gills lo reconocen como fuente de su agenda «neoestructuralista»; Underhill describe el estudio del Estado dentro del complejo Estado-sociedad como «el problema de la economía política internacional». Atrae por su espíritu crítico y su dimensión normativa, en un país abierto a perspectivas críticas donde Strange ya alentaba la rebelión contra el Establishment; por su eclecticismo, que toma de la religión, la antropología, los estudios étnicos, el feminismo, la filosofía y la ecología para un conocimiento más integrado de los procesos de orden mundial; y sobre todo porque ofrece un marco para no perder de vista la Gran Pregunta: para académicos menos preocupados por el método científico que por la interpretación informada, su perspectiva amplia da el lenguaje para descubrir tendencias de largo plazo y buscar signos de transición histórica.\n\n## Globalización, otra vez\n\nPara Cox, el mundo atraviesa una gran fase de cambio estructural que remodela las relaciones sociales a escala global. La integración acelerada, con desregulación y privatización, da rienda suelta a los mercados para reforzar el poder de las clases privilegiadas, con resultados sombríos: conflicto social por la polarización entre ricos y pobres, protestas violentas, perspectiva de colapso financiero y amenaza de crisis de la biosfera. El problema es gestionar un equilibrio de poder económico que cambia radicalmente preservando la equidad social, erosionada por mercados no regulados; el desafío es promover un contramovimiento amplio, basado en la creatividad colectiva y la justicia social, que contenga los excesos del «capitalismo globalizador hiperliberal».\n\nNo sorprende que la globalización reciba más atención en la escuela británica. Para la estadounidense puede ser «globaloney»: si la teoría supone implícitamente un «presente continuo», la transformación genuina queda excluida por definición. Para los británicos, atentos a la longue durée de Braudel, la globalización es real: entramos en una nueva era («estamos en medio de un cambio estructural en el orden mundial», Gill y Mittelman). Se la analiza holísticamente, como fenómeno sistémico general, y sin temor al análisis normativo sobre justicia y equidad: aquí no hay timidez. Textos representativos para el mercado británico: Jones (1995), que revisa la globalización como tendencia dominante sin descuidar los valores e ideas que dirigen la acción humana; Ravenhill (2005), con la mitad de los capítulos sobre globalización; y Stubbs y Underhill (2006), con veintitrés de treinta y cuatro capítulos con alguna variante de la palabra en el título. Ninguno duda de que es real e importante. Incluso Strange, aunque no le gustaba el término, hablaba de las «fuerzas impersonales de los mercados mundiales», ya más poderosas que los Estados a los que supuestamente corresponde la autoridad política última. La escuela británica quiere hablar de globalización, pero en un diálogo de sordos a través del Atlántico, la estadounidense no escucha: allí las mentes están en otra parte."}, "1": {"ejercicios": [], "leido": false, "resumen": "## Capítulo 2. La naturaleza de la economía política\n\nEl estudio de la economía política está de moda entre historiadores, economistas y científicos sociales. Refleja que los mundos de la política y la economía, antes pensados como separados, se afectan mutuamente: la política está mucho más influida por la economía de lo que reconocen muchos politólogos, y la economía depende mucho más de los desarrollos sociales y políticos de lo que admiten los economistas.\n\nEn los últimos dos siglos hubo varias definiciones de «economía política». Para Adam Smith en La riqueza de las naciones (1776) era una «rama de la ciencia del estadista o legislador», una guía para la gestión prudente de la economía nacional; para John Stuart Mill, la ciencia que enseña a una nación a enriquecerse. Se enfatizaba la riqueza de las naciones, y lo «político» importaba tanto como lo «económico». A fines del siglo XIX, Alfred Marshall, padre de la economía moderna, abandonó el énfasis en la nación y en lo político: en sus Principios (1890) reemplazó «economía política» por «economics» y restringió mucho el dominio de la ciencia. Siguiendo la idea de una ciencia empírica y libre de valores, Lionel Robbins (1932) dio la definición que suscribe la mayoría: «la economía es la ciencia que estudia la conducta humana como relación entre fines y medios escasos que tienen usos alternativos»; en términos modernos, una ciencia universal de la toma de decisiones bajo restricción y escasez.\n\nA fines del siglo XX el término volvió a estar de moda, con diferencias y controversia. Para muchos economistas, sobre todo de la Escuela de Chicago, economía política significa ampliar el objeto de estudio: los supuestos sobre la motivación y las herramientas de la economía serían pertinentes para casi toda la conducta humana. Para Becker, Posner o Downs, el individualismo metodológico o modelo del actor racional se aplica a todo, de elegir pareja a votar presidente: la conducta se explica por el esfuerzo de los individuos por maximizar, satisfacer u optimizar su interés propio. Este «imperialismo económico» abarca el neoinstitucionalismo, la teoría de la elección pública y lo que los economistas llaman «economía política». Supone que los individuos crean instituciones y promueven objetivos sociales y políticos para avanzar sus intereses privados, con dos posiciones: que buscan instituciones y políticas que promuevan la eficiencia, o que la economía política designa la búsqueda de rentas (rent-seeking: usar un recurso para obtener un excedente sobre su retorno normal, como un arancel que encarece los bienes domésticos), por ejemplo el proteccionismo. Hay un fuerte sesgo normativo a suponer que las instituciones se crean para servir a la eficiencia.\n\nEl objetivo de largo plazo es volver endógenas a la ciencia económica explicaciones tradicionalmente consideradas exógenas, propias de la psicología, la sociología o la ciencia política. «Endógeno» significa que una acción se explica plenamente como esfuerzo consciente por maximizar el interés económico (según la teoría del crecimiento endógeno, una empresa invierte en investigación para aumentar sus ganancias); «exógeno», que se explica mejor por un motivo no económico (la curiosidad o la fama de Einstein). Los imperialistas económicos suponen que la conducta política y social puede reducirse a motivos económicos y explicarse con modelos formales; Phelps define la economía política como la elección del propio sistema económico, y para Hirshleifer la economía es la única ciencia social verdadera, porque sus abstracciones (escasez, costo, oportunidad) son universales. Esta creencia en una única ciencia social universal es un dogma poderoso entre la mayoría de los economistas.\n\nTres escuelas aplican el enfoque económico a la conducta humana. El institucionalismo neoclásico explica el origen, evolución y funcionamiento de todo tipo de instituciones como resultado de la conducta maximizadora de individuos racionales. La escuela de elección pública aplica la economía formal a la conducta y las instituciones políticas. La «nueva economía política» se interesa por los determinantes políticos de la política económica.\n\nLa elección pública se asocia a Buchanan y Tullock (The Calculus of Consent, 1962): su objeto es el mismo de la ciencia política, al que aplican los métodos supuestamente superiores de la economía. La define sobre todo su coloración política: salvo excepciones como Arrow y Samuelson, tiene un compromiso normativo explícito con los mercados sin trabas y una fuerte oposición a la intervención estatal. Mientras algunos economistas destacan las fallas de mercado como razón para intervenir, la rama conservadora de la elección pública considera más amenazante la falla del gobierno, las distorsiones causadas por las políticas: políticos y funcionarios no son servidores desinteresados, sino que maximizan sus propios intereses y usan el aparato estatal para fines privados.\n\nEl institucionalismo neoclásico, uno de los desarrollos más interesantes, sostiene que las instituciones económicas (y otras, incluido el Estado) pueden explicarse con los métodos neoclásicos. Para Douglass North, son consecuencia de acciones intencionales de individuos racionales que maximizan sus intereses, ya sea para aumentar la eficiencia o para buscar rentas, aunque hay predilección por suponer que se crean para aumentar la eficiencia. Su debilidad es pasar por alto los factores no económicos en la creación de instituciones y reglas.\n\nLa mayoría de los economistas usan «economía política» peyorativamente para la conducta interesada de individuos y grupos en la determinación de políticas. Para la «nueva economía política», la política nacional es más a menudo resultado de grupos privados que usan medios públicos para fines privados que de esfuerzos desinteresados por el bien común: la política económica es resultado de la política distributiva y la competencia entre grupos poderosos. La literatura sobre protección comercial (teoría endógena del comercio) entiende los aranceles como búsqueda de rentas.\n\nUn concepto muy distinto usan los críticos, sobre todo marxistas, para quienes la economía se volvió demasiado formal, matemática y abstracta, irrelevante para entender y resolver problemas reales, porque descuida los contextos históricos, políticos y sociales. Critican su pretensión de ser una «ciencia» modelada sobre la física: la economía no puede ser libre de valores; refleja los valores e intereses de los grupos dominantes del capitalismo, con un sesgo conservador que enfatiza mercado y eficiencia y descuida la desigualdad y el desempleo crónico. Para Heilbroner y Milberg, es una sirvienta del capitalismo occidental moderno cuyo propósito es hacer funcionar ese sistema problemático.\n\nA fines del siglo XX «economía política» tenía tres significados: la aplicación de la metodología de la economía formal (individualismo metodológico, actor racional) a todo tipo de conducta; el uso de una teoría económica específica para explicar la conducta social (Rogowski y el teorema de Stolper-Samuelson para explicar resultados políticos); y, para politólogos como el autor, que creen que lo social y político no puede reducirse a un subcampo de la economía, las cuestiones generadas por las interacciones entre lo económico y lo político, con eclecticismo de temas y métodos.\n\n### Lo que buscás es lo que encontrás\n\nLas interpretaciones dependen de la perspectiva analítica y los supuestos del observador, que determinan qué busca y enfatiza. Economía y economía política difieren
