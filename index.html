antes de actuar unilateralmente y arriesgar una guerra comercial, pidió a Japón limitar sus exportaciones; Japón aceptó: 1,68 millones de autos en 1981, 1,85 millones en 1984‑85; el acuerdo cesó en 1985. Sus efectos se complican porque los autos no eran sustitutos perfectos, Japón respondió subiendo la calidad (autos más grandes y equipados) y la industria no es perfectamente competitiva; pero el resultado básico fue el previsto: subieron el precio de los autos japoneses y las rentas de sus empresas. El gobierno estimó un coste de 3.200 millones de dólares en 1984, sobre todo transferencias a Japón.\n\n**La exigencia de contenido local.** Exige que una fracción del producto final se produzca en el país, en unidades físicas (la cuota de importación de petróleo de Estados Unidos en los 60) o en valor (una cuota mínima de valor añadido nacional). La han aplicado ampliamente países en desarrollo que intentan pasar del ensamblaje a los bienes intermedios; en Estados Unidos se propuso para autos en 1982 sin aprobarse. Para los productores de componentes protege como una cuota; para las empresas que deben comprar localmente no es un límite estricto: pueden importar más si compran más en el país, y el precio efectivo de sus insumos es un **promedio**. Si los componentes importados cuestan 6.000 y los nacionales 10.000, con un 50 % de contenido nacional el coste medio es 8.000 y se refleja en el precio final. No genera ingresos para el Estado ni rentas de cuota: la diferencia se traslada a los consumidores. Una innovación es permitir cumplir el requisito exportando componentes: las automotrices estadounidenses en México exportan componentes a Estados Unidos, aunque allí se producirían más baratos, para usar menos contenido mexicano en los autos para el mercado mexicano.\n\n**Autobuses americanos fabricados en Hungría.** En 1995 circularon en Miami y Baltimore autobuses fabricados en Hungría, que antes los hacía, mal diseñados, para el bloque del Este. Unos inversores húngaros aprovecharon un vacío de la **Ley de Compras de Productos Norteamericanos** (1933), que en las compras públicas exige preferir a empresas nacionales: una oferta extranjera de autobuses debe ser al menos un 25 % más barata, y los productos «norteamericanos» deben tener un 51 % de materiales nacionales. Montaron armazones en Hungría con ejes y neumáticos estadounidenses, y en Georgia instalaban motores y transmisiones estadounidenses: algo más del 51 % nacional. La ventaja era el trabajo húngaro: 1.500 horas por autobús frente a 900 en Estados Unidos, pero a 4 dólares la hora.\n\n**Otros instrumentos de política comercial.**\n\n1. **Subsidios al crédito a la exportación:** préstamos subsidiados al comprador, como los del Banco de Exportación e Importación de Estados Unidos.\n2. **Compras estatales:** las compras del Estado o de empresas reguladas pueden dirigirse a bienes nacionales aunque sean más caros. En Europa las compañías telefónicas, hasta hace poco estatales, compraban a proveedores nacionales, y hay muy poco comercio de equipos de telecomunicaciones.\n3. **Barreras administrativas:** complicar los procedimientos sanitarios, de seguridad y aduaneros. El decreto francés de 1982 obligó a que todos los vídeos japoneses pasaran por el pequeño puesto aduanero de Poitiers.\n\n### Los efectos de la política comercial: un resumen\n\nLa Tabla 9.1 compara los cuatro principales instrumentos:\n\n• **Arancel:** excedente del productor aumenta; del consumidor disminuye; ingresos públicos aumentan; bienestar nacional ambiguo (disminuye para un país pequeño).\n• **Subsidio a la exportación:** productor aumenta; consumidor disminuye; ingresos públicos disminuyen (aumenta el gasto); bienestar nacional disminuye.\n• **Cuota de importación:** productor aumenta; consumidor disminuye; ingresos públicos sin cambio (renta a los tenedores de licencias); bienestar ambiguo (disminuye para un país pequeño).\n• **Restricción voluntaria de la exportación:** productor aumenta; consumidor disminuye; ingresos públicos sin cambio (renta a los extranjeros); bienestar nacional disminuye.\n\nNo es una buena recomendación de las políticas intervencionistas: las cuatro benefician a los productores y perjudican a los consumidores; dos perjudican claramente al país, y aranceles y cuotas solo pueden beneficiar a países grandes que bajan los precios mundiales. ¿Por qué entonces los gobiernos limitan tan a menudo las importaciones o promueven las exportaciones? Se retoma en el capítulo 10.\n\n### Resumen\n\n1. Para el análisis de la política comercial suele bastar el equilibrio parcial.\n2. Un arancel crea una diferencia entre precios nacionales y extranjeros y sube el precio nacional en menos que el arancel; en el país pequeño se traslada totalmente.\n3. Con los excedentes se muestra que los productores ganan, los consumidores pierden y el Estado recauda.\n4. El efecto neto se divide en una pérdida de eficiencia por la distorsión de incentivos y una ganancia de la relación de intercambio; en el país pequeño la segunda es nula y hay indudablemente una pérdida.\n5. El subsidio a la exportación causa pérdidas de eficiencia similares y además deteriora la relación de intercambio; cuotas y RVE difieren del arancel en que el Estado no recauda: lo que serían ingresos son rentas de los licenciatarios o de los extranjeros.\n\n**Conceptos clave:** arancel ad valorem, arancel fijo, barreras no arancelarias, cuotas de importación, curva de demanda de importaciones, curva de oferta de exportaciones, excedente del consumidor, excedente del productor, exigencia de contenido local, ganancia de la relación de intercambio, pérdida de eficiencia, pérdida por distorsiones a la producción y al consumo, rentas de cuotas, restricción a la exportación, RVE, subsidio a la exportación, tasa de protección efectiva.\n\n### Apéndice: aranceles y cuotas de importación en presencia de monopolio\n\nEl análisis supuso competencia perfecta, pero muchos mercados internacionales son imperfectos. Aparece una nueva consideración: **el comercio limita el poder monopolista** y las políticas que lo restringen pueden aumentarlo. Modelo: un país pequeño cuya producción controla una sola empresa que enfrenta importaciones.\n\n**Con libre comercio** (Figura 9A.1): sin comercio, la empresa elegiría la producción y el precio de monopolio, igualando ingreso marginal y coste marginal. Con libre comercio no puede: a cualquier precio por encima del mundial nadie le compraría. El comercio pone un **techo** al precio; lo mejor es producir hasta que el coste marginal iguale el precio mundial, e importar el resto: el mismo resultado que una industria perfectamente competitiva.\n\n**Con un arancel** (Figura 9A.2): el techo sube a P_W + t, pero el monopolista sigue sin poder cobrar el precio de monopolio, porque los consumidores irían a las importaciones; iguala precio y coste marginal, sube su producción, baja la demanda y las importaciones, y produce lo mismo que una industria competitiva. (Excepción: con un arancel prohibitivo, el monopolista sigue limitado por la amenaza de importaciones aunque sean cero, y subirlo le permite acercarse al precio de máximo beneficio.)\n\n**Con una cuota** (Figura 9A.3): si las importaciones se limitan a una cantidad fija, el monopolista sabe que al subir el precio no pierde a todos sus clientes; enfrenta la demanda nacional menos las importaciones permitidas, una curva paralela desplazada a la izquierda, con su ingreso marginal. Maximiza beneficios igualando coste marginal y ese ingreso marginal; la licencia genera una renta igual a la diferencia entre su precio y el mundial.\n\n**Comparación** (Figura 9A.4): con un arancel y una cuota que dan el mismo nivel de importaciones, la cuota provoca **menor producción nacional y mayor precio**. Con arancel el monopolista se comporta como competitivo; con cuota, no. La cuota crea más poder de monopolio porque da protección absoluta: por alto que sea el precio, las importaciones no pueden superar la cuota. Si preocupara el poder de monopolio, los gobiernos preferirían los aranceles; sin embargo, la protección se ha desplazado crecientemente hacia barreras no arancelarias, lo que exige considerar motivos distintos de la eficiencia económica.", "titulo": "Krugman, Obstfeld y Melitz (2012). Economía Internacional, cap. 9: Los instrumentos de la política comercial"}], "textos": {}}, "EI03-c9": {"extras": [], "textos": {"0": {"ejercicios": [], "leido": false, "resumen": "## Capítulo 10. La economía política de la política comercial\n\nEl 8 de noviembre de 2005 los gobiernos de Estados Unidos y China firmaron un memorando por el que China aceptó, bajo presión estadounidense, cuotas a sus exportaciones de ropa y textiles: en 2006 no enviaría más de 772,8 millones de pares de calcetines. El acuerdo elevó significativamente el precio para los consumidores estadounidenses. China cedió en esto, pero se negó rotundamente a reducir sus aranceles a manufacturas y productos agrícolas. Ambos gobiernos estaban dispuestos a aplicar políticas que, según el análisis coste‑beneficio del capítulo 9, producen más costes que beneficios: las políticas reflejan objetivos que van más allá de esas medidas.\n\nEl capítulo analiza por qué los gobiernos no deberían basar, o sencillamente no basan, sus políticas en cálculos coste‑beneficio (el análisis continúa en los capítulos 11 y 12, sobre países en desarrollo y avanzados). El primer paso es preguntar cuáles son los argumentos a favor del libre comercio; luego, los argumentos a favor de la intervención como una puesta en duda de sus supuestos.\n\n**Objetivos de aprendizaje:** expresar argumentos a favor del libre comercio más allá de las ganancias convencionales; valorar los argumentos de bienestar nacional en contra; relacionar teoría y evidencia de los enfoques de «economía política»; explicar cómo los acuerdos y negociaciones internacionales promovieron el comercio; analizar las cuestiones de los acuerdos de preferencias comerciales.\n\n### Los argumentos a favor del libre comercio\n\nPocos países se han aproximado completamente al libre comercio; posiblemente **Hong Kong** sea la única economía moderna sin aranceles ni cuotas. Pero desde Adam Smith los economistas lo defienden como un ideal. Las razones no son tan simples: en un primer nivel, el libre comercio evita las pérdidas de eficiencia de la protección; muchos creen que produce ganancias adicionales; e incluso quienes no lo creen perfecto piensan que es generalmente mejor que cualquier otra política que pueda aplicar un gobierno.\n\n**El libre comercio y la eficiencia.** Es la otra cara del análisis coste‑beneficio del arancel: en el país pequeño, el arancel genera una pérdida neta medida por dos triángulos, por la distorsión de incentivos; el libre comercio elimina esas distorsiones y aumenta el bienestar (Figura 10.1). Como hoy los aranceles suelen ser bajos y las cuotas poco frecuentes, las estimaciones de sus costes son reducidas: según Cline (2004), las ganancias de un libre comercio mundial serían del 0,57 % del PIB para Estados Unidos, 0,61 % para la Unión Europea, 0,85 % para Japón, 1,4 % para los países en desarrollo y 0,93 % para el mundo (Tabla 10.1): menos del 1 %, algo menores para las economías avanzadas y algo mayores para las más pobres.\n\n**Los beneficios adicionales del libre comercio.** Muchos economistas creen que esos cálculos no cuentan toda la historia, sobre todo en países pequeños y en desarrollo. (Estas ganancias se llaman a veces «dinámicas», porque la innovación y la competencia tardan más que la eliminación de distorsiones.)\n\n• **Economías de escala:** los mercados protegidos fragmentan la producción y, al reducir la competencia y aumentar los beneficios, atraen demasiadas empresas, cada una con una escala ineficiente. La industria automotriz argentina, nacida de las restricciones a la importación, producía en 1964 solo 166.000 autos con no menos de 13 empresas, cuando una planta eficiente debería fabricar de 80.000 a 200.000 por año.\n• **Aprendizaje e innovación:** el libre comercio da a los empresarios incentivos para buscar nuevas vías de exportar o competir con las importaciones, más oportunidades que un comercio «administrado» por el gobierno; países menos desarrollados descubrieron oportunidades inesperadas al abrirse (capítulo 11).\n• **Selección de empresas:** las empresas más productivas exportan y las menos productivas se quedan en el mercado nacional; el libre comercio hace más eficiente el conjunto de la economía.\n\nSon difíciles de cuantificar; los modelos con economías de escala y competencia imperfecta dan cifras mayores, pero sin consenso. Si son tan importantes como algunos creen, los costes de distorsionar el comercio son muy superiores a los del análisis convencional.\n\n**Búsqueda de rentas.** Con una cuota, el coste puede amplificarse porque individuos y empresas gastan recursos para conseguir las licencias y sus rentas. En la India de los 50 y 60 las empresas recibían derechos de importar según su capacidad instalada, lo que incentivaba invertir en exceso (una acería construía más hornos de los necesarios): un coste adicional de la protección. En Estados Unidos, el atún enlatado tiene una **cuota arancelaria**: el 4,8 % del consumo entra al 6 % y el resto paga 12,5 %, asignado por orden de llegada. Los importadores acumulan atún en almacenes aduaneros a fines de diciembre para sacarlo al inicio del año: ese gasto es otro coste de la protección.\n\n**El argumento político a favor del libre comercio.** Un compromiso político con el libre comercio puede ser buena idea en la práctica aunque en principio haya mejores políticas. Las políticas comerciales suelen estar dominadas por intereses especiales más que por los costes y beneficios nacionales; un programa sofisticado de intervención puede caer presa de grupos de interés y convertirse en un aparato para redistribuir renta hacia sectores influyentes. Por eso puede ser mejor defender el libre comercio sin excepciones.\n\nEstos argumentos resumen la visión general de los economistas internacionales, al menos en Estados Unidos: 1) los costes convencionales de desviarse del libre comercio son elevados; 2) hay otros beneficios del libre comercio; 3) cualquier intento de desviaciones sofisticadas será subvertido por el proceso político. Aun así, hay argumentos intelectualmente respetables para apartarse de él, y merecen ser oídos.\n\n### Los argumentos sobre el bienestar nacional contra el libre comercio\n\nLa mayoría de las medidas se imponen para proteger la renta de grupos de interés, aunque los políticos digan que es por el interés general, y «a veces, incluso están diciendo la verdad»: hay razones teóricas para creer que las políticas activas pueden aumentar el bienestar nacional.\n\n**El argumento de la relación de intercambio a favor del arancel.** Un país grande, que puede influir en los precios extranjeros, obtiene con un arancel una ganancia de relación de intercambio que puede superar sus costes. Para un arancel suficientemente pequeño, el bienestar es mayor que con libre comercio; al subir el arancel, los costes crecen más rápido y el bienestar baja; un arancel prohibitivo deja al país peor que el libre comercio, y aumentos posteriores no tienen efecto (Figura 10.2). El arancel que maximiza el bienestar es el **arancel óptimo** (por convención, el justificado por la relación de intercambio), siempre positivo pero menor que el prohibitivo. En los sectores exportadores, como el subsidio empeora la relación de intercambio, la política óptima es un **impuesto a la exportación**, positivo pero menor que el prohibitivo: Arabia Saudí y otros exportadores gravan su petróleo, y es difícil sostener que estarían mejor con libre comercio. Limitaciones: la mayoría de los países pequeños casi no influye en los precios mundiales; para los grandes, es un argumento para explotar su poder de monopolio a expensas de otros, una política predadora que provocaría represalias y socavaría la coordinación internacional. Es **intelectualmente impecable, pero de utilidad dudosa**: los economistas lo enfatizan más como proposición teórica que lo que los gobiernos lo usan.\n\n**El argumento del fallo del mercado nacional contra el libre comercio.** Muchos rechazan el libre comercio porque el excedente del productor no mide adecuadamente los costes y beneficios: el trabajo de un sector podría estar mal empleado o desempleado; deficiencias en los mercados de capital o trabajo impiden transferir recursos con rapidez a los sectores de altos beneficios; puede haber externalidades tecnológicas de industrias nuevas o innovadoras. Son **fallos del mercado nacional**: algún mercado interno no funciona correctamente. Si producir un bien genera experiencia que mejora la tecnología de toda la economía, pero las empresas no pueden apropiarse de ese beneficio, hay un **beneficio marginal social** no incluido en el excedente del productor que puede justificar un arancel. En la Figura 10.3, el arancel sube el precio de P_W a P_W + t, con distorsiones de producción *a* y de consumo *b*; pero el aumento de producción genera un beneficio social *c*, que para un arancel suficientemente pequeño supera a *a + b*: hay un arancel que maximiza el bienestar por encima del libre comercio.\n\nEs un caso particular de la **teoría del segundo óptimo** (*second best*): una política no intervencionista es deseable en un mercado solo si todos los demás funcionan correctamente; si no, una intervención que parece distorsionar puede aumentar el bienestar compensando fallos en otra parte. Si el mercado de trabajo no logra el pleno empleo, podría convenir subsidiar industrias intensivas en trabajo; sería mejor flexibilizar los salarios, pero si no se puede, intervenir en otro mercado es un óptimo de segundo orden. Aplicado al comercio: las imperfecciones internas pueden justificar interferir en las relaciones externas; el comercio no es la fuente del problema, pero la política comercial puede dar una solución parcial.\n\n**¿Hasta qué punto es convincente el argumento del fallo del mercado?** Parecía socavar gran parte de la justificación del libre comercio: ninguna economía está exenta de fallos, y en las más pobres parecen la norma (desempleo, enormes diferencias salariales entre campo y ciudad); en las avanzadas es fácil suponerlos (empresas innovadoras que no captan todos sus beneficios). Hay dos líneas de defensa:\n\n• **Corregir el fallo en su raíz con políticas nacionales.** El mismo aumento de producción logrado con un **subsidio a la producción** en vez de un arancel no sube el precio a los consumidores y evita la pérdida *b*. Principio general: siempre es preferible afrontar los fallos del mercado **tan directamente como sea posible**, porque las respuestas indirectas generan distorsiones no intencionadas. Las políticas comerciales justificadas por fallos nacionales nunca son la respuesta más eficiente: son de «segundo óptimo», no de «primer óptimo» (*first best*). Siempre hay que compararlas con la política interior dirigida al mismo problema: si esta parece más costosa o indeseable, la comercial casi seguramente lo es aún más, aunque sus costes sean menos evidentes. Ejemplo: una cuota de importación de autos en Estados Unidos para conservar empleos, porque el mercado laboral sería demasiado inflexible. La alternativa interior, subsidiar a las empresas que emplean trabajadores del automóvil, encontraría oposición masiva: exigiría cuantiosos fondos, déficit o impuestos, y esos trabajadores están entre los mejor pagados de la manufactura. Pero la cuota sería aún más cara, porque logra un aumento similar del empleo y además distorsiona la elección del consumidor; solo que su coste es menos visible, en precios más altos. Muchas desviaciones del libre comercio se adoptan no porque sus beneficios superen sus costes, sino porque el público no conoce sus verdaderos costes.\n• **Es difícil diagnosticar el fallo y, por tanto, la política adecuada.** Ante el desempleo urbano en un país en desarrollo, una hipótesis dice que un arancel que proteja la industria urbana convertirá desempleo en empleo productivo; otra, que fomentará más migración a las ciudades y aumentará el desempleo. La teoría dice mucho sobre los mercados que funcionan y poco sobre los que fallan, que pueden fallar de muchas formas, y el segundo óptimo depende del tipo de fallo. Esto refuerza el argumento político: si los expertos no saben cómo desviarse ni se ponen de acuerdo, es fácil que la política sea dominada por intereses particulares; si los fallos no son demasiado grandes, un acuerdo en torno al libre comercio puede ser mejor que **abrir la caja de Pandora**. Es un juicio sobre los políticos más que sobre los economistas: la teoría económica no ofrece una defensa dogmática del libre comercio.\n\n### Distribución de la renta y política comercial\n\nAl considerar los aspectos políticos reales hay que aceptar que **no hay un bienestar nacional**, solo los deseos de los individuos, más o menos reflejados en los objetivos del gobierno. ¿Cómo se agregan en la política observada? Crece el análisis con modelos en que los gobiernos maximizan el éxito político y no una medida abstracta del bienestar.\n\n**Competencia electoral.** Modelo de Downs (1957): dos partidos dispuestos a prometer lo que les haga ganar; la política se describe en una dimensión, el tipo arancelario; los votantes difieren en sus preferencias. Si un país exporta bienes intensivos en cualificación e importa intensivos en trabajo, los votantes cualificados prefieren aranceles bajos y los poco cualificados altos (efecto Stolper‑Samuelson). Alineados según su tipo preferido, ambos partidos convergen al preferido por el **votante mediano** (Figura 10.4): si uno propone un arancel por encima, el otro gana la mayoría con uno algo más bajo, y viceversa. Se ha modificado (los militantes ideológicos impiden que los partidos sean demasiado cínicos o indistinguibles), pero es útil donde los efectos distributivos importan más que la eficiencia. Sin embargo, **en política comercial hace una predicción errónea**: una política que inflige grandes pérdidas a pocos y beneficia a muchos debería ganar, y una que impone pérdidas difundidas para ayudar a un grupo pequeño debería perder; las políticas proteccionistas encajan con la segunda. La cuota de azúcar impone a decenas de millones de consumidores una pérdida de unos 2.500 millones de dólares para dar una ganancia mucho menor a unos pocos miles. ¿Cómo es posible?\n\n**Acción colectiva.** Mancur Olson señaló que la actividad política en nombre de un grupo es un **bien público**: sus beneficios los reciben todos los miembros, no solo quien actúa. Si un consumidor escribe a su congresista y logra bajar un arancel, todos los consumidores se benefician aunque no hayan escrito. Por eso las políticas que imponen grandes pérdidas totales pero pequeñas a cada persona pueden no tener oposición eficaz: la cuota de azúcar cuesta a una familia media unos 30 dólares anuales, y una carta individual, de efecto marginal, no vale ni el franqueo (ni siquiera vale la pena enterarse de que la cuota existe); pero si un millón de votantes escribiese, la cuota caería con beneficios muy superiores al coste de las cartas. Es el **problema de la acción colectiva**: lo que interesa al grupo no interesa a cada individuo. Se supera mejor cuando el grupo es **pequeño** (cada uno recibe una fracción significativa de los beneficios) y **bien organizado**. Los productores de azúcar son un grupo pequeño, organizado e informado de sus subsidios implícitos; los consumidores, una población enorme que ni se considera un grupo de interés.\n\n**Modelización del proceso político.** La lógica de la acción colectiva es vaga sobre cómo influyen los grupos organizados. Los análisis recientes parten de que una campaña exitosa requiere dinero para publicidad y encuestas: a un político puede convenirle adoptar posiciones contrarias al votante típico si recibe contribuciones suficientes, porque el dinero puede valer más votos que los que se pierden. Los modelos contemplan una especie de **subasta** en que los grupos «compran» políticas con contribuciones condicionadas (Grossman y Helpman, «Protection for Sale», 1994): los políticos no ignoran el bienestar, pero lo equilibran con fondos de campaña, y los grupos que superaron el problema de la acción colectiva obtienen políticas a expensas del público.\n\n**Políticos a la venta: evidencia de los noventa.** Las leyes estadounidenses obligan a publicar las contribuciones de campaña. Baldwin y Magee (1998) estudiaron dos votaciones muy controvertidas, con empresas a favor y trabajadores en contra: el **TLCAN** (1993) y la ratificación del último acuerdo del **GATT** (1994); ganó en ambas el libre comercio, el TLCAN por solo 34 votos (se requerían 214). Su modelo econométrico, que incluye las características de los distritos y las contribuciones, muestra un fuerte efecto del dinero. TLCAN: 229 votos reales, 229 previstos, 291 sin contribuciones de los trabajadores, 195 sin las de empresas, 256 sin ninguna. GATT: 283 reales, 290 previstos, 346 sin las de trabajadores, 257 sin las de empresas, 323 sin ninguna. Las contribuciones laborales llevaron a 62 congresistas a votar en contra del TLCAN y las empresariales a 34 en sentido contrario; sin las empresariales, el TLCAN no se habría aprobado. Como ambas partes contribuyeron, sus efectos se cancelaron y ambas leyes habrían pasado igual. Lo que importa es que los políticos están, en efecto, a la venta, y las teorías que enfatizan los intereses especiales van por buen camino.\n\n**¿Quién obtiene protección?** Muchos países en desarrollo protegieron un amplio conjunto de manufacturas (industrialización por sustitución de importaciones, capítulo 11). En los países avanzados el proteccionismo es mucho más limitado y se concentra en dos sectores:\n\n• **Agricultura:** en Estados Unidos emplea solo unos dos millones de trabajadores de más de 130 millones, pero los agricultores son un grupo organizado y eficaz con tasas muy altas de protección efectiva. Con la PAC, varios productos se venden a dos o tres veces los precios mundiales; Japón prohibía importar arroz, con un precio interno más de cinco veces el mundial, relajó la prohibición tras malas cosechas a mediados de los 90 y a fines de 1998 impuso un arancel del 1.000 %. Estados Unidos es un enorme exportador de alimentos, por lo que aranceles y cuotas no pueden subir los precios (salvo el azúcar), y la renuencia a desembolsar dinero directamente limitó los subsidios; gran parte de su protección se concentra en el otro sector.\n• **El sector textil:** textiles (hilado y tejido) y confección (convertir tela en ropa), fuertemente protegidos con aranceles y cuotas; hasta 2005 sujetos al **Acuerdo Multifibras**. La confección es **intensiva en trabajo** (a veces basta una máquina de coser y poca educación formal) y de **tecnología sencilla**, fácil de transferir a países muy pobres: los de bajos salarios tienen una fuerte ventaja comparativa y los de altos salarios una fuerte desventaja. Es un sector tradicionalmente organizado (el sindicato Unión Internacional de Trabajadores de Prendas de Mujer). La Ronda Uruguay (1994) abolió por fases el AMF a fines de 2004; las cuotas reimpuestas a China en 2005 se fueron eliminando, y para 2013 el comercio de ropa no debería tener demasiadas restricciones. En 2002, con el AMF vigente, la ropa explicaba más del 80 % de los costes de bienestar del proteccionismo estadounidense, sobre todo por la transferencia de rentas de cuota a los extranjeros. Costes totales: 14.100 millones de dólares en 2002 (11.800 de textiles y confección); previsión para 2013: 4.600 (2.300) (Tabla 10.2).\n\n### Negociaciones internacionales y política comercial\n\nEl análisis de la economía política no ha sido muy optimista: es difícil idear políticas que aumenten el bienestar nacional, y la política comercial suele estar dominada por grupos de interés. **(El texto cargado termina en este punto.)**"}, "1": {"ejercicios": [], "leido": false, "resumen": "## De la geoeconomía a la geopolítica de Trump: ¿de los aranceles a las armas?\n\n*Vera Thorstensen y Victor do Prado, CEBRI‑Journal, año 4, n.º 14, abril‑junio de 2025 (actualizado el 18 de julio de 2025).* **(El original está en inglés; el resumen está en castellano y conserva entre paréntesis los términos clave del texto.)**\n\n**Resumen.** La ruptura causada por la política arancelaria de Estados Unidos pone en peligro el orden comercial multilateral. La retracción estadounidense proyecta escenarios de multipolaridad y abre espacio a un mayor protagonismo de China y las potencias medias. Comienza una nueva configuración del orden económico internacional, marcada por la inestabilidad y la disputa hegemónica. Se hace evidente el entrelazamiento entre comercio y finanzas. La gobernanza global enfrenta incertidumbres, con espacio para nuevas dinámicas regionales y una posible reconfiguración de las reglas del comercio internacional. **Palabras clave:** medidas arancelarias; ascenso de China; sistema multilateral de comercio; escenarios futuros.\n\n### Introducción\n\nLos signos de agotamiento del orden multilateral construido en la posguerra bajo liderazgo estadounidense son visibles desde hace tiempo, con acusaciones mutuas y creciente insatisfacción, pero no indicaban aún una ruptura. La llegada de la segunda administración Trump en 2025 fue una **implosión de gran magnitud**. Iniciada como un ataque arancelario contra China y el resto del mundo, claramente en el marco de la **geoeconomía** (el comercio como herramienta de ventaja política), sus efectos se extienden al sector financiero y podrían afectar los fundamentos de la macroeconomía global, exacerbando la inflación y desencadenando una recesión.\n\nLa administración Trump rompe con los fundamentos del orden internacional para imponer una **nueva geopolítica**: tensiones con los aliados europeos, revisión de los compromisos con la OTAN y posibilidad de una partición de Ucrania; el bombardeo de Irán apunta a una nueva configuración en Medio Oriente. Surgen preguntas: ¿el conflicto entre Estados Unidos y China se limitará al comercio, o implicará zonas de influencia y la absorción de Taiwán? ¿Ejercerá Estados Unidos su poder sobre Panamá y Groenlandia? ¿De qué lado estará Rusia, hoy aliada de China? ¿Cómo reaccionarán la Unión Europea, India y los países de ingreso medio? ¿Qué papel tendrán los organismos de gobernanza global? ¿Un mundo de tres zonas de influencia (Estados Unidos, China y Rusia), o bipolar con desacople (*decoupling*) entre Estados Unidos y China? ¿Hacia una confrontación armada?\n\nEstados Unidos es la mayor economía, con un PIB de unos 29 billones de dólares y el 22 % de los flujos de comercio mundial; China, con unos 19 billones, representa cerca del 25 %. Una guerra comercial entre ambos impactará a todos los demás socios y a la gobernanza global. El objetivo es analizar la situación con la geoeconomía como marco: resumir el conflicto comercial, evaluar sus implicancias financieras y económicas, tender un puente hacia la geopolítica de la era Trump y desarrollar escenarios. La pregunta central es cómo y por quién será conducida la gobernanza global.\n\n### La geoeconomía según Trump\n\nLa era Trump será probablemente un caso clásico de **instrumentalización del comercio como arma** (*trade weaponization*) para fines geopolíticos. Según Blackwill y Harris (*War by Other Means*, 2016), los instrumentos comerciales se usan para la persuasión o la coerción política: aranceles, restricciones a exportaciones e importaciones, subsidios, barreras regulatorias, restricciones al origen de inversiones o sanciones financieras, cada vez más usados por los países de mayor peso económico. Su eficacia está demostrada, pero sus consecuencias son impredecibles: los conflictos comerciales pueden escalar a crisis económicas y llevar a conflictos militares, como muestra la historia.\n\nLa estrategia está delineada en el memorando presidencial **«America First Trade Policy»** del 20 de enero, que sirve de guía y pone en duda la tesis de que la administración actúa por puro capricho del presidente, aunque la implementación sea caótica. Usa los **aranceles como arma principal**, con seis objetivos: (i) reducir los déficits comerciales persistentes, considerados un riesgo para la seguridad nacional y atribuidos (en la visión trumpista) a prácticas desleales; (ii) repatriar actividades industriales; (iii) crear empleos para la clase trabajadora; (iv) modernizar la producción industrial; (v) generar ingresos que permitan bajar impuestos; (vi) llevar a los socios a la mesa de negociación.\n\n**La nueva política comercial.** Trata la política comercial como componente crítico de la seguridad nacional. Sus prioridades: investigar las causas del comercio desleal y de los déficits crecientes (1,2 billones de dólares en 2024); crear un Servicio de Ingresos Externos (*External Revenue Service*) para cobrar aranceles; revisar el T‑MEC con México y Canadá, las prácticas cambiarias de los socios y los acuerdos comerciales; negociar acuerdos bilaterales y sectoriales; revisar las normas antidumping y compensatorias; actuar contra productos falsificados y de contrabando y revisar el mínimo para importaciones libres de impuestos; investigar aranceles discriminatorios contra empresas estadounidenses; analizar las compras públicas; revisar a fondo las relaciones con China, incluidas inversión y propiedad intelectual; revisar la seguridad de la base industrial (acero y aluminio) y los controles de exportación de bienes estratégicos, software, servicios y tecnología.\n\n**China es el principal blanco de la guerra comercial.** Desde su ingreso a la OMC en 2001 se convirtió en la potencia más significativa del comercio mundial y desplazó a Estados Unidos de su liderazgo. El memorando dispone revisar si China cumple los acuerdos y recomendar aranceles; evaluar el informe de la Sección 301 sobre propiedad intelectual; aplicar aranceles por cadenas de suministro y elusión vía terceros países; investigar medidas discriminatorias; reevaluar las Relaciones Comerciales Normales Permanentes con China; y evaluar la propiedad intelectual concedida a nacionales chinos para asegurar trato recíproco.\n\n**Reglas arancelarias.** El memorando del 2 de abril, **«Reciprocal Trade and Tariffs»**, sostiene que Estados Unidos tiene una de las economías más abiertas, con los aranceles ponderados y las barreras más bajos, y que ha sido maltratado por amigos y enemigos; la falta de reciprocidad causaría los déficits persistentes. El **Plan Justo y Recíproco** enumera barreras: aranceles, impuestos al consumo discriminatorios (IVA), subsidios, requisitos regulatorios, medidas no arancelarias, prácticas que desvían el tipo de cambio y límites al acceso a mercados. Se introdujo un **«Arancel Recíproco»** según una fórmula de la USTR: como calcular el efecto de aranceles y regulaciones sobre decenas de miles de productos sería complejo, si no imposible, se usó un *proxy*: el arancel compatible con llevar el déficit a cero, que sería «recíproco y justo». Se obtiene dividiendo el déficit con cada país por las importaciones desde ese país, corregido por dos elasticidades fijadas en 2, lo que divide el arancel a la mitad «por cortesía del presidente», según el vocero. La fórmula recibió intensas críticas por su simplismo y su dudosa base económica.\n\n**Base legal.** El presidente invocó la Ley de Poderes Económicos de Emergencia Internacional (IEEPA, 1977), la Ley de Emergencias Nacionales y la Sección 604 de la Ley de Comercio de 1974, base ya impugnada internamente. La razón alegada es una emergencia nacional por el déficit, causado por la falta de reciprocidad y otras políticas como la manipulación cambiaria y el IVA. Se impuso un **arancel base del 10 %** a todos los países, más aranceles recíprocos individuales a los de mayor déficit, por un plazo a determinar por el presidente; podrían subir ante represalias o bajar si los socios se alinean. Quedaron excluidos: bienes ya sancionados (como los de Rusia), acero y aluminio, autos ya gravados (Sección 232), cobre, farmacéuticos, semiconductores, madera, oro, energía y minerales no disponibles en Estados Unidos. En el T‑MEC, los bienes del acuerdo quedan excluidos y el resto paga 25 %; energía y potasa, 10 %. Se justifica señalando que el arancel simple medio estadounidense es del 3,3 %, frente al 11,2 % de Brasil, 7,5 % de China, 5 % de la UE, 17 % de India y 9,4 % de Vietnam, y que la manufactura cayó del 28,4 % (2001) al 17,4 % (2023). La aplicación es muy compleja por las diferencias entre socios y las reglas de origen; los anuncios con gran despliegue, seguidos de excepciones y confirmaciones diarias, generaron una inmensa incertidumbre, al ritmo frenético de un **«reality show»** (Celso Lafer). La dirección política era conocida desde el inicio, aunque su base teórica sea muy cuestionable; las críticas apuntan a la forma de implementación y a si sus efectos fueron bien anticipados.\n\n### La geoeconomía de Trump en acción: cronología\n\nLa reducción y consolidación de aranceles en el GATT y la OMC se logró en sucesivas rondas, hasta la Ronda Uruguay y las adhesiones desde 1995; China redujo los suyos en su adhesión de 2001. Con numerosos acuerdos preferenciales, los aranceles perdieron relevancia frente a las barreras regulatorias. Los aranceles siempre se justificaron en la OMC para proteger y promover la producción nacional, especialmente en países en desarrollo. Según la OMC, cerca del **80 % del comercio** aún se realizaba (antes del alza de Trump) con aranceles multilaterales aplicados sin discriminación por la **cláusula de la nación más favorecida** (NMF). En su primer mandato, Trump ya había impuesto, por la Sección 232, aranceles del 25 % al acero, el aluminio, los autos y autopartes.\n\n**De enero a principios de abril:** el 20 de enero se publica el documento America First; el 1 de febrero, aranceles del 20 % a Canadá, México y China contra el flujo de drogas y la inmigración ilegal (suspendidos para Canadá y México, mantenidos para China); el 26 de marzo, recargo del 25 % a autos y autopartes (excluido el contenido estadounidense para Canadá y México); el 2 de abril, **«Día de la Liberación»**, aranceles recíprocos a gran número de países más el 10 % base, sumados a los aranceles NMF, anunciados con gran despliegue en los jardines de la Casa Blanca. Se excluyeron 1.039 productos (20 % de las importaciones). Rangos: 10 % base para todos; 10 % Argentina, Australia, Brasil, Colombia, Singapur, Ucrania, Reino Unido, Uruguay, Egipto y Arabia Saudí; 11‑19 % Israel, Noruega y Filipinas; 20‑29 % UE, India, Japón, Kenia, Malasia, Corea del Sur y Pakistán; 30‑39 % China, Indonesia, Sudáfrica, Suiza, Taipéi Chino y Tailandia; 40‑49 % Vietnam.\n\n**En abril:** China pide consultas en la OMC, seguida por otros miembros. Trump anuncia una **pausa de 90 días** de los recíprocos, manteniendo el 10 % base, para negociar con unos 70 países. La UE (salvo Hungría) aprueba represalias por 21.000 millones de euros, a la vez que propone un acuerdo «cero por cero». Ante el 34 %, China responde igual; Estados Unidos sube a 104 %, luego 125 % y 145 %; China, a 84 % y 125 %, y anuncia que no se dejará intimidar: ampliar su Lista Negra de empresas estadounidenses, controlar exportaciones de metales críticos, restringir derechos de propiedad intelectual, investigaciones antimonopolio, devaluar el yuan y vender bonos estadounidenses de sus reservas. Se suspenden temporalmente los aranceles a celulares y computadoras chinos; se revisa la exención de farmacéuticos y semiconductores; Estados Unidos anuncia que el total contra China llega a 245 %. China amplía su lista, suspende compras de Boeing y anuncia que llevará la guerra arancelaria al Consejo de Seguridad; Estados Unidos amenaza con sacar empresas chinas de la Bolsa de Nueva York.\n\n**En julio**, al vencer el plazo (9 de julio), una nueva ronda desde el 1 de agosto pese a negociar con más de 50 países: 50 % Brasil; 32‑40 % Laos, Myanmar, Tailandia, Camboya, Bangladés, Serbia, Indonesia; 30 % Sudáfrica, Irak, Sri Lanka, Argelia, Libia, Bosnia y Herzegovina; 30 % UE; 35 % Canadá; 30 % México; 25 % Japón, Corea del Sur, Malasia, Kazajistán, Túnez, Brunéi, Moldavia; 20 % Filipinas. La carta a **Brasil** incluyó referencias a los procesos contra Bolsonaro y a empresas digitales, y una investigación por Sección 301: un hecho inédito, ajeno a la naturaleza comercial de las demás cartas, con una clara conexión con el activismo brasileño en los BRICS y su acercamiento a China y Rusia. A los países del Sudeste Asiático se les advirtió que los aranceles se duplicarían si exportaban productos de origen chino (triangulación). Todas las cartas justifican los aranceles por el superávit de cada país, amenazan con subirlos ante represalias e invitan a las empresas a instalarse en Estados Unidos. Solo Reino Unido, Vietnam e Indonesia cerraron acuerdos, y hubo una tregua con China; se anuncian por posteos de Trump en redes sociales, no por comunicados conjuntos, y no son vinculantes.\n\nNo todos los aranceles se aplicaron: Robert Armstrong (*Financial Times*) acuñó **«TACO»**: *Trump Always Chickens Out* (Trump siempre se acobarda). No hay garantía de que siga ocurriendo; en julio los inversores no creían que los aranceles fueran devastadores, y los flujos y precios tienden a ajustarse, aunque con pérdidas considerables para los afectados. Los objetivos, plazos, sectores y razones se desplazan constantemente; hay demandas judiciales. Gobiernos y empresas deben prepararse para un largo período de incertidumbre y volatilidad; el único plazo concreto son las elecciones de medio término del 3 de noviembre de 2026.\n\nFalta **acción colectiva** de los afectados: las razones y niveles difieren por país; hay temor a que uno abandone a los demás (el **dilema del prisionero**); «toda política es local»; y, sobre todo, falta liderazgo. La crisis de 2008 tuvo coordinación exitosa en el G20; la pandemia, un fracaso. Solo hay iniciativas como el acercamiento de la UE al CPTPP; pese a la retórica BRICS, China firmó una tregua mientras Brasil enfrenta un 50 % y una Sección 301. Con el 10 % base, Estados Unidos podría recaudar hasta 1,7 billones de dólares en una década (Tax Foundation). En pocos meses quedó claro el *modus operandi*: el arancel, instrumento tradicional y poco sofisticado, fue sacado de los manuales y usado para **extraer concesiones mediante coerción**; Estados Unidos promete lograr en meses lo que la OMC no logró en décadas, y usa los aranceles para golpear a China. Su economía enfrenta el desafío de desacoplarse de China o construir un nuevo marco bilateral, según la disputa entre la potencia hegemónica defensora y la retadora.\n\n### Los primeros impactos económicos\n\nLas idas y vueltas crearon incertidumbre en las políticas de los socios y en las grandes empresas, que postergaron producción e inversión, y llegaron a los mercados financieros. **JP Morgan** estimó que el arancel medio estadounidense, de 2,3 %, pasaría a 5 % con el 20 % a China, 7 % con acero y aluminio de Canadá y México, 10 % con autos, 23,3 % tras el 2 de abril y 25 % con la respuesta a China; si se eliminaran las exportaciones chinas y todos pagaran 10 %, bajaría a 12 %. Revisó el PIB de 2025 de +1,3 % a –0,3 %, con desempleo de 5,3 % e inflación PCE de 4,4 %. El Brent cayó de 80 a casi 60 dólares, poniendo en duda la viabilidad del petróleo de esquisto. La **OMC** estimó que el crecimiento del comercio mundial, previsto en 3 %, caería 1 %, con una baja similar del PIB global; el comercio de bienes entre China y Estados Unidos (700.000 millones en 2024) podría caer 80 % o desaparecer, y unos 580.000 millones buscarían terceros mercados. La división del comercio en dos bloques reduciría el PIB real mundial un 7 % a largo plazo; China tendría más para perder, con un superávit de 260.000 millones con Estados Unidos en 2024. Aun así, en el 30.º aniversario de la OMC su directora general recordó que el 74 % de los 24 billones de comercio de bienes seguía operando bajo reglas multilaterales.\n\n**Mercados financieros.** Tras el 2 de abril cayó la bolsa, pero lo decisivo fue el **mercado de bonos del Tesoro**: horas antes de la pausa, se exigían tasas del 4 % al 5 % para refinanciar la deuda a 10 y 30 años, desde un nivel cercano al 2 %, afectando fuertemente sus precios. Siendo refugio junto con el oro, fue una señal del papel del dólar como moneda central; además, varios países, China incluida, movían reservas fuera del dólar. Esto llevó al presidente a retroceder y anunciar la pausa (se mantuvieron el 10 % base y el 145 % a China). El episodio iluminó la **relación entre aranceles y finanzas**, no siempre comprendida por los decisores.\n\n**Cuestiones técnicas para las negociaciones.** El objetivo es bajar las barreras arancelarias y no arancelarias de los socios. Los aranceles son datos objetivos, pero no las barreras regulatorias: IVA, licencias, medidas técnicas, sanitarias y fitosanitarias, ambientales, criterios divergentes (cómo medir el carbono de las manufacturas), propiedad intelectual y burocracia aduanera. ¿Cómo convertirlas en **equivalentes arancelarios** por regulación y producto en poco tiempo? Sirven como fuentes el informe anual de barreras de la USTR y los Exámenes de Políticas Comerciales de la OMC. La pregunta central es cómo resolver todo bilateralmente, país por país y simultáneamente, cuando las negociaciones suelen durar años.\n\n### Las principales críticas al paquete arancelario\n\nEconomistas, exsecretarios demócratas y analistas señalaron los impactos inflacionarios y el posible escenario recesivo:\n\n• **Centralidad del déficit comercial:** la fórmula consideró solo bienes, excluyendo los servicios, donde Estados Unidos es dominante y superavitario con muchos países, y los pagos por propiedad intelectual, que en muchos casos equilibrarían las cuentas.\n• **Efectos sobre el tipo de cambio:** la relocalización y la reducción del déficit podrían anularse por la **apreciación del dólar** al volver inversiones. **Stephen Miran**, presidente del Consejo de Asesores Económicos, propuso en noviembre de 2024 un **«Acuerdo de Mar‑a‑Lago»**: el papel preeminente del dólar como moneda financiera y de reserva genera alta demanda y una apreciación por encima del equilibrio, que produce déficits y debilita la industria; podría controlarse gravando la compra de reservas en dólares o alargando los plazos de los bonos. Los críticos señalaron que omite la cuenta de capital, que podría afectar aún más al dólar, y que el déficit resulta de las decisiones de ahorro e inversión del gobierno y las empresas.\n• **Impacto sobre China y otros socios:** un vocero chino afirmó que China se preparaba desde hacía 10 años para la confrontación, con represalias que incluyen sanciones y restricciones a productos críticos. La concentración de medidas presionará a las exportaciones chinas a buscar nuevos mercados, lo que provocará reacciones defensivas de terceros (aranceles, antidumping, salvaguardias), con resultados imprevisibles.\n• **Reindustrialización:** muchos empresarios señalan que traer la manufactura exigiría producción altamente robotizada, lo que frustra la creación de empleo y requiere mano de obra muy especializada que no se forma a la velocidad necesaria; además, los aranceles apuntan a actividades con una participación pequeña y decreciente en el PIB, y la relocalización de acero o autos tendría que ser muy automatizada para competir con Asia.\n\n### De la geoeconomía a la geopolítica: escenarios posibles\n\nSe construyen escenarios con dos ejes: el **nivel de tensiones globales** (vertical) y la **dinámica de cooperación internacional** (horizontal), basados en do Prado et al. (2025) (Figura 1). No son excluyentes ni predicciones, sino una forma esquemática de imaginar futuros; la trayectoria real combinará elementos de los cuatro y factores aleatorios como pandemias, desastres o conflictos.\n\n• **Escenario 1. Rivalidad proteccionista** (alta tensión, baja cooperación): el peor. Suben aranceles y barreras, represalias, políticas industriales nacionalistas de autosuficiencia, poca inversión transfronteriza; la rivalidad se extiende más allá de Estados Unidos y China, con desprecio por los acuerdos y riesgo de conflicto armado. China responde con más represalias, restricciones a materias primas críticas e intervenciones masivas en el mercado de deuda estadounidense; fragmentación profunda y recesión global. Estados Unidos insiste en controlar el Canal de Panamá y ocupar Groenlandia; una crisis provocada por China en el estrecho de Taiwán; las materias primas críticas, muchas extraídas y refinadas por China, se vuelven armas comerciales.\n• **Escenario 2. Colaboración estratégica** (baja tensión, alta cooperación): los gobiernos priorizan acuerdos y normas globales y diálogos estructurados para resolver desequilibrios racionalmente. China y Estados Unidos crean un marco permanente de consultas; promueven *joint ventures*, inversión con transferencia de tecnología acordada y creación de empleo, aseguran minerales críticos y comparten innovación. Se fortalecen las cadenas de valor y los demás se benefician de la distensión.\n• **Escenario 3. Coexistencia competitiva** (alta tensión, alta cooperación): un cuadro mixto. Muchos gobiernos mantienen las cadenas de valor atendiendo a la competencia leal y la seguridad nacional; aplican defensa comercial y salvaguardias a productos chinos o medidas de «zona gris» (restricciones voluntarias de exportación) con Estados Unidos y China, a la vez que forman alianzas estratégicas. Resulta una alta **regionalización**, con bloques comerciales y prioridad a objetivos internos sin dejar el comercio global.\n• **Escenario 4. Dominio unilateral** (baja tensión, baja cooperación): una región o país domina la producción por liderazgo tecnológico, tamaño de mercado y control de recursos críticos. China, dominante en alta tecnología y software, captura gran parte del mercado global; el dólar deja de ser la principal moneda de pagos y reservas; con la declinación y recesión estadounidense, China pasa a ser el centro de la economía mundial. Las empresas estadounidenses enfrentan una crisis estructural; otras regiones se vuelven dependientes de la tecnología y las cadenas chinas, con estructuras menos diversificadas y poca competencia.\n\n**Escenario posible.** La inestabilidad, marca de Trump, tenderá a frenar la inversión productiva directa: es improbable que las empresas trasladen en masa su manufactura en pocos meses; la mayoría esperará mayor definición. El desprecio por los acuerdos preferenciales, las concesiones a países en desarrollo y las reglas fundamentales de la OMC (consolidación arancelaria, NMF, trato nacional), junto con la aplicación discrecional, generaron **desconfianza**; los principales socios (China, UE, Japón) adoptan una estrategia de reducción del riesgo (*derisking*). La pérdida de credibilidad ya se ve en los mercados de capitales y de deuda: pese a su vibrante mercado de consumo, Estados Unidos se volvió un **socio poco confiable**, por el comportamiento errático de su líder y asesores. Algunos ven, quizás como racionalización *ex post*, un método en los textos de Miran, Scott Bessent y Howard Lutnick; la mayoría ve fundamentos débiles. El sistema de **pesos y contrapesos** prácticamente dejó de funcionar: Trump tiene poderes sin precedentes, como muestra la explosión de órdenes ejecutivas. El único contrapeso efectivo fue el de los **mercados**, sobre todo el de bonos; otros posibles son el comportamiento de consumidores y votantes ante la inflación y la caída de actividad, las donaciones de campaña para las elecciones de medio término, y la opinión de Wall Street y los «Tech‑bros».\n\nTres tendencias de los primeros 100 días: **primera**, China actuó con firmeza y calma: al errático *El arte de la negociación* de Trump respondió con la paciencia milenaria de *El arte de la guerra* de Sun Tzu: «China 1, Estados Unidos 0»; su influencia en el mercado de bonos no habría sido despreciable. **Segunda**, la relación entre los mercados de capitales y deuda y la política comercial quedó totalmente entrelazada, lo que plantea preguntas porque sus sistemas de gobernanza difieren en regulación, ámbito y comunidades epistémicas; ya era claro en 2008, pero ahora tiene contornos más precisos. **Tercera**, la **declinación de la centralidad estadounidense**: el aumento del «riesgo EE. UU.» y el ascenso económico y tecnológico de China apuntan a un papel creciente de esta. El ataque de Estados Unidos al orden de Bretton Woods, que él mismo concibió y que lo hizo el país más rico, recuerda *La marcha de la locura* de Barbara Tuchman (1984), sobre gobiernos que actúan contra sus propios intereses. El dominio del dólar se cuestiona en China, el Sudeste Asiático, el Golfo y los BRICS; los recortes a universidades y la expulsión de estudiantes internacionales refuerzan la impresión de comportamiento autodestructivo.\n\n¿Cómo reaccionarán los demás ante lo que parece no una época de cambios, sino un **cambio de época**? Por ahora la UE, Japón, India, Reino Unido y Brasil adoptan una actitud moderada, que podría cambiar si vuelven aranceles prohibitivos o si se los fuerza a elegir entre Estados Unidos y China; emerge, tenuemente, un acercamiento UE‑CPTPP. La gran pregunta es si Estados Unidos podrá negociar acuerdos amplios y respetados desde la coerción y formar un nuevo orden basado no en reglas multilaterales sino en el deseo o la necesidad de seguir exportando a su mercado.\n\n**Organización Mundial del Comercio.** Las medidas son un ataque frontal a sus reglas, aunque las dudas estadounidenses no son nuevas: desde 2008, cuando Pascal Lamy intentó cerrar la Ronda Doha, fueron evidentes. Tras los éxitos de China ante el Órgano de Apelación contra medidas de defensa comercial estadounidenses, Estados Unidos acusó a la OMC, «no sin razón», de activismo judicial e interpretaciones inconsistentes con la Ronda Uruguay; criticó el **capitalismo de Estado** chino y sus subsidios, incompatibles con la economía de mercado; y bloqueó los nombramientos del **Órgano de Apelación**, inactivo desde 2019. India y Sudáfrica obstruyeron las negociaciones plurilaterales (como comercio electrónico). Estados Unidos anunció que dejaría de aportar al presupuesto y se presentó un proyecto para retirarse. Alternativas: **primera**, que los demás abandonen la OMC: improbable, por el apoyo de la UE, Japón, Australia, Brasil y otros, y porque cerca del 80 % del comercio de mercancías se realiza bajo NMF; aunque el comercio China‑Estados Unidos virtualmente se desacople, el resto seguirá bajo aranceles multilaterales, y los más de 300 acuerdos preferenciales se basan en los compromisos OMC. **Segunda**, una **«OMC menos uno»**, por retiro formal o desentendimiento total de Estados Unidos: realista, porque es improbable que lidere una reforma; la cuestión sería qué papel asumiría China, si lideraría consensos como el Acuerdo de Facilitación de Inversiones, y un mecanismo renovado de solución de diferencias. Es clave el papel de China, la UE y potencias medias como Japón, Corea, Reino Unido, India, Brasil e Indonesia, cuya coordinación con las economías pequeñas podría dar nuevo impulso a la organización.\n\n### Conclusión\n\nLas medidas desde enero de 2025 representan una **ruptura del sistema multilateral basado en reglas** vigente desde el GATT (1947) y la OMC (1995). Estados Unidos, cuya hegemonía desafía China, renunció a pagar el precio del liderazgo de un sistema que lo hizo el país más rico y poderoso militarmente. La **Pax Americana** presuponía la voluntad política de ejercer un liderazgo externo, que ya no existe: prima la política interna, con el lema «Make America Great Again» (el «again» reconoce que hoy no lo es). Esa falta de voluntad se debe al ascenso de China como potencia retadora, cuyo crecimiento, contra lo que muchos creían en 2001, consolidó al Partido Comunista en lugar de cambiar su régimen. Estados Unidos nunca tuvo un rival así: una economía de casi el 70 % de su PIB, con un desarrollo tecnológico envidiable, liderazgo político en Asia, alianza estratégica con Rusia y principal socio comercial de casi toda África, América Latina y Asia. Se abre un nuevo ciclo estratégico en que Estados Unidos parece abandonar el orden liberal multilateral y crear inestabilidad a costa de su credibilidad; implicará aceptar una división del mundo en grandes espacios económicos regionales y una nueva configuración de polaridades. Nada está garantizado: los mercados pueden adaptarse y Estados Unidos, con el mayor mercado de consumo del planeta, seguir atrayendo inversiones y siendo centro de innovación tecnológica. ¿El mundo será liderado por tres, dos o una potencia hegemónica? ¿Qué escenario prevalecerá?"}, "2": {"ejercicios": [], "leido": false, "resumen": "## Antràs: 3.2 Geoeconomía\n\n**(Fragmento cargado: sección 3.2 completa y el inicio de la 3.3; el original está en inglés y el resumen en castellano.)**\n\n**Figura 7.** Participación en el comercio mundial (2015‑2019) de los códigos HS6 de **doble uso**, según la lista de la Comisión Europea de cada año (Alekseev y Lin, 2024): sube con fuerza, con saltos tras Crimea (2014) y la guerra de Ucrania.\n\nLas tensiones geopolíticas se han intensificado: la guerra comercial Estados Unidos‑China, la invasión rusa de Ucrania y la convulsión en Medio Oriente. Su impacto en el comercio es claro: las importaciones estadounidenses de mercancías desde China cayeron más del 20 % en 2023, volviendo a sus niveles de 2013, y los flujos entre países **geopolíticamente alineados** crecieron desproporcionadamente más que entre bloques distintos (Gopinath et al., 2024). Ese impacto refleja sobre todo cambios de política: la **seguridad nacional** pesa cada vez más en la política comercial. Ciertos bienes, en especial de tecnología y defensa, se consideran críticos y se restringen sus exportaciones e inversiones; crece mucho el porcentaje del comercio que la Comisión Europea considera **bienes de doble uso** (con aplicaciones civiles y militares). Algunos bienes, como las ojivas nucleares, son claramente claves y es natural restringir su exportación a adversarios; pero para muchos otros es mucho menos claro, en un mundo donde gran parte del comercio son tramos de **cadenas globales de suministro** complejas y los exportadores pueden no saber cómo se usarán sus bienes.\n\n### A. Algunas aguas están siendo cartografiadas\n\nSurge una literatura creciente sobre cómo la seguridad nacional interactúa con la política comercial y las cadenas globales: las aguas de la geoeconomía están mucho más cartografiadas que un año antes. Hay interés en el uso óptimo de las **sanciones**, estudios empíricos sobre cómo el comercio se organiza a lo largo de **líneas de fractura geopolíticas** (Gopinath et al., 2024) y trabajos teóricos y cuantitativos sobre la interacción entre geopolítica, comercio y conflicto (antecedente: Hirschman, 1945). No se busca reseñarla, porque es pronto para hacer balance y las tensiones no desaparecerán, de modo que crecerá exponencialmente; se ofrecen razones por las que esta agenda entusiasma y tendrá una larga vida media.\n\n### B. ¿Qué maximizan los gobiernos?\n\nEl estudio de la política comercial se liga a entender qué maximizan los gobiernos. El punto de referencia del **planificador social benevolente** que maximiza el ingreso nacional aclaró el papel de la **relación de intercambio** en el diseño óptimo de aranceles e impuestos a la exportación (Johnson, 1953). Tomando teorías de economía política, se supuso que los políticos atienden otros aspectos además del bienestar social: el trabajo sobre el **lobby** (Grossman y Helpman, 1994) explicó por qué rara vez se observan impuestos a la exportación y dio predicciones contrastadas con la variación sectorial de aranceles (Goldberg y Maggi, 1999). Otros estudiaron los **sesgos conductuales y componentes psicosociales**.\n\nLos hechos recientes muestran que la **seguridad nacional** es un factor fundamental de la política comercial. No es original: está en el núcleo de las Relaciones Internacionales; es difícil entender la invasión de Ucrania por Putin o el *friendshoring* de Biden sin ella. Pero hasta hace poco los economistas la habían ignorado. ¿Cómo incorporarla a los modelos? Algunos agregan términos a la función objetivo del gobierno que reflejan **externalidades negativas** de ciertas transacciones (Clayton et al., 2023); otros las vinculan a exportaciones de bienes de doble uso que aumentan el poder militar de adversarios (Alekseev y Lin, 2024). Pero las modelizaciones son demasiado de **forma reducida**, lo que limita sus predicciones para guiar el trabajo empírico o las recomendaciones. Hay una analogía con los motivos proteccionistas de apoyo político: en forma reducida existían desde Findlay y Wellisz (1982) e Hillman (1982), pero no generaron una literatura empírica activa hasta que los **microfundamentos** de Grossman y Helpman (1994) dieron predicciones más precisas.\n\n### C. Algunas áreas que requieren más estudio\n\n**Primero**, el papel de la seguridad nacional parece tener características **contingentes al estado y lexicográficas**: en tiempos de paz la política comercial es en gran parte ortogonal a la geopolítica, pero en tiempos de conflicto la geopolítica se impone a cualquier otra consideración. Hoy muchos gobiernos parecen dispuestos a renunciar a una parte significativa de las ganancias de eficiencia del comercio para redirigirlo hacia países alineados. Si les importa tanto la seguridad nacional, ¿por qué no adoptan políticas precautorias más activas en tiempos de paz? Con una estructura comercial que reacciona lentamente a los shocks geopolíticos, esta dicotomía es desconcertante.\n\n**Segundo**, la interacción entre la política comercial óptima y la **estructura de las alianzas políticas internacionales**. El comercio se moldea cada vez más por el alineamiento geopolítico, lo que indica que la política comercial responde a algo más que «nosotros contra el mundo»; pero la teoría es demasiado reducida para indicar cómo diseñar la política óptima según la estructura de alianzas. Además, los economistas suelen tratar las alianzas como fijas, cuando son dinámicas y pueden estar moldeadas por factores económicos: Cuba o Venezuela, hoy adversarios de Estados Unidos, tuvieron fuertes lazos económicos con él; y China es el principal socio comercial de muchos «amigos» de Estados Unidos (Japón, Corea del Sur, Australia, Sudáfrica, Brasil, Chile). En un posible desacople, ¿se alinearán con Estados Unidos para aislar a China? Entender cómo se forman las alianzas y cómo las moldea la estructura del comercio es de gran e inmediata relevancia.\n\n## 3.3 Economía conductual (inicio)\n\nLa economía conductual avanzó en muchas áreas, pero su aplicación al comercio internacional es limitada. No sorprende: las teorías del comercio se centran en la oferta (las empresas), y que maximicen beneficios es una buena aproximación, sobre todo para las grandes empresas sofisticadas que dominan el comercio y la actividad multinacional, que perderían enormes sumas si cometieran errores sistemáticos. También suponen consumidores racionales, y no es obvio que los sesgos del laboratorio sean de primer orden para los flujos comerciales; la preferencia por lo «local» se capta con un **sesgo doméstico** en las preferencias o con mayores costes comerciales efectivos. No se descarta aprender incorporando sesgos: modelar las decisiones gerenciales como **reglas prácticas** sencillas, o estudiar empresas racionales frente a consumidores que cometen errores sistemáticos. Aun así, el argumento que se anuncia es que, aunque se ignoren los sesgos al estudiar los flujos condicionados a un entorno de política, hay mucho margen para entender cómo… **(el fragmento cargado termina aquí).**"}, "3": {"ejercicios": [], "leido": false, "resumen": "## El regreso de la política industrial\n\n*Douglas Irwin, Finanzas y Desarrollo (FMI), junio de 2023, sección «El comercio, desarticulado».* ¿Deben las economías en desarrollo seguir el ejemplo de Estados Unidos y China, y promocionar las empresas líderes?\n\nLa geopolítica transforma rápidamente el panorama del comercio mundial; las políticas de hace un par de décadas parecen un recuerdo lejano. En las reformas de los 90 y 2000 las economías en desarrollo y en transición abrieron sus mercados y se sumaron a la globalización; se creó la **OMC** y un sistema de comercio no discriminatorio basado en reglas, sin tensiones geopolíticas: China se centraba en crecer y Rusia en estabilizarse. Ahora se debate el futuro de la globalización: preocupan la **fragmentación** y el incumplimiento de las normas. Aumentan las intervenciones: políticas y subsidios industriales, restricciones de importación por razones ambientales y de seguridad nacional, y controles a la exportación para castigar rivales y asegurar el abastecimiento interno.\n\n¿Qué deben hacer las economías en desarrollo? ¿Adoptar políticas similares y aislarse para proteger sus sectores más importantes con ayudas y controles? El debate sobre entrar o salir de la economía mundial es eterno. En los 50 se temía un **deterioro permanente de los términos de intercambio** y se proponía **sustituir importaciones** para ser más autosuficientes.\n\n### Una interpretación errónea de la historia\n\nUna razón de ese repliegue fue la creencia de que los países ricos debían su éxito a proteger las manufacturas, lo que dio respetabilidad a la política industrial. Fue una **interpretación errónea**. Pese a sus altos aranceles, **Estados Unidos** se desarrolló como economía abierta a la inmigración, el capital y la tecnología, con un mercado interno excepcionalmente amplio y ferozmente competitivo; a fines del siglo XIX superó en ingreso per cápita a Gran Bretaña, librecambista, gracias a la productividad del trabajo en los **servicios**, no en la manufactura (Broadberry, 1998).\n\nAunque la sustitución generalizada de importaciones perdió popularidad, el debate continúa. La experiencia de **Asia Oriental** le dio luz positiva, pero aun allí la norma histórica engaña. En 1960 **Corea del Sur** tenía una moneda sobrevaluada, exportaciones de apenas el 1 % del PIB y una capacidad importadora dependiente de la ayuda estadounidense. Tras devaluar a comienzos y mediados de la década, sus exportaciones se dispararon hasta el 20 % del PIB a comienzos de los 70. La política principal fue un **tipo de cambio realista** y crédito más barato para todos los exportadores, no solo de sectores específicos (Irwin, 2021). La política industrial propiamente dicha llegó con la promoción de la industria química y pesada en 1973‑79, cancelada por costos excesivos y falta de efectividad; el rápido crecimiento ya había comenzado antes.\n\nEl debate lleva tiempo estancado: para unos, la política industrial es esencial para la productividad y la transformación estructural; para otros, incita a la corrupción y fomenta la incompetencia. Unos citan el ensamblaje electrónico en **Tierra del Fuego**; otros, las fábricas de alta tecnología de China y Corea. Los modelos cuantitativos indican que los beneficios de las políticas industriales, por óptimo que sea su diseño, son pocos y sin claro poder transformador (Bartelme et al., 2021).\n\nLa novedad es que **Estados Unidos se sumó a China** y abraza explícitamente las políticas industriales. China lo hace al menos desde que **Xi Jinping** restableció el control estatal, dejando atrás la orientación exterior de Deng Xiaoping: **Made in China 2025**, con amplios subsidios a industrias específicas, dio paso a la **«doble circulación»**, para reducir la dependencia externa reforzando el abastecimiento con empresas locales y la autosuficiencia en tecnologías esenciales. Estados Unidos protegió acero y aluminio bajo Trump, supuestamente por seguridad nacional; con la **Ley CHIPS** y la **Ley de Reducción de la Inflación** introdujo subsidios para «relocalizar» los semiconductores y normas de contenido nacional para los vehículos eléctricos. La **UE** siempre tuvo políticas industriales; en 2020 anunció una estrategia para su «economía estratégica abierta» en la transición verde y digital.\n\n¿Deben las economías en desarrollo adaptarse a este **nuevo consenso entre Washington, Beijing y Bruselas**? Sería arriesgado: los subsidios podrían ser costosos y los beneficios esquivos, y las restricciones podrían provocar un giro proteccionista que reduzca los ingresos de exportación y, con ello, las importaciones esenciales que financian. Los subsidios a gran escala parecen un **lujo de los países ricos**; que puedan permitírselos no implica que otros deban imitarlos. Ricardo Hausmann advirtió: «Copiar las soluciones de otros países a problemas que uno no tiene, o focalizar la atención en asuntos de moda que en el fondo no son importantes, no lleva sino a la incompetencia, o aún peor, al fracaso». Con finanzas precarias y beneficios inciertos, sería más sensato destinar los escasos fondos a **salud, educación y ayuda a los pobres**.\n\n### Subsidios industriales y sustitución de importaciones\n\nChina muestra que los subsidios pueden no ser eficaces. En 2006 declaró la **construcción naval** «sector estratégico» y subsidió masivamente producción e inversión con préstamos baratos. No hubo beneficios cuantiosos: resultaron ineficientes (exceso de capacidad) y distorsionaron los mercados (los países más eficientes tuvieron que reducir producción). Su cuota aumentó a expensas de productores de bajo costo de Japón, Corea del Sur y Europa, sin beneficios significativos para los productores internos (Panel, Kalouptsidi y Bin Zahur, 2019). Los préstamos fueron **políticos**, sobre todo a empresas estatales; no hubo derrames al resto de la economía ni aprendizaje con la práctica.\n\n### Sacrificar los beneficios del comercio\n\nLas restricciones al comercio podrían sacrificar beneficios obtenidos por participar en los mercados mundiales. El progreso de muchos países se basó en la **integración**, no en cerrar mercados para estimular la innovación autóctona. **China** no se hizo rica por la política industrial, sino por mejorar la productividad agrícola, permitir la inversión extranjera en manufacturas y potenciar el sector privado. En **India**, las reformas de 1991 que desmantelaron el burocrático **«Licencia Raj»** y abrieron la economía siguen siendo motor de crecimiento, aunque se requieren nuevas reformas. **Bangladesh** se benefició de abrirse a la inversión extranjera, con capital y tecnología, al punto de superar a India en ingreso per cápita.\n\nAunque está de moda desacreditar el **consenso de Washington**, la apertura de ese período generó **convergencia**, y no la divergencia que había sido la norma, entre países ricos y pobres: desde alrededor de 1990 las economías en desarrollo crecieron más rápido y comenzaron a alcanzar a las avanzadas (Patel, Sandefur y Subramanian, 2021). El debate sobre si la globalización murió no lleva a nada: **no ha muerto, pero está cambiando**. Sería desacertado que las economías en desarrollo dieran la espalda a la economía mundial y abandonaran el apoyo a las exportaciones y la adquisición de tecnología del exterior: tienen mucho que ganar del resto del mundo y mucho que perder si vuelven a las políticas de puertas cerradas."}}}, "EI42-c6": {"extras": [{"ejercicios": [], "leido": false, "resumen": "## ¿El fin del sur global? Una etiqueta política puesta a prueba por los datos\n\n*Mariano Turzi, Comentarios Estratégicos n.º 64, CARI, julio de 2026.*\n\n### Introducción\n\nEl 28 de febrero de 2026, Estados Unidos e Israel lanzaron ataques aéreos sorpresa contra Irán, en medio de negociaciones diplomáticas indirectas. Irán respondió con misiles y drones contra Israel y contra bases estadounidenses en Bahréin, Kuwait, Qatar, Emiratos Árabes Unidos, Arabia Saudita, Jordania e Irak, e impuso un cierre selectivo del estrecho de Ormuz, lo que disparó los precios del petróleo y el gas. La crisis, precedida por la «guerra de los Doce Días» de junio de 2025 y meses de sanciones, reabrió una pregunta recurrente: ¿cómo respondería el **«sur global»** ante una agresión de dos potencias occidentales contra un país que integra desde el 1 de enero de 2024 el **BRICS ampliado**?\n\nLa respuesta fue la **ausencia de una respuesta unificada**. A diferencia de junio de 2025, cuando el bloque emitió una declaración conjunta, en 2026 no logró una posición común: India, presidencia rotativa, evitó confrontar a Washington y Tel Aviv; Brasil, Rusia y China condenaron con mayor firmeza; Emiratos Árabes Unidos, miembro pleno, sufrió misiles disparados por otro miembro pleno, Irán; y Arabia Saudita, país asociado, advirtió que se reservaba el derecho a represalias. Dos integrantes de la plataforma que pretende ser la voz del sur global terminaron en extremos opuestos de un intercambio de fuego.\n\nEl episodio, todavía en desarrollo y documentado con fuentes periodísticas, confirma una tesis que excede la coyuntura: el «sur global», como el «tercer mundo», **nunca describió una base material o estructural compartida**. Fue una **construcción discursiva y política** sostenida en un denominador común más estrecho que la «solidaridad»: el **rechazo táctico al orden internacional liderado por Estados Unidos**. Cuando ese rechazo deja de servir a los intereses de cada Estado, o ni siquiera existe ya, sino posturas bilaterales y transaccionales, la etiqueta se vacía de contenido operativo aunque sobreviva como retórica diplomática.\n\nSe examinan tres dimensiones donde la cohesión debería manifestarse: **comercio**, **votos en la Asamblea General de la ONU** y **respuesta a crisis de seguridad**. Se recupera además la **escuela de la autonomía** de Juan Carlos Puig y Hélio Jaguaribe, que ofrece herramientas más precisas. El argumento central: la evidencia confirma la fragilidad conceptual del sur global y sugiere algo más inquietante: ni siquiera el rechazo táctico a Estados Unidos explica el comportamiento de estos países. Lo que muestra es una **geopolítica de intereses nacionales atomizados**, sin proyecto colectivo de ningún signo.\n\n### 1. Genealogía de una etiqueta política\n\nLa idea nace de una historia concreta, no de una estructura económica. Desciende del **«tercer mundo»**, categoría de la Guerra Fría para los países no alineados con ninguno de los dos bloques. Vijay Prashad: «El Tercer Mundo no era un lugar. Era un proyecto» (2007). Un lugar se describe por coordenadas materiales; un proyecto, por una intención política compartida. La que unió a los firmantes de **Bandung (1955)** y a los fundadores del **Movimiento de Países No Alineados** fue anticolonial y antiimperialista: resistencia a las dos superpotencias, con énfasis en la crítica al poder occidental y, en su núcleo, estadounidense.\n\nTras la Guerra Fría, «sur global» reemplazó a «tercer mundo» pero conservó la misma **función relacional**: definirse por lo que se rechaza o por la posición subordinada frente a un «norte» igualmente impreciso. Haug, Braveboy‑Wagner y Maihold (2021, *Third World Quarterly*) lo caracterizan como una **«meta‑categoría»** de crecimiento exponencial desde los 90, sin consenso sobre su significado, con tres lecturas no necesariamente compatibles: marginalidad socioeconómica, construcción de alianzas multilaterales y **resistencia al poder hegemónico global**. Concluyen que solo es útil si se usa de manera acotada a un problema concreto, no como descripción de un bloque con intereses comunes.\n\nLa tercera lectura es la que más subyace al uso político y coincide con la genealogía de Prashad. La **ampliación de los BRICS** es ilustrativa: en Johannesburgo (agosto de 2023) se invitó a Argentina, Arabia Saudita, Egipto, Emiratos, Etiopía e Irán. La invitación a la Argentina, impulsada por India, fue rechazada por el gobierno de **Javier Milei**, que profundizó su alineamiento con Estados Unidos: cuando la pertenencia al «sur global» choca con el alineamiento elegido, **es la pertenencia la que cede**. Además, el bloque incorporó a países con relaciones radicalmente distintas, a veces antagónicas, con Estados Unidos: según Tawat (2025), algunos miembros del BRICS+ «son rivales e incluso están enfrentados en un conflicto», y «Rusia no se considera parte del sur global». Sumar a Irán y Arabia Saudita muestra que el criterio no fue la cohesión estratégica sino el **volumen demográfico y económico** para disputar peso al G7. Un bloque que crece sumando rivales construye una **coalición de circunstancia**.\n\n### 2. La economía del sur: integración real, pero no donde se la busca\n\n¿Existe al menos una base material, una economía sur‑sur densa como sistema alternativo al centrado en las economías avanzadas? Según **UNCTAD**, el comercio sur‑sur pasó del **11 % del comercio mundial de mercancías en 2000 al 26 % en 2024** (6,2 billones de dólares), y siguió creciendo entre 8 % y 9 % anual en 2025 y comienzos de 2026. Pero su composición cuenta otra historia.\n\nPrimero, está **extremadamente concentrado**: ya en 2005 Asia representaba el 85 % del comercio sur‑sur (América el 10 %, África el 5 %); en 2024 las economías asiáticas exportaron el 56 % de los servicios del sur global, y China sola 381.000 millones de dólares. Lo que se computa como «sur‑sur» es sobre todo **comercio intraasiático** y comercio impulsado por **China** como manufacturera y compradora de insumos y commodities: la consolidación de cadenas de valor regionales en Asia oriental y sudoriental, no solidaridad política. Atribuirlo a una lógica de cooperación sur‑sur confunde una causa estructural y regional con una intención colectiva que nunca existió.\n\nSegundo, el dato más incómodo: **Estados Unidos sigue siendo el principal destino individual** de las exportaciones de las economías en desarrollo: **1,8 billones de dólares en 2024**, frente a 1,3 billones a China. Si el sur se reorganizara en torno a la autonomía respecto de la potencia que rechaza, cabría esperar una caída relativa de esa centralidad; ocurre lo contrario. **La complementariedad económica, no la afinidad ideológica, explica los flujos.**\n\nLa evidencia sobre **inversión extranjera directa** sur‑sur es fragmentaria: en 2006 el 36 % de los flujos globales (334.000 millones) iba al sur; en 2023 la IED hacia economías en desarrollo cayó 7 % y hacia los países menos adelantados creció 17 %. Esa volatilidad no permite conclusiones firmes ni a favor ni en contra, y requeriría investigación específica.\n\nEn síntesis, no hay un proyecto colectivo de **desacople** del norte, sino dos procesos paralelos: la **integración regional asiática liderada por China** y la **persistente centralidad del mercado estadounidense**. Ninguno requiere ni se explica mejor por una identidad política del «sur».\n\n### 3. El test político: cohesión y fractura en la Asamblea General\n\nLa votación en la **Asamblea General de la ONU** es el foro donde casi todos los Estados expresan pública y repetidamente su posición. La literatura cuantitativa (Voeten; Bailey, Strezhnev y Voeten, 2017, con un modelo espacial de **«puntos ideales»**) permite distinguir cohesión retórica de cohesión efectiva.\n\n**Ferdinand (2014)** analizó a los BRICS entre 1974 y 2011: cohesión creciente y relativamente alta en el agregado, pero con divergencias persistentes en lo más sensible: **desarme nuclear y derechos humanos**. Donde más importa, la cohesión se debilita. **Dijkhuizen y Onderco (2019)**, sobre copatrocinio de resoluciones, hallaron que la cohesión de los BRICS, aunque superior al promedio de la Asamblea, es **inferior a la del resto de los pa
