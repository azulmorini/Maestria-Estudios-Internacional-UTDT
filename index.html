 en su definición de la economía, de los actores básicos y de las fuerzas del cambio, en las preguntas y en los métodos.\n\n**Definición de una economía.** En 1992 el NBER reunió por primera vez a economistas y politólogos para analizar si Japón creaba deliberadamente un bloque económico exclusivo en Asia oriental y sudoriental (Frankel y Kahler, Regionalism and Rivalry, 1993). Hicieron preguntas distintas, con métodos distintos, y llegaron a conclusiones distintas. Los politólogos se centraron en la conducta comercial y de inversión de las firmas japonesas y en la ayuda oficial: las corporaciones, con apoyo del Estado, incorporaban a las economías del Pacífico asiático en redes industriales y financieras dominadas por grandes corporaciones japonesas, una división regional del trabajo centrada en Japón; como en los años treinta, Japón buscaba una esfera de influencia, esta vez por medios económicos pacíficos. Definían la economía como una estructura jerárquica dominada por las multinacionales y el Estado japonés. Los economistas analizaron flujos comerciales y magnitudes medibles y modelables: todo se explicaba por fuerzas de mercado y respuestas de las firmas (la inversión respondía a la apreciación del yen tras el Acuerdo del Plaza de 1985 y a cambios en la ventaja comparativa); el comercio intrarregional crecía menos que el del Pacífico asiático con el resto del mundo; no había ni economía regional distintiva ni esfuerzo japonés por crear una esfera. Los politólogos definían la economía por actores poderosos; los economistas, por fuerzas y cantidades. Ambos enfoques son complementarios y juntos profundizan la comprensión.\n\n**Naturaleza de los actores económicos.** A fines de los sesenta, estudiantes de Princeton pidieron un curso sobre la corporación multinacional (EMN), entonces muy controvertida: Vernon creía que facilitaría el uso eficiente de los recursos y el desarrollo; Hymer y otros radicales la veían como instrumento del imperialismo capitalista estadounidense. El profesor respondió que «la corporación multinacional no existe»: existen corporaciones, pero todas se comportan igual, respondiendo a señales de mercado para maximizar ganancias, sea cual sea su nacionalidad (el cartero reparte el correo sin importar el color del uniforme). La propiedad de los medios de producción y el origen nacional son irrelevantes. Para la economía neoclásica el mundo está poblado solo por individuos (consumidores y productores) que persiguen racionalmente su interés; firmas y Estados son agregados de individuos; no hay diferencias fundamentales entre actores estadounidenses, japoneses o bantúes; solo cambian las restricciones y oportunidades. Para un marxista, los actores fundamentales son las clases (definidas por la propiedad de los medios de producción) y sus representantes; toda corporación representa a la clase capitalista. Para el enfoque estadocéntrico, los actores primarios son los Estados y otros grupos políticos poderosos, y la nacionalidad de la EMN importa porque su conducta está influida por las políticas y la cultura de su país: una «multinacional» es una corporación de una nacionalidad particular cuyas actividades internacionales promueven los intereses económicos, políticos o de seguridad de su país de origen.\n\n**Dinámica de la economía mundial.** En septiembre de 1992 inversores privados sacaron enormes sumas de la libra y la lira hacia el marco, forzando devaluaciones, desgarrando el Mecanismo de Tipos de Cambio (MTC) del Sistema Monetario Europeo y llevando a la salida británica y a una unificación europea «a dos velocidades». Los economistas sabían del papel de la reunificación alemana y del rechazo danés a Maastricht, pero los trataron como factores externos al modelo; les interesaba la dinámica de la crisis, por ejemplo formular un modelo general de crisis financieras. Los economistas políticos se interesaron por la génesis política, su resolución y sus consecuencias de largo plazo: los factores exógenos. Hicieron preguntas distintas.\n\nDesde los setenta los flujos financieros llegaron a cientos de miles de millones diarios y pueden abrumar economías nacionales; la integración financiera obligó a los gobiernos a ceder autonomía, porque las fuerzas del mercado terminan revirtiendo políticas inapropiadamente expansivas. Muchos vieron en 1992 el triunfo de las fuerzas transnacionales sobre el Estado nación, «el fin de la geografía»: gobiernos rehenes de los mercados y los especuladores, que no obtendrían capital si desatendían a sus controladores; la crisis asiática de 1997 parecería confirmarlo. La interpretación alternativa enfatiza las decisiones gubernamentales y los desarrollos políticos: la eliminación de barreras a los flujos de capital intraeuropeos (julio de 1990) aumentó el riesgo especulativo; se restringió más la flexibilidad cambiaria; el rechazo danés y la ajustada aprobación francesa (51%) generaron dudas; y sobre todo, el Bundesbank subió fuertemente las tasas desde noviembre de 1990 para contrarrestar la inflación de la reunificación, mientras la Reserva Federal bajó las suyas en 1992 y el gobierno británico sostenía una libra sobrevaluada a costa de la peor recesión de posguerra. La brecha de tasas y los problemas de Italia y Gran Bretaña generaron un desequilibrio; gestores como George Soros vieron la oportunidad y otros los siguieron en una «sobrerreacción especulativa». A un nivel, Italia y Gran Bretaña fueron abrumadas por el mercado; a un nivel más profundo, la crisis se debió a decisiones de autoridades estadounidenses, alemanas y británicas (los franceses la denunciaron como «complot anglosajón»). Las fuerzas impersonales del mercado y las acciones deliberadas de unos pocos Estados poderosos determinan la dinámica de la economía mundial; las fuerzas de mercado son dominio del análisis económico y la explicación de las políticas, de la economía política; hay que usar ambos.\n\n### La naturaleza de una economía\n\nLos economistas ven la economía como un mercado de fuerzas impersonales; los especialistas en EPI, como un sistema sociopolítico poblado de actores poderosos. Para la interpretación neoclásica, la economía es un mercado o conjunto de mercados de fuerzas impersonales sobre las que los actores, incluidos Estados y corporaciones, tienen poco o ningún control: salarios, precios y tasas flexibles que asignan recursos mientras compradores y vendedores persiguen racionalmente sus intereses (Leonard Silk); un sistema autorregulado de precios y cantidades donde los actores son «tomadores de precios». La interpretación de economía política del libro define la economía como un sistema sociopolítico de actores o instituciones poderosas (grandes firmas, sindicatos, agronegocios) que compiten por moldear las políticas (impuestos, aranceles) a su favor, siendo los gobiernos nacionales los más importantes. Esta concepción la comparten muchos ciudadanos y la mayoría de los científicos sociales no economistas.\n\nInteresa especialmente el papel de las instituciones, que determinan o influyen en los incentivos de la interacción. En economía, las dos explicaciones principales de su creación son el institucionalismo neoclásico y la elección pública, que las explican como acción consciente para promover intereses económicos, pero difieren en su propósito: para el primero, resuelven problemas económicos y aumentan la eficiencia (las corporaciones reducen costos de transacción); para la segunda, las instituciones gubernamentales son creadas por grupos poderosos, funcionarios y políticos para su propio interés y disminuyen la eficiencia (los aranceles transfieren ingresos de consumidores a productores). Ambas suponen intenciones racionales. Los economistas políticos creen que las instituciones se crean por motivos racionales, irracionales y hasta caprichosos, y se basan en la dependencia de la trayectoria: son resultado de accidentes, elecciones aleatorias y azar, de procesos acumulativos que se refuerzan (la prohibición constitucional de que un estadounidense nacido en el extranjero sea presidente buscaba impedir el acceso del detestado Hamilton). Muchas no son eficientes ni representan los intereses de quienes las crearon, pero una vez creadas tienen gran ventaja sobre otras más eficientes. El institucionalismo neoclásico supone rendimientos constantes a escala, de modo que reemplazar una institución o firma menos eficiente sería sencillo; pero la establecida puede gozar de economías de escala por haber llegado antes y de legitimidad y una base de apoyo, y las «barreras de entrada» impiden el cambio. Hay muchas instituciones ineficientes y empresas oligopólicas surgidas de eventos aleatorios y decisiones irracionales.\n\nLa economía política requiere integrar los dos significados de «economía»: mercados impersonales y actores poderosos interactúan para producir los resultados. Hay que entender cómo funcionan los mercados y cómo los actores poderosos, sobre todo el Estado nación, intentan manipularlos. La economía tiene herramientas analíticas muy útiles y un rico cuerpo de modelos, pero su alcance es demasiado limitado y sus teorías demasiado abstractas para la EPI; la ciencia política es fuerte en su énfasis en las «realidades» de la lucha universal por el poder, pero débil por lo intuitivo de sus métodos y sus fundamentos teóricos limitados. La EPI requiere economía, ciencia política y otras ciencias sociales, aunque su poder explicativo y predictivo será siempre limitado: como señaló Robert Baldwin, una teoría adecuada de la EPI tendría que basarse en una teoría de cómo deciden los gobiernos, y no existe.\n\n### El enraizamiento de la economía\n\nLa idea central es que los mercados están insertos en sistemas sociopolíticos más amplios. El gobierno, los intereses domésticos poderosos y las experiencias históricas determinan el propósito de la economía y los parámetros en que funciona el mecanismo de precios. Contra la creencia de que las actividades económicas son universales, sus objetivos son socialmente determinados y varían mucho: la satisfacción del consumidor individual describe a Estados Unidos, pero Japón y muchas sociedades asiáticas priorizan el bienestar de la comunidad y la cohesión social, y la fortaleza del Estado de bienestar europeo muestra que ni en Occidente es universal la idea de mercados libres al servicio de intereses privados. El sistema sociopolítico y los valores determinan también el papel legítimo del mercado y las formas socialmente aprobadas de perseguir objetivos económicos: cada sociedad fija reglas y límites, y lo que es «justo» en una no lo es en otra (el soborno es grave en Estados Unidos y fue práctica aceptada en China; muchos estadounidenses ven injusta la competencia de salarios bajos asiáticos y muchos asiáticos responden que es su única ventaja comparativa), fuente de malentendidos y conflictos a medida que las economías se vinculan.\n\nLa economía internacional también está inserta, aunque menos profundamente, en un sistema de regímenes, organizaciones públicas y privadas y, sobre todo, Estados nación. La o las potencias dominantes definen su propósito y sus reglas principales: durante la Guerra Fría, el sistema occidental bajo liderazgo estadounidense buscaba fortalecer los lazos de seguridad contra la URSS. Los economistas creen que la economía internacional surge fácil y automáticamente porque es natural «trocar, permutar e intercambiar» (Smith), pero crear una economía mundial abierta es políticamente muy difícil: abrir la economía es riesgoso porque produce de inmediato muchos perdedores resentidos y pocos ganadores (Olson). Por eso es resultado de acciones costosas de Estados poderosos (hegemones) por razones económicas, políticas y sobre todo de seguridad; los intereses privados de grupos empresarios importan, pero los intereses políticos y de seguridad de los Estados tienen el papel central.\n\nAsí lo muestran las sucesivas economías internacionales: en la era mercantilista de los siglos XVII y XVIII las potencias combatieron por imperios que sostuvieran sus rivalidades, y aunque compañías como las de las Indias Orientales se beneficiaran, el objetivo era una balanza comercial favorable para financiar ambiciones militares. Tras las guerras napoleónicas surgió el «imperialismo del libre comercio»; para Jevons, el comercio sin trabas hizo de las partes del globo «tributarias voluntarias» de Inglaterra: la Pax Britannica se construyó sobre bases económicas. Tras la Segunda Guerra, Estados Unidos impulsó una economía mundial abierta (con antecedentes en la Ley de Comercio Recíproco de 1934 y el Acuerdo Monetario Tripartito, y luego Bretton Woods en 1944), pero su liderazgo enérgico llegó solo con la amenaza soviética: fortaleció las economías aliadas, forjó la alianza antisoviética y las ató a Estados Unidos; el Plan Marshall no habría existido sin la Guerra Fría. Crear y mantener una economía mundial abierta requiere un líder o «hegemón» con interés político y recursos para pagar sus altos costos: alentar la reducción de barreras, impedir el free riding y sancionar a quienes incumplan; sin él, la cooperación entre Estados egocéntricos sería muy difícil y la economía podría fragmentarse en proteccionismo y bloques.\n\nEste énfasis en actores políticos que usan su poder para influir en los resultados del mercado se parece a la elección pública, pero difiere en aspectos importantes. La elección pública implica que política y mercado pueden separarse y que sin intervención estatal el sistema de precios determinaría todo; para el autor el mercado es inherentemente político: sus efectos distributivos dependen de los derechos de propiedad, y estos están afectados por la política. Además, mientras la elección pública cree que los funcionarios se mueven sobre todo por intereses económicos, el autor cree que la seguridad y el prestigio nacionales pesan igual o más. También difieren en el concepto de Estado: para la elección pública el Estado es la suma de los individuos que gobiernan en un momento y el interés nacional, la suma de los intereses individuales o de los dominantes; para el autor el Estado es más que la suma de sus partes, tiene cierta autonomía respecto de la sociedad y el interés nacional es distinto de la suma de intereses. Ambos creen en el libre comercio, pero ese compromiso debe basarse en un concepto de interés nacional y no solo en los intereses de quienes gobiernan.\n\nPara conservar la lealtad de sus ciudadanos, el Estado debe cumplir funciones: la primaria es proveer seguridad interna y externa, que ninguna otra institución puede asumir; otra es promover el bienestar social y económico y garantizar estándares mínimos de justicia (el bienestar económico se unió íntimamente a la ciudadanía nacional, la «nueva economía nacionalista» de Mayall: sin Estado propio no hay acceso a programas de bienestar); y proveer identidad, porque los individuos necesitan pertenecer a un grupo social más amplio. La preocupación por la pérdida de identidad ante la globalización refuerza la utilidad del concepto de mercados insertos en un sistema sociopolítico.\n\n### Conclusión\n\nLa economía política se define como la interacción del mercado y los actores poderosos. Ambos componentes son necesarios: no se entiende el funcionamiento de las economías sin entender cómo funcionan los mercados y cómo los Estados y otros actores intentan manipularlos a su favor. Los mercados tienen su propia lógica de respuesta a precios relativos, restricciones y oportunidades; por eso el análisis debe comenzar con un conocimiento al menos rudimentario de cómo la economía entiende el mercado o mecanismo de precios.\n\n## Capítulo 4. El estudio de la economía política internacional\n\nLa EPI depende necesariamente de las teorías de la economía neoclásica, pero ambas hacen preguntas distintas. La economía se ocupa de la eficiencia y los beneficios mutuos del intercambio; la EPI, además, de la distribución de las ganancias de las actividades de mercado. Aunque a largo plazo toda sociedad gana en términos absolutos con mercados internacionales eficientes, las ganancias rara vez se distribuyen por igual, y los Estados se preocupan mucho por sus ganancias relativas. Los economistas ven los mercados como mecanismos autorregulados aislados de la política; la EPI se interesa por el impacto de la economía mundial sobre el poder, los valores y la autonomía política de las sociedades, que los Estados buscan resguardar, y por cómo los Estados manipulan las fuerzas del mercado para aumentar su poder sobre rivales o favorecer a amigos. Los economistas son en general indiferentes al papel de las instituciones; a la EPI le preocupan centralmente las instituciones y regímenes que gobiernan los mercados internacionales, porque afectan la distribución de las ganancias y la autonomía de los Estados, y los Estados poderosos buscan influir en su diseño. La EPI supone que Estados, multinacionales y otros actores poderosos usan su poder para moldear los regímenes internacionales.\n\n### Distribución de la riqueza y de las actividades económicas\n\nLa economía enfatiza la asignación eficiente y las ganancias absolutas de todos: el intercambio ocurre por beneficio mutuo. La interpretación estadocéntrica sostiene que los actores atienden también a las ganancias relativas, al tamaño de su ganancia comparado con la de otros. Los gobiernos se preocupan por los términos de intercambio, la distribución de los retornos de la inversión extranjera y, sobre todo, las tasas relativas de crecimiento. Los mercantilistas contemporáneos de Hume buscaban un superávit porque solo importaban las ganancias relativas: el comercio era un juego de suma cero. Hume mostró que era autodestructivo con el «mecanismo de flujo de especie y precios» (la entrada de oro o plata por un superávit aumenta la oferta monetaria y los precios de exportación, reduciendo el superávit: un superávit permanente es imposible). Ricardo, con la ventaja comparativa, mostró que toda nación gana en términos absolutos con el libre comercio y la especialización territorial; el comercio es un juego de suma positiva, la «idea más bella» de la economía según Samuelson. Pero importan tanto las ganancias absolutas como su distribución.\n\nEl debate se centró en Joseph Grieco, para quien los Estados se preocupan más por las ganancias relativas que por las absolutas, lo que dificulta la cooperación. Nadie descarta las ganancias relativas, pero difieren en su peso: los liberales sostienen que Grieco las sobreestimó y que la cooperación es más fácil. Para el autor el énfasis de Grieco es básicamente importante y los Estados valoran las ganancias relativas, a veces incluso a costa de las absolutas, pero no puede elevarse a ley general: como dijo Kindleberger de las generalizaciones económicas, «depende». Depende de las circunstancias: los Estados nunca son totalmente indiferentes a las consecuencias distributivas para su riqueza y poder relativos, pero a menudo, por seguridad, las ignoran; en la Guerra Fría Estados Unidos fomentó la unificación económica de Europa occidental pese a sus costos, una decisión históricamente sin precedentes según Waltz. Los Estados se interesan especialmente por la distribución de ganancias que afecta el bienestar doméstico, la riqueza nacional y el poder militar, este último el más importante: son muy reacios a cambiar seguridad militar por ganancias económicas. Con el tiempo, la distribución desigual de las ganancias cambia el equilibrio de poder económico y militar y afecta la seguridad nacional; por eso los Estados son sensibles a los efectos de la economía internacional sobre el crecimiento relativo. A comienzos del siglo XXI preocupa la distribución del poder industrial, sobre todo en industrias de alta tecnología; la distribución territorial de la industria y las capacidades tecnológicas es una cuestión central de la EPI.\n\n### Autonomía nacional\n\nUn tema dominante es el choque persistente entre la creciente interdependencia de la economía internacional y el deseo de los Estados de mantener su independencia económica y autonomía política. Los Estados quieren los beneficios del libre comercio y la inversión extranjera, pero también proteger su autonomía, sus valores culturales y sus estructuras sociales. La lógica del mercado es expandirse geográficamente e incorporar cada vez más aspectos de la sociedad al mecanismo de precios, sometiendo asuntos domésticos a fuerzas externas; sin freno, la integración, la competencia extranjera y la necesidad de ser eficiente podrían socavar la independencia de una sociedad y forzarla a adoptar nuevos valores y formas de organización. Está muy extendido el temor de que la globalización destruya la autonomía política, económica y cultural de las sociedades. Mientras las fuerzas del mercado (comercio, finanzas, inversión) saltan las fronteras e integran sociedades, los gobiernos restringen y canalizan las actividades para servir a sus sociedades y a grupos poderosos. La lógica del mercado es ubicar las actividades donde sean más eficientes y rentables; la lógica del Estado es capturar y controlar el crecimiento y la acumulación de capital para aumentar el poder y el bienestar de la nación. Ese choque inevitable entre la lógica del mercado y la del Estado es central para la EPI.\n\nLa mayoría de los economistas y muchos economistas políticos creen que la economía internacional tiene un impacto positivo sobre la política internacional: crea redes de interdependencia e intereses comunes que moderan la conducta egocéntrica de los Estados. Esta interpretación benigna descansa en una definición particular de la interdependencia económica como dependencia mutua.\n\nSin embargo, como señaló Hirschman en National Power and the Structure of Foreign Trade, aunque la interdependencia implique dependencia mutua, esa dependencia rara vez es simétrica. Comercio, inversión y mercados establecen dependencias entre sociedades que pueden ser explotadas y lo son; la integración crea relaciones de poder, donde el poder económico surge de la capacidad de interrumpir las relaciones económicas. Los lazos económicos casi siempre implican relaciones de poder. Keohane y Nye (1977) distinguieron la interdependencia de «sensibilidad», la que suelen tener en mente los economistas (la respuesta entre variables, como las tasas de un país que influyen en las de otro), de la de «vulnerabilidad», la que tienen en mente Hirschman y los economistas políticos: las posibilidades de explotación política de las interdependencias de mercado. Los Estados tienen fuertes incentivos para reducir su propia dependencia (protección comercial, política industrial) o aumentar la de otros respecto de ellos (ayuda exterior, concesiones comerciales). Las relaciones económicas internacionales nunca son puramente económicas: siempre tienen profundas implicancias para la autonomía económica y la independencia política.\n\n### La política de los regímenes internacionales\n\nTodos reconocen la necesidad de reglas o instituciones mínimas; incluso el más ferviente economista de la elección pública admite que se necesitan leyes que hagan cumplir contratos y protejan la propiedad. Una economía internacional liberal (en términos ideales, con mercados abiertos, libre movimiento de capitales y no discriminación) necesita reglas acordadas: solo funciona si provee bienes públicos (un bien colectivo que todos disfrutan sin pagar, como un faro, y que por eso tiende a subproveerse) como un sistema monetario estable, elimina fallas de mercado e impide el engaño y el free riding. Aunque las reglas buscan resolver problemas económicos, muchas se adoptan por razones políticas: aunque los economistas tengan razón en que un país gana abriéndose aunque otros no lo hagan, una economía liberal no podría tolerar políticamente demasiados free riders que se beneficien de la apertura ajena sin abrir sus mercados.\n\nAntes las reglas eran simples e informales y las hacían cumplir las potencias favorecidas: bajo la Pax Britannica, la «diplomacia de las cañoneras» protegía la propiedad en ultramar y el Banco de Inglaterra gestionaba el patrón oro. Hoy hay instituciones formales para gestionar una economía extraordinariamente compleja (Banco Mundial, FMI, OMC), sin las cuales la economía mundial difícilmente funcionaría. El concepto central es el de régimen internacional, «conjuntos de principios, normas, reglas y procedimientos de toma de decisión, implícitos o explícitos, en torno a los cuales convergen las expectativas de los actores en un área dada de las relaciones internacionales» (Krasner). Puede distinguirse régimen (reglas y entendimientos) de institución (organización formal), pero se usan como sinónimos; lo que importa son las reglas más que las organizaciones que las encarnan. Aquí «régimen» abarca ambos.\n\nKeohane fue el más influyente: en After Hegemony (1984) hizo la exposición definitiva y la defensa clásica de la teoría de los regímenes. Son un rasgo necesario de la economía mundial para su funcionamiento eficiente: reducen la incertidumbre, minimizan los costos de transacción y previenen fallas de mercado. Los crean Estados egocéntricos para promover intereses individuales y colectivos; aunque un régimen surja por presión de un hegemón, con el tiempo cobra vida propia, y cuando los Estados experimentan su éxito «aprenden» a cambiar su conducta e incluso a redefinir sus intereses nacionales. La teoría estuvo siempre rodeada de controversia, porque surgió como respuesta a la teoría de la estabilidad hegemónica (TEH): si la economía liberal de posguerra se basaba en el liderazgo estadounidense, su declive relativo (nuevas potencias, menor productividad a comienzos de los setenta) la ponía en riesgo. Como señaló Steven Weber, la teoría de los regímenes respondió al declive percibido, al shock energético de 1973 y a la estanflación: los regímenes y la cooperación entre grandes potencias reemplazarían al liderazgo estadounidense, y su propósito político era en parte tranquilizar sobre la supervivencia del orden liberal.\n\nSusan Strange fue la crítica más franca: la teoría era en el mejor caso una moda pasajera y en el peor un recurso polémico para legitimar la dominación estadounidense. Los regímenes comercial y monetario estaban sesgados a favor de Estados Unidos, instalados por su poder y reflejo de sus intereses, no neutrales; muchos problemas de la economía mundial resultaban de políticas estadounidenses mal concebidas y depredadoras, no de su declive. Su ejemplo principal fue la enorme demanda estadounidense de capital internacional en los ochenta y noventa para financiar sus déficits fiscal y comercial: mediante su «poder estructural» (militar, financiero, tecnológico), Estados Unidos seguía manejando la economía mundial y la desordenó; el papel del dólar le permitió comportarse irresponsablemente. Para ella la EPI estadounidense, y la teoría de los regímenes en particular, eran poco más que esfuerzos por defender el deseo de Estados Unidos de reinar sobre el mundo (son pocos los no estadounidenses favorables a la teoría). Acéptense o no, estas críticas recuerdan que los regímenes a veces se crean para preservar desigualdades, además de mejorar la coordinación. Conviene estudiar sus orígenes, su contenido y la historia de su cumplimiento, sobre todo cuando un régimen va contra los intereses de un Estado.\n\n**Orígenes.** Algunos regímenes surgen espontáneamente, sin diseño consciente (muchas reglas informales de los mercados); otros resultan de negociaciones (los regímenes comercial y monetario de Bretton Woods, negociados sobre todo entre Estados Unidos y Gran Bretaña); otros son impuestos por los poderosos (los sistemas coloniales del siglo XIX). En la posguerra, la tarea principal del liderazgo estadounidense fue promover la cooperación; Canadá, Japón y Europa occidental cooperaron por razones económicas, políticas e ideológicas: un mundo liberal servía a sus intereses, solidificaba la alianza antisoviética y compartían un compromiso ideológico con el libre comercio (una «comunidad epistémica»; las ideas importan políticamente en la medida en que las sostienen los intereses y el poder de actores importantes). Liderazgo, cooperación y consenso ideológico fueron los tres factores.\n\n**Contenido.** Las reglas y técnicas de decisión de un régimen dependen de factores tecnológicos, económicos y políticos. Un régimen no funcionaría si contradijera consideraciones científicas y técnicas; debe basarse en principios económicos sólidos y resolver problemas complejos (el régimen de tipos fijos debía proveer liquidez internacional y un mecanismo de ajuste para países con problemas de balanza de pagos). Pero los economistas rara vez coinciden, y los medios elegidos tienen consecuencias para los Estados y su autonomía: el papel central del dólar facilitó financiar la política exterior estadounidense. Algunos teóricos tienden a ver los regímenes como benignos (cooperación, información, menores costos de transacción, problemas comunes), pero las instituciones también crean o preservan desigualdades y pueden tener una función redistributiva (el reparto de África en el Congreso de Berlín de 1878, el sistema de mandatos). No debe suponerse que un régimen beneficia por igual a todos. Por sus consecuencias distributivas y sobre la autonomía, las reglas suelen reflejar el poder y los intereses de las potencias dominantes: los regímenes de posguerra promovieron los intereses económicos, políticos y de seguridad de Estados Unidos y fortalecieron la alianza antisoviética; cuando sus intereses cambiaron, Estados Unidos los modificó (la decisión de Nixon de agosto de 1971 de destruir los tipos fijos). Pero un régimen liberal no puede representar solo al dominante: debe satisfacer en algún grado a todas las grandes economías o no funcionará ni sobrevivirá; los socios comerciales de Estados Unidos se beneficiaron del régimen comercial incluso más que él. Un hegemón no puede imponer un orden liberal: en última instancia descansa en la cooperación.\n\n**Cumplimiento.** Algunos minimizan el problema, pero es importante entender por qué se cumple o no. Surge porque no hay gobierno internacional con autoridad, porque los Estados valoran sus ganancias relativas y su autonomía, y porque hay un problema de acción colectiva con tentación de engañar y viajar gratis. Puede ser menor en muchos regímenes, pero se vuelve abrumador cuando las reglas tienen consecuencias distributivas importantes o afectan la autonomía y la seguridad, como ocurre en muchos regímenes de la economía mundial. Las soluciones propuestas, dentro de las «teorías de la cooperación internacional», se basan en los juegos iterados (sobre todo el Dilema del Prisionero) y en el nuevo institucionalismo o «nueva economía de la organización». Según Keohane, hay cooperación «cuando los actores ajustan su conducta a las preferencias reales o anticipadas de otros, mediante un proceso de coordinación de políticas». Estas teorías explican el problema, pero no lo resuelven.\n\nEn el Dilema del Prisionero, dos presos acusados de un crimen están aislados: si ambos confiesan, ambos son castigados; si ninguno confiesa (cooperan), ambos son castigados con menos severidad; si uno confiesa y el otro no, este último recibe el castigo más severo. Cada uno tiene incentivos para cooperar y para defeccionar, y la incertidumbre puede llevar a un resultado subóptimo. Este juego de motivos mixtos caracteriza casi toda la política internacional: un país podría aumentar sus ganancias relativas exportando a mercados ajenos mientras cierra el propio, pero si otros toman represalias todos pierden; podría devaluar unilateralmente, pero si todos devalúan todos pierden. La cooperación beneficia a todos en términos absolutos, pero la tentación de aumentar las ganancias relativas engañando o viajando gratis es poderosa. Se propusieron técnicas para aumentar la cooperación: normas de reciprocidad, hacer menos discreta cada jugada, vincular cuestiones; la más notable, los juegos iterados de Axelrod: si el juego se repite y se sigue una estrategia de «ojo por ojo» (premiar la cooperación y castigar la no cooperación), los participantes aprenden a confiar y cooperar. La literatura es extensa y aumentó mucho la comprensión, pero no permite predecir cuándo habrá cooperación o defección: un jugador nunca puede estar seguro de lo que hará el otro y el costo de equivocarse puede ser muy alto. Falta investigación sobre el funcionamiento de regímenes concretos, y hay un problema metodológico: evaluar sus consecuencias requiere un argumento contrafáctico, saber qué pasaría si el régimen no existiera.\n\nEl nuevo institucionalismo, «compuesto laxo» de economía de costos de transacción y juegos no cooperativos (Downs y Rocke), sostiene que los regímenes pueden resolver ineficiencias, incertidumbres y fallas de mercado, pero contribuye poco al problema del cumplimiento, que descansa en última instancia en los intereses domésticos y de política exterior de cada Estado. La teoría de los regímenes suele esquivar los problemas de autonomía e interés nacional: todo miembro se reserva el derecho a retirarse si cambian sus intereses, y la preocupación por la autonomía limita los tipos de regímenes creados (incluso en la OTAN cada miembro se reserva el derecho de no acudir en ayuda de otro). La creciente importancia del bienestar social no cambió esto: los regímenes implicaron pocos sacrificios del bienestar doméstico (Mayall); pese a la retórica de justicia distributiva internacional, compartir voluntariamente una porción sustancial de la riqueza es raro; la ayuda exterior nunca absorbió más que un pequeño porcentaje del PIB y suele darse por seguridad o interés económico. El Estado de bienestar volvió a los Estados aún más atentos a sus intereses: todos restringen severamente la inmigración, en parte para restringir el acceso a su sistema de bienestar. Los regímenes son soluciones técnicas y a la vez arena de lucha política: afectan el bienestar, la seguridad y la autonomía, y los Estados intentan manipularlos. Contra la visión de muchos economistas y liberales de regímenes neutrales, la interpretación realista sostiene que no están por encima ni fuera de la lucha por el poder: son parte y objeto de ella. Para ser efectivo y hacer cumplir sus reglas, un régimen necesita una base política fuerte; por la importancia de la distribución y la autonomía, el problema del cumplimiento difícilmente se resuelva sin un liderazgo internacional fuerte.\n\n### Teoría de la estabilidad hegemónica\n\nLa TEH, en sus versiones liberal y realista, fue criticada en lo teórico, lo histórico y lo político. En lo teórico se señaló la posibilidad de una solución cooperativa entre países no hegemónicos (con pocos jugadores, regímenes existentes y una «sombra del futuro» larga); puede ser posible, pero nunca ocurrió, y sin contrafáctico ni la teoría ni sus críticos pueden ser refutados. Algunos la testearon contra la experiencia de fines del siglo XIX y le encontraron debilidades. En lo político, se la denunció como justificación de la política estadounidense o, al revés, como predicción de su declive absoluto; pero ningún proponente buscó justificar la conducta estadounidense: la mayoría criticó su conducta egocéntrica e irresponsable desde los sesenta (Strange tuvo razón en que esa irresponsabilidad no se debía al declive relativo).\n\nLas críticas se deben en buena medida a que la teoría nunca fue formulada adecuadamente: era más una idea intuitiva basada en una lectura de la historia que una teoría científica. Algunos críticos la interpretaron como que basta un poder dominante para una economía liberal y objetaron que la hegemonía soviética no creó una economía liberal; pero se requiere un hegemón comprometido con principios liberales, como Gran Bretaña en el XIX y Estados Unidos en el XX, no una URSS, una Alemania nazi o un Japón militarista. Además, el hegemón es condición necesaria pero no suficiente. Puede que a un hegemón le convenga un arancel óptimo, pero esa táctica agresiva es muy improbable en una potencia liberal fuerte. La teoría descansa en la cooperación internacional: la hegemonía la hace más factible y no se opone a ella.\n\nEl apoyo más fuerte, sorprendentemente, vino de economistas, que suelen pensar que los mercados solos gestionan la economía mundial. Barry Eichengreen (1989) hizo la crítica empírica más sistemática sobre el papel de Gran Bretaña y Estados Unidos en el sistema monetario y concluyó que el registro daba un apoyo modesto, pero su análisis en realidad la sostiene: su tibieza parece basarse en suponer que el hegemón es imperialista e impone su voluntad («dictar», «forzar», «coaccionar»), lenguaje que ningún proponente usó; sus propios datos confirman que los hegemones británico y estadounidense «influyeron significativamente» en el sistema promoviendo la cooperación. En 1993, sobre el sistema comercial, Eichengreen halló una asociación positiva entre hegemonía y liberalización: el único caso de multilateralismo exitoso coincide con un período de dominio excepcional de una sola potencia, y las dificultades del GATT coinciden con el declive relativo estadounidense. Lo explicó con la teoría de los cárteles: solo es posible disuadir la defección en un cártel de muchos miembros si hay una firma dominante que haga cumplir; sin ella, a lo sumo duopolios de vecinos, de modo que el auge del bilateralismo es corolario de una economía cada vez más multipolar. Robert Mundell sostuvo que la estabilidad monetaria depende de una potencia dominante; Robert Baldwin, que el papel hegemónico estadounidense aumentó el bienestar de la mayoría de los países no comunistas; Bruno Frey, que según la elección pública es imposible proveer bienes públicos sin hegemón (por el teorema de imposibilidad de Arrow, con tres países y tres objetivos con distintos órdenes de prioridad no hay política común sin liderazgo). Mancur Olson, citado a menudo por los críticos, explicó por la política doméstica por qué es tan difícil reducir barreras unilateralmente sin presión externa de un Estado poderoso: el mundo funciona mejor con una potencia «hegemónica» a la que le interese que se provean bienes colectivos internacionales, y ese incentivo disminuye a medida que pesa menos en la economía mundial; de ahí el resurgimiento proteccionista estadounidense y la menor disposición a dar ayuda (el Nuevo Proteccionismo desde mediados de los setenta, el regionalismo del TLCAN en 1994). Sin contrafáctico no puede validarse ni refutarse, pero el examen de Eichengreen, los comentarios de otros y los escritos de Olson le dan considerable apoyo: no es infalible, pero resiste bien según los estándares de las ciencias sociales.\n\n### Gobernanza de la economía global\n\nCrear regímenes efectivos y resolver el cumplimiento requiere liderazgo internacional fuerte y una estructura de gobernanza efectiva. Los regímenes por sí mismos no proveen gobernanza porque carecen de su componente crítico: el poder de hacer cumplir. Deben descansar en una base política de liderazgo y cooperación. Aunque muchos liberales ven hegemonía y regímenes como incompatibles, los regímenes económicos no funcionan sin un líder fuerte, que facilita la cooperación e impide la defección mediante pagos laterales (sobornos), sanciones y otros medios, aunque rara vez puede coaccionar a Estados reticentes. El hegemón estadounidense tuvo un papel crucial en la posguerra, con apoyo de sus aliados. Y, como señalan Downs y Rocke, el cumplimiento depende del apoyo doméstico: los regímenes de posguerra descansaron en el «compromiso del liberalismo enraizado» (Ruggie), por el que los gobiernos intervienen en sus economías para el pleno empleo pero se ajustan a reglas internacionales; la liberalización fue políticamente aceptable porque se garantizaba el pleno empleo y se compensaba a los perjudicados. Durante décadas, la gobernanza (instituciones o reglas que guían la interacción de los actores) se logró con liderazgo, cooperación y consenso doméstico.\n\nLa idea de que una economía liberal requiere liderazgo político fuerte de la potencia dominante la planteó Kindleberger en The World in Depression (1973): la Gran Depresión fue más severa porque no hubo líder que cumpliera ciertas tareas. En tiempos normales: mantener el flujo de capital hacia los países pobres, dar cierto orden a los tipos de cambio de las monedas clave y coordinar moderadamente las políticas macroeconómicas. En crisis: ofrecer mercados abiertos para los bienes en dificultades en la depresión, ser fuente de oferta adicional cuando escasean (crisis petroleras de 1973 y 1979) y ser «prestamista de última instancia» ante una crisis financiera grave. En síntesis: préstamos de capital, régimen cambiario, coordinación macroeconómica, mercados abiertos y prestamista de última instancia.\n\nKrasner y el autor tomaron la idea y la ubicaron en un marco estadocéntrico. Usaron «hegemón» en lugar de «líder» para indicar que a veces debe ejercer poder; el término designa al líder de una alianza, como Esparta contra los persas o Estados Unidos contra los soviéticos. Mientras Kindleberger sostenía que el líder creaba la economía liberal por razones propias y cosmopolitas, ellos sostuvieron que lo hace sobre todo para promover sus propios intereses, en particular políticos y de seguridad, que pueden incluir los intereses económicos y militares de sus aliados. Cuando Estados Unidos promovió una economía abierta para fortalecer la alianza antisoviética no fue altruista. Pero ambas versiones sostienen que proveer bienes públicos internacionales como el libre comercio y la estabilidad monetaria requiere una potencia dominante interesada en una economía liberal y dispuesta a gastar recursos para lograrla y mantenerla. Sin un líder que establezca y gestione una economía basada en libre comercio, estabilidad monetaria y libre movimiento de capital, y que aliente a otros a cumplir las reglas, no hay economía liberal internacional.\n\nUn bien público, según Samuelson, tiene no exclusión y consumo no rival: el consumo de uno no disminuye el de otros y nadie puede ser excluido, pague o no (el faro). Por eso hay incentivo a viajar gratis y los bienes públicos se subproveen. En la economía internacional esa tendencia es mayor que en lo doméstico. En teoría, un pequeño grupo de Estados cooperantes podría superarla, pero no hay ejemplo a la escala de la economía mundial: en la práctica solo los proveyó un líder interesado en suministrarlos o en forzar a otros a compartir el pago.\n\nLas eras británica y estadounidense muestran la dinámica del ascenso y la erosión de una economía liberal (E. H. Carr, en The Twenty Years' Crisis, mostró que una economía liberal debe descansar en una potencia liberal dominante y que, sin el liderazgo británico, los años treinta se caracterizaron por conflictos y fragmentación en esferas de influencia). Desde mediados del XIX hasta 1914, Gran Bretaña lideró la liberalización comercial y la estabilidad monetaria; Estados Unidos lidera desde 1945. La economía del XIX fue verdaderamente global, con comercio no discriminatorio, movimientos de capital sin restricciones y estabilidad bajo el patrón oro. El sistema estadounidense abarcó durante décadas solo al Mundo Libre, con discriminación comercial, controles de capital hasta los setenta e inestabilidad monetaria desde 1971. Gran Bretaña promovió el libre comercio con el ejemplo y acuerdos bilaterales; Estados Unidos, mediante negociaciones multilaterales en el GATT. Según Gowa, la seguridad influyó en la política comercial británica; sin duda fue clave en la estadounidense (podría haber impuesto un arancel óptimo, pero eligió el multilateralismo sobre todo por razones políticas: el bien colectivo provisto fue la seguridad de sus aliados). En lo monetario, el Banco de Inglaterra gestionó el patrón oro, mientras la Reserva Federal tuvo que compartir protagonismo con el Bundesbank y otros bancos centrales.\n\nEl declive británico empezó a fines del XIX con la industrialización de Alemania y Estados Unidos; Gran Bretaña se replegó gradualmente y reforzó su seguridad. Su enorme dependencia del comercio evitó un repliegue proteccionista, pero su liderazgo se aflojó, y en los treinta se refugió en un sistema de preferencias imperiales. Desde mediados de los setenta, en Estados Unidos crecieron las preocupaciones por el declive relativo y la desindustrialización ante la competencia japonesa, que produjeron el Nuevo Proteccionismo: mientras bajaban los aranceles formales, se erigieron barreras no arancelarias como el Acuerdo Multifibras (1973) y restricciones «voluntarias» a las exportaciones japonesas. Ante el déficit comercial, el temor a la desindustrialización y las presiones proteccionistas, la administración Reagan modificó a mediados de los ochenta el compromiso multilateral y adoptó una política comercial de múltiples vías: menos negociaciones multilaterales y más unilateralismo y bilateralismo (sobre todo «comercio administrado» con Japón), junto con el regionalismo del TLCAN con Canadá y México.\n\n### Conclusión\n\nLa economía es un fundamento necesario para comprender la EPI, pero el libro se centra en la interacción de los mercados y los actores políticos. La economía sola es una herramienta inexacta e insuficiente para analizar la distribución internacional de la riqueza y las actividades económicas, los efectos de la economía mundial sobre los intereses nacionales y la efectividad de los regímenes. Se rechaza la idea popular de que leyes económicas universales y fuerzas económicas poderosas gobiernan hoy la economía global. Pese a la globalización y la integración, sigue siendo necesario distinguir entre economías nacionales e internacional: las fronteras políticas dividen las economías y las políticas de cada nación, las consideraciones políticas distinguen las actividades económicas de cada país, y los Estados y otros actores poderosos usan su poder para influir en las actividades económicas a fin de maximizar sus intereses económicos y políticos."}, "2": {"ejercicios": [], "leido": false, "resumen": "## Relaciones Internacionales y Economía Política Internacional: notas para el debate\n\n**Resumen del artículo.** Resaltar las peculiaridades del campo investigando sus orígenes, para contribuir a su identidad, aún dispersa y fragmentada o sobredeterminada por los estudios de política exterior argentina, cuyo marco tiende a separar los factores internacionales de sus dimensiones internas. La EPI, en cambio, amalgama esos niveles de análisis y rechaza la dicotomía entre las esferas económica y política. No se ofrece un estado del campo, sino su impulso e inspiración, para entender las limitaciones de la incipiente comunidad y su diálogo con el centro de la disciplina de Relaciones Internacionales.\n\n### Introducción\n\nEn la disciplina de Relaciones Internacionales (aceptada aquí como disciplina, aunque es un supuesto discutible), la EPI permanece dispersa y diluida en una tierra de nadie: a veces se introyecta como relaciones económicas, otras cae en las rendijas entre la Economía y las Relaciones Internacionales, otras es un campo en disputa entre la Economía, la Sociología y la Ciencia Política. Se nutre de todas, pero desaparecer entre las rendijas muestra parte de su debilidad. Comienza a constituirse lentamente: dado el creciente ingreso al CONICET de investigadores con intereses afines, su producción y su inserción en redes internacionales, es oportuno reflexionar sobre sus orígenes, debates y líneas rectoras (en el CONICET buena parte de la investigación se hace en la comisión de Derecho, Ciencias Políticas y Relaciones Internacionales, y también en Economía y Sociología, aunque con agendas ancladas en el nivel nacional).\n\nEn Argentina la EPI tuvo dos impulsos. Uno iniciático, al calor de la teoría de la dependencia; otro más reciente, en los noventa, con el Mercosur y los bloques regionales, que desató una avalancha de estudios, trajo la economía internacional «a casa», estimuló a los actores sociales a actuar más allá de la nación, dio un tono menos determinista a la investigación y la acercó a la política pública. Un aspecto central fueron las transformaciones institucionales: las interrupciones democráticas y la sucesión de gobiernos de duración incierta afectaron las miradas, y las estrategias de autoposicionamiento académico se redefinieron para dar respuesta a los procesos de transformación: de la sociedad imaginada o deseada del momento iniciático se pasó a estar en y mirar a la sociedad posible. Los claustros nunca estuvieron separados de la política ni cundió la torre de marfil: con una visión del todo por hacer, no se teme a la asociación entre producción de conocimiento e involucramiento político.\n\nEn el primer impulso, bajo la insignia del desarrollo, se dio quizás el intento más original de abordar colectivamente, desde perspectivas propias, el diagnóstico y los futuros posibles de las sociedades latinoamericanas. Con los conceptos de centro-periferia (Prebisch, Sunkel y Paz), subimperialismo (Ruy Mauro Marini), colonialismo interno (Pablo González Casanova) y el enfoque de la dependencia (Cardoso y Faletto, 1969), se sentaron las bases de una sociología económica y una economía política. Las versiones latinoamericanas de la sociología y la economía del desarrollo, fundadas en el estructuralismo, la sociología crítica y la dependencia, mostraron la capacidad de los científicos de la región para confrontar las ideas dominantes del debate internacional, desnudando sus premisas y limitaciones: América Latina cuestionó el saber convencional y lo transformó reinventándolo. De este diagnóstico de consustanciación entre intereses externos y élites dominantes surge el espacio para un mundo académico comprometido con la recuperación de lo interno y con el cambio.\n\nHoy la EPI involucra preguntas en dos niveles de análisis, nacional y sistémico (Nemiña). En cualquiera de ellos corresponde analizar quiénes son los ganadores y perdedores del arreglo que se perfila, y por lo tanto quiénes son los actores: qué sectores económicos, qué empresas o qué agencias de gobierno promueven o resisten una política. La EPI como campo analítico hace una lectura política de la economía internacional y desentierra sus raíces a nivel nacional. El artículo se pregunta cómo se conforma el campo y cuáles son sus temas y debates; primero repasa la problemática y sus premisas, luego las escuelas ordenadas geográficamente (latinoamericana y anglosajona, subdividida en estadounidense y británica) y al final apenas la escuela crítica, radical y constructivista que hoy toma vuelo. El Cuadro 1 sintetiza y contrasta las cuatro escuelas.\n\n### La problemática\n\nEs fruto de una convergencia temática entre la Economía, la Historia, las Relaciones Internacionales, la Ciencia Política y la Sociología (con mayúscula, las disciplinas; con minúscula, sus objetos). Es un campo en rápido crecimiento, pero no una tradición única ni una escuela homogénea. En su momento iniciático gozó del empuje de la controversia sobre la preponderancia de las empresas transnacionales (ET) en la política internacional de los setenta, tipificadas como los ejemplos más negativos de capital monopólico con capacidad de cooptar o derrocar gobiernos (la sensibilidad del tema llevó a teóricos estadounidenses como Krasner a esforzarse por mostrar que el Estado no colaboraba con los derrocamientos). La EPI buscó comprender este fenómeno que parecía hacer estragos con la soberanía nacional: la ONU creó el Centro de Empresas Transnacionales, en México se fundó en 1977 el Instituto Latinoamericano de Economía Transnacional, y muchos coincidieron en que el Estado estaba jaqueado por la empresa planetaria o, como mínimo, que la política exterior no podía analizarse sin los intereses privados que la desbordan, cooptan y se entrelazan con el Estado.\n\nEllo obligó a cuestionar la separación entre la «alta política», en manos de las Cancillerías (control armamentista, conflictos de fronteras), y la «baja política», que dejaba a los agregados comerciales las relaciones económicas, y erosionó las fronteras disciplinarias para no perder de vista los juegos y contrajuegos entre el Estado y los intereses económicos. Hoy la Sociología aporta el estudio de los actores en los procesos político-económicos; la convergencia de la Ciencia Política y la Sociología en el constructivismo incorporó la identidad y problematizó las visiones excesivamente estadocéntricas (enfoques societales). El vigor de la EPI resulta en parte de la globalización y la regionalización, que traen nuevas dependencias e interdependencias y muestran la porosidad de las fronteras. El Estado sigue siendo el actor clave en la regulación de los mercados, pero otros actores circunvalan y socavan sus reglas y generan reglas propias. La volatilidad financiera, la incidencia de los organismos internacionales en la ola de privatizaciones, los países emergentes y las alteraciones de las instituciones internacionales, los bloques regionales y la competencia entre proyectos de integración obligan a entender los resortes de las relaciones globales; también el avance de ET de países emergentes. La EPI adopta así una perspectiva transdisciplinaria, adentra lo internacional en lo nacional y proyecta lo nacional a las pujas externas.\n\nSu objetivo es comprender tanto la construcción del sistema internacional como la política externa de cada país, preguntando a cada paso «cui bono?»: ¿quién se beneficia o puede beneficiarse?, ¿quién gana y quién pierde? Como el detective de las novelas policiales, se sigue la ruta del dinero: ¿quién se beneficia con un acuerdo o una reglamentación?, ¿quién pierde con la ecuación de costos y beneficios? La EPI parte de que las Relaciones Internacionales se desarrollaron con indiferencia y hasta negación de la gravitación de las fuerzas económicas y los operadores de mercado, y por eso cuestiona los análisis que presumen una excesiva autonomía de lo político. No alcanza con un escenario transdisciplinario donde haya intereses económicos: hay que sacar a luz las palancas reales de poder. Implícitamente critica al realismo como mirada unidimensional de la política. Las empresas son actores políticos no solo porque pueden interferir en las prerrogativas del Estado (marcando su agenda con anuncios de inversión o desinversión), sino porque se relacionan permanentemente con el Estado y sus estamentos. El eje central de las relaciones internacionales estaría más cerca de la economía que de la guerra o la seguridad. Las relaciones económicas no son meras relaciones externas: tienen ramas y raíces en lo interno, surgen y penetran en los países, ocurren en y desde un espacio específico penetrado por quien produce y domina las redes de intercambio: el crédito internacional, los recursos naturales, las cadenas de producción de las grandes corporaciones, la generación y apropiación de conocimiento. Por eso la EPI postula que lo interno es naturalmente externo y lo externo naturalmente interno, y que las relaciones transfronterizas se dan también entre agentes no gubernamentales, regionales, multinacionales y locales. Supuesto básico: **la economía es un escenario de pujas de poder.** Premisas:\n\n• Lo político y lo económico no pueden separarse al analizar los fenómenos nacionales e internacionales: la acción política está en el corazón del sistema económico; los intereses económicos, en el corazón de la política, cuya autonomía es siempre relativa.\n• Los niveles de análisis nacional e internacional no pueden separarse de manera tajante.\n\nLa problemática de la EPI se define por la influencia recíproca de la economía en la política (y viceversa) y de lo interno en lo externo (y viceversa). Ningún Estado, aun el más poderoso, tiene un poder omnímodo y abstracto: la dinámica interna, con intereses en pugna, distintas modalidades de presión y grados de influencia de los actores, fue eje de atención para comprender el comportamiento de gobiernos cada vez más presentes en las cuestiones mundiales. Temáticas:\n\n• La globalización, la construcción de hegemonía, su resistencia y desafío; las relaciones y negociaciones comerciales y financieras y su margen de acción.\n• La internacionalización de empresas y su incidencia en el sistema internacional y en la política exterior, y las respuestas sociales nacionales y sus enlaces en movimientos anti o alterglobalización.\n• El orden y desorden global, los organismos internacionales, su uso, agendas, disputas y condicionamientos.\n\nSiempre se pone en tela de juicio la autonomía de la esfera política, y los mapas de la negociación revelan las raíces intersocietales de los acuerdos internacionales, con acento en situaciones continuas, cotidianas e incrementales. La construcción del campo es contingente al contexto y refleja sus sesgos: como sostenía Martin Wight, la teoría de Relaciones Internacionales consiste de teorías nacionales; la realidad que nos toca conforma nuestro conocimiento y la realidad se construye socialmente. Dos vertientes confluyen en la EPI actual.\n\n### América Latina: incidencia e impulso a la praxis\n\nEn América Latina el nacimiento de la EPI (aunque sin ese nombre) estuvo marcado por la visión centro-periferia y por el estructuralismo de la CEPAL, con las obras de Prebisch y luego de Theotonio dos Santos, Hélio Jaguaribe, Juan Carlos Puig, Osvaldo Sunkel, Cardoso y Faletto, entre muchos. La premisa clave era que el atraso y la desigualdad se deben a la subordinación al capital extranjero, que a nivel interno contaba invariablemente con el apoyo de grupos nacionales; a nivel internacional se reconocía el contrapeso de la mera existencia de la URSS. En su vertiente más absolutista descreía del Estado, capturado por las élites, y promovía movimientos de izquierda radicales o revolucionarios. En los noventa, el desmoronamiento del socialismo diluyó esa visión, aunque muchos de sus postulados se recogieron en la EPI Crítica; CLACSO, desde los ochenta, incentivó el estudio de la hegemonía y de la integración latinoamericana como proyecto contestatario al imperialismo estadounidense.\n\nLa versión más moderada postulaba un rol central del Estado, que debía liderar el cambio. Su derivado práctico fue el Programa de Estudios Conjuntos sobre las Relaciones Internacionales de América Latina (RIAL, 1977), que dio a la EPI regional un fuerte sesgo hacia la búsqueda de resquicios para construir políticas públicas. Sus análisis se concentraban en las relaciones de poder asimétricas, buscando operacionalizar los mecanismos que cristalizan las asimetrías y las políticas para el cambio. La mirada se volcó hacia el gigante americano, con un campo dinámico centrado en la economía de Estados Unidos y su proyección sobre la región. La única vía para romper la subordinación era generar recursos e imaginación política para un nuevo estilo de inserción. El foco fue la inserción externa y su concepto central, la búsqueda o preservación de la **autonomía** (O'Donnell y Linck, Jaguaribe, Puig, Sunkel): que los países pudieran «controlar y escoger sus formas de participación en términos de maximizar los beneficios y minimizar los costos derivados de su integración en el sistema, conservando sus estilos de desarrollo y con ellos sus objetivos, intereses y valores» (Sunkel y Tomassini). La autonomía era indispensable para el desarrollo y se vinculó con la política exterior: a nivel nacional, salvaguardia contra los efectos negativos de la dependencia; a nivel externo, instrumento para afirmar intereses en el sistema, separando en cada caso el interés nacional del de la potencia dominante. La clave sería una visión estratégica coherente para el «manejo» de la transnacionalización, en el terreno de la voluntad política y la «virtuosidad» de las élites para aprovechar los márgenes de negociación (Tokatlian y Pardo).\n\nEn Argentina, el debate entre Carlos Escudé y Mario Rapoport sobre costos y beneficios del alineamiento con Estados Unidos fue un hito, que dio lugar tanto a políticas de alineamiento automático como de resistencia activa. La literatura argentina sobre la autonomía tendió un puente conceptual entre la dependencia y las dos teorías dominantes en Estados Unidos, el realismo clásico y la interdependencia; esa fusión es lo que Arlene Tickner llama el modelo híbrido latinoamericano, central para analizar la política exterior. En conjunto, la EPI latinoamericana muestra un sesgo hacia el conocimiento práctico y aplicado: los temas siguen en gran medida la agenda del país; la realidad marca el paso. Con los cambios de los noventa, la preocupación por la autonomía fue reemplazada por la apertura, la internacionalización, la integración regional y las negociaciones comerciales. La desaparición de la competencia Estados Unidos-URSS, la democratización, la integración y la internacionalización impulsaron enfoques pragmáticos. La integración regional abunda, vista como instrumento para el desarrollo y la posición conjunta. El neoliberalismo favoreció el sesgo economicista del análisis de instrumentos, pero también la corriente crítica frente al ALCA como nueva etapa de intervención estadounidense por la vía comercial. La «primacía de lo práctico» (Tickner) dificulta el diálogo con los fabricantes de teoría del norte, no así con pares de la región, que se vuelve un ámbito privilegiado de discusión con masa crítica; también abunda la producción para think tanks extranjeros sedientos de conocimiento empírico (FRIDE, Inter-American Dialogue, Brookings).\n\n### El mundo anglosajón: crecimiento disciplinario e impulso teórico\n\nLa EPI con esa denominación nace en el mundo anglosajón, de los debates de las Relaciones Internacionales. El contexto gatilló su problemática, primero como subdisciplina y luego con creciente autonomía: la crisis de Bretton Woods en 1971, la suba del petróleo de 1973, la guerra de Vietnam y las demandas de la periferia. Los argumentos dependentistas se consideran hoy superados, pero su audacia y sencillez favorecieron su influencia internacional. Estos eventos pusieron de relieve «la economía de la interdependencia» (Richard Cooper, 1972): la OPEP y la declinación del dólar dieron por tierra con la «naturalidad» de las reglas, desenmascararon intereses y abrieron márgenes de negociación. Esta escuela nace en oposición a los enfoques conservadores de la política exterior estadounidense, con una visión hostil del escenario internacional que insistía en la recomposición hegemónica sin atender a la interdependencia económica.\n\nAsí como la autonomía organiza la experiencia latinoamericana, en la escuela estadounidense lo hacen la **hegemonía** y la construcción de normas o regímenes internacionales para dar estabilidad al orden económico y asegurar el librecambio. De ahí la pujanza de la teoría de la estabilidad hegemónica, que sostiene la necesidad de un Estado hegemónico que cargue con el peso de mantener un orden económico liberal, mientras los demás se benefician del libre acceso a su mercado para sus exportaciones; sin ese polo, el orden se derrumbaría (Gilpin, Kindleberger). Kindleberger había participado del Plan Marshall y conocía los resortes prácticos de la construcción hegemónica.\n\nTomando distancia del realismo surge la corriente interdependentista, que muestra con análisis históricos que la cooperación es posible en ausencia de hegemonía y sustituye la competencia estratégica entre Estados por la creciente importancia de la interdependencia económica y la cooperación mediante organismos internacionales. La interdependencia refiere a situaciones de efectos recíprocos (no necesariamente simétricos). La interdependencia compleja tiene tres características: canales múltiples que conectan las sociedades; una agenda interestatal de múltiples temas sin jerarquía rígida; y, en presencia de interdependencia económica, resolución cooperativa de los desacuerdos, aunque la fuerza militar retenga relevancia frente a un bloque rival. Sus padres son Keohane y Nye, con Poder e interdependencia (1977) y Después de la hegemonía (1984), que enfrentan la premisa realista de que no hay orden sin grandes potencias y dirección, es decir, sin hegemonía; con el análisis de regímenes específicos (monetario, comercial, del mar) sostienen que la ausencia de hegemonía y el manejo pluralista conllevan más cooperación y relaciones más estables y beneficiosas. Tienen una visión más abierta del entorno global, como medio creativo y accesible para cambios controlables según los intereses estadounidenses. Nye acuñó soft power y smart power, argumentando que aun con la supremacía estadounidense tras el colapso soviético, la cooperación era la mejor política para Estados Unidos. Esta escuela es hoy la ortodoxia de la EPI y ocupó un espacio político importante en las administraciones Clinton y Obama.\n\nEn paralelo surge la escuela inglesa, que confronta tanto las visiones estadocéntricas de la interdependencia como las preocupaciones por la hegemonía como resabio del imperialismo estadounidense. Su primer mojón es la exposición de las luchas de poder entre países centrales en el período de Bretton Woods (1945-1971), en dos volúmenes dirigidos por Andrew Shonfield (1976), cuya novedad es borrar toda separación entre política exterior y doméstica: se determinan recíprocamente y forman un mismo proceso. El volumen sobre finanzas de Susan Strange fue una cabeza de playa, por la influencia que tendría desde su cátedra en la London School of Economics (1977). Liderado por Strange, el campo inicia un virulento combate de ideas con la escuela estadounidense: las premisas sobre la necesidad y los beneficios de la hegemonía serían una mera codificación teórica de las políticas de poder de Estados Unidos, sin utilidad para Europa ni para la mayoría de los países («para los ojos no americanos, hay algo exagerado en el llorar y gemir ante la caída de la república imperial», Strange, 1984). Con sesgo antiamericano, busca aglutinar las preocupaciones periféricas (geográficas, teóricas, temáticas o de género) y construir una EPI «no hegemónica». En 1991 Murphy y Tooze publican The New International Political Economy, que dará lugar a una revista con ese nombre. Esta escuela parte de un supuesto estructuralista y frecuentemente neomarxista: en la economía mundial las relaciones entre Estados están ampliamente determinadas por las relaciones de producción y por sus pactos para los movimientos de capital, conocimiento y bienes (no de migrantes ni desplazados). Rechaza las postulaciones liberales sobre los organismos internacionales, dadas las relaciones de poder que cristalizan.\n\nPor este sesgo y su perspectiva sistémica, puede emparentarse con la escuela latinoamericana: crecen sin contacto pero en paralelo, unidas por una visión de conjunto (los fenómenos económicos como partes de una totalidad jerárquicamente estructurada y, por lo tanto, como fenómenos políticos) y una perspectiva sociohistórica (génesis y desarrollo, interrelaciones asimétricas). La diferencia es que la latinoamericana da sentido a las relaciones de, sobre y para la periferia, mientras en la anglosajona la periferia casi no aparece: solo los países centrales que dieron forma al sistema merecen atención. Ambas comparten una orientación estructuralista centrada en el análisis sistémico, los organismos internacionales, las ET, el comercio, el sistema monetario y financiero y la integración regional; a veces más descriptivas que analíticas, usan variables económicas, políticas, sociales, geográficas, tecnológicas y culturales, lo que dificultó el diálogo con la Economía por la falta de formalización matemática y econométrica. En ambas prima el interés por el cambio, frente a la escuela estadounidense, más preocupada por las fuentes del orden.\n\nA medida que se desarrollan, se profundizan las diferencias. En el mundo anglosajón se conforma un área pujante y creíble, con escuelas, debates, revistas y separación entre pensadores y hacedores. En el mundo latino hay alta interpenetración entre lo académico y la formulación de políticas, a la vez su fuerza y su debilidad: las «puertas giratorias» generan una dinámica académica inestable que dificultó formar nuevas generaciones. Con la apertura comercial y la negociación de acuerdos durante el auge neoliberal creció el análisis de cómo funciona el sistema, sus resortes y asimetrías, y la reestructuración por los acuerdos regionales fue un campo privilegiado (hitos de Arceo con Basualdo, Bouzas, Chudnovsky y Porta). En el nuevo siglo los estudios reemplazaron «integración» por regionalismo y regionalidad, para sustraerse del sesgo mercadista e incorporar la acción colectiva, la cooperación y las identidades compartidas (Riggirozzi, Falomir Lockhart, Sanahuja). En la última década el estudio se afianzó con maestrías especializadas y el ingreso a la carrera del CONICET.\n\nLa escuela crítica, de creciente importancia y riqueza conceptual, se distancia de la presión de la coyuntura. Con raíces gramscianas, menos en la escuela francesa que en la obra del canadiense Robert Cox, pone en el centro la hegemonía no solo como orden entre Estados, a la usanza estadounidense, sino como aceptación social del ejercicio del poder: «es también un complejo de relaciones sociales internacionales que liga a las clases sociales de los diferentes países. La hegemonía mundial es una estructura social, una estructura económica y una estructura política, no sólo una de ellas. Se expresa en normas e instituciones que implican reglas de comportamiento para los Estados y las fuerzas sociales» (Cox, 1983). Presta especial atención a las dimensiones ideológicas que sostienen o debilitan un orden mundial; resurge la lógica global del capitalismo y sus cadenas de dependencia, pero también el impulso transformador de las fuerzas sociales. De ahí surgirían las escuelas socioconstructivista y posmoderna (posracionalistas), que cuestionan a las escuelas racionalistas, preocupadas por cuáles son los intereses y preferencias de los agentes y cómo resultan en políticas; las posracionalistas buscan conocer cómo y por qué los agentes tienen determinados intereses y preferencias y cómo los afectan factores históricos y sociológicos: intereses e identidades surgen de la interacción, son relacionales (Saguier, Vivares). El socioconstructivismo libera los estudios de la excesiva economización y estudia cómo la percepción determina el comportamiento y cómo eso estructura las relaciones. Florecieron con graduados de Warwick, Manchester y Sheffield, capaces de abrir la caja negra de los estudios tradicionales de política exterior, concebida solo como política pública y solo como política.\n\n### Conclusión\n\nEn la EPI compiten planteamientos que se distinguen por sus problemas, su marco de análisis y sus premisas, que exponen intereses cognitivos y cuestiones de principio: ¿es justo el orden económico internacional?, ¿aceptable?, ¿reformable?, ¿dónde residen las fuerzas conservadoras y las transformadoras?, ¿cómo romper las cadenas de dependencia si los «agentes externos» son a la vez «internos»? Se busca considerar la fecundidad de las perspectivas y consolidar un sendero propio, con una aproximación que sitúe los intereses que fundamentan, condicionan y motivan la política exterior; el desafío es poner en pie de igualdad los intereses económicos con los análisis tradicionales. La regionalización y la globalización pueden permitir que la EPI discuta con las teorías de las relaciones internacionales y se convierta en un campo creciente, con estos postulados:\n\n• La globalización es un proceso en disputa, con nuevos actores y múltiples hegemonías que forcejean por proyectar sus intereses.\n• Así como el Estado ve erosionada su soberanía desde fuera por las dinámicas globales, desde dentro surge una realidad subnacional, multiétnica y multicultural con proyección internacional.\n• Los actores vieron radicalmente modificadas sus condiciones de actuación. El análisis de actores aparece en dos niveles: interno y ligado a la globalización y la regionalización. Como la política no es solo política pública, hay que reivindicar una amplia constelación de actores: las grandes empresas y su captura del Estado, y la sociedad civil articulada en redes internacionales.\n\nLa política exterior latinoamericana dejó de concebir sus dilemas solo frente a la hegemonía estadounidense: amplió la mirada hacia las alianzas internas que la sostienen o resisten, hacia nuevos agrupamientos que abren oportunidades y exigen capacidades, y hacia nuevos actores como Brasil y China; surgieron dilemas sobre hegemonías nuevas y viejas y cobran vida los estudios sobre concertación regional e instituciones con agendas de recursos naturales y derechos económicos y sociales. Como todo proceso de conocimiento, la construcción del campo es contingente a su contexto y refleja nuestras circunstancias y acentos. Los caminos de las Relaciones Internacionales y la EPI, antes paralelos, hoy empiezan a cruzarse.\n\n### Cuadro 1. Escuelas y sus premisas básicas\n\n• **Latinoamericana.** Eje: desarrollo, dependencia, autonomía. Interacción entre variables: economía y política se determinan mutuamente. Unidad de análisis: el Estado periférico. Objetivo: maximizar el poder negociador y la autonomía en el sistema.\n• **Estadounidense.** Eje: estabilidad hegemónica, interdependencia compleja. Economía y política se determinan mutuamente. Unidad: el Estado central, que lidera el sistema. Objetivo: mantener el orden a través de la cooperación.\n• **Británica.** Eje: estructuralismo. Economía y política se determinan mutuamente. Unidad: Estados y firmas que conforman el sistema. Objetivo: identificar ganadores y perdedores; el cambio.\n• **Posestructuralismo (neogramsciano), Canadá y América Latina.** Eje: fuerzas sociales, identidades. Identidades en la economía política. Objetivo: cambio; justicia, libertad, derechos."}}}, "EI03-c3": {"extras": [{"ejercicios": [], "leido": false, "resumen": "## Sesión 3 (17/3). Mercados nacionales y globales, y lógica de intervención\n\n### El problema de la escasez\n\n**Socialismo:** racionalizar políticamente. **Capitalismo:** racionalizar por mercado, es decir, por precios. Eficiencia = precios de mercado.\n\n**Mercado:** relación de intercambio entre vendedor y comprador; ambas partes salen ganando y el bienestar después de la transacción es mayor. **Economía de mercado:** aquella en la cual el intercambio es la actividad central en torno a la cual gira todo lo demás: producimos para vender y compramos para consumir. Actividad económica central: la **producción** (medio). Actividad terminal: el **consumo** (fin), disponer de un satisfactor para la necesidad. El bienestar depende de la cantidad, la calidad y la variedad de bienes y servicios. Todo empieza con la **división del trabajo**, primer paso para el intercambio.\n\nAgentes: productores (oferentes, vendedores) y demandantes (compradores, consumidores). Condición indispensable para el intercambio: el **precio**, razón de cambio (tanto de x por tanto de y), el que el demandante está dispuesto a pagar y el oferente a aceptar; sin acuerdo no hay intercambio. Lo que hace legítimo al intercambio es la **propiedad**: solo puedo ofrecer lo que es mío. Dos dimensiones del intercambio: **económica** (el vendedor entrega la mercancía y el comprador el precio pactado) y **legal** (se otorga el derecho de propiedad). Resultado: mayor bienestar.\n\n**Sentido institucional de la economía de mercado:** las reglas del juego reconocen plenamente, definen puntualmente y garantizan jurídicamente los derechos de los agentes de la oferta y la demanda: libertad individual para producir, propiedad privada sobre el producto del trabajo y sobre los ingresos de los consumidores. Si esto no existe, no es posible la economía de mercado. El mercado libre define al capitalismo; el nivel de intervención y regulación define el sistema; es central que los medios de producción sean privados.\n\n¿Salud y educación son bienes públicos? Para los neoclásicos, no. El mercado es «democrático»: nos trata a todos como iguales, y ese es parte del problema, porque no todos tenemos las mismas posibilidades de acceder a un bien: **problema de justicia**. Es difícil establecer un mecanismo más justo que sustituya al mercado. Intentos: **China**, capitalismo al estilo chino, con los medios de producción en manos del Estado; **Yugoslavia**, medios de producción estatales con asignación por criterio de mercado (socialismo de mercado).\n\n### Frontera de posibilidades de producción\n\nEjemplo: una isla con 10 personas y 2 botes; pueden pescar o levantar cocos. **Supuestos:** solo dos bienes (peces y cocos); autarquía; cantidades por unidad de tiempo (por día); tecnología dada y la mejor disponible; factores en cantidad fija; factores versátiles (mejores para una cosa, pero pueden hacer todo); pleno empleo; racionalidad (actuar en pos de un objetivo).\n\nCombinaciones (peces; cocos): 10 pescan: 15; 0 · 8 pescan: 14; 2 · 6 pescan: 12; 4 · 4 pescan: 9; 6 · 2 pescan: 5; 8 · 0 pescan: 0; 10. Al pasar gente a los cocos, la producción pierde cada vez más a sus mejores pescadores.\n\n¿Cuál es el mejor punto (A a F)? Ninguno es técnicamente mejor: todos son máximos (pleno empleo), máxima eficiencia con los recursos disponibles. **Punto G:** interior (ineficiente). **Punto H:** superior, inalcanzable sin más recursos; se alcanza con más empleados, mejor tecnología o capacitación. La frontera puede moverse hacia abajo por desastres naturales o guerras.\n\n**Costo de oportunidad:** el costo de la mejor alternativa descartada. A‑B = ½ = 0,5; B‑C = 2/2 = 1; C‑D = 3/2 = 1,5; D‑E = 4/2 = 2; E‑F = 5/2 = 2,5. Es creciente: los recursos no son igualmente aptos y cada vez se pierde más producto al trasladarlos.\n\n### Competencia perfecta\n\nMano invisible (A. Smith), economía política. Con muchos productores y consumidores, nadie puede por su voluntad modificar el **precio** (ej.: panaderías de Buenos Aires). Condiciones: información perfecta; productos homogéneos; sin barreras de entrada (no hace falta autorización formal o legal); derechos de propiedad (todo es de alguien); sin externalidades (todo cae en mi cuenta, lo bueno y lo malo); bienes sujetos a exclusión y rivalidad; ⭐ **sin recursos ociosos**: siempre en la frontera de producción. Hoy Argentina produce al 50% de su capacidad: no está en la frontera.\n\n### Oferta\n\nCantidad que los productores están dispuestos a vender por un precio; pendiente positiva: a más precio, más voluntad de producir. Gráficamente, al revés de la física o la matemática: la independiente va en la horizontal y la dependiente en la vertical. **Factores que la desplazan:** costos de producción (materias primas; sueldos y salarios, cuyo aumento desplaza a la izquierda; tipos de interés); número de empresas (más empresas, a la derecha: más cantidad y menor precio); meteorología; tecnología. Si cambian, la curva se mueve.\n\n¿Por qué 3 naranjas salen más caras que un cajón? Desde el vendedor, prefiere vender rápido y maximizar su tiempo; desde el productor, **escala de producción**: ahorro productivo y logístico (al carpintero le conviene hacer 12 sillas en vez de 4: mismo contacto con la maderera, mismo flete). *Ceteris paribus*, si el precio sube la cantidad ofrecida aumenta, y si baja, disminuye; esto existe en competencia perfecta, y la economía de escala no lo es: si A descubre cómo producir más rápido, baja sus costos y su precio hasta que B no puede competir y quiebra; se rompe la idea de muchos productores y aparece el **poder de mercado**. Fracking: se corre el precio del petróleo. El desplazamiento de la curva ocurre cuando alguna variable *ceteris paribus* deja de estar fija.\n\n### Demanda\n\nCantidad que las personas están dispuestas a comprar contra el precio que est
