<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestría Estudios Internacionales - UTDT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: estudio editorial en papel crudo y tinta roja. Título enorme en serif de alto contraste, rótulos chicos en versalitas espaciadas, filetes rojos finos, retratos en duotono rojo. */
:root{
  --paper:#ECE2D4; --card:#F2EADF; --ink:#C02D1A; --text:#B42A18; --muted:#C35F49; --line:#DDB3A3;
  --accent:#C02D1A; --accent-soft:#F0D5CA;
  --ok:#2F6F4A; --ok-soft:#D7E6D3; --warn:#9A5A00; --warn-soft:#F3DFC0; --bad:#A3241A; --bad-soft:#F2CFC6;
  --panel-ink:#1F1B2D;
  --f-display:"Cormorant Garamond", "Bodoni 72", Didot, Georgia, serif;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 18px;border-bottom:1.5px solid var(--ink)}
header.top h1{font-size:clamp(34px,6vw,52px);line-height:1}
header.top h1 em{font-style:italic;color:var(--accent)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}

/* hoy */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--ink)}
.tcard .when{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tcard .when.hoy{color:var(--accent)}
.tcard h4{font-size:18px;line-height:1.25}
.tcard .sub{font-size:13px;color:var(--muted)}

/* carpetas */
.year{margin-top:34px}
.year>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.year>summary::-webkit-details-marker{display:none}
.year>summary h2{font-size:30px}
.year>summary .chev{transition:transform .2s;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.year[open]>summary .chev{transform:rotate(90deg)}
.tri{margin-top:22px}
.ysum{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.ysum h2{font-size:clamp(40px,6vw,68px);font-weight:400;letter-spacing:-.03em}
.tri-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:12px}
.tri-head h3{font-size:21px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}

/* cartas de materia */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s, box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 8px 0 -2px var(--line)}
.mcard .code{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.mcard .short{font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.15;color:var(--ink)}
.panel{aspect-ratio:1/1;max-width:100%;border-radius:3px;display:grid;place-items:center;color:var(--panel-ink);position:relative;overflow:hidden}
.panel>svg{width:78%;height:78%}
.panel>svg.pt{width:100%;height:100%;display:block;align-self:end}
.panel svg.pt .badge *{stroke-width:7}
.mcard .prof{font-family:var(--f-display);font-size:16px;font-style:italic}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.grade{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
.grade span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grade b{font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1;color:var(--ok)}
.avg{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.avg b{font-family:var(--f-display);font-size:20px;font-weight:500;color:var(--ink)}
.mcard .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* detalle */
.back{margin-top:20px;border:none;background:none;padding:0;cursor:pointer;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.dhead{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:24px;align-items:start;margin-top:14px}
@media (max-width:600px){.dhead{grid-template-columns:1fr}.dhead .panel{max-width:160px}}
.dhead h2{font-size:clamp(28px,4.4vw,42px);line-height:1.08;margin-top:4px}
.dhead .prof{font-family:var(--f-display);font-style:italic;font-size:19px;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px}
.facts div{min-width:0}
.facts b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{margin-top:12px;font-size:13px;color:var(--muted);max-width:65ch}
.stats{display:flex;gap:26px;margin-top:16px;font-variant-numeric:tabular-nums}
.stats .n{font-family:var(--f-display);font-size:32px;line-height:1}
.stats .k{font-size:12px;color:var(--muted)}

.classes{margin-top:30px;display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.cls{border-bottom:1px solid var(--line)}
.cls>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:14px 4px}
.cls>summary::-webkit-details-marker{display:none}
.cls .num{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.cls .tema{font-family:var(--f-display);font-size:19px;line-height:1.25}
.cls .cmeta{font-size:12px;color:var(--muted);margin-top:2px}
.cls .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cls.is-next .num{color:var(--accent)}
.cls-body{padding:0 4px 18px 66px;display:flex;flex-direction:column;gap:10px}
@media (max-width:600px){.cls-body{padding-left:4px}}
.txt{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.txt>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.txt>summary::-webkit-details-marker{display:none}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);margin-top:5px}
.dot.on{background:var(--ink)}
.txt .ttl{min-width:0;flex:1;font-size:14px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.ac{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.txt-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;width:max-content}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;line-height:1.5}
textarea{min-height:110px;resize:vertical}
textarea.sm{min-height:60px}
.resumen-prev{font-family:var(--f-display);font-size:15.5px;line-height:1.55;color:var(--muted);max-width:68ch}
.readlink{cursor:pointer;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.reader{max-width:70ch;margin-top:16px}
.reader h2{font-size:clamp(26px,4vw,38px);line-height:1.12;margin-top:6px}
.reader-body{margin-top:22px;font-family:var(--f-display);font-size:18px;line-height:1.65}
.reader-body p{margin:0 0 .9em}
.reader-body h2,.reader-body h3{font-size:24px;margin:1.4em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
.reader-body h4,.reader-body h5{font-family:var(--f-ui);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:1.3em 0 .4em}
.reader-body ul{margin:0 0 .9em;padding-left:1.2em}
.reader-body li{margin-bottom:.35em}
.readnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;max-width:70ch}
.navbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;font-family:var(--f-display);font-size:16px}
.navbtn:last-child{text-align:right}
.navbtn:hover{border-color:var(--ink)}
.resumen-view{font-family:var(--f-display);font-size:16.5px;line-height:1.6;white-space:pre-wrap;max-width:68ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.link{border:none;background:none;color:var(--muted);padding:4px 6px;text-decoration:underline}
.ex{border-left:2px solid var(--accent);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.ex .q{font-weight:600}
.ex details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.ex .a{font-size:14px;white-space:pre-wrap;margin-top:4px}
.sect{display:flex;flex-direction:column;gap:8px}
.add{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 14px;text-align:left;color:var(--muted);cursor:pointer;font-weight:600}
.add:hover{border-color:var(--ink);color:var(--ink)}

/* cuotas */
.payhero{margin-top:24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.payhero{grid-template-columns:1fr}}
.big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.big h2{font-size:clamp(26px,4vw,36px);line-height:1.1;margin-top:6px}
.big p{margin:8px 0 0;color:var(--muted)}
.window{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-top:16px}
.window i{height:22px;border-radius:2px;background:var(--line)}
.window i.in{background:var(--accent-soft)}
.window i.today{background:var(--ink)}
.window i.in.today{background:var(--accent)}
.wlegend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv a{color:var(--accent)}
.months-year{margin-top:30px}
.months-year h3{font-size:22px;margin-bottom:12px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mo:hover{border-color:var(--ink)}
.mo[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.mo .mn{font-family:var(--f-display);font-size:20px;text-transform:capitalize}
.mo .amt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.st{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.st.pagado{background:var(--ok-soft);color:var(--ok)}
.st.ventana{background:var(--warn-soft);color:var(--warn)}
.st.vencida{background:var(--bad-soft);color:var(--bad)}
.st.sinreg{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.st.futura{background:transparent;color:var(--muted);border:1px solid var(--line)}
.st.proxima{background:var(--accent-soft);color:var(--accent)}
.editor{margin-top:14px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.editor .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.editor label span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20}


/* avance */
.prog{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.prog .ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.prog .pct{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.prog .pk{color:var(--muted);font-size:13px}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:12px}
.seg{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent)}
.seglab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:5px;font-size:11px;color:var(--muted);text-align:center}
.seglab .yr{font-weight:700}
/* promedio */
.avghero{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.avghero .big .n{font-family:var(--f-display);font-size:clamp(48px,8vw,72px);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.avghero .big .k{color:var(--muted);font-size:13px;margin-top:6px}
.gtable{margin-top:28px}
.gtable h3{font-size:22px;margin:22px 0 8px}
.grow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.grow .sw{width:44px;height:44px;border-radius:6px;overflow:hidden;display:grid;place-items:center}
.grow .sw svg{width:100%;height:100%}
.grow .nm{font-family:var(--f-display);font-size:18px;line-height:1.25}
.grow .pf{font-size:12.5px;color:var(--muted)}
.grow .gv{display:flex;align-items:center;gap:6px}
.grow .gv b{font-family:var(--f-display);font-size:28px;font-weight:500;color:var(--ok);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.grow .gv input{width:64px;padding:5px 8px}
.grow .pend{font-size:12px;color:var(--muted)}


/* la maestría */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 32px;margin-top:22px}
.mblock{border-top:1px solid var(--ink);padding:14px 0 22px;min-width:0}
.mblock h3{font-size:30px;font-weight:400;line-height:1.05;margin-top:4px}
.mblock p{margin:8px 0 0;max-width:62ch}
.mlist{list-style:none;margin:10px 0 0;padding:0}
.mlist li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mlist li span:first-child{min-width:0}
.mlist li span:last-child{flex:none;text-align:right}
.mlist li span:last-child{color:var(--muted);font-size:12.5px}
.mlist li.ok span:first-child::before{content:"✓ ";color:var(--ok)}
.mfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 24px;margin-top:22px}
.mfacts div{border-top:1px solid var(--ink);padding:10px 0 14px}
.mfacts b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;line-height:1.05;color:var(--ink);font-variant-numeric:lining-nums}
.mfacts span{font-size:12.5px;color:var(--muted)}
.plan2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:4px}
.pcard{border-top:1px solid var(--ink);padding:10px 0;min-width:0}
.pcard .short{font-family:var(--f-display);font-size:22px;line-height:1.1;color:var(--ink)}
.pcard .code{font-size:10px;letter-spacing:.18em;font-weight:600;text-transform:uppercase;color:var(--muted)}
/* lecturas */
.wk{margin-top:30px}
.wk>.ysum h2{font-size:clamp(34px,5vw,56px)}
.lcls{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px 28px;padding:18px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.lcls{grid-template-columns:1fr}}
.lcls .when{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.lcls .dd{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.lcls .mod{font-size:12px;color:var(--muted);margin-top:4px}
.lcls h4{font-size:24px;line-height:1.15}
.lcls .sub{font-size:13px;color:var(--muted);margin-top:2px}
.lread{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.lread li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lread li .tt{font-size:14.5px;overflow-wrap:anywhere}
.lread li.done .tt{text-decoration:line-through;text-decoration-color:var(--line)}
.lread input{width:17px;height:17px;accent-color:var(--ink)}
.lsum{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
.lsum b{font-family:var(--f-display);font-size:26px;font-weight:400;color:var(--ink);margin-right:4px;font-variant-numeric:lining-nums}
/* calendario */
.calbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:24px}
.calbar h2{font-size:clamp(28px,4.4vw,40px);text-transform:capitalize;margin-right:auto}
.calbar .btn{min-width:38px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.cal .dow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px 4px}
.day{min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.day.out{background:transparent;border-style:dashed;opacity:.5}
.day.hoy{border:2px solid var(--accent)}
.day[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.day .dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.day.hoy .dn{color:var(--accent)}

function portrait(s){
  if(!s.faces)return ILLU[s.ill];
  let inner;
  if(s.faces.length===1)inner=face(FACES[s.faces[0]]);
  else inner=`<g transform="translate(-4 34) scale(.72)">${face(FACES[s.faces[0]])}</g><g transform="translate(38 34) scale(.72)">${face(FACES[s.faces[1]])}</g>`;
  return `<svg class="pt" viewBox="0 0 120 120" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Ilustración de ${esc(s.prof)}">${inner}${badge(s)}</svg>`;
}

const SNAP={"clases": {"EI03-c1": {"extras": [{"ejercicios": [], "leido": false, "resumen": "## Sesión 1 (3/3). La globalización\n\n### Globalización: definiciones y caracterización\n\n**«Visión 90'».** Proceso irreversible, que data del siglo XVI pero se aceleró en las últimas dos o tres décadas, y consiste en la integración y unificación de la vida política, económica, social y cultural, sobre todo de mercados, valores y patrones económicos. Muy difundida en los noventa, con el fin de la Guerra Fría y el auge del neoliberalismo: integración creciente impulsada por el libre mercado, la apertura y la tecnología.\n\n• ¿Irreversible? La literatura reciente lo cuestiona: la crisis de 2008, el proteccionismo, el Brexit y las tensiones entre potencias muestran que no es lineal ni irreversible.\n• ¿Surge con el comercio de ultramar en los albores del capitalismo? Algunos autores sitúan sus orígenes en la expansión europea desde el siglo XVI (comercio transoceánico, colonización, sistema económico mundial).\n• ¿Des-globalización desde 2008? Muchos hablan de desaceleración o reconfiguración: menor dinamismo del comercio, relocalización y mayor intervención estatal.\n\n**Mirada crítica (Ramonet).** «El principal enfrentamiento de nuestros días»: mercado contra Estado, privado contra público, individuo contra colectividad. La globalización debilitó la capacidad regulatoria de los Estados frente al capital y las corporaciones.\n\n**Los hiperglobalizadores.** La globalización define una nueva era en que los pueblos quedan sujetos a la disciplina del mercado global; los Estados nación se vuelven unidades de negocios no viables; las fuerzas de los mercados son más poderosas que los Estados. Toda política se justificaba por la globalización y era desregulatoria: si no te subías al tren, quedabas afuera del progreso. Los gobiernos tienen cada vez menos margen.\n\n**Definición abarcadora (OIT, 2006).** La mundialización es la progresiva integración de sociedades y economías nacionales, impulsada por avances tecnológicos, reformas comerciales, políticas de inversión y nuevas estrategias empresariales. Destaca factores simultáneos (tecnología, políticas, estrategias empresariales, integración) y no afirma que sea irreversible.\n\n**Aldo Ferrer.** «Un sistema de redes en las cuales se organizan el comercio, las inversiones de las corporaciones transnacionales, las corrientes financieras, el movimiento de personas y la circulación de información que vincula a las diversas civilizaciones». No se limita al mercado, incluye redes económicas, financieras, tecnológicas y culturales, las transnacionales y los flujos de información y personas. Le saca centralidad al mercado; el punto flojo es el movimiento de personas, porque la migración legal no es tan relevante.\n\n**Precisiones.** No es un hecho nuevo, pero hoy tiene dimensiones distintas y más complejas; la de fines del XX y comienzos del XXI tiene especificidades propias, con continuidades y rupturas. Definición minimalista: la tendencia de mercados y empresas a asumir escala mundial, con mayor interrelación política y cultural. Implica más comercio, más transnacionales, cadenas productivas globales e interdependencia.\n\n### Tres grandes etapas de la globalización\n\n**Primera (1870-1913).** Gran expansión del comercio; fuertes flujos de capitales y migraciones (de Europa a América); imperialismo europeo y zonas de influencia; Segunda Revolución Industrial (acero, electricidad, química, ferrocarriles); caída de los costos de transporte (vapor, ferrocarril) y comunicación (telégrafo); patrón oro que estabiliza el sistema monetario. Se configura una economía mundial relativamente integrada. Se interrumpe con la Primera Guerra, la crisis de 1929, la Gran Depresión, el proteccionismo y nacionalismo económico, y la Segunda Guerra.\n\n**Segunda (1950-1975/80).** Menor integración global: mundo bipolar; integración sobre todo dentro de Occidente; fuerte intervención estatal (Estado de bienestar); institucionalización del sistema: Bretton Woods (1944), FMI, Banco Mundial, el fracaso de la OIC y en su lugar el GATT (1947). Crece el comercio y la industria en los desarrollados, con menor movilidad de capitales y un sistema financiero más regulado. Entra en crisis en los setenta: petróleo, fin de Bretton Woods (1971), inflación y estancamiento.\n\n**Tercera (1980-actualidad).** Se gesta en los ochenta y se materializa en los noventa: libre comercio, desregulación financiera, flujos de capital, transnacionales, cadenas globales de valor, revolución de las TIC. Contradicción: alta movilidad de capitales y mercancías, baja movilidad de personas. ¿Dos subetapas? **Globalización triunfante** (1990-2005/2008): fin de la Guerra Fría, neoliberalismo, OMC (1995), cadenas globales, auge de la IED; hitos como la crisis argentina de 2001 y el rechazo al ALCA en 2005. **Globalización cuestionada** (2006/2009-actualidad): crisis de 2008, cuestionamiento al neoliberalismo, más intervención estatal, discursos proteccionistas y nacionalistas, desaceleración del comercio; se debate una nueva etapa de regionalización, tensiones geopolíticas y reconfiguración de las cadenas.\n\n### Primera fase: 1870-1913\n\nPrimera gran etapa de integración moderna, impulsada por la industrialización y la expansión imperial europea. **Contexto político:** Estados soberanos, colonias y protectorados; las potencias industriales (Reino Unido, Francia, Alemania) organizan la economía mundial según sus intereses. **Movilidad:** alta movilidad de capitales desde Europa hacia América y las colonias; cerca del 10% de la población mundial migró, como mecanismo para abastecer de trabajo a economías en expansión. **Patrón oro:** monedas convertibles en oro, estabilidad cambiaria que facilitaba créditos, inversiones y comercio, aunque habilitaba especulación. **Migraciones masivas:** unos 60 millones de europeos hacia América, África y Oceanía, y otros 60 millones de trabajadores de China e India hacia Birmania, Filipinas, Vietnam, Tailandia y Sri Lanka. La colonización se justificaba con el eufemismo de «espacios vacíos», desplazando o exterminando pueblos originarios. **Comercio:** fuerte aumento por la baja de costos de transporte y la expansión del libre comercio promovido por el Reino Unido.\n\n**Fin de la primera globalización.** La Primera Guerra rompe los flujos; sigue un interregno de recuperación (Belle Époque en las capitales vencedoras). La crisis de 1929 y la Gran Depresión traen proteccionismo y bilateralismo cerrado, que profundizan la crisis y las tensiones. La crisis y el nacionalismo económico contribuyen al ascenso de regímenes autoritarios como el nazismo y a la Segunda Guerra, más destructiva: mayor extensión, más muertos y más civiles por bombardeos, armas atómicas. Emerge un mundo bipolar con liderazgo de Estados Unidos y la URSS: la Guerra Fría.\n\n### Segunda fase: posguerra a 1975-80\n\nReúne elementos y consecuencias de la crisis del 30 y la guerra. La solución teórica fue la **macroeconomía keynesiana**: el mercado no garantiza el pleno empleo; el Estado debe estabilizar el ciclo y aumentar el gasto en recesión; objetivos: pleno empleo, suavizar crisis, evitar otro 1929. **Ciudadanía social y Estado de bienestar:** bienes públicos y derechos sociales, seguridad social, seguro de desempleo, salud y educación públicas, redistribución; con el objetivo político de reconstruir la cohesión social, reducir conflictos y evitar que la población se inclinara al comunismo. **Fordismo:** cadena de montaje, producción en masa estandarizada, productividad creciente; círculo de productividad, salarios relativamente altos y consumo masivo (los trabajadores consumen lo que fabrican); intensivo en energía barata, sobre todo petróleo. **Modelo dominante:** fordismo + Estado de bienestar + keynesianismo, base de «los treinta años dorados» (1945-1975), con alto crecimiento, más comercio y mejor nivel de vida en los desarrollados.\n\n**Apertura gradual y regulada:** los países priorizaban su acumulación interna; el GATT coordinó la apertura en manufacturas reduciendo aranceles. **Exclusión de los países en desarrollo:** rol marginal; agricultura (protegida por Europa y Estados Unidos desde los cincuenta) y textiles (restricciones en los sesenta) quedaron prácticamente excluidos aun dentro del GATT; por eso muchos países del Sur adoptaron la ISI.\n\n**Bretton Woods:** tipos de cambio fijos pero ajustables, monedas vinculadas al dólar y dólar convertible en oro. El FMI supervisaba y prestaba ante problemas de balanza de pagos; solo se autorizaba devaluar ante desequilibrios fundamentales (si tenías sequía, te prestaba en la recesión y lo devolvías después). **Del patrón oro al patrón dólar:** Estados Unidos se vuelve proveedor de liquidez internacional. **Dilema de Triffin:** para que haya liquidez, Estados Unidos debe emitir dólares y tener déficits externos, pero cuantos más dólares circulan, más dudas sobre su respaldo en oro; fue uno de los factores del fin de Bretton Woods en 1971.\n\n### Fin de la «Edad de Oro» (fines de los 60 y años 70)\n\n1. **Crisis del fordismo (fines de los 60):** rendimientos decrecientes; la productividad crece cada vez menos, los mercados de consumo masivo se saturan, suben costos laborales y tecnológicos, caen las ganancias; menor crecimiento y tensión capital-trabajo.\n2. **1971, fin de Bretton Woods:** Nixon declara la inconvertibilidad del dólar; colapsa el sistema, las monedas flotan, aumentan la volatilidad y la especulación. El desafío vino también de Europa: De Gaulle exigía convertir dólares en oro; empieza el proyecto del euro.\n3. **1973, primer shock petrolero:** la OPEP reduce producción y embarga a Occidente; el precio se cuadruplica, suben los costos, se desacelera el crecimiento. Ganan productores como Venezuela, pierden importadores como Brasil. Fue el «talón de Aquiles» del fordismo, que dependía de energía barata.\n4. **1974-1978, fracaso keynesiano:** se intenta más gasto, menos tasas y devaluación, pero aparece la **estanflación** (estancamiento más inflación alta), inesperada según el trade-off de la curva de Phillips; con inflación alta, desempleo alto y bajo crecimiento entra en crisis el paradigma. Cuando el trípode se rompe, devaluar o bajar tasas hace que los capitales se vayan.\n5. **1976, desregulación financiera:** sin tipos fijos, los capitales se mueven más libremente, crece la especulación y difieren las tasas; se expanden los mercados financieros, comienza la financiarización y los Estados pierden capacidad regulatoria, con devaluaciones recurrentes.\n6. **1979, segundo shock petrolero:** la revolución iraní reduce la oferta; suben precio e inflación, la crisis se profundiza. La inflación internacional por emisión de Estados Unidos había licuado el primer shock.\n\n**Conclusión:** entre 1970 y 1980 colapsa el modelo de posguerra (fordismo + bienestar + Bretton Woods) y se abre un nuevo paradigma: liberalización financiera, desregulación, globalización del capital, políticas neoliberales (Reagan, Thatcher).\n\n### El fin de la segunda fase: una respuesta capitalista\n\nSe instala la idea de que el problema no es el mercado sino el exceso de Estado. **Críticas al Estado de Bienestar Keynesiano (EBK):** genera rigideces; el Estado hipertrofiado reduce incentivos y eficiencia; el mercado es más eficiente; la expansión de derechos sociales, sindicales y democráticos genera demandas que el sistema no puede satisfacer, con crisis fiscales y conflictos. La democracia social y los sindicatos pasan a verse como obstáculos para la acumulación.\n\n**1978-1981, Thatcher y Reagan:** neoconservadurismo (conservadurismo político y liberalismo económico): privatizaciones (sobre todo en el Reino Unido), desregulación, menor rol del Estado y debilitamiento sindical (huelga minera británica, controladores aéreos en Estados Unidos). **Ascenso del sector financiero** y competencia regulatoria: si un país regulaba demasiado, los capitales se iban, generando una «corrida hacia el mínimo regulatorio».\n\nEsta globalización es la respuesta de los Estados avanzados y las transnacionales a la crisis del régimen F+EBK: apertura, desregulación financiera e internacionalización de la producción, apoyadas en tecnologías flexibles, automatización, redes de información, transporte y telecomunicaciones. En los ochenta muchas transnacionales trasladan producción a la periferia, primero como plataformas de exportación de bajo costo (todavía no cadenas complejas), favorecidas por la crisis de la deuda de 1982, la necesidad de divisas y la estrategia exportadora (Turquía, Brasil, México imitando a Corea del Sur). Cumple dos objetivos: **recuperar la tasa de ganancia** con mano de obra más barata, menos regulaciones y energía más barata (como preveía Marx), y **disciplinar a la fuerza de trabajo** de los países desarrollados (desempleo o amenaza de desempleo, debilitamiento sindical). La globalización de los 80-90 no surge solo de la tecnología: es una respuesta política y económica a la crisis del capitalismo de posguerra (crisis fordista-keynesiana, reformas neoliberales, nueva fase).\n\n### Tercera fase: desde inicios de los 90\n\nDesde fines de los setenta el capitalismo central está en crisis (Gramsci: «muere lo viejo sin que pueda nacer lo nuevo»). **Factor político:** caída del bloque socialista (1989-1991), desaparece la alternativa y se consolida un orden unipolar liderado por Estados Unidos; el capitalismo se expande sin competidor, puede ir a un «capitalismo desenfrenado» bajando derechos laborales sin freno. Se generalizan apertura, liberalización financiera, desregulación y menor rol estatal como nuevo paradigma.\n\n**Financiarización:** los flujos financieros crecen más rápido que la economía productiva. **Transnacionales e IED:** entre 1950 y 1970 replicaban plantas completas para abastecer mercados internos; ahora surgen las **cadenas globales de valor**: una empresa coordina producción en muchos países, cada país hace una etapa y los bienes cruzan varias veces las fronteras (electrónica, automotriz). Aumenta el comercio intrafirma, con problemas de evasión, precios de transferencia y recaudación. **Movilidad desigual:** el capital se mueve libremente pero el trabajo no: mercados laborales segmentados, migrantes con menor protección, informalidad y tensiones culturales. **Revoluciones tecnológicas:** microelectrónica, nuevos materiales, biotecnología, TIC, internet; reducen costos de comunicación y coordinación y tiempos de producción.\n\n**Instituciones internacionales:** FMI y Banco Mundial impulsan el Consenso de Washington (liberalización comercial y financiera, privatizaciones, apertura a la IED, disciplina fiscal), aplicado sobre todo en América Latina en los noventa, con liberalización unilateral, apertura financiera y Tratados Bilaterales de Inversión. **OMC (1995):** surge en un contexto unipolar y de hegemonía liberal; amplía las reglas a servicios, propiedad intelectual e inversiones; muchos países en desarrollo las aceptaron para anclar sus reformas (Argentina comprometió apertura en servicios).\n\n**Redespliegue productivo hacia la periferia** por salarios bajos, regulaciones laborales y ambientales laxas y economías de aglomeración (Brasil, Turquía, India, Sudeste Asiático). Factores de los noventa: tecnologías flexibles y TIC; caída del Muro; incorporación de grandes masas de trabajadores (China, Europa del Este) que ampliaron la oferta global de trabajo; China funcionó como reserva de mano de obra que presionó a la baja los salarios, un ejército industrial de reserva según Marx. **Gobernanza de las CGV:** subcontratación internacional y redes de producción coordinadas por las transnacionales, que fijan estándares, precios, abastecimiento y sanciones; los precios se duplican al pasar de mano en mano. **Cambio en la relación empresas-Estados:** antes las empresas negociaban con los Estados para acceder a mercados; ahora los Estados compiten por atraer inversiones (resource seeking, market seeking) con incentivos fiscales, menores regulaciones, subsidios e infraestructura (caso automotriz). Síntesis: liberalización, capital financiero, producción fragmentada, poder de las transnacionales y competencia entre Estados.\n\n### Globalización, desarrollo y respuestas nacionales: hechos y ficciones (A. Ferrer)\n\n**Ficciones** (enfoques ingenuos que la presentan como inevitable e incontrolable): determinismo tecnológico (la tecnología organizaría automáticamente la economía mundial, cuando depende de decisiones políticas, instituciones y estrategias); irrelevancia del Estado nación (exageración: los Estados siguen siendo centrales); imposibilidad de regular la globalización (los Estados solo podrían adaptarse pasivamente); enfoques maniqueos de dominación total del capital, que conducen a la inacción.\n\n**Hechos:** la globalización resulta de luchas de poder. Las reglas se construyen mediante relaciones de poder, en instituciones formales (FMI, OMC, Banco Mundial) o informales; las instituciones no son neutrales y reflejan los intereses de los poderosos; los desarrollados «patean la escalera» al promover libre mercado tras haber usado proteccionismo; las teorías presentadas como universales reflejan experiencias específicas de los desarrollados; persisten el Estado y la geopolítica.\n\n**Desarrollo según Ferrer:** no depende solo de la inserción en el mercado mundial, sino de la capacidad de generar conocimiento, difundirlo en toda la economía e integrarlo en las relaciones sociales, productivas y políticas. **Densidad Nacional:** instituciones sólidas, coordinación entre Estado, empresas y sociedad, consenso político sobre una estrategia, sistema científico-tecnológico, capital humano y educación; solo los países con alta densidad nacional pueden aprovechar la globalización. El Estado ve recortada su soberanía por limitaciones internas (descentralización, minorías, tensiones) y externas (compromisos internacionales, tratados, condicionamientos financieros), pero sigue siendo el principal actor para formular políticas, movilizar recursos y diseñar una estrategia nacional: la globalización no elimina su rol, cambia el contexto en que actúa.\n\nEl determinismo tecnológico es limitado: también estuvo la caída del Muro, y en los últimos diez años la tecnología avanzó mientras la globalización retrocede; la política moldea la apertura o el cierre. Bruno Amable, estilos de capitalismo. Detrás de la globalización hay ganadores y perdedores; la densidad nacional requiere consensos de la burguesía nacional para participar del conocimiento científico. La globalización recortó herramientas del Estado respecto de los años cincuenta, pero sigue siendo el único capaz de guiar objetivos económicos.\n\n### Desarrollo, pobreza y bienes públicos\n\nEl PBI es una aproximación muy mala al desarrollo; el IDH se correlaciona con el PBI pero toma otras variables. Hasta los 70-80 se pensaba que la periferia debía crecer para cerrar la brecha, aunque si todos consumieran como las potencias no existiría el mundo. América Latina no convergió: la brecha sigue (alrededor del 30%), con mejoras en indicadores sociales. Corea es el único caso de fuerte convergencia en el ciclo (supera a América Latina en los ochenta, con procesos geopolíticos a tener en cuenta). China crece en etapas: muerte de Mao, reformas de mercado de Deng Xiaoping, apertura en las Zonas Económicas Especiales y, en 2001, ingreso a la OMC, que le dio seguridad jurídica: capitalismo de Estado o «socialismo con características chinas»; en 2010 su PBI per cápita estaba apenas por encima del de América Latina.\n\n**Pobreza:** termina habiendo menos, pero no se verificó la teoría del derrame (sería «goteo»; Perú creció mucho y sigue con mucha pobreza, a diferencia de Brasil). Desde los noventa la producción mundial de alimentos alcanza para todos, pero el crecimiento es ineficiente para reducir el hambre y tiene límites de sustentabilidad ambiental: no se puede crecer infinitamente, hay que cambiar el patrón de producción y tomar acciones focalizadas. Debate entre priorizar pobreza o desigualdad. Milanovic: un tercio de la población vive uno o dos siglos atrasada y solo el 15% es «contemporánea»; la globalización sigue siendo un fenómeno de grandes urbes. Los recursos no renovables generan conflictos entre naciones (ríos: Indo, Atuel; agua y energía hidroeléctrica). No alcanza con un país: se necesitan instituciones. El problema afecta a clases sociales y generaciones.\n\n**Energía y clima:** no todos los fósiles son iguales (el gas emite cerca de 25% menos que el petróleo; el peor es el carbón). Gravar el petróleo genera inflación, por eso nadie lo hace. La UE empezó a avalar la nuclear (sin gases de efecto invernadero); Alemania cerró sus plantas, Francia las mantuvo. Greenwashing y bonos verdes. Hay que analizar el ciclo completo (reciclado, vida útil, litio, baterías); los no responsables pagan la contaminación. El consumo imperial: habría que bajar el consumo de los desarrollados, pero todos apuestan a la transición energética; la electricidad es fósil si se genera con carbón. Río 1992: responsabilidades comunes pero diferenciadas. Las emisiones históricas son acumulativas desde la revolución industrial; Brasil pide que se le pague por no explotar el Amazonas (el principal aportante del fondo es Noruega, que vive del petróleo); China dice «yo produzco pero ustedes consumen» y abarató paneles solares y molinos. Trump salió dos veces del Acuerdo de París; ante tensiones geopolíticas y guerras se reabren usinas de carbón y todo queda en segundo plano.\n\n**Derechos, delitos y gobernanza:** expansión de derechos con instancias regionales y mundiales (Pacto de San José), aunque los derechos humanos también son un arma política. Los delitos transnacionales (tráfico de personas) se fomentaron y conectaron con la globalización. La pobreza mundial bajó, pero por China, India y Brasil (2004-2010), con mayor polarización entre ganadores y perdedores. No hay sanciones al Estado que no haga nada: cada uno elige cómo implementar y medir; es voluntad política. En pesca, la OMC logró el acuerdo sobre subsidios. Mayor influencia de los desarrollados y de las transnacionales, hoy las tecnológicas («tecnofeudalismo» que absorbe la renta); pérdida de financiamiento de organismos como la UNESCO; desde 2000 la sociedad civil como poder transnacional, con la pregunta de a quién representan las ONG.\n\nTodas estas tensiones surgen de la fuerte interdependencia lograda tras la caída del Muro: los mercados articulaban la globalización, pero eso está en crisis. Diversos capitalismos (Amable) y la cuestión de la nivelación del campo de juego. Desde 2017 Estados Unidos siente que la OMC da ventajas a China; Biden atenuó el rechazo pero no volvió a la situación previa: dejó elegir una directora general, pero no destrabó el Órgano de Apelación.", "titulo": "Apuntes de clase · Sesión 1 (3/3): La globalización"}], "textos": {"0": {"ejercicios": [], "leido": false, "resumen": "## Capítulo 3. ¿Cómo llegamos hasta aquí? Una breve historia del capitalismo\n\n### Una maldita cosa después de otra: ¿para qué sirve la historia?\n\nMuchas personas consideran que la historia económica no tiene sentido: ¿hace falta saber lo que ocurrió hace dos o tres siglos para corroborar que el libre comercio fomenta el crecimiento, que los impuestos altos desalientan la creación de riqueza o que menos burocracia estimula los negocios? ¿No son proposiciones derivadas de teorías de lógica irrefutable y confirmadas por datos estadísticos contemporáneos? La mayoría de los economistas está de acuerdo. La historia económica fue materia obligatoria en las facultades de economía norteamericanas hasta los años ochenta; hoy muchas ya no la ofrecen, y entre los economistas más teóricos se la considera, en el mejor de los casos, una distracción inofensiva y, en el peor, un refugio para quienes no pueden manejar las matemáticas y las estadísticas. Sin embargo, es vital conocer la historia del capitalismo para comprender plenamente los fenómenos económicos contemporáneos.\n\n### La vida es más extraña que la ficción: por qué la historia importa\n\nLa historia afecta al presente porque lo que creemos saber de ella determina nuestras decisiones. Muchas recomendaciones políticas se respaldan en ejemplos históricos, porque nada convence tanto como los casos reales. Quienes promueven el libre comercio señalan que Gran Bretaña y luego Estados Unidos llegaron a ser superpotencias gracias al libre comercio; si comprendieran que esa visión de la historia es incorrecta, no pondrían tanto empeño en recomendar esas políticas.\n\nLa historia también nos fuerza a cuestionar supuestos. Saber que muchas cosas que hoy no se compran ni se venden (esclavos, trabajo infantil, cargos de gobierno) solían ser comercializables muestra que la frontera del «libre mercado» no fue trazada por una ley científica atemporal y puede ser retrazada. Saber que las economías capitalistas avanzadas crecieron más rápido que nunca entre 1950 y 1970, una época de fuertes regulaciones e impuestos altos, vuelve escépticos ante la idea de que para crecer hay que bajar impuestos y reducir la burocracia.\n\nLa historia resalta los límites de la teoría económica: está plagada de experiencias exitosas que ninguna teoría explica a la perfección. Singapur se presenta como prueba del libre comercio y la apertura a la inversión extranjera, pero casi toda la tierra es del Estado, el 85% de las viviendas las otorga un organismo estatal y el 22% de la riqueza nacional la producen empresas públicas (el promedio internacional ronda el 10%). Ninguna teoría (neoclásica, marxista, keynesiana) explica el éxito de esa combinación de mercado libre y socialismo, lo que debería volvernos más cautos al sacar conclusiones políticas.\n\nPor último, existe el deber moral de evitar «experimentos» con la gente. Desde la planificación central en el bloque socialista y su transición «big bang» al capitalismo, hasta los fracasos de la «economía de la filtración» en Estados Unidos y el Reino Unido en los ochenta y noventa, y la austeridad en Europa tras la Gran Depresión, la historia está plagada de experimentos radicales que destruyeron millones de vidas. Hay que extraer lecciones de la historia antes de formular políticas.\n\n### La tortuga contra los caracoles: la economía mundial antes del capitalismo\n\n**Europa occidental creció muy lentamente…** El capitalismo comenzó en Europa occidental, especialmente en Gran Bretaña y los Países Bajos, entre los siglos XVI y XVII. Por qué allí y no en China o India, comparables en desarrollo, es objeto de intenso debate (desde el desprecio de la élite china por el comercio y la industria hasta el descubrimiento de América y los yacimientos de carbón británicos). Antes del capitalismo, las sociedades cambiaban con extrema lentitud: organizadas en torno a una agricultura con las mismas tecnologías durante siglos, algo de comercio e industrias artesanales. Entre 1000 y 1500 la renta per cápita de Europa occidental creció al 0,12% anual: en 1500 era solo un 82% más alta que en el año 1000. China, al 11% anual, logró ese crecimiento en seis años (2002-2008): un año de la China actual equivale a ochenta y tres de la Europa medieval.\n\n**… pero creció más rápido que el resto del mundo.** Asia y Europa oriental crecieron en promedio un tercio de eso (0,04%): su renta aumentó solo un 22% en medio milenio. Europa occidental avanzaba a paso de tortuga; otras partes del mundo, como caracoles.\n\n### Los albores del capitalismo: 1500-1820\n\n**Nace el capitalismo… a cámara lenta.** Entre 1500 y 1820 la renta per cápita de Europa occidental creció solo al 0,14%, casi igual que antes. Gran Bretaña y Holanda aceleraron hacia fines del siglo XVIII, sobre todo en tejidos de algodón y hierro, con tasas de 0,27% y 0,28%: bajas para hoy, pero el doble del promedio europeo.\n\n**El surgimiento de nuevas ciencias, tecnologías e instituciones.** Primero hubo un cambio cultural hacia maneras más «racionales» de entender el mundo, con el predominio de las matemáticas y las ciencias modernas, inicialmente tomadas del mundo árabe y Asia; Copérnico, Galileo, Fermat, Newton y Leibniz son de esta época. La sistematización del conocimiento hizo que las innovaciones dependieran menos de individuos y fueran más fáciles de transferir. El siglo XVIII vio nuevas tecnologías que anunciaron la producción mecanizada (textil, siderurgia, química), una división del trabajo más específica y, desde comienzos del XIX, líneas de montaje continuas. Clave fue el deseo de aumentar la producción para vender más y obtener mayores beneficios: como en la teoría de la división del trabajo de Adam Smith, más producción permitía más división del trabajo, más productividad y más producto, un «ciclo virtuoso». Surgieron nuevas instituciones: los bancos, para facilitar las transacciones, y la corporación o sociedad anónima, y con ella el mercado de valores, para proyectos que superaban la riqueza de los individuos más ricos.\n\n**Comienza la expansión colonial.** Desde el siglo XV los países de Europa occidental se expandieron más allá de sus fronteras; la «era de los descubrimientos» implicó adueñarse de tierras, recursos y trabajadores nativos mediante el colonialismo. Portugal (en Asia) y España (en América) primero; hacia mediados del XVIII, Gran Bretaña, Francia y España se habían repartido América del Norte; América Latina estuvo bajo dominio español y portugués hasta las décadas de 1810 y 1820; partes de India eran británicas, francesas y portuguesas; Australia empezó a colonizarse (1788). África todavía estaba poco afectada. El colonialismo se regía por principios capitalistas: hasta 1858 la India británica fue administrada por una empresa, la Compañía de las Indias Orientales. Las primeras expansiones buscaban metales preciosos y especias; luego se establecieron plantaciones con esclavos africanos (Estados Unidos, Brasil, Caribe) para caña de azúcar, caucho, algodón y tabaco. Algunos cultivos del Nuevo Mundo se volvieron alimentos básicos en Europa y Asia (patatas, tomates, maíz, chiles).\n\n**El colonialismo deja hondas cicatrices.** Se debate si el capitalismo podría haberse desarrollado sin los recursos coloniales (metales para moneda, alimentos como la patata y el azúcar, insumos como el algodón). Los colonizadores se beneficiaron enormemente, aunque probablemente habrían desarrollado el capitalismo sin ellos. Lo indudable es que el colonialismo devastó a las sociedades colonizadas. Las poblaciones nativas fueron exterminadas o marginadas y les usurparon tierras y recursos: Evo Morales (2006) es apenas el segundo jefe de Estado indígena en América desde 1492, tras Benito Juárez. Unos doce millones de africanos fueron capturados como esclavos por europeos y árabes, lo que vació de trabajadores a muchas sociedades y destruyó su tejido social. Se inventaron países con fronteras arbitrarias que siguen afectando su política; las fronteras rectas de África dan fe de ello. El colonialismo destruyó deliberadamente actividades productivas avanzadas: en 1700 Gran Bretaña prohibió la importación de calicós indios para promover su industria algodonera, y a mediados del XIX las exportaciones de la industria británica mecanizada dieron el tiro de gracia. Como colonia, India no podía usar aranceles para protegerse. En 1835 lord Bentinck escribió que «los huesos de los tejedores de algodón blanquean las llanuras de India».\n\n### 1820-1870: la revolución industrial\n\n**El rugido de las turbinas: comienza la revolución industrial.** El capitalismo despegó hacia 1820, con una aceleración visible en Europa occidental y luego en las «filiales occidentales» de América del Norte y Oceanía, tan espectacular que se llamó «revolución industrial» al medio siglo posterior. La renta per cápita de Europa occidental creció al 1% anual, poco para hoy pero turbopropulsado frente al 0,14% de 1500-1820.\n\n**Espere vivir diecisiete años y trabajar ochenta horas a la semana: la miseria aumenta para algunos.** Al principio, la aceleración vino con una caída del nivel de vida para muchos. Los artesanos con destrezas útiles perdieron sus trabajos, reemplazados por máquinas operadas por trabajadores baratos y no cualificados, muchos de ellos niños; algunas máquinas se diseñaban del tamaño de los menores. Se trabajaban entre setenta y ochenta horas semanales, algunos más de cien. Las condiciones eran extremadamente peligrosas: muchos obreros del algodón morían de enfermedades pulmonares. La clase trabajadora urbana vivía hacinada, quince o veinte personas por habitación y cientos por baño. En las zonas pobres de Manchester la esperanza de vida era de diecisiete años, un 30% más baja que en Gran Bretaña antes de la conquista normanda.\n\n**El surgimiento de los movimientos anticapitalistas.** Algunos intentaban volver al pasado: los luditas, artesanos textiles que habían perdido sus trabajos en la década de 1810, alentaban la destrucción de las máquinas. Otros buscaban una sociedad más igualitaria basada en el trabajo comunitario, parecida al kibbutz. El más destacado fue Karl Marx (1818-1883), que tildó a Owen y otros de «socialistas utópicos» y llamó «socialismo científico» a su enfoque: la nueva sociedad debía construirse sobre los logros del capitalismo, aboliendo la propiedad privada de los medios de producción pero preservando las grandes unidades de producción, y planificando centralmente la economía como una empresa capitalista planifica sus operaciones (planificación centralizada). Marx y seguidores como Lenin creían que el socialismo solo llegaría por una revolución obrera; los «revisionistas» o socialdemócratas (Bernstein, Kautsky) pensaban que bastaba reformar el capitalismo mediante la democracia parlamentaria: regulación de la jornada y condiciones laborales, Estado del bienestar. Los reformistas leyeron mejor la tendencia histórica, aunque entonces no era obvio, porque los capitalistas resistían ferozmente cualquier reforma. Desde 1870 hubo mejoras palpables: subieron los salarios, algunos trabajaban menos de sesenta horas, la esperanza de vida pasó de 36 años (1800) a 41 (1860), y surgió el Estado del bienestar con el seguro alemán por accidente industrial de Bismarck (1871).\n\n**El mito del libre mercado y del libre comercio: cómo se desarrolló realmente el capitalismo.** El avance del capitalismo en el siglo XIX suele atribuirse a la propagación del libre comercio y el libre mercado: Gran Bretaña y Estados Unidos habrían tomado la delantera por adoptarlos primero. Nada más lejos de la realidad: el gobierno desempeñó un papel crucial en el temprano desarrollo del capitalismo.\n\n**Gran Bretaña como pionera del proteccionismo.** Desde Enrique VII (1485-1509), los Tudor promovieron la industria textil lanera, la de alta tecnología liderada por Flandes, con aranceles contra los productores de los Países Bajos y con la «caza ilegal» de artesanos flamencos (de ahí los apellidos Flanders, Fleming y Flemyng). Hacia el siglo XVIII los textiles laneros eran casi la mitad de los ingresos británicos por exportaciones, sin los cuales no habría podido importar alimentos y materias primas para la revolución industrial. En 1721 Robert Walpole lanzó un programa de desarrollo industrial con protección arancelaria y subvenciones a industrias «estratégicas». En la década de 1770 Gran Bretaña llevaba tanta delantera que Adam Smith no veía necesidad de proteccionismo, pero pasó casi un siglo hasta que adoptó el libre comercio, cuando su supremacía industrial era incuestionable: 20% de la producción industrial mundial (1860) y 46% del comercio mundial de manufacturas (1870) con solo el 2,5% de la población.\n\n**Estados Unidos como adalid del proteccionismo.** Bajo dominio británico su desarrollo industrial fue reprimido; William Pitt el Viejo habría dicho que no debía «permitírseles fabricar ni siquiera un clavo para herradura». Tras la independencia, Alexander Hamilton, secretario del Tesoro, sostuvo en su Report on the Subject of Manufactures (1791) que el gobierno de una nación atrasada debe proteger y alimentar a las industrias «desde la infancia» frente a competidores extranjeros superiores: el argumento de la industria naciente. Proponía aranceles, subvenciones, inversión pública en infraestructura, ley de patentes y desarrollo bancario. Los terratenientes esclavistas del Sur lo rechazaron, pero tras la guerra angloamericana (1812-1816) muchos aceptaron que un país fuerte necesita un sector manufacturero fuerte, imposible sin aranceles. Desde 1816 la política comercial se volvió cada vez más proteccionista: en los años 1830 Estados Unidos tenía los aranceles industriales medios más altos del mundo, estatus que mantuvo casi cien años, hasta la Segunda Guerra Mundial; en ese siglo los aranceles eran mucho más bajos en Alemania, Francia y Japón. El proteccionismo fue tema de conflicto entre el Norte industrial y el Sur agrario hasta la guerra civil (1861-1865), que ganó el Norte precisamente porque había desarrollado su industria detrás del proteccionismo.\n\n**El libre comercio se propaga… en su mayor parte a través de medios para nada libres.** El libre comercio no fue responsable del surgimiento del capitalismo, pero lo propagó en el siglo XIX: en el centro, con la adopción del libre comercio por Gran Bretaña y acuerdos bilaterales entre países europeos en la década de 1860; sobre todo en la periferia, Asia y América Latina, por la fuerza o su amenaza. La colonización fue la ruta obvia del «libre comercio no libre», pero también países no colonizados fueron forzados, mediante la «diplomacia de las cañoneras», a firmar tratados desiguales que los privaban de la autonomía arancelaria y solo les permitían una tasa baja y uniforme (3-5%), suficiente para recaudar pero no para proteger la industria naciente. El más infame es el Tratado de Nankín (1842), tras la guerra del Opio, pero empezaron con los países latinoamericanos tras su independencia y siguieron con el Imperio otomano, Persia, Siam y Japón. Los latinoamericanos expiraron en las décadas de 1870 y 1880; los asiáticos duraron hasta entrado el siglo XX. La incapacidad de proteger la industria naciente contribuyó al retroceso de Asia y América Latina, con crecimiento negativo de la renta per cápita (−0,1% y −0,4% anual).\n\n### 1870-1913: apogeo\n\n**El capitalismo se acelera aún más: el surgimiento de la producción en serie.** Entre 1860 y 1910 surgieron las industrias química y pesada: maquinaria eléctrica, motores de combustión interna, tinturas sintéticas, fertilizantes artificiales. A diferencia de las tecnologías de la revolución industrial, inventadas por hombres prácticos, estas se desarrollaron aplicando sistemáticamente principios científicos y de ingeniería, por lo que podían replicarse y mejorarse rápidamente. La producción en serie, con la cadena de montaje móvil y las partes intercambiables, redujo espectacularmente los costes y constituye la médula del sistema de producción actual.\n\n**Nuevas instituciones económicas surgen para regular la creciente escala de producción, el riesgo y la inestabilidad.** En su «apogeo» el capitalismo adquirió su forma institucional básica: sociedad anónima, banco central, Estado del bienestar, leyes laborales. La responsabilidad limitada se «generalizó» a cualquier firma que cumpliera condiciones mínimas, y la sociedad anónima se volvió el vehículo más poderoso del desarrollo capitalista (Marx la llamó «producción capitalista en su desarrollo más alto»). Las nuevas leyes de quiebras de la segunda mitad del XIX dieron a los empresarios una segunda oportunidad. Con empresas más grandes llegaron bancos más grandes, y los bancos centrales asumieron el papel de prestamistas de último recurso (el Banco de Inglaterra en 1844). Desde 1870, por la agitación socialista y las presiones reformistas, se promulgaron leyes laborales y asistenciales: seguros por accidente, de salud, pensiones de vejez, seguro de desempleo; se prohibió el trabajo de niños pequeños y se regularon las jornadas de los mayores y de las mujeres (esto último por el estereotipo de que las mujeres carecían de facultades mentales plenas). Estos cambios promovieron el crecimiento: la responsabilidad limitada y las leyes de quiebras redujeron el riesgo empresarial; la banca central y la legislación laboral y asistencial aumentaron la estabilidad económica y política, y con ella la inversión. La renta per cápita de Europa occidental pasó de crecer al 1% (1820-1870) al 1,3% (1870-1913).\n\n**La edad dorada «liberal» no fue tan liberal.** El «apogeo» suele describirse como la primera era de globalización, atribuida a políticas liberales: pocas restricciones al movimiento de bienes, capitales y personas, laissez faire interno, equilibrio presupuestario y patrón oro. Las cosas fueron más complejas.\n\n**Recuadro: «Liberal», ¿el término más confuso del mundo?** Las ideas del liberalismo se remontan al siglo XVII (Hobbes, Locke). Su significado clásico prioriza la libertad del individuo; en lo económico, el derecho a usar su propiedad como le plazca, y el gobierno ideal propicia solo condiciones mínimas como la ley y el orden: el Estado mínimo o minarquismo, con el lema «laissez faire». Hoy se lo equipara con la democracia, pero hasta mediados del siglo XX la mayoría de los liberales no eran demócratas: rechazaban la primacía de la tradición y la jerarquía, pero negaban el voto a las mujeres y a los pobres. Adam Smith admitió que el gobierno «es instituido en realidad para la defensa de los ricos contra los pobres». En Estados Unidos «liberal» designa a políticos de centroizquierda (en Europa serían socialdemócratas); en Europa, a quienes apoyan partidos como el FDP alemán (en Estados Unidos serían libertarios). El neoliberalismo, dominante desde los ochenta, es cercano al liberalismo clásico pero acepta un banco central que monopolice la emisión de moneda y no se opone abiertamente a la democracia, aunque muchos neoliberales sacrificarían la democracia en favor de la propiedad privada y el libre mercado. En los países en desarrollo se lo llama Consenso de Washington, por el Tesoro estadounidense, el FMI y el Banco Mundial.\n\nEl período 1870-1913 no fue de liberalismo universal. En el corazón del capitalismo, el proteccionismo aumentó. Estados Unidos se volvió más proteccionista tras la guerra civil; los países europeos no renovaron sus acuerdos de libre comercio y subieron aranceles, en parte para proteger la agricultura de las importaciones baratas del Nuevo Mundo y Europa oriental, y en parte para promover las nuevas industrias química y pesada; Alemania y Suecia son los mejores ejemplos de este «nuevo proteccionismo» («matrimonio entre el hierro y el centeno»). Al expirar los tratados desiguales, América Latina aplicó aranceles altos (30-40%). En el resto de la periferia el libre comercio forzoso se propagó: la «carrera por África», la colonización de Malasia, Singapur, Myanmar, Camboya, Vietnam y Laos, y la incorporación de Alemania, Bélgica, Estados Unidos y Japón a la aventura colonial; es la «era del imperialismo». En el frente interno aumentó la intervención gubernamental: aun con equilibrio presupuestario y patrón oro, crecieron las regulaciones laborales, la asistencia social y la inversión pública en infraestructura y educación. La edad dorada liberal fue cada vez menos liberal en el centro; la liberalización ocurrió en los países débiles, por obligación, y en la única región periférica de rápido crecimiento, América Latina, el proteccionismo aumentó tras la expiración de los tratados desiguales.\n\n### 1914-1945: la era de las turbulencias\n\n**El capitalismo trastabilla: la Primera Guerra Mundial y el final de la edad dorada liberal.** Hasta 1914, pese a las revueltas (1848, la Comuna de París) y a la Larga Depresión de 1873-1896, el capitalismo parecía destinado a crecer y expandirse. La Primera Guerra Mundial desacreditó la idea de que una red comercial cada vez más tupida haría improbables las guerras. No debería haber sorprendido: la globalización del «apogeo» fue impulsada sobre todo por el imperialismo, no por el mercado, y la rivalidad entre los principales países capitalistas podía desembocar en conflictos violentos. Algunos argumentaron que el capitalismo ya no podía sostenerse sin expansión continua hacia afuera, que tarde o temprano llegaría a su fin.\n\n**El capitalismo encuentra un rival: la Revolución rusa y el apogeo del socialismo.** Ese fue el punto de vista de Lenin en El imperialismo, fase superior del capitalismo. La Revolución bolchevique fue una conmoción aún mayor, porque creó un sistema que pretendía socavar todos los pilares del capitalismo. Se abolió la propiedad privada de los medios de producción; con la colectivización agraria de 1928, las tierras de los kulaks pasaron a granjas estatales (sovjós) y los pequeños agricultores fueron obligados a formar cooperativas (koljós). Los mercados fueron reemplazados por la planificación central con el Primer Plan Quinquenal (1928). En teoría los trabajadores no eran asalariados porque poseían los medios de producción, pero en la práctica eran indistinguibles de los asalariados capitalistas: escaso control sobre sus empresas y la misma relación jerárquica. Fue un gran experimento: ninguna economía había sido planificada centralmente, y muchos marxistas como Kautsky eran escépticos, porque según Marx el socialismo debía surgir en las economías capitalistas más desarrolladas, ya planificadas en alto grado por grandes empresas y cárteles, mientras la URSS era muy atrasada. Sin embargo, la temprana industrialización soviética fue un gran éxito, demostrado al repeler a los nazis en el Frente Oriental: la renta per cápita creció un 5% anual entre 1928 y 1938, cuando lo habitual era 1-2%. Se logró a costa de millones de muertes por represión y por la hambruna de 1932, cuya magnitud no se conoció entonces; muchos quedaron subyugados por el desarrollo soviético, sobre todo porque tras 1929 el capitalismo estaba de rodillas.\n\n**El capitalismo se deprime: la Gran Depresión de 1929.** Fue todavía más traumática, sobre todo en Estados Unidos, donde empezó con el crac de Wall Street y que fue el país más golpeado: entre 1929 y 1932 la producción cayó un 30% y el desempleo pasó del 3 al 24%; recién en 1937 recuperó el nivel de 1929. Alemania y Francia cayeron un 16% y un 15%. Una hipótesis influyente, propagada por los economistas neoliberales, sostiene que una crisis financiera manejable devino Gran Depresión por el colapso del comercio causado por la «guerra comercial» que desató el arancel Smoot-Hawley (1930). Esa versión no se sostiene: el arancel industrial medio pasó solo del 37 al 48%, no hubo una guerra arancelaria masiva salvo en países débiles como Italia y España, y los estudios muestran que la razón principal del colapso del comercio fue la espiral descendente de la demanda internacional, causada por la adhesión de los gobiernos centrales a la doctrina del equilibrio presupuestario.\n\nTras una gran crisis como el crac de 1929 o la crisis financiera de 2008, el gasto privado cae: las deudas quedan impagas, los bancos reducen préstamos, empresas y particulares recortan gastos, y eso reduce la demanda de quienes les venden; la demanda entra en una espiral descendente. El gobierno es el único actor que puede sostener la demanda gastando más de lo que ingresa, en déficit. Pero la fuerte creencia en el equilibrio presupuestario lo impidió: con la recaudación en caída, la única forma de equilibrar era recortar gastos, y nada contrarrestaba la espiral. Además, con el patrón oro los bancos centrales no podían aumentar el dinero en circulación por temor a comprometer el valor de la moneda; el crédito se volvió escaso y la demanda cayó aún más.\n\n**Comienza la reforma: Estados Unidos y Suecia muestran el camino.** La Gran Depresión trajo un rechazo generalizado del laissez faire y serios intentos de reformar el capitalismo. En Estados Unidos, donde la Depresión fue más profunda y larga, el «primer New Deal» (1933-1934) de Franklin D. Roosevelt separó la banca comercial de la de inversión (Ley Glass-Steagall de 1933), creó el seguro de depósitos, aumentó la regulación del mercado de valores, fortaleció el crédito agrícola, fijó precios mínimos agropecuarios y desarrolló infraestructuras (presa Hoover). El «segundo New Deal» (1935-1938) incluyó la Ley de Seguridad Social de 1935 (pensiones de vejez y seguro de desempleo) y la Ley Wagner, que fortaleció a los sindicatos. En Suecia, el descontento con políticas liberales que llevaron el desempleo al 25% dio el poder al Partido Socialdemócrata en 1932: se introdujo el impuesto a la renta (sorprendentemente tarde: Gran Bretaña en 1842, Estados Unidos en 1913) para expandir el Estado del bienestar (seguro de desempleo en 1934, mayores pensiones), y en 1938 sindicatos y patronal firmaron el Acuerdo de Saltsjöbaden, que instauró la paz industrial. Otros países no llegaron tan lejos, pero anticiparon la posguerra.\n\n**El capitalismo se tambalea: el crecimiento se ralentiza y el socialismo supera al capitalismo.** Las turbulencias culminaron con la Segunda Guerra Mundial, con decenas de millones de muertos (hasta 60 millones según las estimaciones más altas), primer revés para la aceleración del crecimiento desde comienzos del siglo XIX.\n\n### 1945-1973: la Edad Dorada del capitalismo\n\n**El capitalismo destaca en todos los frentes: crecimiento, empleo y estabilidad.** Entre el fin de la guerra y la primera crisis del petróleo se dio la tasa de crecimiento más alta de todos los tiempos: entre 1950 y 1973 la renta per cápita de Europa occidental creció al 4,1% anual, la de Estados Unidos al 2,5%, la de Alemania Occidental al 5% («Milagro del Rin») y la de Japón al 8,1%, iniciando la cadena de «milagros» asiáticos. El desempleo fue virtualmente eliminado en los países capitalistas avanzados. Las economías fueron notablemente estables: la producción fluctuaba mucho menos gracias a la política fiscal keynesiana (más gasto en épocas de vacas flacas, menos en auge), la inflación era relativamente baja y casi ningún país atravesó una crisis bancaria (desde 1975, entre el 5 y el 35% de los países las sufrió en algún momento). Harold Macmillan no exageraba al decir que «las cosas nunca habían ido tan bien». Qué subyace a ese desempeño es objeto de debate permanente.\n\n**Factores subyacentes a la Edad Dorada.** Algunos señalan un conjunto inusualmente vasto de nuevas tecnologías desarrolladas en la guerra con fines militares que pasaron a usos civiles (computadores, electrónica, radares, caucho sintético, microondas), explotadas en la reconstrucción y para satisfacer la renovada demanda de consumo. También hubo cambios en el sistema económico internacional. En Bretton Woods (1944) se crearon el FMI, para proporcionar fondos de corto plazo a países con crisis de balanza de pagos (cuando un país paga a otros mucho más de lo que obtiene, hasta que nadie quiere prestarle, con pánico financiero y recesión), y el Banco Mundial (BIRD), para «préstamos para proyectos» con vencimientos más largos o intereses más bajos que la banca privada. La tercera pata fue el GATT (1947), que entre 1947 y 1967 organizó seis «rondas» de reducciones arancelarias sobre todo entre países ricos; al darse entre países de desarrollo similar, ampliaron mercados y estimularon la productividad por la mayor competencia. En Europa, la CECA (1951) de seis países culminó en la Comunidad Económica Europea tras el Tratado de Roma (1957); en 1973 se sumaron Reino Unido, Irlanda y Dinamarca. Al traer paz e integrar mercados, contribuyó al desarrollo.\n\nLa explicación más influyente atribuye la Edad Dorada a reformas en políticas e instituciones que dieron origen a la economía mixta, que mezcla rasgos positivos del capitalismo y del socialismo. Tras la Gran Depresión se aceptaron los límites del laissez faire y el papel activo del Estado ante los fallos de mercado; el éxito de la planificación en la guerra redujo el escepticismo; los triunfos de la izquierda europea, por su papel contra el fascismo, expandieron el Estado del bienestar y los derechos laborales. Estos cambios contribuyeron creando paz social, estimulando la inversión, aumentando la movilidad social y promoviendo la innovación.\n\n**Capitalismo híbrido: políticas e instituciones en pro de los trabajadores.** Muchos países europeos nacionalizaron o crearon empresas públicas en sectores clave (siderurgia, ferrocarriles, banca, energía), reflejando la creencia socialdemócrata en el control público de los medios de producción (la Cláusula IV del laborismo británico, abolida en 1995 por Blair). Se cree que en Francia, Finlandia, Noruega y Austria las empresas públicas generaron crecimiento invirtiendo en industrias de alta tecnología que el sector privado consideraba demasiado arriesgadas. Las medidas asistenciales se fortalecieron con la nacionalización de servicios básicos (el Servicio Nacional de Salud británico), financiadas con grandes aumentos de impuestos; aumentaron la movilidad social y la legitimidad del capitalismo, y la paz social estimuló inversiones de largo plazo.\n\n**Capitalismo gestionado: los gobiernos regulan y configuran los mercados de muchas y diversas maneras.** Los gobiernos aplicaron deliberadamente políticas macroeconómicas contracíclicas o «keynesianas»: más gasto y más dinero en recesión, menos en recuperación. Fortalecieron las regulaciones financieras; pocos llegaron a separar la banca como Estados Unidos, pero todos restringieron a bancos e inversores (los banqueros eran respetables pero aburridos). Muchos aplicaron políticas industriales selectivas para industrias «estratégicas» con protección y subvenciones. Estados Unidos no tenía política industrial oficial, pero financió masivamente la investigación en computadores (Pentágono), semiconductores (marina), aviones (fuerza aérea), internet (DARPA) y ciencias farmacéuticas y biológicas (Institutos Nacionales de Salud). Japón, Francia y Corea del Sur coordinaron sectores mediante planes quinquenales: la planificación indicativa, distinta de la planificación central «directiva» soviética.\n\n**Nuevos albores: los países en desarrollo finalmente se proponen el desarrollo económico.** Hubo una amplia descolonización: Corea (1945), India y Pakistán (1947), Kenia primero en el África subsahariana (1957), la mitad de esos países en la primera mitad de los sesenta, y otros más tarde (Angola y Mozambique 1975, Namibia 1990). La mayoría de las naciones poscoloniales rechazó el libre mercado y el libre comercio impuestos durante el colonialismo. Algunas se volvieron socialistas (China, Corea del Norte, Vietnam del Norte, Cuba); la mayoría siguió siendo capitalista con industrialización liderada por el Estado: la industrialización por sustitución de importaciones (ISI), que sustituye manufacturas importadas por propias protegiendo a los productores nacionales (protección de la industria naciente) o regulando a las compañías extranjeras, con subvenciones y empresas públicas en sectores de alto riesgo. Evaluada en 1960-1980, la renta per cápita de los países en desarrollo creció 3% anual, a la par de los avanzados (3,2%). Corea del Sur, Taiwán, Singapur y Hong Kong crecieron entre 7 y 8%, las mayores tasas de la historia (con Japón antes y China después). Incluso el África subsahariana, la región más lenta, creció 1,6% anual (América Latina 3,1%, Sudeste Asiático 5,3%), tasa nada desdeñable si se recuerda que en la revolución industrial Europa occidental crecía al 1%.\n\n**El camino del medio: el capitalismo funciona mejor con intervenciones adecuadas del gobierno.** En la Edad Dorada la intervención gubernamental aumentó en casi todos los ámbitos, salvo el comercio internacional entre países ricos, y los resultados fueron mucho mejores que antes; no han mejorado desde los ochenta, cuando la intervención se redujo. El potencial del capitalismo se maximiza cuando es regulado y estimulado adecuadamente por el gobierno.\n\n### 1973-1979: el interregno\n\nLa Edad Dorada perdió fuelle con la suspensión de la convertibilidad dólar-oro en 1971. Bretton Woods había abandonado el viejo patrón oro por su rigidez, pero seguía anclado en el oro porque el dólar, con tipos fijos frente a las demás monedas, era convertible a 35 dólares la onza, bajo el supuesto de que era «tan bueno como el oro» (Estados Unidos generaba cerca de la mitad de la producción mundial y había escasez de dólares). Con la reconstrucción y el desarrollo de otras economías el supuesto perdió validez: la gente convertía dólares en oro, las reservas caían y el dólar parecía menos fiable; los pasivos oficiales estadounidenses pasaron de la mitad de sus reservas de oro (hasta 1959) a una vez y media (1967). En 1971 Estados Unidos abandonó la convertibilidad, otros países dejaron de atar sus monedas al dólar y las monedas pasaron a fluctuar, supeditadas a la especulación.\n\nEl fin llegó con la primera crisis del petróleo (1973), cuando los precios se cuadruplicaron por la OPEP; la inflación, que venía subiendo desde fines de los sesenta, se disparó. Vino la estanflación: ruptura de la regularidad según la cual los precios caen en la recesión y suben en el auge; había recesión con precios subiendo 10, 15 o 25% anual. La segunda crisis del petróleo (1979) puso fin a la Edad Dorada y propició gobiernos neoliberales, sobre todo en Gran Bretaña y Estados Unidos. Los economistas del libre mercado describen este período como un desastre absoluto, pero no lo fue: el crecimiento per cápita de 1973-1980 (2%) fue más alto que en cualquier período desde la Segunda Guerra salvo la Edad Dorada y ligeramente más alto que el de las tres décadas neoliberales siguientes (1,8% en 1980-2010); el desempleo (4,1%) fue más alto que en la Edad Dorada (3%), pero no tanto. Aun así, la insatisfacción generalizada provocó cambios radicales.\n\n### Desde 1980 hasta hoy: ascenso y caída del neoliberalismo\n\n**La Dama de Hierro: Margaret Thatcher y el fin del compromiso británico de posguerra.** Elegida en 1979, rechazó el compromiso «blando» de los tories con los laboristas e inició el desmantelamiento radical de la economía mixta. Rebajó el impuesto a la renta a los más adinerados, redujo el gasto (educación, vivienda, transporte), disminuyó el poder de los sindicatos y abolió el control del capital. La medida más simbólica fue la privatización: gas, agua, electricidad, acero, la aerolínea estatal, automóviles y parte de la vivienda pública. Se subieron los tipos de interés para reducir la inflación; atrajeron capital extranjero, elevaron la libra y dejaron fuera de competencia a las exportaciones. Resultó una enorme recesión entre 1979 y 1983, con 3,3 millones de desempleados bajo un gobierno que había llegado criticando el millón de parados del laborismo («Laborismo no es trabajo»). Buena parte de la industria manufacturera fue destruida y quedaron devastados centros industriales (Manchester, Liverpool, Sheffield) y zonas mineras.\n\n**El actor: Ronald Reagan y la reconfiguración de la economía estadounidense.** Desde 1981 su administración rebajó agresivamente los tramos más altos del impuesto a la renta, con el argumento de que los ricos invertirían más, crearían riqueza, gastarían más y generarían empleo e ingresos para el resto: la teoría de la filtración descendente. Al mismo tiempo recortó subsidios a los pobres y congeló el salario mínimo para incentivarlos a trabajar más. La lógica es curiosa (¿por qué enriquecer a los ricos y empobrecer a los pobres con el mismo propósito?), pero esta economía de la oferta se volvió el postulado fundacional de las siguientes tres décadas. Los tipos de interés pasaron de cerca del 10 a más del 20% entre 1979 y 1981; buena parte de la industria, que ya perdía terreno frente a Japón, no lo soportó, y el Medio Oeste se volvió el «Cinturón
