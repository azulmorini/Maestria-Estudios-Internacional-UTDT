íses en desarrollo**: el bloque que más se presenta como vocero del sur vota menos unificado que el conjunto difuso de países en desarrollo, porque un bloque formal introduce intereses geopolíticos propios y contrapuestos.\n\n**Ucrania** es el experimento natural mejor documentado: agresión militar directa, sin ambigüedad legal. La resolución del **2 de marzo de 2022 (A/RES/ES‑11/1)**, que exigió la retirada rusa, obtuvo **141 votos a favor, 5 en contra y 35 abstenciones**. Entre los 54 africanos, 28 a favor, 17 abstenciones, 8 ausentes y solo Eritrea en contra. En Asia, India, Pakistán, Bangladés y Sri Lanka se abstuvieron, mientras la mayoría de la ASEAN votó a favor.\n\n¿Qué explica la heterogeneidad? No la pertenencia al sur global. **Farzanegan y Gholipour (2023)** muestran econométricamente que votar a favor de Rusia se asoció a **acuerdos de defensa con Moscú**, una historia más larga de **gobiernos de izquierda**, ser **receptor de ayuda rusa** y no haber tenido **guerras con la URSS**. **Tawat (2025)**, sobre el **G77** en las seis primeras resoluciones de emergencia, concluye que el **tipo de régimen político**, liberal o iliberal, predice mejor el voto que la identidad sureña: las democracias electorales del sur apoyaron la primera resolución en un **86,21 % (50 de 58)**, casi igual que las del norte, mientras los regímenes no democráticos fueron sistemáticamente más reticentes. Si lo que mejor predice el comportamiento es el régimen y los vínculos bilaterales de dependencia, la categoría **carece de poder explicativo autónomo**: en el mejor de los casos es una **correlación espuria** que se desvanece con los controles adecuados.\n\nEn América Latina, **Fortín, Heine, Ominami y Somavía (2025)** plantean el **«no alineamiento activo»** tratando a «los países de América Latina y del resto del sur global» como si compartieran la misma presión y el mismo remedio: un sujeto colectivo que la evidencia no sostiene. La abstención latinoamericana sobre Ucrania que citan responde a una **atomización de cálculos bilaterales**, no a una doctrina compartida.\n\n### 4. 2026: Irán, prueba de fuego del sur global ampliado\n\nLa guerra iniciada el 28 de febrero de 2026 es un experimento más esclarecedor: a diferencia de Rusia, que no integra ningún bloque sureño ni se autodefine como sur global, **Irán es miembro pleno del BRICS ampliado**, lo que pone a prueba la cohesión dentro de la propia membresía. (Al tratarse de un proceso en curso, este apartado es ilustrativo y no tiene el mismo estatuto evidencial que el resto.)\n\nEl resultado fue la **fractura**. A diferencia de 2025, no hubo posición común. **India**, en la presidencia rotativa, optó por una **ambigüedad calculada** para preservar sus vínculos con Estados Unidos, con Israel y con el bloque, con críticas de su oposición interna. **Brasil, Rusia y China** condenaron con más firmeza. **Emiratos**, miembro pleno, sufrió daños por misiles de **Irán**, otro miembro pleno, y **Arabia Saudita**, asociado, advirtió que se reservaba represalias. No es una divergencia de matices: dos miembros intercambiaron o amenazaron con intercambiar fuego, y un tercero de mayor peso no condenó a los atacantes occidentales por temor a dañar sus vínculos. Si el sur global fuera una comunidad de intereses frente al norte, esta era la crisis donde debía manifestarse; ocurrió lo contrario. La cohesión es, en el mejor de los casos, **una aspiración retórica que se disuelve cuando más se la necesitaría**.\n\n### 5. Autonomía y sur global: una filiación espuria\n\nNo se trata de sustituir una etiqueta débil por otra más prestigiosa, sino de examinar un fenómeno del debate latinoamericano, y argentino en particular, desde comienzos de los 2010: presentar el «sur global» como **continuación natural de la escuela de la autonomía** de Puig y Jaguaribe (décadas de 1960 a 1980). Esa **filiación es espuria**: el sur global carece del rasgo que distingue a la autonomía, la **ausencia de todo presupuesto de solidaridad o identidad colectiva** entre Estados periféricos.\n\nA diferencia del **estructuralismo cepalino** y la **teoría de la dependencia**, que explicaban el comportamiento periférico por su posición en una estructura económica jerárquica, la autonomía se centró en la **capacidad de decisión de cada Estado** dentro de los márgenes que el sistema permite (Briceño Ruiz y Simonoff, 2017; Simonoff y Lorenzini, 2019). **Puig (1980)** la definió como «la máxima capacidad de decisión propia que se puede tener, teniendo en cuenta los condicionamientos objetivos» del sistema: no presupone identidad compartida, sino la relación bilateral de cada Estado con la potencia hegemónica de su entorno. **Jaguaribe (1979)** distinguió la **«autonomía periférica»**, disponible para Estados de mediano desarrollo como los latinoamericanos, de la **«autonomía céntrica»** de las grandes potencias: una gradación de opciones que el sur global no permite distinguir, porque agrupa a Estados en posiciones radicalmente distintas.\n\nPara la autonomía, la **integración periférica no era un fin solidario sino un instrumento** de la autonomía individual: aumentaría los costos de una intervención hegemónica, funcionando como **«reaseguro»** (Simonoff y Lorenzini, 2019). Cada Estado tiene intereses objetivos diferenciados, y la cooperación solo tiene sentido si les sirve (Lorenzini y Pereyra Doval, 2013). No hay presunción de solidaridad antiimperialista: cada Estado actúa según su cálculo de costos y beneficios. Esa diferencia es la que el uso corriente del término borra.\n\n¿Por qué se fusionaron? Briceño Ruiz y Simonoff (2017) advertían que la autonomía fue una contribución genuinamente original de América Latina, no reductible a corrientes que sí «viajaron» como el cepalismo y la dependencia; esa originalidad se diluye al leerla en clave de sur global. Una **primera explicación**, hermenéutica: una lectura selectiva de Puig y Jaguaribe retiene su vocabulario crítico del poder hegemónico sin retener su punto de partida **estadocéntrico e individualista**, y desliza ese vocabulario hacia el de la solidaridad sur‑sur. Una **segunda**, que no puede demostrarse de manera concluyente: ciertos sectores académicos y de política exterior habrían tenido **incentivos institucionales** para presentar posiciones específicas bajo el paraguas de una tradición rigurosa antes que bajo el del sur global, más fácil de impugnar; la autonomía ofrece una cobertura más sólida y más rentable en prestigio, financiamiento y legitimación. La fusión sería entonces una **estrategia retórica** para capturar la legitimidad de una escuela rigurosa.\n\nSea cual sea la explicación, y ambas pueden operar a la vez, la confusión tiene un **costo analítico**: el sur global hereda sin ganarlo el prestigio de la autonomía, y la autonomía carga sin merecerlo con las inconsistencias del sur global. Distinguirlas es condición para evaluar cuál ofrece una base más sólida. Esa base es la autonomía, que explica mejor el patrón documentado: el rechazo argentino a los BRICS, la heterogeneidad frente a Ucrania y la fractura ante la crisis de 2026. En cada caso decidió un **cálculo específico de costos y beneficios** según los vínculos bilaterales de cada Estado. La autonomía no necesita que la solidaridad exista: solo que cada Estado actúe racionalmente según sus márgenes de maniobra.\n\n### Conclusión: hacia una agenda de investigación\n\n¿Fue el sur global una etiqueta construida sobre un rechazo táctico compartido a Estados Unidos más que sobre una base material? La respuesta es **matizada pero en general afirmativa**, con una calificación importante.\n\nEn la **dimensión genealógica** se confirma con solidez (Prashad, 2007; Haug et al., 2021): «tercer mundo» y «sur global» fueron proyectos políticos definidos **por oposición**, primero a las dos superpotencias y luego, de manera casi exclusiva, al orden unipolar estadounidense tras 1991, no descripciones de una estructura compartida.\n\nEn la **dimensión contemporánea**, los datos sugieren una conclusión **más radical**: el comercio (concentrado en Asia y con centralidad persistente de Estados Unidos), los votos en la Asamblea (mejor explicados por régimen político y vínculos bilaterales) y la fractura del BRICS ampliado en 2026 muestran que **ni siquiera existe ya, de manera generalizada, ese rechazo táctico compartido**. Hay cálculos estrictamente bilaterales y nacionales que pueden alinear a cada Estado con Washington, con Pekín, con Moscú o con ninguno. El «sur global» es, las más de las veces, **una etiqueta retórica que convive con comportamientos plenamente atomizados**.\n\nImplicancias para la **política exterior argentina** y latinoamericana: si la pertenencia discursiva al sur global no aporta ventaja estructural verificable, ni comercial ni de respaldo en crisis, el criterio no puede ser la identidad retórica sino el **cálculo específico de autonomía** de Puig y Jaguaribe: qué margen de maniobra ofrece cada vínculo y a qué costo. La decisión argentina de **no integrar el BRICS ampliado** puede leerse como una aplicación, consciente o no, de esa lógica: pertenecer a un bloque con intereses contrapuestos no necesariamente amplía los márgenes y puede comprometerlos.\n\n**Agenda pendiente:** un relevamiento sistemático de la IED sur‑sur con datos posteriores a 2010, y extender el análisis de cohesión de voto a todas las resoluciones sobre la guerra de Irán de 2026 cuando el episodio concluya. Mientras tanto, la evidencia va en una dirección: **el mundo no se organiza en torno a un eje norte‑sur**, sino a **múltiples clivajes cruzados** (geopolíticos, económicos, tecnológicos y de régimen político), en los que la pertenencia retórica al sur define cada vez menos y el **interés nacional específico** cada vez más.", "titulo": "Turzi (2026). ¿El fin del sur global? Una etiqueta política puesta a prueba por los datos"}], "textos": {"1": {"ejercicios": [], "leido": false, "resumen": "## Gobernanza, orden y cambio en la política mundial\n\n*James N. Rosenau, capítulo introductorio de Rosenau y Czempiel (eds.), Governance without Government: Order and Change in World Politics, Cambridge University Press, 1992.* **(El original está en inglés; el resumen está en castellano y conserva entre paréntesis los términos clave.)**\n\nEn un tiempo en que los **hegemones declinan**, las fronteras desaparecen, las plazas se llenan de ciudadanos que desafían a las autoridades y las alianzas militares pierden viabilidad, las perspectivas de **orden y gobernanza global** se vuelven un asunto trascendente. Cuanto más amplia e intensa la transformación, más urgentes las preguntas. El cambio implica el desgaste de los patrones establecidos, la disminución del orden y el debilitamiento de la gobernanza, hasta que nuevos patrones se forman y se incorporan a las rutinas. La historia está en un punto de inflexión: las oportunidades de cooperación pacífica, derechos humanos y mejores niveles de vida son tan visibles como las de conflictos grupales, deterioro social y ambiental.\n\nEl objetivo del proyecto colectivo es aprovechar este tiempo de cambio para **clarificar la naturaleza del orden global** y los procesos por los que la gobernanza opera a escala mundial, sin anticipar sus formas específicas tras la Guerra Fría o la guerra del Golfo. Preguntas: ¿qué es la gobernanza a escala global? ¿Cómo opera **sin gobierno**? Si la gobernanza es un sistema de reglas no sostenido por un gobierno organizado, ¿quién hace y aplica las reglas? ¿Depende el orden de la gobernanza? ¿Cómo se sostiene durante cambios rápidos? ¿Cómo se distingue el orden de la estabilidad y de los intereses y condiciones materiales en que descansa?\n\nLa literatura de RR.II. atendió estas cuestiones (Bull, *The Anarchical Society*; Miller, *Global Order*), pero no impulsada por un mundo en cambio fundamental; la ventaja aquí es la **perplejidad** que generan los hechos recientes. Los autores se reunieron cinco veces en cuatro años y encontraron las respuestas esquivas; mantienen matices en el uso de **orden, gobernanza, instituciones y poliarquía**, pero comparten los problemas: en un mundo donde la **autoridad se reubica continuamente**, hacia afuera (entidades supranacionales) y hacia adentro (grupos subnacionales), es cada vez más necesario indagar cómo puede haber **gobernanza en ausencia de gobierno**.\n\n### Gobernanza y orden\n\nPresumir gobernanza sin gobierno es concebir **funciones** que todo sistema humano debe cumplir, tenga o no organizaciones encargadas de ellas: enfrentar desafíos externos, evitar que los conflictos internos lo desgarren, procurar recursos para su preservación y fijar metas y políticas. Son necesidades permanentes para que un sistema persista. En los gobiernos son evidentes: constituciones adentro, tratados afuera. Pero en el período actual, constituciones y tratados han sido **socavados** por las demandas y mayor coherencia de subgrupos étnicos, la **globalización de las economías**, los movimientos sociales, el achicamiento de las distancias por la **microelectrónica** y las interdependencias de crisis monetarias, contaminación, terrorismo, narcotráfico, sida y otros asuntos transnacionales. Estas dinámicas **centralizadoras y descentralizadoras** desplazaron los **locus de autoridad**: los gobiernos siguen siendo soberanos en varios sentidos, pero parte de las funciones de gobernanza la cumplen actividades que no se originan en ellos.\n\n¿Es la gobernanza sinónimo de instituciones y regímenes internacionales? ¿Puede ser eficaz sin autoridad central? No es ocasión para una disquisición sobre gobierno y gobernanza, solo para señalar significados posibles.\n\n**Gobernanza no es gobierno.** Ambos refieren a comportamiento intencional, orientado a metas, a **sistemas de reglas**; pero el **gobierno** supone actividades respaldadas por **autoridad formal** y poder de policía, mientras que la **gobernanza** refiere a actividades respaldadas por **metas compartidas** que pueden o no derivar de responsabilidades legales y no dependen necesariamente del poder de policía. Es un fenómeno **más abarcador**: incluye las instituciones gubernamentales y también **mecanismos informales, no gubernamentales**. Es un sistema de reglas que depende tanto de **significados intersubjetivos** como de constituciones formales: **funciona solo si lo acepta la mayoría** (o al menos los más poderosos), mientras que los gobiernos pueden funcionar frente a amplia oposición. Por eso la gobernanza es **siempre eficaz**, de lo contrario no se la concibe existente (se habla de anarquía o caos); los gobiernos pueden ser ineficaces sin dejar de existir (son «débiles»). Puede haber, entonces, **gobernanza sin gobierno**, y también **gobierno sin gobernanza**: países divididos y paralizados cuyas autoridades formales carecen de mecanismos reguladores eficaces. Incluso podría argumentarse que la gobernanza sin gobierno es a veces preferible: «la gobernanza ha sido usurpada por los gobiernos» (Kothari).\n\nQue la gobernanza sea siempre eficaz la liga estrechamente al orden: **la gobernanza es orden más intencionalidad**. El **orden global** son los **arreglos rutinizados** por los que la política mundial pasa de un momento al siguiente. Algunos son **fundamentales** (dispersión del poder entre actores clave, jerarquías, reglas de interacción, premisas sobre fuerza, diplomacia, cooperación y conflicto) y otros muy **rutinarios** (comercio, correos, pasaportes). No todos son fruto de esfuerzos conscientes: algunos resultan de la **agregación de decisiones individuales** que sirven a intereses inmediatos pero se acumulan en un orden sistémico. El **mercado** fija precios así; los miembros de **Amnistía Internacional** trabajan casos concretos y su suma preserva un mínimo de derechos humanos; la **huida de alemanes orientales en 1989** deshizo, familia por familia, el consenso de la Guerra Fría que prohibía cruzar la frontera e inició un nuevo sistema. Otros arreglos son **deliberados**: reglas y funcionarios que vigilan los mercados, el comité ejecutivo de Amnistía, las leyes y policías de Alemania Oriental, o las autoridades de Alemania Occidental y Hungría que alentaron un nuevo orden. En esas dimensiones intencionales los lazos entre orden y gobernanza son más visibles.\n\nLa distinción no es evidente: en algunas lenguas, como el alemán, no hay una palabra para «gobernanza», porque un sistema de reglas intersubjetivo sin respaldo legal es improbable en esas culturas. Aun en inglés tiene matices diversos pero compatibles: **funcional** (tareas para sostener los arreglos, cumplidas o no por gobiernos); **capacidad de regular** los arreglos; **poder ejercido independientemente** de la autoridad gubernamental; modo de **asignar valores**, mientras el gobierno opera los mecanismos; o surgimiento de **sistemas de reglas** y de resolución de problemas.\n\nEn lo que todos los capítulos coinciden: estudiar gobernanza sin gobierno no excluye a los gobiernos nacionales o subnacionales, pero presume **la ausencia de una autoridad gubernamental suprema en el nivel internacional**. Es especialmente apto para la política mundial, donde la autoridad central está ausente pero suele haber un mínimo de orden. La tarea es indagar en qué medida las funciones de gobernanza se cumplen sin instituciones de gobierno. Muchos usan **«anarquía»** como término descriptivo de esa ausencia, sin connotación buena o mala ni desorden generalizado. Para otros implica falta de reglas pautadas; esto es muy cuestionable: con tantos tratados, precedentes y organizaciones, «el sistema internacional está varios pasos más allá de la anarquía» (North).\n\n**En suma**, gobernanza y orden son **interactivos**: la gobernanza moldea el orden, pero no podría hacerlo si los patrones del orden no la facilitaran. El orden es **precondición y consecuencia** del gobierno; ninguno es primero. No hay gobernanza sin orden ni orden sin gobernanza (salvo que los períodos de desorden se consideren formas de orden).\n\n### Gobernanza, regímenes e instituciones\n\n¿Es distinto de los **regímenes internacionales**, hoy en boga? Como la gobernanza, los regímenes son arreglos, «conjuntos de principios, normas, reglas y procedimientos de toma de decisiones, implícitos o explícitos, en torno a los cuales convergen las expectativas de los actores» (Krasner), que regulan actividades transfronterizas, incluyen actores gubernamentales y no gubernamentales y operan sin autoridad central: son formas de gobernanza sin gobierno. ¿Son entonces equivalentes? **No.** La definición agrega que convergen «en un área dada de las relaciones internacionales», un **área temática** (*issue‑area*). La gobernanza de un orden global **no se limita a una esfera**: refiere a los arreglos en los **intersticios entre regímenes** y a los que entran en juego cuando dos o más regímenes **se superponen o entran en conflicto**. En la Guerra Fría, la gobernanza dio prioridad al régimen de control de armas sobre la libre circulación de personas: las negociaciones soviético‑estadounidenses de armas, a diferencia de las comerciales, nunca se interrumpieron por la emigración de judíos de la URSS. Según Oran Young, los **órdenes internacionales** son marcos amplios que rigen a casi todos los miembros en muchos temas, mientras los **regímenes** son arreglos especializados (caza de ballenas, osos polares, espectro electromagnético, Antártida). Young trata órdenes y regímenes como subcategorías de las **instituciones**, pero esa capa parece opcional: «instituciones» connota principios y reglas con autoridad, y corre el riesgo de ocultar las dimensiones **informales, no autoritativas**, esenciales para el funcionamiento de órdenes y regímenes.\n\n### Orden analítico versus orden normativo\n\nLas transformaciones aclaran la distinción entre **orden como concepto analítico** y **orden como precepto normativo**. El cambio genera incertidumbre, temor a perder la estabilidad previa y a instituciones menos satisfactorias, y con ello se intensifican las preocupaciones normativas. Pero hay una gran diferencia entre **rastrear empíricamente** los arreglos y sus consecuencias y **juzgar** sus pros y contras. La línea es oscura y variable, pero importante: no advertirla es arriesgarse a nublar el análisis con resultados preferidos o a confundir preferencias con recomendaciones empíricamente erradas. Ninguna sensibilidad evita toda confusión, porque observar es en parte normativo, pero puede minimizarse vigilando la tendencia a que el deseo sea padre del pensamiento. (Algunos consideran que el World Order Models Project cruzó esa línea, envolviendo valores en un contexto racionalista que sugiere objetividad.)\n\n¿Es una situación de alto desorden una forma de orden? Si el **orden empírico** son los arreglos por los que los asuntos globales avanzan en el tiempo, muchas formas califican: órdenes **hegemónicos**, **equilibrios de poder** con alianzas, **rivalidades bipolares** y períodos de **poliarquía**; Bull identificó ocho formas futuras posibles. Todo orden se ubica en un **continuo** entre cooperación y cohesión en un extremo y conflicto y desorden en el otro: el siglo XX, con sus guerras calientes y frías, es tanto un orden como la paz del **Concierto Europeo**. Cualquier momento histórico es un orden, por indeseable que sea. Muchos analistas se incomodan: asocian orden con estabilidad y coherencia mínimas y ven las épocas de guerra y explotación como «caos» o «entropía»; para ellos el orden tiene **connotación normativa positiva**, aunque admitan que demasiada estabilidad puede ser estancamiento. La distinción aparece también en las cuestiones de **política**: quien recomienda pasa al terreno de las normas; ocuparse de los **derechos humanos** es involucrarse en problemas de orden normativo.\n\n### Capas del orden empírico\n\nAunque las dimensiones normativas son inevitables, es posible separar las empíricas, o al menos suspender el juicio con más éxito. Cuanto más arraigadas en estimaciones empíricas, más incisivas y eficaces serán las recomendaciones: los objetivos de política deben estar mínimamente en contacto con las circunstancias en que se implementan.\n\nSeparar lo empírico de lo normativo es solo el primer paso; luego hay que **delinear órdenes en varios niveles**. No hay un conjunto coherente de arreglos: los patrones recurren en **sitios diversos, a ritmos distintos y en formas variadas**, y se moldean mutuamente formando un **todo orgánico** que enfrenta desafíos, gestiona el cambio y perdura hasta que sus fundamentos dejan de ser consistentes con las necesidades, deseos, capacidades y prácticas de la gente. El **orden global** («política mundial») abarca más diversidad que cualquier orden internacional: toda región, país, relación, movimiento social y organización privada con actividades transfronterizas, aunque sus propósitos sean limitados; incluso la estrechez de su alcance es parte de los arreglos.\n\nUn rasgo central es el **grado de conexión o desconexión** entre actores. En siglos anteriores, el transporte y las comunicaciones aislaban componentes y el orden era muy **descentralizado**; Europa dominaba, pero su dominio se volvió global recién a mediados del XIX. Con la tecnología, el orden se fue **centralizando**. Hoy, con tecnologías más dinámicas, problemas del Tercer Mundo más visibles y economías más globalizadas, hay más conexión que nunca, aunque persisten actividades desconectadas y locales: el orden actual incluye un **orden islámico** y uno **occidental** en una relación incómoda y distante. El orden global es un único conjunto de arreglos aunque no esté causalmente ligado en patrones coherentes; es orgánico solo porque todos sus actores reclaman los **mismos recursos terrestres** y enfrentan las mismas condiciones ambientales.\n\nLos patrones operan en **tres niveles**:\n\n1. **Ideacional o intersubjetivo:** lo que la gente percibe o entiende sobre cómo se manejan sus asuntos: marcos mentales, sistemas de creencias, valores compartidos. Se manifiesta en discursos, editoriales y libros; salvo en períodos transformadores, esos temas son compartidos por aliados y adversarios, formando un **consenso intersubjetivo**. Desde aquí, la **Guerra Fría** no fue más que un conjunto de supuestos aceptados globalmente sobre una competencia hostil e ideológica entre Estados Unidos y la URSS.\n2. **Conductual u objetivo:** lo que los actores **hacen regularmente**, a menudo sin saberlo, para sostener esos entendimientos: amenazar, negociar, armarse, ceder. En la Guerra Fría, las exigencias de las superpotencias a sus aliados fueron parte del orden (y la resistencia creciente a ellas, señal de su desintegración).\n3. **Agregado o político:** donde ocurre la gobernanza y **instituciones y regímenes** aplican las políticas de los otros dos niveles: Bretton Woods, el COMECON, la ONU.\n\nEl grado de orden es producto de los **tres niveles**. Sin la premisa compartida de competencia agresiva, la Guerra Fría no habría durado cuatro décadas; tampoco sin las conductas regulares que la expresaban ni sin la **OTAN**, el **Pacto de Varsovia** y otras instituciones (el **Telón de Acero**, símbolo de las fronteras del orden). Cuando los hechos socavaron premisas y patrones en los tres niveles, la Guerra Fría se deshizo rápidamente, cada nivel reforzando el cambio en los otros: la percepción en Europa del Este de que los soviéticos no podían controlarla, las nuevas conductas de reunirse en las plazas y sobre el **Muro de Berlín**, y las iniciativas de las grandes potencias que reemplazaron la competencia rígida por una búsqueda menos estructurada de nuevas relaciones de poder.\n\nSe puede objetar que esta formulación no distingue **fuentes, prácticas y resultados**: ¿el orden de la Guerra Fría era la carrera armamentista, la disuasión, el espionaje y la competencia en el Tercer Mundo, o sus consecuencias (crisis de los misiles, cumbres estancadas, fronteras cerradas), o las estructuras profundas de sospecha y hostilidad? Como las tres dimensiones son **interactivas**, cada una es **fuente, actividad y resultado** respecto de las otras: cada una es **necesaria pero no suficiente**. Solo quien narra la evolución necesita secuencias causales; para el análisis basta su interacción, y su prioridad temporal es un problema del **huevo y la gallina**. Eso no minimiza la fuerza causal: la **inercia** y los **costos de transacción** sostienen un orden mucho después de que cambian sus condiciones materiales, pero cuando el cambio altera las bases ideacionales, las dimensiones conductual e institucional se debilitan y se quiebran; y si se imponen nuevas bases conductuales e institucionales, las ideas tienden a alinearse. La política mundial tiende a **ajustar creencias a conductas y viceversa**. En la Guerra Fría, la carrera armamentista facilitó alianzas y cumbres, que presionaron por consensos, que influyeron en la carrera y estimularon el control de armas. Un orden global es **indivisible**: idea y práctica, estímulo y resultado, premisa e institución; es lo que hace **reconocible** un período histórico. Cualquier dimensión puede ser **punto de entrada**, pero pronto lleva a las demás.\n\nEsto plantea un **problema metodológico**: desafía las hipótesis que vinculan **variables independientes y dependientes**, porque presumen una prioridad temporal que no se sostiene en perspectivas largas, donde la variable dependiente realimenta a la independiente. Tres soluciones: 1) limitarse a **hipótesis de corto plazo y lineales**, dejando la retroalimentación para hipótesis posteriores; 2) enfocarse en **casos difíciles** (*hard cases*): si las expectativas sobreviven a la situación más compleja, los casos más claros también estarán explicados; 3) abandonar la designación de variables y **estimar sin descanso** cómo un cambio en una dinámica afecta a las otras dos y se realimenta. Este último es engorroso y propenso a error por la causalidad múltiple, pero las alternativas son peores para ampliar la comprensión del orden global.\n\n### Orden y cambio\n\n¿Qué hace cambiar un orden? Decir que cambian sus patrones es tautológico e ignora qué subyace a los cambios ideacionales, conductuales e institucionales: hay **fuentes más profundas** que impiden o fomentan su quiebre. Y surgen más preguntas: ¿el cambio es **decadencia o reconstitución** del viejo orden? ¿Fundamental o limitado? ¿**Cambio sistémico o dentro del sistema**? ¿Difieren los cambios de conducta de los cambios en la **distribución del poder**? ¿Hay **desfase** entre lo ideacional y lo conductual e institucional? ¿Puede persistir un conflicto intenso por mucho tiempo, o el orden se quiebra? ¿Es el orden **cíclico**? ¿Pueden crearse órdenes por **voluntad política**, o surgen de tecnologías, condiciones socioeconómicas y perspectivas psicológicas fuera del control humano?\n\nNo hay respuestas finales; depende de cómo se conceptualicen orden y cambio. Cuanto más elaborada la definición, más se limitará el colapso de un orden a los raros casos de **decadencia fundamental** y no de reconstitución limitada, de cambio sistémico, de largo plazo y demasiado complejo para la voluntad de una generación. Además, cada transición combina de manera distinta dinámicas y condiciones subyacentes: todo orden florece o fracasa en un **contexto histórico específico**.\n\n¿Por qué terminó la Guerra Fría? Sus premisas resultaron **imágenes mentales** y no realidades objetivas, y colapsaron tan rápido como cayó el Muro; pero ¿por qué en 1989 y no en 1979, 1969 o 1959? ¿Cuándo empezó el fin: con Solidaridad, con Reagan, con la muerte de Brézhnev, con los videograbadores y los satélites de televisión? Esto señala la importancia de los **intereses y condiciones materiales** como fuentes **exógenas** de la vida y muerte de los órdenes. Si un orden se asienta en **brechas económicas crecientes**, las presiones de cambio serán persistentes; si cambia la **distribución de recursos**, cambiarán las jerarquías. Eso pasó: más que Reagan y Gorbachov, fue fundamental la **bancarrota de la economía soviética** y la constatación de que las premisas ideológicas eran falsas; ocurrió en 1989 porque llevó tanto tiempo que la distancia entre ideología y nivel de vida se volviera innegable. Las protestas polacas y la huida de alemanes orientales respondían a la represión, pero también a la **desesperanza económica**.\n\nOtra condición material transformada fue la **competencia analítica de los individuos**: con más educación y los productos de la **revolución microelectrónica** (videograbadoras, televisión global, computadoras), los ciudadanos se volvieron más hábiles para explicar las circunstancias en que vivían y para saber cómo y dónde sumar demandas. No es casual que la Guerra Fría terminara en las **plazas** de Europa del Este y la URSS: se fundaba en parte en la premisa de que las masas aceptaban la competencia y la sostendrían; el **aumento de las habilidades** de la gente alteró una de las condiciones materiales de su fortaleza. Además, surgieron **asuntos públicos** para los que los arreglos existentes no estaban diseñados: contaminación, crisis monetarias, terrorismo, sida y narcotráfico atraviesan la rivalidad entre superpotencias y requieren cooperación. **Chernóbil (1986)** simboliza el comienzo, quizás la penúltima etapa, del fin de la Guerra Fría.\n\n### Cambio sistémico versus cambio dentro del sistema\n\n¿El orden sucesor descansa en **nuevas bases sistémicas** o es una **reconstitución** del existente? Depende de cómo se identifiquen las características del sistema. Si se enfatiza la competencia y el dominio de los **Estados** y su sistema anárquico de soberanía e igualdad, el fin de la Guerra Fría, con una competencia más dispersa y menos militarista entre muchos Estados, es una nueva forma del mismo orden: relaciones y jerarquías reordenadas, pero el mismo sistema de Estados; cambios profundos pero **dentro del sistema** (Mayall sostiene que el mapa territorial quedó «congelado de una vez y para siempre»). Si se enfatiza la **menor competencia de los Estados**, la globalización de las economías, la **fragmentación** de las sociedades en subgrupos étnicos, religiosos, nacionales, lingüísticos y políticos, los asuntos transnacionales que crean **autoridades transnacionales** y la mayor disposición ciudadana a reunirse en las plazas, se trata de un **orden enteramente nuevo**: los Estados siguen siendo importantes, pero su participación es menos dominante; hay **cambio sistémico**.\n\n¿Hay evidencia concluyente? No todavía: los arreglos son demasiado inestables tras el colapso del imperio soviético, y depende de cuánto peso se dé a la competencia de los Estados, la fuerza de los asuntos transnacionales, las dinámicas de subgrupos y las habilidades ciudadanas. Que la evidencia sea turbia muestra que ambos tipos de cambio son tan fundamentales que **ninguno es rápido**. Las últimas etapas de un orden pueden ser veloces, como la caída del Muro, pero la formación de nuevos arreglos es lenta y engorrosa, porque los fundamentos del orden están arraigados en **hábitos**, formas rutinizadas de responder, que pueden deshacerse rápido ante su evidente inutilidad, pero cuya sustitución lleva tiempo: que se desarrolle confianza, se distingan oportunidades y peligros, evolucione un repertorio de respuestas y se repitan lo suficiente para volverse patrones. Si el orden es un **«artificio humano»** (como se dijo del Concierto Europeo) y sus bases intersubjetivas deben ser hoy **globales**, el ritmo será lento: el Concierto lo idearon unas pocas personas, mientras los artificios actuales deben abarcar a **millones de personas** (Shevardnadze llegó a proponer un referéndum de todos los pueblos de Europa sobre la unificación alemana). Un nuevo orden puede tardar **décadas** en madurar.\n\n### Aplicaciones específicas\n\nLos capítulos siguientes exploran estos temas:\n\n• **K. J. Holsti (cap. 2)** estudia el sistema de gobernanza de las grandes potencias en la Europa del siglo XIX y, contra la **teoría de la estabilidad hegemónica**, muestra que la **«administración multipotencia»** puede florecer: la experiencia napoleónica llevó a las élites de Prusia, Rusia, Gran Bretaña y Austria‑Hungría a evitar otra guerra hegemónica y las revoluciones liberales; la convergencia de tareas, instituciones, reglas de decisión, decisiones autoritativas y capacidad coercitiva tuvo un efecto causal positivo.\n• **Mark W. Zacher (cap. 3)** analiza la **«decadencia del templo westfaliano»**: el crecimiento de instituciones, regímenes, interdependencia y regulación confirma sistemas de gobernanza emergentes; los Estados se enredan en redes de colaboración y cambian autonomía por otros valores, y los supuestos centrados en el Estado soberano pierden credibilidad.\n• **Thomas J. Biersteker (cap. 4)** explica la **convergencia neoclásica** de los países subdesarrollados y distingue el orden como sistema de ideas, como convergencia conductual y como gobernanza intencional: la convergencia conductual facilita la gobernanza, pero cierta **convergencia ideacional**, a menudo provocada por **shocks sistémicos**, la precede.\n• **Robert W. Cox (cap. 5)** se ocupa de la dimensión **intersubjetiva** a través de **Ibn Jaldún**, filósofo islámico del siglo XIV, para deconstruir los constructos del «presente pasajero»; propone una metodología **no positivista** para detectar el cambio y un conocimiento práctico para la acción: ser conscientes del condicionamiento histórico y perseguir principios morales dentro de lo factible.\n• **Oran R. Young (cap. 6)** evalúa la **«eficacia»** de las instituciones: una institución es eficaz si lleva a los actores a comportarse distinto de como lo harían sin ella; ese nexo se establece mejor con **casos difíciles**.\n• **Janice E. Thomson (cap. 7)** pone a prueba la **teoría de la construcción del Estado** (lo que se regula internacionalmente depende de la voluntad de los Estados fuertes) comparando terrorismo, mercenarismo y comercio de alcohol, armas y drogas: su valor es nebuloso, aunque los poderosos generan en parte la legitimidad y forma de las regulaciones; las normas surgen más de consecuencias no intencionales de la construcción del Estado: la regulación es un fenómeno **político, no moral**.\n• **Linda Cornett y James A. Caporaso (cap. 8)** estudian el relanzamiento de la **integración europea** («CE 1992») comparando **neorrealismo, institucionalismo neoliberal, funcionalismo y neofuncionalismo**: solo juntos captan las complejidades de la gobernanza en Europa.\n• **Ernst‑Otto Czempiel (cap. 9)**, desde la tradición **liberal**, sostiene que, como los Estados liberales no suelen guerrear entre sí, una sociedad global de Estados de modelo occidental producirá un sistema de gobernanza pacífico.\n• **Rosenau (cap. 10)** examina el nivel **micro**: ¿puede transformarse la gobernanza global sin cambios en las orientaciones de los ciudadanos? La interdependencia y la **«revolución de las habilidades»** cambiaron a los ciudadanos; sus mayores capacidades intelectuales y emocionales contribuyen a las transformaciones globales; lo micro y lo macro son **interactivos**.\n\nEn conjunto, confirman la observación de **Inis Claude**: el mundo tiene **menos gobernanza que la mayoría de los Estados, más que algunos, y probablemente menos de la que necesita**. Los sistemas de gobernanza operan a nivel global, pueden fundarse en creencias, hábitos e instituciones arraigados y a la vez cambiar, y pueden sostener la cooperación y beneficios colectivos. Para una disciplina basada en la premisa de que la gobernanza está acotada por las prerrogativas de los soberanos, la propuesta desafiante es que hay mucho por aprender sobre la gobernanza en un contexto donde **las acciones de los Estados, sus soberanías y sus gobiernos no son precondiciones** de cómo se desenvuelven los acontecimientos."}}}}, "notas": {"EI01": {"nota": 10}, "EI03": {"nota": 8}, const plain=t=>String(t||"").replace(/^#+\s*/gm,"").replace(/\*\*/g,"").replace(/\s+/g," ").trim();
const words=t=>plain(t).split(" ").filter(Boolean).length;
function md(t){
  const out=[];let list=null,para=[];
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const flush=()=>{if(para.length){out.push("<p>"+inl(para.join(" "))+"</p>");para=[]}if(list){out.push("<ul>"+list.map(li=>"<li>"+inl(li)+"</li>").join("")+"</ul>");list=null}};
  String(t||"").split(/\n/).forEach(line=>{const l=line.trim();
    if(!l){flush();return}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){flush();const lv=Math.min(m[1].length+1,5);out.push(`<h${lv}>${inl(m[2])}</h${lv}>`);return}
    if((m=l.match(/^[•*]\s+(.*)$/))){if(para.length){out.push("<p>"+inl(para.join(" "))+"</p>");para=[]}(list=list||[]).push(m[1]);return}
    if(list)flush();para.push(l)});
  flush();return out.join("");
}

document.addEventListener("toggle",e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement))return;
  if(d.dataset.key){d.open?ui.openCls.add(d.dataset.key):ui.openCls.delete(d.dataset.key)}
  if(d.dataset.tk){d.open?ui.openTxt.add(d.dataset.tk):ui.openTxt.delete(d.dataset.tk)}},true);

function clsDoc(sid,i){const d=store.clases[clsKey(sid,i)]||{};return JSON.parse(JSON.stringify({textos:d.textos||{},extras:d.extras||[]}))}
function getNote(doc,k){if(k.startsWith("x"))return doc.extras[+k.slice(1)];return doc.textos[k]=doc.textos[k]||{}}

document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const sc=e.target.closest("[data-sub]");if(sc){go("materias",sc.dataset.sub,sc.dataset.cls!=null?+sc.dataset.cls:null);return}
  const mo=e.target.closest("[data-month]:not([data-act])");if(mo){ui.selMonth=ui.selMonth===mo.dataset.month?null:mo.dataset.month;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,s=b.dataset.s,i=+b.dataset.i,k=b.dataset.k,key=s?clsKey(s,i):null,tk=key?key+"-"+k:b.dataset.tk;
  if(act==="read"){e.preventDefault();openRead(s,i,k);return}
  if(act==="calprev"||act==="calnext"){const [y,m]=ui.calMonth.split("-").map(Number);const d=new Date(y,m-1+(act==="calnext"?1:-1),1);ui.calMonth=mKey(d);ui.calDay=null;render();return}
  if(act==="caltoday"){ui.calMonth=mKey(today());ui.calDay=iso(today());render();return}
  if(act==="calday"){const ds=b.dataset.day;if(!ds.startsWith(ui.calMonth))ui.calMonth=ds.slice(0,7);ui.calDay=ui.calDay===ds?null:ds;render();return}
  if(act==="caldayclose"){ui.calDay=null;render();return}
  if(act==="editnota"){ui.adding="nota-"+b.dataset.sid;render();$("#nota-"+b.dataset.sid)?.focus();return}
  if(act==="cancel"){ui.adding=null;render();return}
  if(act==="editres"){ui.adding="res-"+b.dataset.tk;render();return}
  if(act==="openex"){ui.adding="ex-"+b.dataset.tk;render();$("#exq-"+CSS.escape(b.dataset.tk))?.focus();return}
  if(act==="opentx"){ui.adding="tx-"+b.dataset.key;render();$("#newtx-"+CSS.escape(b.dataset.key))?.focus();return}
  if(act==="saveres"){const v=$("#res-"+CSS.escape(tk)).value.trim();const d=clsDoc(s,i);getNote(d,k).resumen=v;ui.adding=null;document.activeElement.blur();save("clases",key,d);return}
  if(act==="addex"){const q=$("#exq-"+CSS.escape(tk)).value.trim(),r=$("#exr-"+CSS.escape(tk)).value.trim();if(!q){toast("Escribí la pregunta");return}
    const d=clsDoc(s,i),n=getNote(d,k);n.ejercicios=(n.ejercicios||[]).concat([{p:q,r}]);ui.adding=null;document.activeElement.blur();save("clases",key,d);return}
  if(act==="delex"){const d=clsDoc(s,i),n=getNote(d,k);n.ejercicios.splice(+b.dataset.j,1);save("clases",key,d);return}
  if(act==="addtx"){const v=$("#newtx-"+CSS.escape(key)).value.trim();if(!v){toast("Escribí el título");return}
    const d=clsDoc(s,i);d.extras.push({titulo:v,resumen:"",ejercicios:[],leido:false});ui.adding=null;document.activeElement.blur();ui.openCls.add(key);save("clases",key,d);return}
  if(act==="delextra"){const d=clsDoc(s,i);d.extras.splice(+k.slice(1),1);save("clases",key,d);return}
  if(act==="savenota"){const sid=b.dataset.sid,v=$("#nota-"+sid).value.trim();document.activeElement.blur();
    if(v===""){delete store.notas[sid];ui.adding=null;render();if(db)db.collection("notas").doc(sid).delete().then(()=>toast("Nota quitada"));return}
    const n=Number(v);if(!(n>=1&&n<=10)){toast("La nota va de 1 a 10");return}ui.adding=null;save("notas",sid,{nota:n});return}
  if(act==="copyid"){try{await navigator.clipboard.writeText(PAY.id);toast("ID copiado")}catch(_){toast("ID de pago: "+PAY.id)}return}
  if(act==="payclose"){ui.selMonth=null;render();return}
  if(act==="paysave"){const m=b.dataset.month;const data={estado:"pagado",monto:Number($("#pm-monto").value)||0,fecha:$("#pm-fecha").value,comprobante:$("#pm-comp").value.trim()};
    ui.selMonth=null;document.activeElement.blur();save("pagos",m,data);return}
  if(act==="payundo"){const m=b.dataset.month;ui.selMonth=null;delete store.pagos[m];render();if(db)db.collection("pagos").doc(m).delete().then(()=>toast("Pago quitado")).catch(()=>toast("No se pudo quitar"));return}
  if(act==="markpast"){const t=today(),cur=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`;
    const ks=monthsList().filter(m=>m<cur&&monthStatus(m)[0]==="sinreg");for(const m of ks){await save("pagos",m,{estado:"pagado",monto:PAY.ultimo,fecha:"",comprobante:""})}return}
});
document.addEventListener("change",e=>{const b=e.target;if(b.dataset.act!=="leido")return;const s=b.dataset.s,i=+b.dataset.i,k=b.dataset.k;
  const d=clsDoc(s,i);getNote(d,k).leido=b.checked;save("clases",clsKey(s,i),d)});

const _r=render;render=function(){_r();persist()};
/* inicio */
(function init(){const h=(location.hash||"").slice(1);
  if(h==="cuotas")ui.view="cuotas";else if(h==="calendario")ui.view="calendario";else if(h==="lecturas")ui.view="lecturas";else if(h==="promedio")ui.view="promedio";else if(h.startsWith("m-")&&sub(h.slice(2))){ui.subject=h.slice(2)}
  else if(h.startsWith("r-")){const m=h.match(/^r-([A-Z0-9]+)-c(\d+)-(x?\d+)$/);if(m&&sub(m[1])){ui.subject=m[1];ui.read={s:m[1],i:+m[2]-1,k:m[3]}}}
  render();
})();
</script>
