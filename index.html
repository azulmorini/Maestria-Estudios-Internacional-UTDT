del óxido». La desregulación financiera sentó las bases del sistema actual: las compras hostiles de «tiburones corporativos» interesados en liquidar activos (Gordon Gekko: «La avaricia es buena») obligaron a las empresas a obtener beneficios rápidos para no ser compradas, mediante la reestructuración: reducir plantillas y minimizar inversiones aunque afectara al largo plazo.\n\n**La crisis de la deuda en el Tercer Mundo y el fin de la revolución industrial del Tercer Mundo.** El legado más perdurable del «shock Volcker» se dio en los países en desarrollo, que se habían endeudado en los setenta y comienzos de los ochenta para industrializarse y pagar el petróleo encarecido. Al duplicarse los tipos internacionales, hubo un impago casi generalizado, empezando por México en 1982: la crisis de la deuda del Tercer Mundo. Debieron recurrir al FMI y al Banco Mundial, que impusieron programas de ajuste estructural (PAE): recortar el presupuesto, privatizar empresas públicas y desregular, sobre todo el comercio internacional. Los resultados fueron, en el mejor de los casos, decepcionantes: el crecimiento per cápita de América Latina pasó de 3,1% (1960-1980) a 0,3% (1980-2000), y en el África subsahariana la renta per cápita del año 2000 era 13% más baja que en 1980. Se interrumpió la «revolución industrial del Tercer Mundo» (Ajit Singh). Chile fue el único que prosperó bajo políticas neoliberales, a costa de la dictadura de Pinochet; los demás casos de éxito (Japón, los «tigres» Corea del Sur, Taiwán y Singapur, y cada vez más China) usaron ampliamente la intervención estatal y liberalizaron gradualmente.\n\n**Cae el muro: el derrumbe del socialismo.** En 1989 cayó el Muro de Berlín; Alemania se reunificó en 1990, Europa oriental abandonó el comunismo y en 1991 se desmembró la URSS. Con China liberalizándose desde 1978 y Vietnam con el Doi Moi (1986), el bloque quedó reducido a Corea del Norte y Cuba. Los problemas socialistas eran conocidos (dificultad de planificar una economía diversa, falta de incentivos por el débil vínculo entre esfuerzo y recompensa, desigualdad políticamente determinada), pero pocos esperaban un derrumbe tan rápido. El problema crucial fue intentar un sistema alternativo con tecnologías de segunda categoría: líderes en lo espacial y armamentístico por la concentración de recursos, pero con bienes de consumo de segunda (el Trabant), lo que llevó a los ciudadanos a rebelarse. La mayoría aplicó reformas «big bang» para recuperar el capitalismo de la noche a la mañana, privatizando y reintroduciendo el mercado rápidamente, también para impedir que la vieja élite se reagrupara. El resultado fue desastroso: Yugoslavia se desintegró en guerras y limpiezas étnicas; muchas ex repúblicas soviéticas sufrieron depresiones; en Rusia el colapso, el desempleo y la inseguridad causaron estrés, alcoholismo y problemas de salud que provocaron millones de muertes adicionales; la antigua élite «cambió de chaqueta» y se enriqueció comprando activos estatales a precios irrisorios. Polonia, Hungría, la República Checa y Eslovaquia, con reformas más graduales y mejor base industrial, y desde 2004 en la UE, estuvieron mejor, aunque su transición tampoco fue un gran éxito. Comenzó el «triunfalismo del libre mercado»: Fukuyama anunció «el fin de la historia», ignorando que el capitalismo presenta multitud de variantes.\n\n**Un solo mundo: la globalización y el nuevo orden económico mundial.** A mediados de los noventa el neoliberalismo se había propagado por el mundo: el ex bloque socialista fue absorbido por «big bang» o, en China y Vietnam, por apertura gradual; la mayoría de los países en desarrollo liberalizó rápidamente con los PAE (India, más gradualmente). En 1994 se firmó el TLCAN, primer gran acuerdo de libre comercio entre desarrollados y un país en desarrollo; en 1995 la Ronda Uruguay transformó el GATT en la OMC, que abarca muchos más ámbitos (propiedad intelectual, servicios) y tiene más poder sancionador; la UE completó el «mercado único» de las cuatro libertades (1993) y sumó a Suecia, Finlandia y Austria (1995). El sistema comercial quedó mucho más orientado al libre comercio, aunque no del todo. Surgió la «globalización» como concepto de la época: la integración venía del siglo XVI, pero según la nueva narrativa había entrado en una etapa nueva por las revoluciones en comunicación (internet) y transporte (aviones, portacontenedores), «la muerte de la distancia». Los países no tendrían otra opción que abrirse totalmente al comercio y la inversión y liberalizar; quienes se resistieran serían «luditas modernos» (El mundo sin fronteras, El mundo es plano).\n\n**El principio del fin: la crisis financiera asiática.** La euforia no duró. La primera señal fue la crisis mexicana de 1995, tras inversiones con la expectativa irracional de que México, por adoptar el libre mercado y el TLCAN, sería el próximo milagro; fue rescatado por Estados Unidos, Canadá y el FMI. En 1997 una crisis más grave sacudió a Malasia, Indonesia, Tailandia y Corea del Sur por el estallido de una burbuja de activos. Tras abrir radicalmente sus mercados financieros a fines de los ochenta y comienzos de los noventa, sus bancos se endeudaron agresivamente en los países ricos, cuyos bancos veían poco riesgo; el capital extranjero subió los precios de los activos, lo que permitió endeudarse más con esos activos como aval, en una profecía autocumplida hasta que los precios se revelaron insostenibles, el dinero se retiró y estallaron las crisis. En 1998 la producción cayó 16% en Indonesia y 6-7% en los otros; decenas de millones perdieron el empleo en sociedades con Estados del bienestar reducidos. A cambio del rescate debieron liberalizar sus mercados, sobre todo financieros. Esta crisis, y las de Brasil y Rusia, sembraron el primer escepticismo sobre el triunfalismo de libre mercado; se debatió reformar el sistema financiero mundial, e incluso defensores de la globalización como Martin Wolf y Jagdish Bhagwati cuestionaron la libre circulación del capital.\n\n**El falso amanecer: de la fiebre de las «puntocom» a la Gran Moderación.** Controladas las crisis, se dejó de hablar de reforma; en 1999 Estados Unidos derogó la Ley Glass-Steagall. En 2000 estalló la «burbuja puntocom», pero el pánico terminó pronto porque la Reserva Federal recortó agresivamente los tipos. Siguió una bonanza en los países ricos: crecimiento robusto, activos en alza y baja inflación. Los economistas, incluido Ben Bernanke, hablaban de la «Gran Moderación», en la que la ciencia económica habría controlado el ciclo de expansión y contracción, y Alan Greenspan era reverenciado como un «Maestro». A mediados de los 2000 el mundo percibió el crecimiento «milagroso» de China: en 1978 era el 2,5% de la economía mundial y el 0,8% de las exportaciones de bienes; en 2007, el 6% y el 8,7%. Pobre en recursos y creciendo vertiginosamente, demandó alimentos, minerales y combustible, lo que empujó a los exportadores de materias primas de África y América Latina a recuperar parte del terreno perdido; China se volvió también prestamista e inversor en África, dándole poder de negociación frente al Banco Mundial y los donantes tradicionales. En América Latina hubo un alejamiento de las políticas neoliberales: Brasil (Lula), Bolivia (Morales), Venezuela (Chávez), Argentina (Kirchner), Ecuador (Correa) y Uruguay (Vázquez).\n\n**Una grieta en la pared: la crisis financiera mundial de 2008.** A comienzos de 2007 sonaron alarmas por la morosidad de las hipotecas subprime: personas sin ingresos estables ni buen historial crediticio habían recibido préstamos impagables bajo el supuesto de que los precios de la vivienda subirían eternamente y podrían vender la casa si las cosas iban mal. Esos préstamos estaban vinculados a productos financieros «compuestos» (MBS, CDO) vendidos como de bajo riesgo, bajo el supuesto de que era improbable que muchos prestatarios tuvieran problemas a la vez. El problema se estimó en 50.000-100.000 millones de dólares, asumible según muchos expertos, pero la crisis estalló en el verano de 2008 con la quiebra de Bear Stearns y Lehman Brothers, y se reveló que nombres venerables del sector estaban en graves problemas por esos productos dudosos.\n\n**La «primavera keynesiana» y el retorno de la ortodoxia de libre mercado… con sed de venganza.** Las medidas iniciales fueron distintas de las de la Gran Depresión: políticas keynesianas que permitieron grandes déficits sin recortar gasto y a veces aumentándolo (China fue la más agresiva); rescates con dinero público de grandes instituciones financieras (Royal Bank of Scotland) e industriales (GM, Chrysler); tipos de interés históricamente bajos (el Banco de Inglaterra, en su nivel más bajo desde 1694) y, cuando no pudieron bajarlos más, expansión cuantitativa (QE): el banco central crea moneda y la pone en circulación comprando sobre todo bonos soberanos. Pero la ortodoxia regresó con ánimo de venganza en mayo de 2010, con la coalición conservadora en el Reino Unido y el rescate de la Eurozona a Grecia: volvió la doctrina del equilibrio presupuestario y se impusieron presupuestos austeros en el Reino Unido y los «PIIGS». Siguieron el recorte de gasto impuesto a Obama por los republicanos en 2011 y el Pacto Fiscal Europeo de 2012. La derecha usa el equilibrio presupuestario como pretexto para podar el Estado del bienestar.\n\n**Las consecuencias: ¿la década perdida?** A fines de 2012 la producción per cápita seguía por debajo de 2007 en veintidós de los treinta y cuatro países de la OCDE: 26% menos en Grecia, 12% en Irlanda, 7% en España, 6% en el Reino Unido e incluso 1,4% en Estados Unidos. Con la austeridad, la recuperación es difusa, porque recortar radicalmente el gasto en una economía estancada obstaculiza la recuperación, como en la Gran Depresión; muchos países podrían estar en una «década perdida», como Japón en los noventa y América Latina en los ochenta. En su punto álgido la crisis generó 80 millones más de desempleados; en España y Grecia el desempleo pasó de cerca del 8% al 26 y 28% en 2013, con paro juvenil superior al 55%; en Estados Unidos y el Reino Unido llegó al 8 y 10%.\n\n**¿Un poco demasiado tarde?: perspectivas de reforma.** Pese a que la causa de la crisis fue la excesiva liberalización financiera, las reformas han sido blandas y lentas (aplicadas en varios años, cuando los bancos estadounidenses tuvieron doce meses para aplicar las durísimas reformas del New Deal), y en sectores como los productos financieros excesivamente complejos ni siquiera hubo reformas blandas. Es posible revertir la tendencia: tras la Gran Depresión, las reformas en Estados Unidos y Suecia llegaron después de pocos años de penuria. Los electorados francés, holandés, griego e italiano votaron contra la austeridad en 2012 y 2013; la Unión Europea introdujo regulaciones financieras más duras de lo esperado (impuesto a las transacciones financieras, límites a las primas); Suiza prohibió en 2013 las altas recompensas a directivos con rendimiento mediocre. Queda mucho por hacer, pero estas medidas habrían sido consideradas imposibles antes de 2008."}, "1": {"ejercicios": [], "leido": false, "resumen": "## Capítulo 1. El nuevo orden económico global\n\nEl libro analiza la globalización de la economía mundial y sus implicancias reales y supuestas para la economía política internacional. Desde el fin de la Guerra Fría la globalización ha sido la característica más sobresaliente de los asuntos económicos internacionales y, en buena medida, de los políticos. Sin embargo, su extensión y significado han sido muy exagerados y malentendidos en las discusiones públicas y profesionales: la globalización no es ni tan extensa ni tan arrolladora en sus consecuencias (negativas o positivas) como creen muchos observadores. Este sigue siendo un mundo en el que las políticas nacionales y las economías domésticas son los principales determinantes de los asuntos económicos. Como señaló Vincent Cable, el mayor logro económico de la posguerra ha sido restaurar el nivel de integración económica internacional que existía antes de la Primera Guerra Mundial.\n\nEl libro de 1987 carecía de una dimensión doméstica adecuada: analizaba la economía internacional como si los desarrollos domésticos tuvieran importancia menor, en parte por el deseo de impulsar una economía política internacional autónoma. Este libro intenta superar esa debilidad con el foco en los «sistemas nacionales de economía política» y su significado para los asuntos domésticos e internacionales: a medida que las economías nacionales se integran, aumenta la importancia de las diferencias fundamentales entre ellas. El libro de 1987 tenía otras limitaciones en su tratamiento de la empresa multinacional, el desarrollo económico y el regionalismo económico.\n\nA mediados de los ochenta hubo una revolución en los asuntos económicos internacionales: las empresas multinacionales (EMN) y la inversión extranjera directa (IED) empezaron a tener un impacto profundo sobre casi todos los aspectos de la economía mundial. En los sesenta y setenta el aumento del comercio transformó la economía internacional; en los ochenta la expansión de las multinacionales integró cada vez más las economías nacionales. «Multinacional» había sido sinónimo de expansión de firmas estadounidenses, pero en los ochenta se sumaron firmas de otras nacionalidades, y las EMN lideraron la internacionalización de servicios y manufacturas. La discusión del desarrollo económico en 1987 quedó desactualizada: entonces se atendía a la teoría cuasi marxista de la dependencia y a la división entre mundo desarrollado y menos desarrollado; hoy el debate se centra en el papel apropiado del Estado y del mercado en el proceso de desarrollo. El regionalismo económico, presentado en 1987 como la ola del futuro, ha alcanzado su pleamar. Los desarrollos financieros desde mediados de los ochenta aumentaron mucho la integración. El libro también aborda si la creciente importancia del mercado significa el fin del Estado nación y de la economía política internacional: la respuesta es que no.\n\nEl propósito principal es formular una comprensión más abarcadora de la economía política internacional. El libro de 1987 presentaba de manera ecléctica las tres grandes perspectivas de la EPI (liberalismo, marxismo y nacionalismo); este adopta conscientemente un enfoque realista o estadocéntrico. El Estado nación sigue siendo el actor dominante en los asuntos económicos domésticos e internacionales, y para entender la economía internacional son necesarios tanto el análisis económico como el político, que el libro integra.\n\n### Cambios en la economía mundial\n\nEl cambio más importante desde 1987 fue el fin de la Guerra Fría y de la amenaza soviética a Estados Unidos y sus aliados europeos y japoneses. Durante la segunda mitad del siglo XX, la Guerra Fría y sus alianzas proveyeron el marco de la economía mundial: Estados Unidos y sus aliados subordinaban los conflictos económicos potenciales a la cooperación política y de seguridad, que funcionaba como pegamento político y facilitaba compromisos. Con el fin de la Guerra Fría decayeron el liderazgo estadounidense y la estrecha cooperación entre las potencias capitalistas. Al mismo tiempo el mundo orientado al mercado se agrandó, porque ex países comunistas y del Tercer Mundo se dispusieron a participar del sistema de mercado (por ejemplo, el papel más activo de los países menos desarrollados en la OMC), lo que hizo más difícil la gestión del sistema.\n\nLa globalización económica implicó desarrollos clave en comercio, finanzas e IED. El comercio internacional creció más rápido que el producto mundial; además del comercio de mercancías creció el de servicios, y con la caída del costo del transporte cada vez más bienes se volvieron «comerciables». La competencia internacional aumentó mucho: consumidores y sectores exportadores se benefician de la apertura, pero muchas empresas compiten con firmas extranjeras más eficientes. En los ochenta y noventa la competencia se intensificó porque economías en industrialización de Asia oriental pasaron de la sustitución de importaciones a un crecimiento orientado a las exportaciones. Aun así, los principales competidores de casi todas las firmas estadounidenses siguen siendo otras firmas estadounidenses.\n\nDetrás de la expansión del comercio están la caída de las barreras por las sucesivas rondas de negociación (los aranceles medios de los países industrializados bajaron de cerca de 40% a solo 6%, y también bajaron las barreras al comercio de servicios), la desregulación y privatización desde fines de los setenta, y los avances tecnológicos en comunicaciones y transporte. Sin embargo, la mayor parte del comercio ocurre entre las tres economías industrializadas avanzadas (Estados Unidos, Europa occidental y Japón) y algunos mercados emergentes; la mayor parte del mundo menos desarrollado queda excluida salvo como exportadora de alimentos y materias primas (el África subsahariana, cerca del 1% del comercio mundial en los noventa).\n\nDesde mediados de los setenta, la desregulación financiera, los nuevos instrumentos como los derivados y los avances en comunicaciones produjeron un sistema financiero internacional mucho más integrado. El volumen de comercio de divisas llegó a fines de los noventa a cerca de 1,5 billones de dólares diarios, ocho veces más que en 1986, frente a exportaciones globales de bienes y servicios de 25.000 millones por día en 1997. El capital de inversión en busca de mayores retornos creció enormemente (fondos mutuos y de pensión por 20 billones a mediados de los noventa, diez veces más que en 1980), con buena parte apalancada, y los derivados, valuados en 360 billones (más que toda la economía mundial), aumentaron la complejidad e inestabilidad de las finanzas internacionales. Esta revolución financiera vinculó estrechamente las economías y aumentó el capital disponible para países en desarrollo, pero como muchos flujos son de corto plazo, volátiles y especulativos, las finanzas internacionales se volvieron el aspecto más inestable de la economía capitalista global. Los gobiernos quedaron más vulnerables a cambios súbitos y a los especuladores, como en la crisis europea de 1992 (salida británica del Mecanismo de Tipos de Cambio), el colapso del peso mexicano de 1994-95 y la crisis asiática de fines de los noventa. Para unos la globalización financiera es el triunfo beneficioso del capitalismo global; para otros el sistema está «fuera de control» y debe regularse. En cualquier caso, las finanzas son el área donde el término «globalización» se aplica con mayor propiedad.\n\nEl término «globalización» se popularizó en la segunda mitad de los ochenta con el auge de la IED de las multinacionales. EMN e IED existen desde hace siglos (la Compañía de las Indias Orientales). En la posguerra temprana la mayor parte de la IED era estadounidense; en los ochenta la IED creció mucho más rápido que el comercio y el producto mundial, se sumaron inversores japoneses y europeos, y Estados Unidos pasó a ser a la vez el mayor país de origen y de destino. La IED hacia países en industrialización creció cerca de 15% anual, pero la mayor parte va a países industrializados. Se concentra en servicios e industrias de alta tecnología; la información misma se volvió «comerciable», lo que plantea nuevas cuestiones como la protección de la propiedad intelectual y el acceso a mercados de servicios. Junto con el comercio y los flujos financieros, las EMN transformaron la economía internacional.\n\nEl fin de la Guerra Fría fue la condición política necesaria para una economía verdaderamente global, pero la fuerza impulsora fueron desarrollos económicos, políticos y tecnológicos: el transporte más barato, la computadora y las telecomunicaciones, que permitieron a las multinacionales estrategias globales; la compresión del tiempo y el espacio redujo los costos del comercio internacional. También la produjeron la cooperación económica internacional y nuevas políticas: bajo liderazgo estadounidense, ocho rondas del GATT redujeron barreras y cada vez más países adoptaron políticas neoliberales de desregulación y privatización. El resultado es una economía global cada vez más orientada al mercado.\n\nMuchos creen que ocurre un cambio profundo de una economía internacional dominada por el Estado a una dominada por el mercado, hacia un mundo políticamente sin fronteras. El colapso soviético, el fracaso de la sustitución de importaciones y el éxito estadounidense de los noventa alentaron la aceptación de mercados irrestrictos como solución. Según esta interpretación, el Estado nación se volvió un anacronismo en retirada y avanzamos hacia una economía capitalista abierta con comercio, flujos financieros y multinacionales sin restricciones. La mayoría de los economistas celebra este desarrollo, pero los críticos destacan sus «altos costos»: creciente desigualdad entre y dentro de las naciones, desempleo crónico alto en Europa occidental, degradación ambiental, explotación y efectos devastadores de los flujos financieros no regulados. Sostienen que las sociedades quedan a merced de fuerzas sobre las que no tienen control, que una economía abierta producirá más perdedores que ganadores y que «la lucha por el producto mundial» (Helmut Schmidt) podría derivar en bloques regionales rivales.\n\nLa idea de que la globalización es responsable de la mayoría de los problemas del mundo es falsa o muy exagerada: el desarrollo tecnológico y las políticas nacionales imprudentes son causas mucho más importantes. Esos malentendidos alimentan la desilusión con la apertura (en 1999, 52% de los estadounidenses tenía una visión negativa de la globalización). La globalización no es tan omnipresente, extensa o significativa como se cree: la mayoría de las economías nacionales siguen siendo principalmente autocontenidas; la globalización se restringe a un número limitado, aunque creciente, de sectores, y a la tríada industrializada (Estados Unidos, Europa occidental y, mucho menos, Japón) y los mercados emergentes de Asia oriental. Muchos de sus «males» se deben a cambios que poco o nada tienen que ver con ella.\n\nEl fin de la Guerra Fría y la globalización coincidieron con una nueva revolución industrial basada en la computadora y la economía de la información o de internet, cuyo impulso podría ser tan significativo como el del vapor, la electricidad o el petróleo. Los economistas están divididos sobre si es una revolución de esa escala; es pronto para medir su impacto total, pero es seguro que está cambiando muchos aspectos de la economía y, sobre todo, aceleró en los países industrializados el paso de las manufacturas a los servicios, una reestructuración económicamente costosa y políticamente difícil.\n\nEn las últimas décadas del siglo XX la industria mundial se desplazó de las viejas economías industriales hacia el Pacífico asiático, América Latina y otras economías en rápida industrialización. Estados Unidos y los demás industrializados conservan una porción preponderante de la riqueza, pero declinaron en términos relativos (no absolutos), mientras ganaban importancia las economías en industrialización, sobre todo China. Antes de la crisis de 1997, iniciada en Tailandia, muchas economías asiáticas crecían 6 a 8% anual, y sus «fundamentos» (alto ahorro, excelente fuerza laboral) sostienen que seguirán siendo actores importantes.\n\nEl regionalismo económico se expandió en respuesta a estos desarrollos. Comparado con el de los cincuenta y sesenta (del que solo sobrevive la Comunidad Económica Europea), el nuevo regionalismo es casi universal: salvo excepciones como China, Japón y Rusia, las grandes economías integran algún acuerdo regional, con mayor regionalización de la inversión y la producción. Cada acuerdo regional representa esfuerzos cooperativos de Estados para promover objetivos nacionales y colectivos; es una respuesta a problemas políticos compartidos y a una economía global interdependiente y competitiva: los grupos regionales cooperan para fortalecer su autonomía, mejorar su posición negociadora y promover objetivos. La regionalización no es una alternativa al Estado nación, sino el esfuerzo de los Estados por promover colectivamente sus intereses nacionales vitales.\n\nTodo esto volvió urgente la gobernanza de la economía global, que requiere acuerdo sobre el propósito de la economía internacional. Durante la Guerra Fría el propósito fue fortalecer las economías de la alianza antisoviética y consolidar la unidad política de Estados Unidos y sus aliados, lo que a menudo exigía aceptar discriminación comercial y otras políticas iliberales. Hoy muchos sostienen que el propósito debe ser promover mercados libres y abiertos guiados por la economía neoclásica: libre comercio, libre movimiento de capitales y acceso irrestricto de las multinacionales; con el triunfo del mercado, la lógica económica y las eficiencias relativas determinarían la distribución de la actividad económica, la riqueza y el poder. Los críticos cuestionan ese énfasis. Pero la experiencia histórica indica que el propósito de la actividad económica se determina no solo por los mercados y la economía técnica, sino también por las normas, valores e intereses de los sistemas sociales y políticos en que está inserta. Los factores políticos tendrán igual o mayor importancia que los económicos; la economía global estará fuertemente afectada por los intereses de seguridad y políticos de las potencias dominantes (Estados Unidos, Europa occidental, Japón, China y Rusia), y es muy improbable que dejen la distribución del producto global enteramente al mercado. Eficiencia económica y ambiciones nacionales son ambas fuerzas impulsoras de la economía global del siglo XXI.\n\nEl libro adopta un enfoque de «economía política» que integra el análisis económico y político con otros modos de análisis. Las teorías económicas formales (la teoría convencional del comercio, la organización industrial) son herramientas indispensables pero no suficientes: hay que recurrir a la historia, la ciencia política y otras ciencias sociales. Existe una paradoja preocupante: mientras los asuntos económicos se volvieron centrales, la disciplina económica se alejó de los asuntos públicos por su énfasis en modelos abstractos y teorías matemáticas, volviéndose inaccesible al público e incluso a colegas académicos. El vacío intelectual que dejan los economistas suele ser llenado por quienes malentienden o usan mal la economía para promover alguna panacea.\n\n### Perspectivas intelectuales\n\nEn 1987 se identificaron tres ideologías o perspectivas sobre la economía internacional: liberalismo, marxismo y nacionalismo. Su relevancia cambió drásticamente. Con el fin del comunismo y de la sustitución de importaciones, la relevancia del marxismo declinó mucho y el liberalismo ganó influencia: cada vez más países abren sus economías, reducen el papel del Estado y adoptan estrategias de crecimiento exportador. El marxismo como doctrina para manejar una economía quedó desacreditado (solo Cuba y Corea del Norte se aferran a él), pero sobrevive como herramienta analítica y crítica del capitalismo, y sobrevivirá mientras persistan los defectos que señaló: el ciclo de «auge y caída», la pobreza junto a la gran riqueza y las intensas rivalidades por cuotas de mercado.\n\n¿Liberal, marxista o nacionalista? «Ninguno de los anteriores». En 1987 no se aclaró que cada perspectiva tiene elementos analíticos y normativos. El liberalismo económico es una herramienta analítica basada en la economía neoclásica y un compromiso normativo con una economía de mercado o capitalista. Marx aceptó las ideas analíticas de la economía liberal de su tiempo, pero despreciaba el capitalismo (término que acuñó) y se preguntó por sus orígenes, las leyes de su evolución y su destino; como señaló Schumpeter, mientras los economistas se interesan por el funcionamiento cotidiano del capitalismo, Marx y él se interesaban por su dinámica de largo plazo. El nacionalismo económico también tiene un núcleo analítico (la naturaleza anárquica de los asuntos internacionales, la primacía del Estado y sus intereses, la importancia del poder) y un compromiso normativo con el Estado nación, la construcción estatal y la superioridad moral del propio Estado. Se acepta el enfoque «estadocéntrico» como perspectiva analítica, pero no el compromiso normativo del nacionalismo económico: el compromiso normativo propio es con el liberalismo económico (libre comercio y barreras mínimas a bienes, servicios y capital), aunque en circunstancias restringidas pueden justificarse políticas nacionalistas como la protección comercial y la política industrial. Debió distinguirse entre nacionalismo económico como posición normativa y realismo político como perspectiva analítica: todos los nacionalistas son realistas en su énfasis en el Estado, la seguridad y el poder, pero no todos los realistas son nacionalistas. Por eso aquí se usa «realismo estadocéntrico».\n\n### Mi perspectiva: realismo estadocéntrico\n\nEl realismo es una posición filosófica y una perspectiva analítica, no necesariamente un compromiso moral con el Estado nación; muchos realistas lamentan un mundo en que el Estado no está suficientemente restringido por reglas internacionales y consideraciones morales. Tampoco es una teoría científica: como el liberalismo y el marxismo, no es falsable en el sentido de Popper, aunque la tradición realista produjo teorías como las del equilibrio de poder y la estabilidad hegemónica que sí pueden testearse empíricamente.\n\nRealismo y nacionalismo no son idénticos. Morgenthau, Bull y otros eran realistas en su análisis y en sus sobrias expectativas, pero no nacionalistas: el realista que diagnostica los males de la condición humana no los aprueba, como el médico no aprueba el cáncer que encuentra. Morgenthau atacó el nacionalismo desenfrenado y en Politics Among Nations propuso reglas de conducta diplomática para que las naciones vivieran en paz resguardando sus intereses; condenó el «nacionalismo universal», es decir, la conducta imperialista, y sostuvo que los Estados deben respetar los intereses de otros. George Little, quien enseñó al autor el realismo, era un pacifista cuáquero; Martin Wight, autor de Power Politics, un pacifista cristiano. Es posible analizar los asuntos económicos internacionales desde el realismo y tener a la vez un compromiso normativo con ciertos ideales.\n\nComo recuerda Michael Doyle, hay muchas variedades de realismo, pero todos comparten ideas como la naturaleza anárquica del sistema internacional y la primacía del Estado. Hay que distinguir entre realismo estadocéntrico y sistémico. El estadocéntrico es la forma tradicional (Tucídides, Maquiavelo, Morgenthau): el Estado (ciudad, imperio o Estado nación) es el actor principal, no hay autoridad superior a estas unidades soberanas y el análisis debe enfocarse en la conducta de los Estados. El realismo sistémico, estructural o neorrealismo, asociado a la Teoría de la política internacional de Waltz (1979), enfatiza la distribución del poder en el sistema como principal determinante de la conducta estatal.\n\nEl realismo estadocéntrico supone que, al ser anárquico el sistema, el Estado es el actor principal en ausencia de una autoridad superior. Anarquía no significa una guerra hobbesiana permanente de todos contra todos: los Estados cooperan y crean instituciones; significa que no hay autoridad superior a la que apelar en tiempos difíciles. El realismo debe reconocer la importancia de actores no estatales (multinacionales, instituciones internacionales, ONG), pero insiste en que el Estado sigue siendo el principal. Sus preocupaciones centrales son sus intereses nacionales definidos en términos de seguridad militar e independencia política, sin rechazar las consideraciones morales y de valores. El poder y las relaciones de poder tienen el papel principal, pero el poder puede ser militar, económico o psicológico (E. H. Carr), y las ideas, valores y normas también cuentan. La crítica de que los realistas ignoran las ideas es falsa: Morgenthau sostuvo en Scientific Man vs. Power Politics (1946) que las creencias liberales de las democracias occidentales les impidieron reconocer la amenaza fascista, y advirtió que era peligroso confiar solo en el poder de los ideales.\n\nAquí se define la «economía política global» como la interacción del mercado y actores poderosos como los Estados, las multinacionales y las organizaciones internacionales. El Estado territorial sigue siendo el actor primario, pero no el único: el Banco Mundial, el FMI y la Comisión Europea son importantes. Aun así, los gobiernos nacionales toman las decisiones económicas principales, fijan las reglas dentro de las cuales operan los demás actores y usan su poder para influir en los resultados; Alemania, Francia y el Reino Unido son centrales incluso en una institución tan integrada como la Unión Europea.\n\nLos intereses y políticas de los Estados están determinados por la élite política gobernante, las presiones de grupos poderosos y la naturaleza del «sistema nacional de economía política». Como se sostuvo en War and Change in World Politics (1981), las políticas económicas y exteriores reflejan el interés nacional definido por la élite dominante. Hay un elemento subjetivo en esa definición, pero los factores objetivos, como la ubicación geográfica y las necesidades físicas de la economía, son muy importantes: solo ellos explican por qué el interés primordial británico durante unos cuatrocientos años fue impedir la ocupación de los Países Bajos por una potencia hostil, interés que trascendió a las élites y regímenes de cada momento.\n\nLa seguridad nacional es y siempre será la preocupación principal de los Estados. En un sistema de «autoayuda» (Waltz), deben protegerse de amenazas a su independencia política y económica, de modo que el poder militar, económico o psicológico es vital y deben atender a los cambios en el equilibrio de poder. Como sostiene Rosecrance, el «Estado comercial» se volvió más prominente, pero el desarrollo de la economía internacional desde 1945 fue posible gracias al sistema de seguridad de las alianzas de Estados Unidos en Europa y Asia. Japón y Alemania Occidental crecieron protegidos por el poder militar estadounidense y hacia fines del siglo XX establecieron una opción militar independiente; incluso Japón, con su constitución «pacifista», es una de las principales potencias militares.\n\nUna de las críticas contemporáneas más importantes al realismo es el constructivismo, según el cual la política internacional está «socialmente construida». Según Wendt, sus dos principios son que las estructuras humanas están determinadas principalmente por ideas compartidas y no por fuerzas materiales, y que las identidades e intereses son producto de esas ideas compartidas y no de la naturaleza. Si fueran válidos, socavarían al realismo, al marxismo, al liberalismo, a la economía neoclásica y a buena parte de la ciencia política. El constructivismo es un correctivo importante para algunas vertientes del realismo y para la metodología individualista de elección racional, pero su supuesto implícito de abandonar el conocimiento acumulado y empezar desde una tabula rasa no es convincente.\n\nSu crítica principal es que el realismo sería puramente materialista y determinista, sin lugar para la agencia humana, mientras el constructivismo enfatizaría las ideas, las estructuras sociales y la voluntad humana. Pero exagera la distinción: los realistas clásicos desde Tucídides enfatizaron las ideas y la «identidad»; el nacionalismo y la identidad nacional son pilares del pensamiento realista desde Maquiavelo y Hobbes. Las ideas importan, pero el mundo tiene muchas restricciones económicas, tecnológicas y otras que limitan la sabiduría y practicidad de ciertas ideas; toda teoría debe integrar ideas y fuerzas materiales. Sobre la identidad (cómo se define una sociedad, por ejemplo democrática o autoritaria), la crítica es en parte válida, porque los realistas suelen enfatizar el «interés» sobre la «identidad», pero muchos realistas estadocéntricos la reconocen: el propio énfasis en el sistema nacional de economía política lo muestra, porque que una sociedad se defina como economía de stakeholders (Alemania, Japón) o de shareholders (Gran Bretaña, Estados Unidos) influye en su conducta. No se puede explicar la Guerra Fría sin el conflicto entre la identidad democrático-capitalista estadounidense y la totalitaria-comunista soviética; Kennan, realista hasta la médula, basó la «contención» en la identidad autoritaria del Estado soviético y predijo que la contención la transformaría. Los realistas discrepan, sin embargo, con que la identidad sea el determinante más importante o el único de la política exterior.\n\nLa interpretación estadocéntrica rechaza la creencia de que las fuerzas económicas y tecnológicas eclipsaron al Estado nación y crean una economía global donde las fronteras y los gobiernos ya no importan. Esas fuerzas transforman los asuntos internacionales, pero en una economía integrada los Estados siguen usando su poder para canalizar las fuerzas económicas hacia sus intereses nacionales: obtener una parte favorable de las ganancias y preservar la autonomía nacional. La UE y el TLCAN son esfuerzos nacionales colectivos hacia esos objetivos. En el último cuarto del siglo XX el Estado nación fue atacado desde afuera por fuerzas económicas transnacionales y desde adentro por nacionalismos étnicos, pero sigue siendo de suprema importancia, aunque no hay certeza de que exista para siempre. Fue creado para satisfacer necesidades específicas, seguridad económica y política entre ellas, a cambio de la lealtad ciudadana; si deja de satisfacerlas, los ciudadanos retirarán su lealtad y desaparecerá como los reinos feudales, los imperios y las ciudades Estado. No hay evidencia de que eso haya ocurrido: el número de Estados crece rápidamente (de unos 50 en la ONU en 1945 a casi 200), con fuerzas militares poderosas, y si el Estado desaparece será reemplazado por otra forma de autoridad política formal.\n\nLos asuntos económicos se volvieron mucho más importantes desde el fin de la Guerra Fría y desplazaron la preocupación por la seguridad militar, pero es engañoso separar demasiado lo económico y lo de seguridad: están íntimamente unidos, siempre lo estuvieron y lo estarán (Jacob Viner, «Power versus Plenty»). Como mostró Ralph Hawtrey en Economic Aspects of Sovereignty (1952), la relación es recíproca: el sistema político y de seguridad internacional provee el marco en que funciona la economía, y las economías generan la riqueza que es base del sistema político. Con el tiempo esa base económica cambia según «la ley del crecimiento desigual», y la transformación del equilibrio de poder lleva a los Estados a redefinir sus intereses y políticas, lo que puede socavar la estabilidad del sistema e incluso llevar al conflicto.\n\nEl funcionamiento de la economía mundial lo determinan tanto los mercados como las políticas de los Estados, sobre todo de los poderosos. Las ambiciones, rivalidades y cooperación de los Estados crean el marco político en que operan los mercados; los Estados grandes establecen las reglas que deben seguir los empresarios y las multinacionales, y esas reglas reflejan los intereses de los Estados dominantes. Pero las fuerzas económicas y tecnológicas también moldean las políticas e intereses estatales: la relación entre economía y política es interactiva.\n\n### El propósito de la actividad económica\n\nLa mayoría de los economistas formados en la economía neoclásica creen que el propósito de la actividad económica es beneficiar a los consumidores individuales y maximizar el uso eficiente de los recursos escasos. Su tarea es explicar cómo funcionan los mercados en la producción de riqueza y cómo hacerlos más eficientes; cómo distribuir esa riqueza es una cuestión moral y política fuera de la ciencia económica. En la economía política, en cambio, el propósito es una cuestión fundamental: ¿beneficiar a los consumidores, promover ciertos objetivos de bienestar social o maximizar el poder nacional? La respuesta es política y determina el papel del mecanismo de mercado: decidir si el mercado u otro mecanismo asignará los recursos productivos y distribuirá el producto es una decisión política de máxima importancia. Fines y medios no pueden separarse, y en toda sociedad los determinan procesos políticos que se delegan al Estado. Sin embargo, el mercado tiene su propia lógica: todo beneficio tiene un costo y en un mundo de escasez hay que tomar decisiones dolorosas, de modo que el mercado impone límites a lo que los Estados pueden lograr.\n\n### Conclusión\n\nEl funcionamiento de la economía mundial está determinado tanto por los mercados como por las políticas de los Estados. Los propósitos, rivalidades y cooperación de los Estados crean el marco de relaciones políticas en el que operan las fuerzas económicas; los Estados fijan las reglas para empresarios y multinacionales. Pero las fuerzas económicas y tecnológicas moldean las políticas e intereses de los Estados y sus relaciones, y el mercado es una fuerza potente. Por eso se requieren análisis político y económico para entender el funcionamiento y la evolución de la economía global: un análisis abarcador exige integrar intelectualmente Estados y mercados."}, "2": {"ejercicios": [], "leido": false, "resumen": "## Introducción\n\nEn el marco de la globalización, el dinamismo del comercio internacional indicaba que la apertura externa y la integración en las cadenas globales de valor eran el sendero para incrementar el desarrollo y mejorar la inserción internacional. Desde la crisis financiera de 2008 comenzaron a percibirse señales de agotamiento, y con la pandemia de 2020 y la guerra en Ucrania en 2022 la economía global adquirió rasgos sustantivamente diferentes: las dinámicas y geografías que impulsaron el crecimiento en los noventa y comienzos del siglo XXI ya no explican la realidad actual. La búsqueda de nuevas etiquetas («post-hiperglobalización», Rodrik; «poliglobalización», Grynspan) revela la singularidad del período y la necesidad de volver a mirar al mundo, incorporando a las políticas de desarrollo las estrategias de inserción internacional. El nuevo escenario requiere instrumentos que vinculen la producción local con los mercados globales, amortigüen los shocks externos y generen mecanismos para resolver problemas colectivos.\n\nEl documento analiza los cambios en las dinámicas de poder, los instrumentos y sectores estratégicos del nuevo escenario, y las respuestas de los países del Sur Global para enfrentar los desafíos de desarrollo e inserción. Busca comprender el grado de permisividad del escenario internacional para políticas autónomas. Argumento: aun con limitaciones, estos países pueden encontrar en el uso estratégico de las herramientas de inserción internacional mecanismos para aprovechar la reconfiguración en beneficio de su desarrollo, en lugar de adaptarse de manera pasiva.\n\nSudáfrica muestra la importancia de un buen diagnóstico del sistema internacional, el peso de las capacidades burocráticas, el uso de acuerdos internacionales para generar poder y la apuesta por la región para cubrirse del riesgo global. Brasil ofrece un ejemplo de reconfiguración productiva de sectores estratégicos y fortalecimiento de capacidades nacionales, apoyado en acuerdos internacionales y en la diplomacia económica y ambiental para legitimar sus políticas. Indonesia muestra que ignorar los equilibrios en las relaciones internacionales puede poner en riesgo los objetivos económicos y el margen de maniobra. México revela que construir una posición estratégica puede ser palanca suficiente para políticas que difieren de las normas globales, incluso en energía. Los cambios del sistema pueden ser una oportunidad para los países que sepan leer los espacios de permisividad, con políticas que articulen metas productivas y de inserción internacional.\n\n## La gran reconfiguración global y los nuevos instrumentos de política económica\n\nNo se trata de un proceso de desglobalización, pues la interdependencia y la integración en los mercados globales siguen vigentes, sino de una reconfiguración en la que cobra fuerza la dimensión geopolítica. Es un proceso acumulativo que comenzó con los ajustes posteriores a la crisis de 2008 y tomó forma tras la pandemia; el Brexit y la primera elección de Trump suelen tomarse como puntos de quiebre a mediados de la década de 2010. Cuatro dimensiones permiten entender la transformación, en la que se modifican la relación Estado-mercado y los modos de participación en la economía internacional (la globalización se entiende como el incremento de la interdependencia entre Estados impulsado por el comercio, los flujos de capital, el conocimiento, la tecnología y las migraciones):\n\n• **Orden internacional.** Hiperglobalización (1989-2015): primacía de Estados Unidos y cooperación institucionalizada. Reconfiguración (desde 2016): «multilateralismo competitivo» y competencia geoeconómica.\n• **Políticas de comercio e IED.** Antes: apertura, acuerdos de libre comercio y tratados bilaterales de inversión. Ahora: nueva política industrial, nuevo proteccionismo, más sanciones comerciales y controles a la IED.\n• **Sectores estratégicos.** Antes: servicios financieros, farmacéutica, manufacturas tecnológicas, servicios de distribución. Ahora: semiconductores y minerales críticos, servicios digitales, telecomunicaciones e inteligencia artificial, insumos farmacéuticos, equipamiento para la transición energética.\n• **Alcance de la producción.** Antes: cadenas globales de valor, «hecho en el mundo para ser consumido en el mundo». Ahora: fragmentación geoeconómica, friendshoring y slowbalization.\n\n### El orden internacional y la transición de poder\n\nMientras la globalización estuvo asociada al fin de la Guerra Fría y a la hegemonía estadounidense, el escenario emergente refleja el ascenso de China y otros emergentes. La crisis de 2008, con epicentro en los países desarrollados, aceleró los cambios: profundizó la menor participación relativa del G7 en el PIB mundial y el crecimiento de China. En 2008 las exportaciones chinas superaron a las de Estados Unidos y desde 2013 sus empresas se expandieron hasta hacer de China uno de los principales emisores de IED. Con un modelo de «capitalismo de Estado» con «omnipresencia del sector público», China pasó a competir con las potencias occidentales en múltiples industrias, reclamó voz en las instituciones de gobernanza y promovió instituciones alternativas. Su ascenso traccionó a India, Indonesia, Vietnam y Tailandia, desplazando el epicentro hacia Asia Pacífico y diversificando políticas y modelos de desarrollo.\n\nRebeca Grynspan (UNCTAD) denominó a esta geografía «multilateralismo competitivo»: una difusión relativa del poder frente a la declinante hegemonía estadounidense y, a diferencia de la homogeneización que ambicionaba la hiperglobalización, una creciente diversidad de modelos. En esa diversidad ya no pesan tanto las ganancias absolutas como las relativas, cómo se distribuye el crecimiento entre países. El libre comercio deja de ser el factor estructurante y se pasa a lecturas más proteccionistas. La interdependencia pasa a ser identificada como fuente de vulnerabilidad y crecen las nociones de riesgo, porque hay actores con incentivos para aprovechar puntos vulnerables (cuellos de botella, nodos de información).\n\nLa relación sino-estadounidense marca el ritmo del cambio, entre cooperación, competencia y conflicto. En 2011 Estados Unidos desplazó su atención hacia el Pacífico; Trump definió la competencia con China como eje de su seguridad nacional y puso al comercio como herramienta central con la «guerra comercial» de 2018-2019: subas de aranceles, defensa comercial, antidumping y restricciones a las exportaciones, que llevaron a una fragmentación del comercio y la inversión según alineamientos geopolíticos. La variable ideológica o la proximidad geopolítica se volvió relevante en la selección de socios (friendshoring, Yellen) y la seguridad se expandió para incluir la «seguridad económica». Todo esto ocurre en un contexto de transformación tecnológica (industria 4.0) y de tensiones por el cambio climático y la transición energética: la densidad de vínculos económicos y el control de eslabones estratégicos y tecnologías clave son componentes de poder, y aumentaron los riesgos globales.\n\n### Políticas de comercio y de inversión extranjera directa\n\nEl Estado volvió a ocupar un lugar central en el diseño de políticas industriales, comerciales y de IED. Se amplió el instrumental, con un uso más intensivo de instrumentos existentes y su «politización», al incluir metas no económicas como la competitividad estratégica, la mitigación del cambio climático, la resiliencia de las cadenas de valor (capacidad de prevenir crisis, enfrentarlas y recuperarse) o la seguridad nacional. Se relegitimó la intervención mediante un discurso de «nueva política industrial»: intervenciones focalizadas para apoyar empresas, industrias o actividades específicas en persecución de objetivos nacionales, económicos o no (FMI), buscando mayor control nacional sobre eslabones estratégicos y metas no económicas mediante condicionalidades.\n\n**La política comercial en la reconfiguración de la globalización** tiene tres modalidades: un uso estratégico de los flujos de comercio que genera creciente proteccionismo; la negociación de acuerdos comerciales y nuevos instrumentos de cooperación; y un cambio de enfoque en la gobernanza multilateral, con el debilitamiento de la OMC.\n\n**Proteccionismo emergente y uso estratégico del poder de mercado.** El giro comenzó tras 2008 y se aceleró con la disputa Estados Unidos-China y la pandemia. Las medidas restrictivas sobre importaciones (aranceles, restricciones cuantitativas, licencias, precios de referencia, recargos) pasaron de afectar el 0,6% de las importaciones mundiales a cerca del 10% en 2023; medidas temporales se acumularon y prolongaron. La guerra arancelaria fue disruptiva: entre 2018 y 2021 Washington y Beijing aplicaron salvaguardias, aranceles y cuotas con tarifas adicionales de 10 a 25% (picos de 200%) para más de la mitad del comercio bilateral, iniciando un desacople que persiste: la participación de China en las importaciones estadounidenses cayó de 21,5% (2017) a 13,8% (2023). La direccionalidad y el volumen abarcado diferencian este uso de aranceles de los precedentes. La competencia tecnológica llevó también a restricciones a las exportaciones de bienes de uso dual y tecnológicos en Estados Unidos, la UE y China, a lo que se sumaron las sanciones contra Rusia; en el último semestre de 2023 las nuevas restricciones a exportaciones superaron a las de importaciones. También aumentaron los subsidios: según Global Trade Alert, el 42,7% de las medidas desde 2008, con un pico desde 2017, junto con las medidas compensatorias. Un último componente es la aplicación unilateral de regulaciones extraterritoriales: en 2024 Estados Unidos amplió sus prácticas antidumping para gravar productos que aventajen a su industria por tener regulaciones laborales, ambientales, de derechos humanos o de propiedad intelectual más «débiles», y la UE proyecta sus estándares verdes sin negociarlos, como con el Mecanismo de Ajuste en Frontera por Carbono (CBAM).\n\n**Acuerdos comerciales bajo el giro geoeconómico.** El 31% de los acuerdos de libre comercio vigentes corresponde a 2017-2024. A diferencia de otros períodos, se concentraron entre países con afinidad geopolítica o ideológica, incluyeron formas más flexibles de cooperación e incorporaron metas no comerciales; el poder de mercado se usó para promover la adopción de reglas y estándares. Se destaca la profundización de capítulos ambientales: la administración Biden incluyó descarbonización, coordinación de políticas ambientales con socios y exclusión de recursos de extracción no sustentable; en 2022 la UE revisó sus lineamientos para dar más relevancia a los capítulos de desarrollo sostenible, evitar una «carrera a la baja» regulatoria, fomentar la economía circular y combatir la deforestación, e incluyó liberalizar el comercio de materias primas y bienes energéticos para la transición. Estas medidas contrastan con negociaciones concretas Norte-Sur, donde suelen preservarse cuotas y restricciones con una lectura más mercantilista. Por fuera de los TLC surgieron herramientas de cooperación para la resiliencia sin mecanismos vinculantes: el Marco Económico del Indo-Pacífico (IPEF), con un pilar de resiliencia, un Consejo para revisar planes nacionales y una Red de respuesta a crisis en cadenas de valor; y los «mini-deals» de la UE y Estados Unidos, acuerdos típicamente bilaterales sobre un aspecto delimitado (por ejemplo, una barrera técnica), con negociación y ratificación más sencillas. Esta tendencia a mecanismos ad hoc, sobre todo en minerales críticos, exige mayor creatividad y flexibilidad en las estrategias de inserción.\n\n**Recuadro: política comercial y estrategias en cadenas de valor de minerales críticos.** La transición energética impulsó la demanda de litio, cobre, níquel, cobalto y tierras raras, insumos críticos y estratégicos. Estados Unidos lanzó programas como la Ley de Infraestructura y Empleos y la Ley de Reducción de la Inflación (IRA), y restricciones a «entidades extranjeras de preocupación» que consideran no solo el origen de la producción sino la composición del capital. La UE diseñó un plan de resiliencia, sustentabilidad y autonomía estratégica «abierta» (diversificación, localización y circularidad), con la Alianza Europea para las Materias Primas y el Reglamento de Materias Primas Fundamentales con metas vinculantes hasta 2030. Ambos participan del Mineral Security Partnership, con estándares ambientales, sociales y de gobernanza. Crecieron los Memorandos de Entendimiento sobre minerales críticos, mecanismos blandos de cooperación: 43 firmados entre enero de 2017 y noviembre de 2024 por 29 países y la UE (11 como bloque).\n\n**Multilateralismo debilitado, acciones unilaterales.** La OMC perdió capacidad para moldear la conducta de los Estados, tanto en su función negociadora (pocos y limitados acuerdos multilaterales en el siglo XXI) como por la parálisis del Órgano de Apelación. El fracaso de la Ronda de Doha (lanzada en 2001) fue el primer indicio de que la gobernanza de la hiperglobalización no producía resultados bajo un multilateralismo competitivo; solo se lograron acuerdos parciales y menos «profundos» (Facilitación del Comercio 2013, subvenciones agrícolas a la exportación 2015, subvenciones a la pesca 2022). Se desarrolló una agenda plurilateral (comercio electrónico, facilitación de inversiones, regulación doméstica de servicios) acordada solo por algunos miembros, lo que hace menos esperable una regulación homogénea. El rechazo estadounidense a nombrar árbitros disolvió de facto el Órgano de Apelación: una parte puede «apelar» un informe sin que exista quien lo reciba (31 apelaciones sin resolver a mediados de 2024). El debilitamiento se retroalimenta con las acciones unilaterales extraterritoriales, lo que aumenta la vulnerabilidad de los países de ingresos medios pero genera algunos nichos de oportunidad.\n\n**Inversión extranjera directa: friendshoring, control e influencia.** El crecimiento de la IED fue más lento y volátil, los Estados modificaron sus lineamientos priorizando la resiliencia (uso más intenso de medidas en 2022 según la UNCTAD) y la IED mundial se redujo. Se distinguen tres estrategias:\n\n• **Reshoring, nearshoring y friendshoring.** Relocalización nacional, regionalización por proximidad geográfica y por proximidad geopolítica. Tras la vulnerabilidad de la pandemia y los cambios de costos por el salto tecnológico, se fortaleció el posicionamiento de los territorios nacionales en sectores estratégicos con un enfoque de «seguridad económica». Estados Unidos impulsó el reshoring: en 2021 identificó cuatro áreas para atraer IED (semiconductores, baterías para vehículos eléctricos, minerales críticos y farmacéuticos) con incentivos fiscales, subsidios condicionados a contenido local e infraestructura; la Ley CHIPS y Ciencia (2022) destinó USD 52,7 mil millones, condicionados a no realizar transacciones significativas para expandirse en países como China. La UE sancionó su Ley de Chips (2023) con EUR 11,15 mil millones. Estos planes reaccionan en parte al «Made in China 2025» (2015), basado en subsidios y regulaciones de propiedad intelectual que «facilitaron» la transferencia de tecnología.\n• **Controles y prohibiciones sobre la inversión.** En 2018 Estados Unidos fortaleció el monitoreo del impacto de la IED sobre la seguridad nacional en tecnologías críticas, infraestructura y datos sensibles. Se expandió globalmente el control de flujos entrantes y salientes, concentrado en sectores tecnológicos para limitar a otros países en la competencia tecnológica; la UE incorporó en 2019 un mecanismo de monitoreo. A fines de 2023, treinta y siete países tenían controles por seguridad nacional, que alcanzan al 68% de la IED global.\n• **La inversión como instrumento de competencia geopolítica.** Grandes programas como la Iniciativa de la Franja y la Ruta (BRI) china, lanzada en 2013 con inversión en infraestructura e interdependencia comercial, primero en Asia Pacífico y global desde 2017: a diciembre de 2023, 146 países (casi 75% del mundo) habían firmado memorandos y la inversión superaría USD 950 mil millones. Estados Unidos y el G7 respondieron con Build Back Better World (B3W), coordinando capital de actores que convergen en valores democráticos, con la Asociación para la Infraestructura e Inversión Mundiales (PGII) y el Fondo ITSI. La UE impulsa Global Gateway en lo digital, energético, transporte, salud, educación e investigación, con la ambición de movilizar hasta EUR 300 mil millones entre 2021 y 2027.\n\n### Sectores económicos estratégicos\n\nMientras entre 1990 y 2015 los sectores prioritarios fueron los servicios financieros, la farmacéutica, las manufacturas tecnológicas y los servicios de distribución, la reconfiguración da lugar a nuevas prioridades. Primero, las industrias de aprovisionamiento energético: minerales críticos, energías tradicionales y tecnologías bajas en carbono. La agenda climática, con la electrificación y la eficiencia energética, convierte al litio, cobre, níquel, cobalto y tierras raras en insumos estratégicos con sensibilidad geopolítica; los gobiernos buscan controlar sus cadenas priorizando socios y concentrando los últimos eslabones en su industria. La guerra en Ucrania mostró la importancia de las fuentes convencionales y no convencionales. Segundo, los sectores ligados a la innovación tecnológica, sobre todo los semiconductores, presentes en vehículos, aeronaves, armamento y equipos informáticos, con capacidades concentradas en pocos países (lo que genera vulnerabilidad) y gran potencial de empleo y valor agregado. Vinculadas a ambos grupos, industrias como la electromovilidad: las baterías combinan litio, níquel y cobalto, y los autos eléctricos tienen de 3 a 10 veces más semiconductores que los de combustión.\n\nLa reconfiguración profundizó también la servificación del comercio (los servicios son el 50% del comercio mundial medido en valor añadido); la pandemia aceleró los servicios digitales, que Rodrik y Stiglitz jerarquizan para los países en desarrollo como generadores de empleo. Los datos se vuelven «factor productivo» y diferencial de competitividad: plataformas digitales, tecnologías logísticas y procesamiento de datos son subsectores estratégicos. La automatización y la IA son disruptivas, con impactos que dependen de la infraestructura digital, el capital humano, la innovación y la regulación, y son relevantes en clave geopolítica por sus usos en defensa. La competencia Estados Unidos-China elevó la relevancia de los bienes de uso dual (electrónicos, telecomunicaciones, navegación, láseres, sensores), objeto de regulaciones específicas. Finalmente, la pandemia jerarquizó el control de los bienes críticos, cuya falta de suministro puede causar pérdidas humanas, como los insumos médicos y farmacéuticos. Lo que se consideraba estratégico hasta hace poco no es lo mismo en el mundo pospandemia, y los instrumentos de la reconfiguración se centran en estos sectores.\n\n### Alcance de la producción\n\nEl comercio y la inversión crecieron más lento que antes: slowbalization. Entre 2008 y 2023 el comercio creció menos que el PIB global, revirtiendo la relación previa; la relación IED/PIB pasó de 3,4% antes de 2008 a 2,5%. Además, varían según nuevos factores: la conjunción de restricciones comerciales, instrumentos distorsivos en IED y subsidios moldea una «fragmentación geoeconómica». El comercio entre países geopolíticamente próximos (con votaciones semejantes en la Asamblea General de la ONU) creció más que entre países distantes, y la tendencia se profundizaría. Por ahora la diferencia es marginal (4,2% más), pero tiene mecanismos sólidos que hacen esperable su extensión; los proyectos de IED greenfield entre países geopolíticamente distantes cayeron del 23% al 13% del total entre 2013 y 2022.\n\nDos precisiones. La interconexión sigue siendo fuerte: la reconfiguración no implica desglobalización; la disputa es por el control de las cadenas globales, buscando reducir la vulnerabilidad en sectores clave antes que estrategias autárquicas. Y su alcance varía por sector y geografía: es más fuerte en sectores estratégicos y entre los protagonistas de las disputas que tejieron vínculos interdependientes y ahora los morigeran sin romperlos (Estados Unidos-China, UE-Rusia), y menos acentuada en el Sur Global, donde surgen nuevos posicionamientos. Se destacan los «conectores» (Vietnam, Polonia, Marruecos, México, Indonesia): países con posicionamientos equilibrados que triangulan comercio e inversión entre actores distantes (1% más de importaciones desde Estados Unidos se asocia a 1,6% más de exportaciones hacia China) y absorben parte de los costos de la fragmentación. Se conforma así una globalización multinivel: sectores con lógica de interdependencia mundial y sectores donde comercio e inversión se fragmentan en clave geopolítica.\n\n## La adaptación de las estrategias de inserción internacional en países del Sur Global\n\n### En búsqueda de la inserción internacional\n\nEl nuevo contexto obliga a repensar las políticas de desarrollo y las estrategias de inserción (Rodrik y Stiglitz). Predominan las recomendaciones de desarrollo orientado por las exportaciones, que suponen ausencia de riesgos geopolíticos para deslocalizar la producción, un mercado global con baja intervención estatal (fair play) y baja disrupción climática: factores ya no esperables. Los países desarrollados, con su poder de mercado y capacidad regulatoria y fiscal, se adaptaron y moldearon el desacople y el friendshoring. Los riesgos crecientes sugerirían un contexto muy restrictivo para el Sur Global, pero la evidencia preliminar indica estrategias diferenciadas y cierta permisividad internacional. El Sur Global explica el 25% de las medidas de nueva política industrial desde 2022, con instrumentos propios: más restricciones a las importaciones e incentivos fiscales, mientras en el Norte predominan subsidios y créditos directos.\n\nSe analizan cuatro países de ingresos medios que buscan salir de la «trampa de los ingresos medios»: la diplomacia económica asociada a la política industrial de Sudáfrica; la nueva política industrial de Brasil vinculada a la agenda ambiental y la transición energética; las restricciones a las exportaciones de níquel de Indonesia; y la soberanía energética de México. Combinan sectores agrícolas y mineros con industrias de tecnología media, usan activamente la «nueva política industrial» y tienen diversa exposición geopolítica. Se compara con Argentina en PIB, complejidad, apertura, TLC con Estados Unidos y China e integración regional (AfCFTA, Mercosur, ASEAN, T-MEC).\n\nLos países de ingresos medios pueden sacar provecho de la reconfiguración y no ser meros tomadores de reglas; no hay una única vía, pero los instrumentos de inserción externa que ordenan la vinculación del mercado doméstico con el sistema internacional son estratégicos. Las estrategias combinan componentes tradicionales de política exterior (alineamiento o seguimiento de la potencia, y/o balanceo entre la hegemónica y la ascendente) con instrumentos de reposicionamiento en las cadenas de valor, para vincular la producción local con los mercados globales, amortiguar riesgos y generar mecanismos de resolución de problemas colectivos.\n\nAggarwal y Kenney sintetizan tres conjuntos de respuestas de las potencias emergentes: fortalecimiento de las capacidades nacionales (self-reliance); cobertura (hedging), combinando acciones hacia Estados Unidos y China con diversificación de riesgos y resiliencia; y aprovechamiento de los marcos institucionales, con regímenes de cooperación, integración económica y coordinación de políticas. Sobre esa base se definen tres estrategias: fortalecimiento de capacidades nacionales; cobertura, diversificación de riesgos y resiliencia; y aprovechamiento de acuerdos internacionales. No son excluyentes: Sudáfrica da un rol prominente a la diplomacia económica, mientras Indonesia combina de manera más simétrica. Síntesis: Sudáfrica, diplomacia económica (automotriz, economía verde, minerales críticos, vehículos eléctricos); Brasil, reindustrialización (agroindustria, salud, infraestructura, digitalización, bioeconomía, defensa); Indonesia, nacionalismo de recursos (minerales críticos, acero inoxidable, baterías); México, soberanía energética (sector energético no renovable).\n\n### Sudáfrica y la diplomacia económica\n\nSudáfrica priorizó la diplomacia económica exterior (política exterior centrada en las relaciones económicas, desde misiones comerciales hasta la promoción de reglas en organismos) como componente clave de su política industrial: materializar prioridades nacionales mediante la diplomacia, amplificar en mercados externos los esfuerzos domésticos y preservar autonomía y resiliencia. Apoyándose en su posición en múltiples acuerdos y plataformas, buscó mejorar relaciones clave como la de Estados Unidos y diversificar riesgos apostando a la región y a los BRICS. Los acontecimientos de 2020-2023 llevaron a un diagnóstico de «policrisis»; la revisión de la «Estrategia Industrial Reimaginada» (2019) reconoció la necesidad de fortalecer la resiliencia y la adaptación a los shocks, con diversificación de plataformas, socios, canastas e instrumentos: una estrategia de cobertura combinada con capacidades nacionales y soportes institucionales.\n\nLo distintivo es el «multialineamiento»: diversificar vínculos institucionalizando mecanismos de diplomacia económica de forma balanceada entre polos de poder, con agendas específicas para cada contraparte, y un ejercicio activo en foros multilaterales. Sus lineamientos bilaterales se apoyan en instrumentos institucionalizados (TLC, cooperación, diálogo estructurado), tienen un objetivo de mercado diferenciado por relación, conjugan el multialineamiento y se vinculan con programas de desarrollo industrial, generando sinergias entre lo doméstico y lo internacional. Sostiene que posicionarse como formadora de reglas en ámbitos multilaterales maximiza la proyección de su interés nacional.\n\nEl espacio prioritario es África y el Acuerdo de Libre Comercio Continental Africano (AfCFTA, vigente desde 2019), visto como central para la resiliencia frente a la fragmentación; Sudáfrica busca proyectarse con productos de mayor valor agregado y posicionar estratégicamente a la región (por ejemplo, un marco africano para minerales críticos y una Comisión de Minerales). Con Estados Unidos y China mantiene el no alineamiento con nutridas agendas de cooperación que refuerzan programas industriales, y busca posicionarse como Estado «conector» o «articulador» en las cadenas globales.\n\nCon Estados Unidos, pese a los vaivenes por el no alineamiento, obtuvo respaldo económico: es su principal socio en la región, vía la Ley de Crecimiento y Oportunidades para África (AGOA), instrumento unilateral que otorga preferencias hasta septiembre de 2025, condicionado a Estado de derecho, derechos humanos, derechos laborales y política exterior, y que incluye el 18% de sus exportaciones a ese país. La AGOA se apalancó con la política industrial (Programa de Producción y Desarrollo Automotriz y Automotive Masterplan 2021-2035), dando certidumbre al sector: entre 2001 y 2022 las exportaciones de autos a Estados Unidos crecieron 447% y las importaciones 671%; las exportaciones a terceros pasaron de USD 2096 a 12.669 millones; desde 2007 es exportador neto y en 2023 tuvo un superávit de USD 4355 millones. Ante el vencimiento de la AGOA, Ramaphosa desplegó diplomacia hacia actores clave apalancándose en su rol de proveedor de minerales críticos (principios compartidos, misiones de alto nivel).\n\nCon China la relación se fortaleció mediante misiones comerciales y una veintena de memorandos en economía verde, economía azul e industrialización digital; Sudáfrica se integró a la BRI y firmó acuerdos para financiar inversiones en dispositivos médicos, economía verde, vehículos eléctricos, hidrógeno y Zonas Económicas Especiales, replicando la sinergia entre planes domésticos e incentivos externos. Con la UE la diplomacia se canalizó por el Acuerdo de Asociación Económica con la SADC (2016) y una asociación estratégica 2021-2027. Por su matriz energética basada en carbón, el Pacto Verde Europeo impactaría exportaciones por USD 1,5 mil millones y podría reducir el comercio un 4%: la diplomacia económica se usó contra el «proteccionismo verde» del CBAM (protesta formal, acciones multilaterales), mientras desarrolló un Electric Vehicles White Paper siguiendo lineamientos de la UE y el Reino Unido.\n\nEl último componente es la diplomacia en foros multilaterales y plurilaterales: Sudáfrica busca ser referente regulatorio del Sur Global con un rol «constructivo», reconociendo que aun sin efecto económico inmediato estas acciones crean un entorno favorable. Defiende el espacio de políticas para la industrialización y los desafíos climáticos y un sistema basado en reglas en la OMC, perspectiva replicada en el BRICS y el G20; promovió un Panel sobre Minerales Críticos en la ONU y coberturas en sistemas de pagos (PAPSS, BRICS Pay). En suma, los instrumentos de diplomacia económica se entienden como un todo que refuerza el apalancamiento, como mecanismos de balanceo y diversificación de riesgos, con objetivos diferenciados hacia África y hacia los mercados emergentes. Diplomacia económica, política industrial y política comercial se refuerzan «como un círculo». El caso sostiene que la diplomacia y la política exterior pueden ser medulares en las estrategias industriales y de inserción, y que una inserción en múltiples plataformas puede apalancar capacidades frente a los shocks.\n\n### Brasil y la estrategia de reindustrialización\n\nBrasil aborda a la vez revertir la desindustrialización relativa y adaptarse a las obligaciones y oportunidades de la transición energética, con fortalecimiento de capacidades nacionales articulado con diplomacia económica y, en menor medida, apalancamiento en instituciones internacionales. Desde 2023 el tercer gobierno de Lula buscó recuperar la política exterior tradicional (autonomía, diversificación, pertenencia al Sur Global) y revertir la primarización y la desindustrialización precoz, fortaleciendo asociaciones con emergentes (BRICS) y buscando reformar la gobernanza internacional (Consejo de Seguridad, OMC, instituciones financieras). El compromiso climático es un factor de legitimación doméstica e internacional frente a Bolsonaro; Brasil tiene tradición de diplomacia ambiental (Cumbre de la Tierra de 1992), casi 90% de generación eléctrica renovable y un programa de biocombustibles que funciona sin subsidios permanentes.\n\nEn enero de 2024 lanzó Nova Indústria Brasil para enfrentar la desindustrialización precoz, la primarización, el acortamiento de las cadenas y la baja complejidad exportadora. Adopta el enfoque por misiones (Mazzucato): cadenas agroindustriales sostenibles y digitales; complejo industrial sanitario resiliente; infraestructura, saneamiento, vivienda y movilidad sostenibles; transformación digital de la industria; bioeconomía, descarbonización y seguridad energética; tecnologías para la soberanía y la defensa. Busca aprovechar la tendencia global hacia la nueva política industrial y minimizar problemas de coordinación entre agencias. La sustentabilidad condiciona las políticas a metas no económicas, responde a los requisitos de acceso a mercados de Estados Unidos y la UE, y legitima la estrategia también internamente frente a críticos liberales que la ven anacrónica, dándole un «ropaje de modernidad». Adopta el desarrollo sostenible en su triple faceta según los ODS, con herramientas que van de las tendencias internacionales al tradicional crédito público subsidiado.\n\nEl Plan de Acción privilegia tres herramientas: instrumentos financieros (créditos, subvenciones y subsidios por USD 55 mil millones hasta 2026 e incentivos fiscales cercanos al 3% del PIB, vía BNDES, Embrapii y FINEP), más finanzas sostenibles (taxonomía verde, bonos y mercado regulado de carbono); mejora del entorno empresarial (capacitación, promoción externa, reducción de ineficiencias regulatorias); y compras públicas del Estado, las empresas estatales y las Fuerzas Armadas. A diferencia de Sudáfrica, Indonesia y México, ni la estrategia diplomática ni el plan mencionan al Mercosur, por el declive del comercio intrazona, el cambio de preferencias brasileñas hacia China y Asia, y sectores que no apuntan a encadenamientos regionales.\n\nLos objetivos se vinculan con resiliencia y sectores estratégicos: agricultura familiar y biodiversidad con maquinaria agrícola, biomateriales y biocombustibles; transformación digital con fabricación nacional de semiconductores; transición energética con bienes de capital para renovables; desarrollo urbano con electromovilidad. El foco en biocombustibles es una elección nacionalista por razones tecnológicas, basada en las fortalezas brasileñas. Hay metas de producción nacional en defensa (evidenciada por Ucrania) y salud (por la pandemia). Hitos: en 2023 se eliminó la exención a autos eléctricos e híbridos importados, restituyendo el arancel externo común del 35% para promover la producción doméstica; el Programa MOVER (ley en 2024) dispone USD 3,5 mil millones hasta 2028 con beneficios por eficiencia, reciclado y emisiones, penalizaciones y medición de ciclo completo; los compromisos para biocombustibles superan USD 36,4 mil millones (Combustible del Futuro); se revirtió el cierre de la estatal de semiconductores CEITEC y se ampliaron los fondos del PADIS.\n\nEn política exterior: la Iniciativa Global Conjunta con Estados Unidos por los derechos de los trabajadores hace de la transición un vector de empleo de calidad; el diálogo con la UE incluyó fondos para la Amazonía e inversiones en hidrógeno verde por USD 2 mil millones (Global Gateway). Impulsó el acuerdo Mercosur-UE, pero planteó renegociaciones alineadas con su política industrial (financiamiento, fomento y amplia autonomía en compras públicas). En suma, la transición energética fue internalizada como justificación de la reindustrialización y permite incorporar instrumentos y subsidios con metas de contenido local. Que las potencias industriales sean más activas le da a Brasil mayor permisividad para subsidios, compras públicas y transferencia tecnológica, junto con bonos verdes y mercados de emisiones; los estímulos se enfocan en tecnologías de mayor desarrollo doméstico (biocombustibles, híbridos). Brasil abraza las obligaciones de la transición con la condición de privilegiar la generación de capacidades nacionales, y aspira a recuperar un liderazgo en el Sur Global e interlocución con Occidente vía foros e instituciones, no vía integración regional. La diplomacia económica y ambiental son piezas clave para ganar legitimidad, reducir vulnerabilidad e incrementar el apalancamiento.\n\n### Indonesia y el nacionalismo de recursos\n\nLos países con grandes reservas de minerales críticos tienen una ventaja geoestratégica: Indonesia dispone del 42% de las reservas mundiales de níquel, pero convertir esa ventaja en crecimiento y reinserción depende de las políticas. A principios de 2020 prohibió las exportaciones de níquel para desarrollar la industria de acero inoxidable y de baterías para vehículos eléctricos. La medida muestra la articulación entre objetivos de política doméstica y exterior, y también sus límites: la política comercial no es por sí misma motor del desarrollo productivo estratégico. El «nacionalismo de recursos» data de más de una década (desde 2009 hubo resoluciones que robustecían o flexibilizaban el control) hasta la prohibición total anunciada en 2019, adelantada respecto de 2022. El gobierno invocó la creación de empleo, el desarrollo industrial y la inserción estratégica en las cadenas de VE para asegurar autonomía frente a presiones externas, dentro de la doctrina de «independencia y proactividad» (bebas dan aktif). Su respuesta articula de forma simétrica capacidades nacionales, cobertura y aprovechamiento de regímenes: impulsó cooperación en minerales críticos en el Pilar I del IPEF, propuso en 2022 una organización de productores de níquel al estilo de la OPEP y lideró la expansión institucional regional con acuerdos basados en la ASEAN, espacio crucial de su estrategia.\n\nEfectos comerciales: entre 2020 y 2022 las cantidades exportadas de productos metálicos derivados del níquel (ferroníquel, matas, arrabio, lingotes de acero inoxidable) aumentaron 194% y los ingresos de divisas pasaron de USD 7,3 a 23,7 mil millones (324%), por el mayor valor agregado. Esto respondió a la prohibición y a la promoción industrial: en 2014 se había ensayado la medida sin promoción productiva, con magros resultados; en 2020 se relanzó con un intenso programa de promoción de inversiones en procesamiento de níquel, acero inoxidable y baterías, dentro del Plan Nacional de Desarrollo Industrial 2015-2035, con diplomacia económica bilateral y memorandos con multinacionales. La extracción creció 233% entre 2020 y 2023 y las fundiciones pasaron de 2 en 2014 a 13 en 2020 y 39 en 2023, con 17 más en construcción. Indonesia integra progresivamente su cadena, resuelve el abastecimiento de litio vía diplomacia con socios como Australia, adapta su industria automotriz a la electromovilidad y gestiona su apertura estratégicamente.\n\nEfectos geopolíticos: la UE llevó el caso al Órgano de Solución de Diferencias de la OMC; el informe la favoreció, pero Indonesia apeló al inexistente Órgano de Apelación, mantuvo la prohibición y extendió medidas similares a la bauxita. China se volvió el principal socio financiero y comercial del sector: concentra el 90,53% de la demanda de los productos de acero inoxidable exportados y buena parte de la IED en fundiciones, en parte por la diplomacia de Widodo hacia los parques industriales y hacia Xi Jinping. La estrategia no apuntaba exclusivamente a China, pero el peso chino en el procesamiento del níquel y su interés en trasladar parte de las cadenas del acero y las baterías generaron una relación asimétrica de dependencia. Indonesia intenta ser neutral entre Estados Unidos y China, por lo que el resultado geopolítico no es favorable: acentuó la dependencia, reduce la autonomía del incipiente sector y limita su inserción en otro
