<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestría Estudios Internacionales - UTDT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: estudio editorial en papel crudo y tinta roja. Título enorme en serif de alto contraste, rótulos chicos en versalitas espaciadas, filetes rojos finos, retratos en duotono rojo. */
:root{
  --paper:#ECE2D4; --card:#F2EADF; --ink:#C02D1A; --text:#B42A18; --muted:#C35F49; --line:#DDB3A3;
  --accent:#C02D1A; --accent-soft:#F0D5CA;
  --ok:#2F6F4A; --ok-soft:#D7E6D3; --warn:#9A5A00; --warn-soft:#F3DFC0; --bad:#A3241A; --bad-soft:#F2CFC6;
  --panel-ink:#1F1B2D;
  --f-display:"Cormorant Garamond", "Bodoni 72", Didot, Georgia, serif;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 18px;border-bottom:1.5px solid var(--ink)}
header.top h1{font-size:clamp(34px,6vw,52px);line-height:1}
header.top h1 em{font-style:italic;color:var(--accent)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}

/* hoy */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--ink)}
.tcard .when{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tcard .when.hoy{color:var(--accent)}
.tcard h4{font-size:18px;line-height:1.25}
.tcard .sub{font-size:13px;color:var(--muted)}

/* carpetas */
.year{margin-top:34px}
.year>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.year>summary::-webkit-details-marker{display:none}
.year>summary h2{font-size:30px}
.year>summary .chev{transition:transform .2s;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.year[open]>summary .chev{transform:rotate(90deg)}
.tri{margin-top:22px}
.ysum{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.ysum h2{font-size:clamp(40px,6vw,68px);font-weight:400;letter-spacing:-.03em}
.tri-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:12px}
.tri-head h3{font-size:21px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}

/* cartas de materia */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s, box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 8px 0 -2px var(--line)}
.mcard .code{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.mcard .short{font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.15;color:var(--ink)}
.panel{aspect-ratio:1/1;max-width:100%;border-radius:3px;display:grid;place-items:center;color:var(--panel-ink);position:relative;overflow:hidden}
.panel>svg{width:78%;height:78%}
.panel>svg.pt{width:100%;height:100%;display:block;align-self:end}
.panel svg.pt .badge *{stroke-width:7}
.mcard .prof{font-family:var(--f-display);font-size:16px;font-style:italic}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.grade{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
.grade span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grade b{font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1;color:var(--ok)}
.avg{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.avg b{font-family:var(--f-display);font-size:20px;font-weight:500;color:var(--ink)}
.mcard .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* detalle */
.back{margin-top:20px;border:none;background:none;padding:0;cursor:pointer;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.dhead{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:24px;align-items:start;margin-top:14px}
@media (max-width:600px){.dhead{grid-template-columns:1fr}.dhead .panel{max-width:160px}}
.dhead h2{font-size:clamp(28px,4.4vw,42px);line-height:1.08;margin-top:4px}
.dhead .prof{font-family:var(--f-display);font-style:italic;font-size:19px;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px}
.facts div{min-width:0}
.facts b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{margin-top:12px;font-size:13px;color:var(--muted);max-width:65ch}
.stats{display:flex;gap:26px;margin-top:16px;font-variant-numeric:tabular-nums}
.stats .n{font-family:var(--f-display);font-size:32px;line-height:1}
.stats .k{font-size:12px;color:var(--muted)}

.classes{margin-top:30px;display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.cls{border-bottom:1px solid var(--line)}
.cls>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:14px 4px}
.cls>summary::-webkit-details-marker{display:none}
.cls .num{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.cls .tema{font-family:var(--f-display);font-size:19px;line-height:1.25}
.cls .cmeta{font-size:12px;color:var(--muted);margin-top:2px}
.cls .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cls.is-next .num{color:var(--accent)}
.cls-body{padding:0 4px 18px 66px;display:flex;flex-direction:column;gap:10px}
@media (max-width:600px){.cls-body{padding-left:4px}}
.txt{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.txt>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.txt>summary::-webkit-details-marker{display:none}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);margin-top:5px}
.dot.on{background:var(--ink)}
.txt .ttl{min-width:0;flex:1;font-size:14px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.ac{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.txt-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;width:max-content}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
textarea,input[type=text],input[type=url],input[type=number],input[type=date]{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;line-height:1.5}
textarea{min-height:110px;resize:vertical}
textarea.sm{min-height:60px}
.resumen-prev{font-family:var(--f-display);font-size:15.5px;line-height:1.55;color:var(--muted);max-width:68ch}
.readlink{cursor:pointer;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.reader{max-width:70ch;margin-top:16px}
.reader h2{font-size:clamp(26px,4vw,38px);line-height:1.12;margin-top:6px}
.reader-body{margin-top:22px;font-family:var(--f-display);font-size:18px;line-height:1.65}
.reader-body p{margin:0 0 .9em}
.reader-body h2,.reader-body h3{font-size:24px;margin:1.4em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
.reader-body h4,.reader-body h5{font-family:var(--f-ui);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:1.3em 0 .4em}
.reader-body ul{margin:0 0 .9em;padding-left:1.2em}
.reader-body li{margin-bottom:.35em}
.readnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;max-width:70ch}
.navbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;font-family:var(--f-display);font-size:16px}
.navbtn:last-child{text-align:right}
.navbtn:hover{border-color:var(--ink)}
.resumen-view{font-family:var(--f-display);font-size:16.5px;line-height:1.6;white-space:pre-wrap;max-width:68ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.link{border:none;background:none;color:var(--muted);padding:4px 6px;text-decoration:underline}
.ex{border-left:2px solid var(--accent);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.ex .q{font-weight:600}
.ex details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.ex .a{font-size:14px;white-space:pre-wrap;margin-top:4px}
.sect{display:flex;flex-direction:column;gap:8px}
.add{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 14px;text-align:left;color:var(--muted);cursor:pointer;font-weight:600}
.add:hover{border-color:var(--ink);color:var(--ink)}

/* cuotas */
.payhero{margin-top:24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.payhero{grid-template-columns:1fr}}
.big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.big h2{font-size:clamp(26px,4vw,36px);line-height:1.1;margin-top:6px}
.big p{margin:8px 0 0;color:var(--muted)}
.window{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-top:16px}
.window i{height:22px;border-radius:2px;background:var(--line)}
.window i.in{background:var(--accent-soft)}
.window i.today{background:var(--ink)}
.window i.in.today{background:var(--accent)}
.wlegend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv a{color:var(--accent)}
.months-year{margin-top:30px}
.months-year h3{font-size:22px;margin-bottom:12px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mo:hover{border-color:var(--ink)}
.mo[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.mo .mn{font-family:var(--f-display);font-size:20px;text-transform:capitalize}
.mo .amt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.st{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.st.pagado{background:var(--ok-soft);color:var(--ok)}
.st.ventana{background:var(--warn-soft);color:var(--warn)}
.st.vencida{background:var(--bad-soft);color:var(--bad)}
.st.sinreg{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.st.futura{background:transparent;color:var(--muted);border:1px solid var(--line)}
.st.proxima{background:var(--accent-soft);color:var(--accent)}
.editor{margin-top:14px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.editor .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.editor label span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20}


/* avance */
.prog{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.prog .ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.prog .pct{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.prog .pk{color:var(--muted);font-size:13px}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:12px}
.seg{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent)}
.seglab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:5px;font-size:11px;color:var(--muted);text-align:center}
.seglab .yr{font-weight:700}
/* promedio */
.avghero{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.avghero .big .n{font-family:var(--f-display);font-size:clamp(48px,8vw,72px);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.avghero .big .k{color:var(--muted);font-size:13px;margin-top:6px}
.gtable{margin-top:28px}
.gtable h3{font-size:22px;margin:22px 0 8px}
.grow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.grow .sw{width:44px;height:44px;border-radius:6px;overflow:hidden;display:grid;place-items:center}
.grow .sw svg{width:100%;height:100%}
.grow .nm{font-family:var(--f-display);font-size:18px;line-height:1.25}
.grow .pf{font-size:12.5px;color:var(--muted)}
.grow .gv{display:flex;align-items:center;gap:6px}
.grow .gv b{font-family:var(--f-display);font-size:28px;font-weight:500;color:var(--ok);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.grow .gv input{width:64px;padding:5px 8px}
.grow .pend{font-size:12px;color:var(--muted)}


/* la maestría */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 32px;margin-top:22px}
.mblock{border-top:1px solid var(--ink);padding:14px 0 22px;min-width:0}
.mblock h3{font-size:30px;font-weight:400;line-height:1.05;margin-top:4px}
.mblock p{margin:8px 0 0;max-width:62ch}
.mlist{list-style:none;margin:10px 0 0;padding:0}
.mlist li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mlist li span:first-child{min-width:0}
.mlist li span:last-child{flex:none;text-align:right}
.mlist li span:last-child{color:var(--muted);font-size:12.5px}
.mlist li.ok span:first-child::before{content:"✓ ";color:var(--ok)}
.mfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 24px;margin-top:22px}
.mfacts div{border-top:1px solid var(--ink);padding:10px 0 14px}
.mfacts b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;line-height:1.05;color:var(--ink);font-variant-numeric:lining-nums}
.mfacts span{font-size:12.5px;color:var(--muted)}
.plan2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:4px}
.pcard{border-top:1px solid var(--ink);padding:10px 0;min-width:0}
.pcard .short{font-family:var(--f-display);font-size:22px;line-height:1.1;color:var(--ink)}
.pcard .code{font-size:10px;letter-spacing:.18em;font-weight:600;text-transform:uppercase;color:var(--muted)}
/* intercambio */
.xhero{margin-top:18px}
.xhero h2{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,84px);line-height:1;color:var(--ink);margin:6px 0 0}
.xsub{margin:6px 0 0;color:var(--muted)}
.xform{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.xlinks a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.xnota{border-top:1px solid var(--line);padding:10px 0}
.xn-txt{white-space:normal;overflow-wrap:anywhere}
/* pdf */
.clip{vertical-align:-2px;flex:none}
a.tag.pdf{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.clipbtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.lacts{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){.lread li{grid-template-columns:auto minmax(0,1fr);row-gap:6px}.lacts{grid-column:2;justify-content:flex-start}}
/* lecturas */
.wk{margin-top:30px}
.wk>.ysum h2{font-size:clamp(34px,5vw,56px)}
.lcls{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px 28px;padding:18px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.lcls{grid-template-columns:1fr}}
.lcls .when{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.lcls .dd{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.lcls .mod{font-size:12px;color:var(--muted);margin-top:4px}
.lcls h4{font-size:24px;line-height:1.15}
.lcls .sub{font-size:13px;color:var(--muted);margin-top:2px}
.lread{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.lread li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lread li .tt{font-size:14.5px;overflow-wrap:anywhere}
.lread li.done .tt{text-decoration:line-through;text-decoration-color:var(--line)}
.lread input{width:17px;height:17px;accent-color:var(--ink)}
.lsum{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
.lsum b{font-family:var(--f-display);font-size:26px;font-weight:400;color:var(--ink);margin-right:4px;font-variant-numeric:lining-nums}
/* calendario */
.calbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:24px}
.calbar h2{font-size:clamp(28px,4.4vw,40px);text-transform:capitalize;margin-right:auto}
.calbar .btn{min-width:38px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.cal .dow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px 4px}
.day{min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.day.out{background:transparent;border-style:dashed;opacity:.5}
.day.hoy{border:2px solid var(--accent)}
.day[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.day .dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.day.hoy .dn{color:var(--accent)}
.ev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11.5px;line-height:1.25;padding:3px 6px;border-radius:5px;color:#1F1B2D;overflow:hidden;overflow-wrap:anywhere}
.ev.dl{background:transparent!important;border:1.5px dashed var(--ink);color:var(--ink)}
:root{--c-virt:#A9BFEE;--c-hib:#BFDAA6;--c-fer:#FFF27A;--c-exa:#E8897A;--c-evt:#E979E4}
.ev.virt{background:var(--c-virt)}.ev.hib{background:var(--c-hib)}.ev.evt{background:var(--c-evt)}.ev.exa{background:var(--c-exa)}
.ev{border-left:4px solid var(--sc,transparent)}
.day.fer{background:color-mix(in srgb,var(--c-fer) 55%,var(--card))}
.day.exa{background:color-mix(in srgb,var(--c-exa) 40%,var(--card))}
.day .tag-d{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6B5A00}
.day.exa .tag-d{color:#7A2416}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid #1F1B2D22}
.dots i.virt{background:var(--c-virt)}.dots i.hib{background:var(--c-hib)}.dots i.evt{background:var(--c-evt)}.dots i.exa{background:var(--c-exa)}
.warn{color:var(--bad);font-weight:600}
.evcard .links{margin-top:6px;font-size:13px}.evcard .links a{color:var(--accent)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid #1F1B2D33}
.dots i.dl{background:transparent;border:1.5px dashed var(--ink)}
@media (max-width:640px){.day{min-height:54px;padding:5px}.day .ev{display:none}.dots{display:flex}}
.dayhead{margin-top:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h3{font-size:24px}
.evlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.evcard{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-width:0}
.evcard:hover{border-color:var(--ink)}
.evcard .sw{border-radius:4px}
.evcard h4{font-size:19px;line-height:1.25;margin-top:2px}
.evcard .sub{font-size:13px;color:var(--muted)}
.evcard ul{margin:6px 0 0;padding-left:1.1em;font-size:13.5px}
.evcard .when{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.undated{margin-top:30px}
.undated h3{font-size:22px}
.undated ul{margin:8px 0 0;padding-left:1.1em;font-size:14px;color:var(--muted)}

body{color:var(--text);font-size:14px}
h1,h2,h3,h4{font-weight:500;letter-spacing:-.015em;color:var(--ink)}

.mcard:hover{transform:none;box-shadow:none}

.mcard .code{color:var(--ink);letter-spacing:.18em;font-size:10px}
.mcard .short{min-height:2.04em}
.mcard .prof{color:var(--muted);font-size:17px}
.panel{border-radius:0;filter:url(#duo);background:#6C6C6C!important}
.grow .sw{filter:url(#duo);border-radius:0;background:#6C6C6C!important}
.bar{height:2px;border-radius:0;background:var(--line)}.bar i{background:var(--ink)}
.year>summary{border-bottom:1px solid var(--ink)}
.year>summary h2{font-size:clamp(44px,6vw,72px);font-weight:400;letter-spacing:-.03em}
.tri-head h3,.months-year h3,.undated h3,.gtable h3{font-size:30px;font-weight:400}
.pill{border-radius:0;background:var(--ink);color:var(--paper)}
.btn{border-radius:0;background:var(--ink);border-color:var(--ink);color:var(--paper);letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:8px 14px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.link{color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
.tag{border-radius:0}
.dhead h2,.reader h2,.calbar h2,.big h2{font-weight:400;letter-spacing:-.03em}
.dhead h2{font-size:clamp(38px,6vw,68px);line-height:.98}
.calbar h2{font-size:clamp(40px,6vw,72px)}
.cls .num,.stats .n,.avghero .big .n,.prog .pct{color:var(--ink);font-weight:400}
.classes{border-top:1px solid var(--ink)}
.big,.prog,.evcard,.txt,.day,.mo{background:var(--card)}
.prog{border:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:transparent;padding:16px 0}
.seg{border-radius:0;height:6px}.seg i{background:var(--ink)}
.day.hoy{border-color:var(--ink)}
.toast{border-radius:0;background:var(--ink);color:var(--paper)}
a{color:var(--ink)}
input,textarea{border-radius:0!important}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.mcard .short{font-size:21px}.mcard .prof{font-size:14px}.mcard .meta{flex-direction:column;gap:2px}nav.tabs button{min-width:0;font-size:20px}}
.reader-body{color:var(--text)}
.reader-body h4,.reader-body h5{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function badge(s){return `<circle cx="101" cy="19" r="15" fill="#FBFBEC" stroke="#1F1B2D" stroke-width="1.5"/>`+ILLU[s.ill].replace("<svg ",'<svg x="89" y="7" width="24" height="24" class="badge" ')}
function portrait(s){
  if(!s.faces)return ILLU[s.ill];
  let inner;
  if(s.faces.length===1)inner=face(FACES[s.faces[0]]);
  else inner=`<g transform="translate(-4 34) scale(.72)">${face(FACES[s.faces[0]])}</g><g transform="translate(38 34) scale(.72)">${face(FACES[s.faces[1]])}</g>`;
  return `<svg class="pt" viewBox="0 0 120 120" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Ilustración de ${esc(s.prof)}">${inner}${badge(s)}</svg>`;
}

/* cuotas */
function monthsList(){const out=[];let [y,m]=PAY.first.split("-").map(Number);const [ly,lm]=PAY.last.split("-").map(Number);
  while(y<ly||(y===ly&&m<=lm)){out.push(`${y}-${String(m).padStart(2,"0")}`);m++;if(m>12){m=1;y++}}return out}
function monthStatus(k){const p=store.pagos[k];if(p&&p.estado==="pagado")return["pagado","Pagada"];
  const t=today(),cur=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`;
  if(k<cur)return["sinreg","Sin registrar"];
  if(k===cur)return t.getDate()<=10?["ventana","Pagar hasta el 10"]:["vencida","Fuera de término"];
  const n=new Date(t.getFullYear(),t.getMonth()+1,1),nk=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
  return k===nk?["proxima","Próxima"]:["futura","Pendiente"]}
const mName=k=>{const [y,m]=k.split("-").map(Number);return MES[m-1]};

  else if(day<=10){head=`Pagá ${mName(cur)} antes del 10`;lead=`Te ${10-day===0?"queda hoy":`quedan ${10-day+1} días`} dentro de la ventana de pago.`}
  else {head=`${mName(cur)[0].toUpperCase()+mName(cur).slice(1)} no figura como pagada`;lead=`La ventana del 1 al 10 ya pasó. Si la pagaste, marcala abajo.`}

  if(past.length)h+=`<div class="row" style="margin-top:16px"><button class="btn ghost" type="button" data-act="markpast">Marcar ${mName(past[0])} a ${mName(past[past.length-1])} como pagadas</button><span class="note" style="margin:0">${past.length} meses sin registrar</span></div>`;

  Object.entries(by).forEach(([y,ks])=>{h+=`<section class="months-year"><h3>${y}</h3><div class="months">`;

  return h;

const TRI_DATES={1:["03-01","05-31"],2:["06-01","09-12"],3:["09-13","12-11"]};

          return `<li class="${n.leido?"done":""}"><input type="checkbox" id="lec-${x.s.id}-${x.i}-${tx.k}" data-act="leido" ${ctx} ${n.leido?"checked":""} aria-label="Marcar como leído"><span class="tt">${esc(tx.title)}${tx.disc?' <span class="tag ac">Discusión</span>':""}</span><span class="lacts">${pdfLink(n,"PDF")}${!n.pdf&&assets?`<button class="tag clipbtn" type="button" data-act="attach" ${ctx} title="Adjuntar PDF original">${CLIP} Adjuntar</button>`:""}${n.resumen?`<button class="tag ok readlink" type="button" data-act="read" ${ctx}>Leer resumen →</button>`:`<span class="pend" style="font-size:12px;color:var(--muted)">Sin resumen</span>`}</span></li>`}).join("")}</ul>`:`<div class="note">Sin lecturas asignadas en el programa.</div>`}
        </div></article>`});
    h+=`</section>`});
  return h;
}
/* calendario */
const cap=x=>x[0].toUpperCase()+x.slice(1);
function calEvents(){const ev=[];
  SUBJECTS.forEach(s=>s.classes.forEach((c,i)=>{if(c.d)ev.push({d:c.d,type:"cls",s,i,c})}));
  DEADLINES.forEach(x=>{const s=sub(x.id);ev.push({d:x.d,type:"dl",s,txt:x.txt})});
  CRONO.filter(x=>x.tipo==="evento"||x.tipo==="hibrida").forEach(x=>ev.push({d:x.d,type:x.tipo==="evento"?"evt":"hib",s:x.id?sub(x.id):null,txt:x.txt}));
  return ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.type==="dl")-(b.type==="dl"))}
const mKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const modCls=m=>/virtual/i.test(m||"")?"virt":/h[ií]brida/i.test(m||"")?"hib":"";
const dayInfo=ds=>CRONO.find(x=>x.d===ds&&(x.tipo==="feriado"||x.tipo==="examen"));
function evCls(e){return e.type==="dl"?"dl":e.type==="evt"?"evt":e.type==="hib"?"hib":modCls(e.c.mod)}
function evLabel(e){return e.type==="dl"?`Entrega · ${e.s?e.s.short:""}`:e.type==="evt"||e.type==="hib"?e.txt:`Clase ${e.i+1} · ${e.s.short}`}
function evCard(e){const col=e.s?e.s.color:"var(--line)";
  if(e.type==="evt"||e.type==="hib")return `<div class="evcard" style="cursor:default"><span class="sw" style="background:var(${e.type==="evt"?"--c-evt":"--c-hib"})"></span><span style="min-width:0"><span class="when">${e.type==="evt"?"Evento":"Híbrida"} · ${fmtD(e.d)}</span><h4>${esc(e.txt)}</h4></span></div>`;
  if(e.type==="dl")return `<button class="evcard" type="button" data-sub="${e.s?e.s.id:""}"><span class="sw" style="background:transparent;border:1.5px dashed var(--ink)"></span><span style="min-width:0"><span class="when">Entrega · ${fmtD(e.d)}</span><h4>${esc(e.txt)}</h4><span class="sub">${esc(e.s?e.s.name:"")}</span></span></button>`;
  const lec=(e.c.t||[]).map(t=>t.replace(/^D:/,"")),mc=modCls(e.c.mod),di=dayInfo(e.d);
  const links=mc==="hib"&&e.s.aula?`Aula ${esc(e.s.aula)}`:mc==="virt"?(e.s.zoom?`<a href="${e.s.zoom}" target="_blank" rel="noopener">Entrar al Zoom</a>`:e.s.zoomTxt?`Zoom: ${esc(e.s.zoomTxt)}`:""):"";
  return `<button class="evcard" type="button" data-sub="${e.s.id}" data-cls="${e.i}"><span class="sw" style="background:${mc?`var(--c-${mc==="virt"?"virt":"hib"})`:col}"></span><span style="min-width:0">
    <span class="when">${fmtD(e.d)} · Clase ${e.i+1}${e.c.mod?" · "+esc(e.c.mod):""}</span><h4>${esc(e.c.tema)}</h4><span class="sub">${esc(e.s.name)} · ${esc(e.s.prof)}</span>
    ${links?`<div class="links">${links}</div>`:""}${di?`<div class="links warn">El cronograma marca ${di.tipo==="feriado"?"feriado":"semana de recuperación"} este día: confirmá si la clase se mantiene.</div>`:""}
    ${lec.length?`<ul>${lec.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</span></button>`}
function viewCalendario(){
  const t=today(),all=calEvents();
  if(!ui.calMonth)ui.calMonth=mKey(t);
  const [y,m]=ui.calMonth.split("-").map(Number),first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate();
  const off=(first.getDay()+6)%7;const by={};all.forEach(e=>{(by[e.d]=by[e.d]||[]).push(e)});
  let h=`<div class="calbar"><h2>${MES[m-1]} ${y}</h2><button class="btn ghost" type="button" data-act="calprev" aria-label="Mes anterior">←</button><button class="btn ghost" type="button" data-act="caltoday">Hoy</button><button class="btn ghost" type="button" data-act="calnext" aria-label="Mes siguiente">→</button></div>`;
  h+=`<div class="cal" role="grid" aria-label="Calendario de ${MES[m-1]} ${y}">`+["lun","mar","mié","jue","vie","sáb","dom"].map(d=>`<div class="dow">${d}</div>`).join("");
  const cells=Math.ceil((off+dim)/7)*7;
  for(let k=0;k<cells;k++){const d=new Date(y,m-1,1-off+k),ds=iso(d),out=d.getMonth()!==m-1,evs=by[ds]||[];
    const di=dayInfo(ds);
    h+=`<button class="day ${out?"out":""} ${ds===iso(t)?"hoy":""} ${di?(di.tipo==="feriado"?"fer":"exa"):""}" type="button" data-act="calday" data-day="${ds}" aria-pressed="${ui.calDay===ds}" aria-label="${d.getDate()} de ${MES[d.getMonth()]}${evs.length?`, ${evs.length} evento${evs.length>1?"s":""}`:""}">
      <span class="dn">${d.getDate()}</span>${di?`<span class="tag-d">${di.tipo==="feriado"?"Feriado":"Recup. / exámenes"}</span>`:""}${evs.map(e=>`<span class="ev ${evCls(e)}" style="--sc:${e.s&&e.type==="cls"?e.s.color:"transparent"}">${esc(evLabel(e))}</span>`).join("")}
      <span class="dots">${evs.map(e=>`<i class="${evCls(e)}"></i>`).join("")}</span></button>`}
  h+=`</div><div class="legend"><span><i style="background:var(--c-virt)"></i>Virtual</span><span><i style="background:var(--c-hib)"></i>Híbrida</span><span><i style="background:var(--c-evt)"></i>Evento</span><span><i style="background:var(--c-fer)"></i>Feriado</span><span><i style="background:var(--c-exa)"></i>Recuperación o exámenes</span><span><i style="border:1.5px dashed var(--ink);background:transparent"></i>Entrega</span></div>`;
  if(ui.calMonth>="2026-09"&&ui.calMonth<="2026-12")h+=`<p class="note">${esc(CRONO_NOTA)}</p>`;
  if(ui.calDay&&ui.calDay.startsWith(ui.calMonth)){const evs=by[ui.calDay]||[],d=pd(ui.calDay);
    h+=`<div class="dayhead"><h3>${cap(DIA[d.getDay()])} ${d.getDate()} de ${MES[d.getMonth()]}</h3><button class="btn link" type="button" data-act="caldayclose">Ver todo el mes</button></div>
      <div class="evlist">${dayInfo(ui.calDay)?`<div class="empty">${esc(dayInfo(ui.calDay).txt)}</div>`:""}${evs.length?evs.map(evCard).join(""):dayInfo(ui.calDay)?"":'<div class="empty">No hay clases ni entregas este día.</div>'}</div>`}
  else{const evs=all.filter(e=>e.d.startsWith(ui.calMonth));
    h+=`<div class="dayhead"><h3>Clases y entregas de ${MES[m-1]}</h3><span class="lbl">${evs.length} en total</span></div>
      <div class="evlist">${evs.length?evs.map(evCard).join(""):'<div class="empty">No hay clases ni entregas con fecha en este mes.</div>'}</div>`}
  const und=SUBJECTS.filter(s=>s.classes.some(c=>!c.d)).map(s=>{const n=s.classes.filter(c=>!c.d).length;return `<li>${esc(s.name)}: ${n===s.classes.length?"todas las clases":`${n} clase${n>1?"s":""}`}</li>`});
  if(und.length)h+=`<section class="undated"><h3>Sin fecha en el programa</h3><p class="note">Estas clases no tienen fecha en el programa, por eso no aparecen en el calendario. Si me pasás las fechas, las sumo.</p><ul>${und.join("")}</ul></section>`;
  return h;
}
/* ============ Lectura de resúmenes ============ */
const plain=t=>String(t||"").replace(/^#+\s*/gm,"").replace(/\*\*/g,"").replace(/\s+/g," ").trim();
const words=t=>plain(t).split(" ").filter(Boolean).length;
function md(t){
  const out=[];let list=null,para=[];
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const flush=()=>{if(para.length){out.push("<p>"+inl(para.join(" "))+"</p>");para=[]}if(list){out.push("<ul>"+list.map(li=>"<li>"+inl(li)+"</li>").join("")+"</ul>");list=null}};
  String(t||"").split(/\n/).forEach(line=>{const l=line.trim();
    if(!l){flush();return}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){flush();const lv=Math.min(m[1].length+1,5);out.push(`<h${lv}>${inl(m[2])}</h${lv}>`);return}
    if((m=l.match(/^[•*]\s+(.*)$/))){if(para.length){out.push("<p>"+inl(para.join(" "))+"</p>");para=[]}(list=list||[]).push(m[1]);return}
    if(list)flush();para.push(l)});
  flush();return out.join("");
}
function openRead(sid,i,k){ui.read={s:sid,i:+i,k:String(k)};ui.subject=sid;ui.view="materias";
  try{history.replaceState(null,"",`#r-${sid}-c${+i+1}-${k}`)}catch(e){}render();scrollTo(0,0)}
function viewRead(){
  const r=ui.read,s=sub(r.s),c=s.classes[r.i];const list=txtList(s,r.i);const tx=list.find(x=>x.k===r.k);
  if(!tx){ui.read=null;return viewSubject(s)}
  const n=noteOf(s,r.i,tx);
  const all=[];s.classes.forEach((cc,ii)=>txtList(s,ii).forEach(x=>{if(noteOf(s,ii,x).resumen)all.push({i:ii,k:x.k,title:x.title})}));
  const pos=all.findIndex(x=>x.i===r.i&&x.k===r.k),prev=all[pos-1],next=all[pos+1];
  const nav=(x,lab)=>x?`<button class="navbtn" type="button" data-act="read" data-s="${s.id}" data-i="${x.i}" data-k="${x.k}"><span class="lbl">${lab} · Clase ${x.i+1}</span><span>${esc(x.title)}</span></button>`:"<span></span>";
  return `<button class="back" type="button" data-sub="${s.id}" data-cls="${r.i}">← ${esc(s.name)}</button>
  <article class="reader"><div class="lbl">${esc(s.code)} · Clase ${r.i+1} · ${esc(c.tema)}</div><h2>${esc(tx.title)}</h2>
  <div class="row" style="margin-top:10px"><label class="chk"><input type="checkbox" id="lei-r" data-act="leido" data-s="${s.id}" data-i="${r.i}" data-k="${tx.k}" ${n.leido?"checked":""}> Leído</label><span class="note" style="margin:0">Resumen · ${words(n.resumen).toLocaleString("es-AR")} palabras</span></div>
  ${pdfRow(n,`data-s="${s.id}" data-i="${r.i}" data-k="${tx.k}"`)}
  <div class="reader-body">${n.resumen?md(n.resumen):'<p class="note">Este texto todavía no tiene resumen.</p>'}</div></article>
  <nav class="readnav" aria-label="Otros resúmenes">${nav(prev,"Anterior")}${nav(next,"Siguiente")}</nav>`;
}

/* ============ Render y navegación ============ */
let pending=false;
function render(){
  const a=document.activeElement;
  if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"))&&$("#app").contains(a)){pending=true;return}
  pending=false;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===ui.view?"page":"false"));
  const y=scrollY;
  $("#app").innerHTML= ui.view==="cuotas"?viewCuotas(): ui.view==="lecturas"?viewLecturas(): ui.view==="calendario"?viewCalendario(): ui.view==="promedio"?viewPromedio(): ui.view==="intercambio"?viewIntercambio(): ui.read?viewRead(): ui.subject?viewSubject(sub(ui.subject)):viewMaterias();
  scrollTo(0,y);
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},0));
function go(view,subject=null,cls=null){
  ui.view=view;ui.subject=subject;ui.selMonth=null;ui.adding=null;ui.read=null;
  if(subject&&cls!=null)ui.openCls.add(clsKey(subject,cls));
  try{history.replaceState(null,"","#"+(subject?"m-"+subject:view))}catch(e){}
  render();scrollTo(0,0);
}
document.addEventListener("toggle",e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement))return;
  if(d.dataset.key){d.open?ui.openCls.add(d.dataset.key):ui.openCls.delete(d.dataset.key)}
  if(d.dataset.tk){d.open?ui.openTxt.add(d.dataset.tk):ui.openTxt.delete(d.dataset.tk)}},true);

function clsDoc(sid,i){const d=store.clases[clsKey(sid,i)]||{};return JSON.parse(JSON.stringify({textos:d.textos||{},extras:d.extras||[]}))}
function getNote(doc,k){if(k.startsWith("x"))return doc.extras[+k.slice(1)];return doc.textos[k]=doc.textos[k]||{}}

document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const sc=e.target.closest("[data-sub]");if(sc){go("materias",sc.dataset.sub,sc.dataset.cls!=null?+sc.dataset.cls:null);return}
  const mo=e.target.closest("[data-month]:not([data-act])");if(mo){ui.selMonth=ui.selMonth===mo.dataset.month?null:mo.dataset.month;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,s=b.dataset.s,i=+b.dataset.i,k=b.dataset.k,key=s?clsKey(s,i):null,tk=key?key+"-"+k:b.dataset.tk;
  if(act==="read"){e.preventDefault();openRead(s,i,k);return}
  if(act==="xaddlink"){const t=$("#xl-t").value.trim(),u=$("#xl-u").value.trim();if(!u){toast("Pegá el link");return}const d=xDoc();d.links.push({t,u});document.activeElement.blur();save("intercambio",XCH.id,d);return}
  if(act==="xdellink"){const d=xDoc();d.links.splice(+b.dataset.j,1);save("intercambio",XCH.id,d);return}
  if(act==="xaddnota"){const v=$("#xn-txt").value.trim();if(!v){toast("Escribí la nota");return}const d=xDoc();d.notas.unshift({txt:v,f:iso(today())});document.activeElement.blur();save("intercambio",XCH.id,d);return}
  if(act==="xdelnota"){const d=xDoc();d.notas.splice(+b.dataset.j,1);save("intercambio",XCH.id,d);return}
  if(act==="attach"){ui.attach={s,i,k};const f=$("#pdfin");f.value="";f.click();return}
  if(act==="delpdf"){const d=clsDoc(s,i),n=getNote(d,k),old=n.pdf;delete n.pdf;save("clases",key,d);if(assets&&old&&old.id)assets.delete(old.id).catch(()=>{});return}
  if(act==="calprev"||act==="calnext"){const [y,m]=ui.calMonth.split("-").map(Number);const d=new Date(y,m-1+(act==="calnext"?1:-1),1);ui.calMonth=mKey(d);ui.calDay=null;render();return}
  if(act==="caltoday"){ui.calMonth=mKey(today());ui.calDay=iso(today());render();return}
  if(act==="calday"){const ds=b.dataset.day;if(!ds.startsWith(ui.calMonth))ui.calMonth=ds.slice(0,7);ui.calDay=ui.calDay===ds?null:ds;render();return}
  if(act==="caldayclose"){ui.calDay=null;render();return}
  if(act==="editnota"){ui.adding="nota-"+b.dataset.sid;render();$("#nota-"+b.dataset.sid)?.focus();return}
  if(act==="cancel"){ui.adding=null;render();return}
  if(act==="editres"){ui.adding="res-"+b.dataset.tk;render();return}
  if(act==="openex"){ui.adding="ex-"+b.dataset.tk;render();$("#exq-"+CSS.escape(b.dataset.tk))?.focus();return}
  if(act==="opentx"){ui.adding="tx-"+b.dataset.key;render();$("#newtx-"+CSS.escape(b.dataset.key))?.focus();return}
  if(act==="saveres"){const v=$("#res-"+CSS.escape(tk)).value.trim();const d=clsDoc(s,i);getNote(d,k).resumen=v;ui.adding=null;document.activeElement.blur();save("clases",key,d);return}
  if(act==="addex"){const q=$("#exq-"+CSS.escape(tk)).value.trim(),r=$("#exr-"+CSS.escape(tk)).value.trim();if(!q){toast("Escribí la pregunta");return}
    const d=clsDoc(s,i),n=getNote(d,k);n.ejercicios=(n.ejercicios||[]).concat([{p:q,r}]);ui.adding=null;document.activeElement.blur();save("clases",key,d);return}
  if(act==="delex"){const d=clsDoc(s,i),n=getNote(d,k);n.ejercicios.splice(+b.dataset.j,1);save("clases",key,d);return}
  if(act==="addtx"){const v=$("#newtx-"+CSS.escape(key)).value.trim();if(!v){toast("Escribí el título");return}
    const d=clsDoc(s,i);d.extras.push({titulo:v,resumen:"",ejercicios:[],leido:false});ui.adding=null;document.activeElement.blur();ui.openCls.add(key);save("clases",key,d);return}
  if(act==="delextra"){const d=clsDoc(s,i);d.extras.splice(+k.slice(1),1);save("clases",key,d);return}
  if(act==="savenota"){const sid=b.dataset.sid,v=$("#nota-"+sid).value.trim();document.activeElement.blur();
    if(v===""){delete store.notas[sid];ui.adding=null;render();if(db)db.collection("notas").doc(sid).delete().then(()=>toast("Nota quitada"));return}
    const n=Number(v);if(!(n>=1&&n<=10)){toast("La nota va de 1 a 10");return}ui.adding=null;save("notas",sid,{nota:n});return}
  if(act==="copyid"){try{await navigator.clipboard.writeText(PAY.id);toast("ID copiado")}catch(_){toast("ID de pago: "+PAY.id)}return}
  if(act==="payclose"){ui.selMonth=null;render();return}
  if(act==="paysave"){const m=b.dataset.month;const data={estado:"pagado",monto:Number($("#pm-monto").value)||0,fecha:$("#pm-fecha").value,comprobante:$("#pm-comp").value.trim()};
    ui.selMonth=null;document.activeElement.blur();save("pagos",m,data);return}
  if(act==="payundo"){const m=b.dataset.month;ui.selMonth=null;delete store.pagos[m];render();if(db)db.collection("pagos").doc(m).delete().then(()=>toast("Pago quitado")).catch(()=>toast("No se pudo quitar"));return}
  if(act==="markpast"){const t=today(),cur=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`;
    const ks=monthsList().filter(m=>m<cur&&monthStatus(m)[0]==="sinreg");for(const m of ks){await save("pagos",m,{estado:"pagado",monto:PAY.ultimo,fecha:"",comprobante:""})}return}
});
document.addEventListener("change",async e=>{const b=e.target;
  if(b.id==="pdfin"){const f=b.files&&b.files[0],t=ui.attach;ui.attach=null;if(!f||!t||!assets)return;
    if(f.size>20*1024*1024){toast("El PDF supera los 20 MB");return}

(function init(){const h=(location.hash||"").slice(1);
  if(h==="cuotas")ui.view="cuotas";else if(h==="calendario")ui.view="calendario";else if(h==="lecturas")ui.view="lecturas";else if(h==="promedio")ui.view="promedio";else if(h==="intercambio")ui.view="intercambio";else if(h.startsWith("m-")&&sub(h.slice(2))){ui.subject=h.slice(2)}
