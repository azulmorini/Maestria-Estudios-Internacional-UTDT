án dispuestas a pagar: a menor precio, más cantidad; precio y cantidad se relacionan inversamente (**ley de la demanda**). **Factores:** precios de bienes relacionados (sustitutos y complementarios); ingresos; precios futuros esperados; población; preferencias. Si aumenta el ingreso, al mismo precio se demanda más; si baja, menos. **Bien normal ≠ bien inferior:** cuando baja el ingreso aumenta la demanda de ropa usada. **Sustituto:** si sube la mermelada, se compra miel. **Complementario:** si sube el pan, se consume menos miel. Más gusto, más población o mayores precios futuros esperados aumentan la demanda actual.\n\n### Equilibrio\n\nLas curvas se cortan en el precio y la cantidad de equilibrio, que vacían el mercado. Fuera del equilibrio hay escasez o exceso: con exceso de oferta no se compra, los precios bajan hasta igualar cantidad ofrecida y demandada; el mercado tiende al equilibrio. Pero el mercado raciona por precio y **hay exclusión**: consumidores que no pueden pagar el precio de equilibrio y productores que no pueden producir a ese precio. No es un paraíso.\n\n¿Autorregulación? Aumento de la oferta (a la derecha): precio más bajo y cantidad mayor. Disminución (a la izquierda y arriba): precio más alto y cantidad menor. Aumento de la demanda (a la derecha): precio y cantidad mayores. Disminución: precio y cantidad menores. Si la demanda aumenta mucho más que la oferta, suben los precios (se ve en que la distancia entre D y D' es mayor que entre S y S').\n\n### Elasticidad\n\nSe entiende como **sensibilidad**: cuán sensible es la demanda al cambio del precio. **Inelástico:** medicamentos, energía. 🚩 Peligro de **cartelización**: en mercados imperfectos los productores pueden subir precios indiscriminadamente porque los consumidores comprarán igual. La OPEP en 1973 se cartelizó, restringió la oferta y logró aumentar el precio. Pérdida de bienestar: quienes pueden comprar pagan más que en competencia perfecta, y quienes podían comprar al precio de equilibrio quedan privados del bien. 🚨 Se regula con **precio máximo**.\n\n**Monopsonios:** un solo comprador; el poder está del lado de la demanda. Se regula con **precio mínimo**.\n\nEn la economía internacional los mercados imperfectos funcionan muy bien porque nadie los regula. Parecen perfectos, pero no hay un gran mercado central con toda la oferta; aunque haya muchos productores, quienes les venden son muy pocos; hay muchas marcas pero pocas empresas. En tecnología, 20 empresas concentran casi todo el mercado. El petróleo es mercado más política: los países occidentales proponen liberar reservas estratégicas para mostrarle a Irán que no tiene poder real, pero tarde o temprano se agotan, y se generan expectativas sobre una guerra que debe ser más corta que larga. La OPEP se crea como coordinación entre Estados frente a la coordinación de las empresas privadas occidentales; hoy a las nuevas «siete hermanas» podríamos agregar YPF.", "titulo": "Apuntes de clase · Sesión 3 (17/3): Mercados y lógica de intervención"}], "textos": {"0": {"ejercicios": [], "leido": false, "resumen": "## Capítulo 4. Las fuerzas del mercado de la oferta y la demanda\n\nCuando una helada llega a Florida, sube el precio del jugo de naranja en todo Estados Unidos; cuando hace calor en la costa este, se desploman los precios de los hoteles del Caribe; cuando hay guerra en Medio Oriente, sube la gasolina y baja el precio de los autos grandes. Todos muestran cómo funcionan la oferta y la demanda, las dos fuerzas que hacen funcionar las economías de mercado: determinan la cantidad que se produce de cada bien y su precio. Para saber cómo un acontecimiento afectará la economía, primero hay que pensar en términos de oferta y demanda. El capítulo analiza cómo se comportan e interactúan compradores y vendedores, cómo la oferta y la demanda determinan los precios y cómo los precios asignan los recursos escasos.\n\n### Mercados y competencia\n\n**¿Qué es un mercado?** Un **mercado** es un grupo de compradores y vendedores de un bien o servicio en particular: los compradores determinan la demanda y los vendedores la oferta. Algunos están muy organizados, como los agrícolas, con un lugar y hora y un subastador que fija precios; la mayoría está menos organizada, como el del helado en una ciudad: sin subastador, cada vendedor anuncia su precio y los compradores deciden cuánto y dónde comprar, pero igual forman un mercado.\n\n**¿Qué es la competencia?** La mayoría de los mercados son muy competitivos: cada comprador sabe que hay varios vendedores y cada vendedor sabe que su producto es similar a otros, de modo que el precio y la cantidad los fijan todos los que interactúan. Un **mercado competitivo** tiene muchos compradores y vendedores, cada uno con un impacto insignificante en el precio: un vendedor que sube el precio pierde clientes, y un comprador no puede modificarlo porque compra poco. Se supone un mercado **perfectamente competitivo**, con dos características: bienes exactamente iguales, y compradores y vendedores tan numerosos que ninguno influye solo en el precio; ambos son **tomadores de precios**, y al precio de mercado pueden comprar y vender cuanto quieran (por ejemplo, el trigo). No todos los mercados lo son: en un **monopolio** un solo vendedor fija el precio (la televisión por cable local), y la mayoría está en un punto intermedio. Aun así, suponer competencia perfecta es una simplificación útil, porque siempre hay algún grado de competencia y muchas lecciones se aplican a mercados más complicados.\n\n### La demanda\n\n**La curva de la demanda.** La **cantidad demandada** es la cantidad de un bien que los compradores están dispuestos a adquirir y pueden comprar. Un determinante fundamental es el precio: si el helado costara $20 la gente compraría menos (y quizás yogur helado); si costara $0,20, más. Es la **ley de la demanda**: si todo lo demás permanece constante, la cantidad demandada de un bien disminuye cuando su precio aumenta y aumenta cuando su precio disminuye. La **tabla de la demanda** muestra la relación entre precio y cantidad demandada (Catherine compra 12 vasos si el helado es gratis, 10 a $0,50 y ninguno a $3). La **curva de la demanda** es su gráfico, con el precio en el eje vertical y la cantidad en el horizontal, y tiene pendiente negativa.\n\n**Demanda de mercado frente a demanda individual.** La demanda de mercado es la suma de las demandas individuales: las curvas individuales se suman horizontalmente (a $2, Catherine demanda 4 y Nicholas 3: el mercado, 7). La curva de mercado muestra cómo varía la cantidad total demandada al cambiar el precio, manteniendo constantes los demás factores.\n\n**Desplazamientos de la curva de la demanda.** Si algo altera la cantidad demandada a un precio dado, la curva se desplaza (por ejemplo, si se descubriera que el helado alarga la vida). Un cambio que aumenta la cantidad demandada a cada precio la desplaza a la derecha (**incremento de la demanda**); uno que la reduce, a la izquierda (**decremento de la demanda**). Las principales variables:\n\n• **Ingreso.** Si al perder el trabajo la demanda de un bien cae, es un **bien normal**: un aumento del ingreso aumenta su demanda. Si la demanda aumenta cuando el ingreso cae, es un **bien inferior** (los boletos de autobús en lugar del auto o el taxi).\n• **Precios de bienes relacionados.** Si al bajar el precio del yogur helado se compra menos helado, son **sustitutos**: el aumento del precio de uno aumenta la demanda del otro (pollo y carne, refrescos y agua, cine y alquiler de películas). Si al bajar el jarabe de chocolate se compra más helado, son **complementarios**: el aumento del precio de uno reduce la demanda del otro (gasolina y autos, computadoras y programas, cereal y leche).\n• **Gustos.** Los economistas no los explican, porque dependen de fuerzas históricas y psicológicas fuera de su campo, pero estudian qué pasa cuando cambian.\n• **Expectativas.** Si se espera ganar más el mes próximo, se gasta más hoy; si se espera que el precio baje mañana, se compra menos hoy.\n• **Número de compradores.** Si se suma Peter, la demanda de mercado aumenta.\n\n**Resumen.** La curva muestra qué pasa con la cantidad demandada cuando cambia el precio, con todo lo demás constante. Una curva se desplaza cuando cambia una variable relevante que no está en ninguno de los ejes: un cambio en el precio es un movimiento a lo largo de la curva; un cambio en el ingreso, los precios relacionados, los gustos, las expectativas o el número de compradores la desplaza (tabla 1).\n\n**Caso de estudio: dos maneras de reducir la cantidad demandada de cigarrillos.** Una es desplazar la curva de demanda a la izquierda con advertencias en las cajetillas, anuncios sobre los riesgos o prohibición de publicidad: a $2 por cajetilla se pasa de 20 a 10 cigarrillos diarios. La otra es subir el impuesto, lo que eleva el precio y produce un movimiento a lo largo de la curva: de $2 a $4 la cantidad baja de 20 a 12. Un aumento del 10% en el precio reduce un 4% la cantidad demandada, y un 12% en los adolescentes, especialmente sensibles. Quienes se oponen a los impuestos argumentan que tabaco y marihuana son sustitutos; pero muchos expertos ven al tabaco como «puerta de entrada», y los estudios muestran que un menor precio del cigarrillo se asocia a más uso de marihuana: parecen complementarios.\n\n### La oferta\n\n**La curva de la oferta.** La **cantidad ofrecida** es la cantidad que los vendedores pueden y quieren vender. Cuando el precio del helado sube, venderlo es rentable y se ofrece más (más horas, más máquinas, más personal); cuando baja, se produce menos y algunos cierran. Es la **ley de la oferta**: con todo lo demás constante, la cantidad ofrecida aumenta cuando el precio aumenta y disminuye cuando baja. La **tabla de la oferta** muestra esa relación (Ben no ofrece nada por debajo de $1 y luego cantidades crecientes) y la **curva de la oferta** tiene pendiente positiva.\n\n**Oferta de mercado frente a oferta individual.** La oferta de mercado es la suma horizontal de las ofertas individuales (a $2, Ben ofrece 3 y Jerry 4: el mercado, 7).\n\n**Desplazamientos de la curva de la oferta.** Si baja el precio del azúcar, insumo del helado, venderlo es más rentable y a cada precio se ofrece más: la curva se desplaza a la derecha (**incremento de la oferta**); lo contrario es un **decremento de la oferta**. Variables:\n\n• **Precios de los insumos** (crema, azúcar, saborizantes, máquinas, infraestructura, mano de obra): si suben, producir es menos rentable y se ofrece menos; la oferta se relaciona negativamente con el precio de los insumos.\n• **Tecnología:** la máquina para hacer helado redujo la mano de obra necesaria y los costos, y aumentó la oferta.\n• **Expectativas:** si se espera que el precio suba, se almacena y se ofrece menos hoy.\n• **Número de vendedores:** si Ben o Jerry se retiran, la oferta de mercado cae.\n\n**Resumen.** Un cambio en el precio es un movimiento a lo largo de la curva de oferta; un cambio en los precios de los insumos, la tecnología, las expectativas o el número de vendedores la desplaza (tabla 2).\n\n### Oferta y demanda juntas\n\n**Equilibrio.** El punto donde se intersecan las curvas de oferta y demanda de mercado es el **equilibrio**: situación en la que el precio alcanzó el nivel en que la cantidad ofrecida equivale a la demandada. El **precio de equilibrio** ($2 por vaso) balancea ambas cantidades, y la **cantidad de equilibrio** es de 7 vasos. Como en el diccionario, el equilibrio es una situación de fuerzas balanceadas: al precio de equilibrio, lo que los compradores quieren y pueden comprar equivale exactamente a lo que los vendedores quieren y pueden vender; por eso se lo llama también precio de liquidación de mercado: todos quedan satisfechos. Las acciones de compradores y vendedores mueven naturalmente el mercado hacia el equilibrio. Si el precio está por encima del de equilibrio ($2,50), la cantidad ofrecida (10) supera la demandada (4): hay un **excedente** o exceso de oferta; los vendedores, con heladeras llenas, bajan los precios, lo que aumenta la cantidad demandada y reduce la ofrecida.\n\nEstos cambios son movimientos a lo largo de las curvas, y los precios siguen cayendo hasta el equilibrio. Si el precio está por debajo ($1,50), la cantidad demandada (10) supera la ofrecida (4): hay **escasez** o exceso de demanda; los compradores hacen largas filas y los vendedores pueden subir el precio sin perder ventas, lo que reduce la cantidad demandada, aumenta la ofrecida y lleva al equilibrio. Sea el precio demasiado alto o demasiado bajo, las actividades de muchos compradores y vendedores empujan automáticamente el precio de mercado hacia el de equilibrio; una vez alcanzado, no hay presiones para que suba o baje. La rapidez varía según cuán rápido se ajusten los precios; en la mayoría de los mercados libres, excedentes y escasez son temporales. Es la **ley de la oferta y la demanda**: el precio de un bien cualquiera se ajusta para llevar al equilibrio la cantidad ofrecida y la demandada.\n\n**Tres pasos para analizar los cambios en el equilibrio.** El precio y la cantidad de equilibrio dependen de la posición de las curvas; cuando un acontecimiento desplaza alguna, el equilibrio cambia. Se procede en tres pasos (tabla 3): 1) decidir si el acontecimiento desplaza la oferta, la demanda o ambas; 2) decidir en qué dirección; 3) usar el diagrama para comparar el equilibrio inicial con el nuevo.\n\n**Ejemplo: desplazamiento de la demanda.** Un verano muy caluroso: 1) afecta la demanda, al modificar la preferencia por el helado; la oferta no cambia porque el clima no afecta directamente a las empresas; 2) la demanda se desplaza a la derecha (de D1 a D2); 3) al precio de $2 hay escasez, las empresas suben el precio y el equilibrio pasa de $2 a $2,50 y de 7 a 10 vasos.\n\n**Desplazamientos en las curvas frente a movimientos a lo largo de las curvas.** Cuando el calor sube el precio, la cantidad que ofrecen las empresas aumenta aunque la curva de oferta permanezca igual: aumenta la «cantidad ofrecida», no la «oferta». Oferta se refiere a la posición de la curva; cantidad ofrecida, a lo que los oferentes desean vender. Un desplazamiento de la curva es un «cambio en la oferta» o «cambio en la demanda»; un movimiento a lo largo de una curva existente es un «cambio en la cantidad ofrecida» o «en la cantidad demandada».\n\n**Ejemplo: desplazamiento de la oferta.** Un huracán destruye cultivos de caña y sube el precio del azúcar: 1) afecta la oferta, porque aumenta los costos; la demanda no cambia; 2) la oferta se desplaza a la izquierda (de O1 a O2); 3) al precio de $2 hay escasez; el precio sube a $2,50 y la cantidad cae de 7 a 4 vasos.\n\n**Ejemplo: desplazamientos de la oferta y la demanda.** Ola de calor y huracán el mismo verano: 1) ambas curvas se desplazan; 2) la demanda a la derecha y la oferta a la izquierda; 3) el precio de equilibrio aumenta en ambos casos, pero la cantidad depende del tamaño relativo de los desplazamientos: si la demanda aumenta mucho y la oferta cae poco, la cantidad sube; si la oferta cae mucho y la demanda sube poco, baja. El impacto en la cantidad es ambiguo.\n\n**En las noticias: incremento de precios después de los desastres** (Jeff Jacoby, *The Boston Globe*, 2010). Tras la ruptura de una tubería que dejó sin agua potable a poblaciones cercanas a Boston, la procuradora Coakley y el gobernador Patrick advirtieron contra la «especulación de precios» del agua embotellada. Ante cada calamidad se levantan voces farisaicas contra el sistema sorprendentemente eficiente que estimula a los proveedores a hacer llegar los recursos: el mecanismo de precios del libre mercado. Cuando el agua se vuelve escasa, el precio sube; es molesto, pero menos que no encontrar agua a ningún precio: evita que las existencias desaparezcan hoy y aumenta las probabilidades de nuevo abastecimiento mañana. Experimento mental: el vendedor A mantiene el agua a 69 centavos y el B la sube a $2,99; en A se agota en horas y los últimos se van con las manos vacías; en B se vende más lento, pero incluso los que llegan tarde consiguen agua y casi nadie compra más de lo necesario. Con precios altos, los proveedores se esfuerzan más (horas extra en embotelladoras, camiones desde Nueva York). El gobierno podría racionar o controlar precios, con corrupción, filas y mercado negro; es mucho mejor dejar que los precios suban y bajen libremente: no es «especulación», sino sentido común.\n\n**Resumen.** La tabla 4 predice el resultado para cualquier combinación de desplazamientos: sin cambios, P y Q iguales; aumento de oferta, P baja y Q sube; caída de oferta, P sube y Q baja; aumento de demanda, P y Q suben; caída de demanda, P y Q bajan; aumento de ambas, P ambiguo y Q sube; aumento de demanda con caída de oferta, P sube y Q ambiguo; caída de demanda con aumento de oferta, P baja y Q ambiguo; caída de ambas, P ambiguo y Q baja.\n\n### Conclusión: cómo los precios distribuyen los recursos\n\nAunque el capítulo se centró en el helado, sus lecciones se aplican a la mayoría de los mercados: al comprar se contribuye a la demanda; al buscar trabajo, a la oferta de servicios laborales. Los mercados son usualmente una buena manera de organizar la actividad económica. Todo sistema debe distribuir recursos escasos entre usos que compiten; las economías de mercado usan la oferta y la demanda, que determinan los precios, y los precios son las señales que guían la distribución de los recursos. La tierra frente al mar es limitada: la obtiene quien pueda y esté dispuesto a pagar el precio, que se ajusta hasta igualar la cantidad demandada y la ofrecida; los precios son el mecanismo para racionar los recursos escasos. También determinan quién produce y cuánto: en una sociedad libre no hay un órgano de planeación que decida quién es agricultor; los precios de la comida y los salarios de los campesinos se ajustan para que suficientes personas decidan serlo. ¿Qué impide que la toma de decisiones descentralizada degenere en caos? Los precios. Si una mano invisible guía a las economías de mercado, como propuso Adam Smith, el sistema de precios es la batuta que usa para dirigir la orquesta.\n\n**Conceptos clave:** mercado, mercado competitivo, cantidad demandada, ley de la demanda, tabla y curva de la demanda, bien normal, bien inferior, sustitutos, complementarios, cantidad ofrecida, ley de la oferta, tabla y curva de la oferta, equilibrio, precio y cantidad de equilibrio, excedente, escasez, ley de la oferta y la demanda.\n\n## Capítulo 5. La elasticidad y sus aplicaciones\n\nSi un evento aumenta el precio de la gasolina (una guerra en Medio Oriente que reduce la oferta, el auge chino que aumenta la demanda, un nuevo impuesto), los consumidores comprarán menos: es la ley de la demanda. Pero ¿cuánto caerá el consumo? Se responde con el concepto de **elasticidad**, que mide qué tanto reaccionan compradores y vendedores a cambios en las condiciones del mercado, y permite discutir la dirección del efecto y también su magnitud. Muchos estudios muestran que la cantidad demandada de gasolina responde más a largo que a corto plazo: un aumento del 10% en el precio reduce el consumo 2,5% después de un año y 6% después de cinco; alrededor de la mitad de la reducción de largo plazo se debe a que se maneja menos y la otra a autos que gastan menos.\n\n### La elasticidad de la demanda\n\nEn el capítulo 4 la discusión fue cualitativa: la dirección del cambio en la cantidad demandada, no su magnitud. Para medir qué tanto responden los consumidores se usa la **elasticidad**: medida de la capacidad de respuesta de la cantidad demandada u ofrecida ante un cambio en uno de sus determinantes.\n\n**La elasticidad precio de la demanda y sus determinantes.** Mide qué tanto la cantidad demandada responde a un cambio en el precio. La demanda es **elástica** si la cantidad responde sustancialmente, e **inelástica** si responde ligeramente. Como la curva refleja factores económicos, sociales y psicológicos, no hay una regla universal, pero sí reglas generales:\n\n• **Disponibilidad de sustitutos cercanos.** Los bienes con sustitutos cercanos tienen demandas más elásticas: la mantequilla (sustituible por margarina) frente a los huevos, sin sustituto cercano.\n• **Necesidades frente a lujos.** Las necesidades tienen demandas inelásticas y los lujos elásticas: si sube la visita al médico, no se reduce drásticamente; si suben los veleros, sí. Depende de las preferencias del comprador, no de las propiedades del bien.\n• **Definición del mercado.** Cuanto más estrecho el mercado, más elástica la demanda: la comida es inelástica, el helado más elástico y el helado de vainilla muy elástico.\n• **Horizonte de tiempo.** Cuanto más largo, más elástica: ante una suba de la gasolina, la cantidad cae poco al principio y sustancialmente tras unos años (autos eficientes, transporte público, mudanzas).\n\n**Cálculo de la elasticidad precio de la demanda.** Es el cambio porcentual en la cantidad demandada dividido por el cambio porcentual en el precio. Si un aumento del 10% en el precio hace caer la cantidad un 20%, la elasticidad es 2: el cambio en la cantidad es proporcionalmente el doble. Como cantidad y precio se mueven en sentido opuesto, el resultado es negativo; aquí se reporta en valor absoluto, de modo que una mayor elasticidad implica mayor respuesta.\n\n**El método del punto medio.** Entre A ($4; 120) y B ($6; 80), de A a B el precio sube 50% y la cantidad cae 33% (elasticidad 0,66); de B a A el precio cae 33% y la cantidad sube 50% (1,5), porque los cambios se calculan con bases distintas. El método del punto medio divide el cambio por el promedio de los niveles inicial y final: de $4 a $6 es un 40% respecto de $5, en ambas direcciones. Con punto medio ($5; 100), precio y cantidad cambian 40% y la elasticidad es 1 en ambas direcciones. Fórmula: [(Q2 – Q1) / ((Q2 + Q1)/2)] / [(P2 – P1) / ((P2 + P1)/2)]. Para la mayoría de los propósitos importa más lo que representa la elasticidad que cómo se calcula.\n\n**La variedad de curvas de la demanda.** La demanda es **elástica** si la elasticidad es mayor que 1 (la cantidad se mueve proporcionalmente más que el precio), **inelástica** si es menor que 1 y de **elasticidad unitaria** si es exactamente 1. Cuanto más plana sea la curva en un punto, mayor la elasticidad; cuanto más pronunciada, menor. La figura 1 muestra cinco casos: a) perfectamente inelástica (elasticidad 0, curva vertical, la cantidad no cambia con el precio); b) inelástica (un aumento del 22% del precio reduce 11% la cantidad); c) unitaria (22% y 22%); d) elástica (22% y 67%); e) perfectamente elástica (elasticidad infinita, curva horizontal: pequeños cambios de precio producen enormes cambios de cantidad). Las curvas inelásticas, como la del panel a, parecen una letra I.\n\n**Para su información: algunas elasticidades del mundo real.** Huevos 0,1; atención médica 0,2; arroz 0,5; vivienda 0,7; carne de res 1,6; comidas en restaurantes 2,3; Mountain Dew 4,4. Deben tomarse con reservas: las técnicas estadísticas requieren supuestos que quizá no se cumplan, y la elasticidad no es necesariamente igual en todos los puntos de la curva; por eso distintos estudios reportan distintas elasticidades para el mismo producto.\n\n**Los ingresos totales y la elasticidad precio de la demanda.** Los **ingresos totales** son la cantidad pagada por los compradores y recibida por los vendedores: P × Q, el área de la caja bajo la curva de demanda ($4 × 100 = $400). Cómo cambian al moverse a lo largo de la curva depende de la elasticidad. Si la demanda es inelástica, un aumento del precio de $4 a $5 reduce la cantidad de 100 a 90 y los ingresos suben de $400 a $450: la caída de Q es proporcionalmente menor que el aumento de P (el área A, ingreso extra por vender más caro, supera al área B, ingreso perdido por vender menos). Si es elástica, la cantidad cae de 100 a 70 y los ingresos bajan de $400 a $350. Reglas generales:\n\n• Demanda inelástica (elasticidad menor que 1): precio e ingresos totales se mueven en la misma dirección.\n• Demanda elástica (mayor que 1): se mueven en direcciones opuestas.\n• Elasticidad unitaria: los ingresos totales permanecen constantes cuando cambia el precio.\n\n**La elasticidad y los ingresos totales a lo largo de una curva de la demanda lineal.** Una recta tiene pendiente constante (cada $1 de aumento reduce la cantidad en dos unidades), pero la elasticidad no lo es, porque la pendiente es la razón de cambios entre dos variables y la elasticidad la razón de cambios porcentuales. Con precio bajo y cantidad alta la curva es inelástica; con precio alto y cantidad baja, elástica (de 13,0 a 0,1 en la tabla de la figura 4). A $1, subir a $2 aumenta los ingresos; a $5, subir a $6 los reduce; entre $3 y $4 la elasticidad es unitaria y los ingresos son iguales ($24). La elasticidad no es necesariamente la misma en todos los puntos de una curva.\n\n**Otras elasticidades de la demanda.**\n\n• **Elasticidad ingreso de la demanda:** cambio porcentual en la cantidad demandada dividido por el cambio porcentual en el ingreso. Los bienes normales tienen elasticidad ingreso positiva; los inferiores (el transporte público), negativa. Entre los normales, las necesidades (comida, ropa) tienen elasticidades ingreso pequeñas y los lujos (caviar, diamantes), grandes.\n• **Elasticidad precio cruzada de la demanda:** cambio porcentual en la cantidad demandada del bien 1 dividido por el cambio porcentual en el precio del bien 2. Es positiva para sustitutos (hamburguesas y hot dogs) y negativa para complementarios (computadoras y programas).\n\n### La elasticidad de la oferta\n\n**La elasticidad precio de la oferta y sus determinantes.** Mide qué tanto responde la cantidad ofrecida a cambios en el precio: es elástica si responde sustancialmente e inelástica si responde ligeramente. Depende de la flexibilidad de los vendedores para cambiar la producción: los terrenos frente a la playa tienen oferta inelástica, porque es casi imposible producir más; los bienes manufacturados (libros, autos, televisores), elástica. Un determinante clave es el periodo considerado: la oferta es más elástica a largo plazo, porque a corto plazo las empresas no pueden modificar fácilmente sus plantas, mientras que a largo plazo pueden construir o cerrar plantas, y entran y salen empresas.\n\n**Cálculo de la elasticidad precio de la oferta.** Es el cambio porcentual en la cantidad ofrecida dividido por el cambio porcentual en el precio. Si la leche sube de $2,85 a $3,15 (10% con punto medio) y la producción pasa de 9000 a 11.000 galones (20%), la elasticidad es 2.\n\n**Las diferentes curvas de la oferta.** La figura 5 muestra cinco casos, desde la oferta perfectamente inelástica (elasticidad 0, curva vertical) hasta la perfectamente elástica (infinita, horizontal); a mayor elasticidad, curva más plana. En algunos mercados la elasticidad varía a lo largo de la curva (figura 6): en industrias con capacidad limitada, a niveles bajos de producción hay capacidad ociosa y la oferta es muy elástica; al acercarse a la capacidad máxima, producir más exige construir plantas, el precio debe subir mucho y la oferta se vuelve menos elástica. De $3 a $4 (29%) la cantidad pasa de 100 a 200 (67%): elástica; de $12 a $15 (22%), de 500 a 525 (5%): inelástica.\n\n### Tres aplicaciones de la oferta, la demanda y la elasticidad\n\n**¿Buenas noticias sobre la agricultura pueden ser malas noticias para los agricultores?** Un nuevo híbrido de trigo aumenta 20% la producción por acre. Afecta la oferta, que se desplaza a la derecha; la demanda no cambia. La cantidad vendida pasa de 100 a 110 y el precio cae de $3 a $2. Los ingresos dependen de la elasticidad de la demanda, que en productos básicos como el trigo es usualmente inelástica (son baratos y tienen pocos sustitutos): los ingresos caen de $300 a $220. Los agricultores adoptan igual el híbrido porque cada uno es tomador de precios y le conviene producir más; pero al hacerlo todos, la oferta aumenta, el precio cae y quedan peor. Esto explica un gran cambio en Estados Unidos: en 1950 había 10 millones de personas en el campo (17% de la fuerza de trabajo); hoy menos de tres millones (2%), y con 70% menos de agricultores se produce más del doble. También explica la paradoja de programas que pagan a los agricultores para no cultivar toda su tierra: con demanda inelástica, ofrecer menos aumenta los ingresos totales del grupo, aunque ningún productor lo haría solo. Lo bueno para los agricultores no es necesariamente bueno para la sociedad: las mejoras tecnológicas los perjudican, pero benefician a los consumidores; reducir la oferta aumenta su ingreso a expensas de los consumidores.\n\n**¿Por qué la OPEP no pudo mantener un precio alto del petróleo?** En los setenta, la OPEP redujo conjuntamente la oferta: entre 1973 y 1974 el precio real subió más de 50%, y entre 1979 y 1981 se duplicó. Pero entre 1982 y 1985 cayó 10% anual; en 1986 la cooperación se derrumbó y el precio cayó 45%; en los noventa volvió a los niveles de los setenta. (En la primera década del siglo XXI las fluctuaciones se debieron a la demanda mundial: el crecimiento chino, la recesión de 2008-2009 y la recuperación.) A corto plazo oferta y demanda son inelásticas (las reservas y la capacidad de extracción no cambian de repente; los hábitos de compra no responden de inmediato), y un desplazamiento de la oferta sube mucho el precio. A largo plazo los productores ajenos a la OPEP exploraron y ampliaron su capacidad y los consumidores cambiaron a autos más eficientes: las curvas son más elásticas y la misma reducción sube menos el precio. El cartel aprendió que aumentar los precios es más fácil a corto que a largo plazo.\n\n**¿La prohibición de las drogas aumenta o disminuye los delitos relacionados con las mismas?** El consumo de drogas genera dependencia y lleva a los adictos a delinquir para conseguir dinero; Estados Unidos invierte miles de millones para reducir su flujo. Si el gobierno aumenta los agentes antidrogas, el impacto directo recae en los vendedores: sube el costo de vender y la oferta se desplaza a la izquierda; la demanda no cambia. El precio sube y la cantidad cae: la prohibición reduce el uso. Pero como pocos adictos dejarían el hábito por el precio, la demanda es probablemente inelástica, y el aumento del precio aumenta los ingresos totales del mercado: los adictos que ya robaban necesitarán más dinero, y la prohibición podría aumentar los delitos. Por eso algunos analistas proponen reducir la demanda mediante educación: la curva de demanda se desplaza a la izquierda, caen la cantidad, el precio y los ingresos totales, y así se reducen tanto el uso como el crimen. Los partidarios de la prohibición argumentan que la demanda es inelástica a corto plazo pero puede ser más elástica a largo plazo, porque precios altos desalientan la experimentación de los jóvenes; la prohibición aumentaría los delitos a corto plazo y los disminuiría a largo plazo.\n\n### Conclusión\n\nSegún una vieja broma, un perico puede convertirse en economista aprendiendo a decir «oferta y demanda». Las herramientas de la oferta y la demanda permiten analizar muchas de las más importantes políticas y eventos de la economía."}, "1": {"ejercicios": [], "leido": false, "resumen": "## Capítulo 10. Externalidades\n\nLas empresas que fabrican papel crean como subproducto una sustancia química, la dioxina, que una vez en el ambiente aumenta el riesgo de cáncer, defectos congénitos y otros problemas de salud. ¿Es un problema para la sociedad? En los capítulos 4 a 9 se vio que el equilibrio de oferta y demanda es típicamente una distribución eficiente de los recursos: la «mano invisible» de Adam Smith lleva a compradores y vendedores egoístas a maximizar el beneficio total. Es la base del principio según el cual los mercados son por lo general una buena forma de organizar la actividad económica. ¿Impide entonces la mano invisible que las papeleras emitan demasiada dioxina?\n\nLos mercados hacen bien muchas cosas, pero no todo. El capítulo estudia otro principio: las acciones del gobierno pueden mejorar los resultados del mercado. Examina por qué los mercados a veces no distribuyen con eficiencia, cómo las políticas pueden mejorar la distribución y cuáles funcionan mejor. Estas fallas se agrupan bajo las **externalidades**: efecto no compensado de las acciones de una persona sobre el bienestar de un tercero. Si el impacto es negativo, **externalidad negativa**; si beneficia, **positiva**. Con externalidades, el interés de la sociedad incluye el bienestar de terceros afectados indirectamente; como compradores y vendedores desatienden esos efectos, el equilibrio no es eficiente: no maximiza el beneficio total. La dioxina es una externalidad negativa: ni las papeleras ni los consumidores consideran el costo total de la contaminación, y se emitirá mucha a menos que el gobierno lo impida. Ejemplos:\n\n• **El tubo de escape** genera smog que otros respiran: los conductores contaminan demasiado. El gobierno fija normas de emisiones y grava la gasolina.\n• **Los edificios históricos restaurados** son una externalidad positiva para quienes pasan; los propietarios no captan todo el beneficio y tienden a deshacerse de ellos. Los gobiernos regulan su destrucción y dan exenciones a quienes los restauran.\n• **Los perros que ladran** molestan a los vecinos; los dueños toman pocas precauciones. Los gobiernos prohíben «alterar el orden público».\n• **La investigación de nuevas tecnologías** crea conocimiento que otros usan; los investigadores no captan todos los beneficios y destinan pocos recursos. El gobierno usa las patentes, que dan uso exclusivo por tiempo limitado.\n\nEn cada caso un tomador de decisiones no considera los efectos externos, y el gobierno trata de influir en su conducta para proteger a terceros.\n\n### Externalidades e ineficiencia del mercado\n\nSe usan las herramientas de la economía del bienestar (capítulo 7) para mostrar por qué las externalidades llevan a distribuir mal los recursos.\n\n**Economía del bienestar: una recapitulación.** En el mercado del aluminio, la curva de demanda refleja el valor para los consumidores: su altura muestra la disposición a pagar del comprador marginal, el valor de la última unidad comprada. La curva de oferta refleja el costo: su altura muestra el costo del vendedor marginal. Sin intervención, el precio equilibra oferta y demanda, y la cantidad de equilibrio (QMERCADO) es eficiente: maximiza la suma de excedentes del productor y del consumidor, es decir, el valor total para los consumidores menos el costo total para los productores.\n\n**Externalidades negativas.** Si las fábricas emiten humo que daña la salud, el costo para la sociedad es mayor que el costo para los productores: el **costo social** incluye los costos privados más los de los afectados. La curva de costo social está por encima de la oferta, y la diferencia refleja el costo de la contaminación. Un planificador social benevolente, que quiere maximizar el excedente total considerando los costos externos, elegiría la producción donde la demanda corta la curva de costo social: es la cantidad óptima. Debajo de ese nivel, el valor para los consumidores excede el costo social; por encima, el costo social de una unidad adicional supera su valor. La cantidad de equilibrio QMERCADO es mayor que la óptima QÓPTIMA, porque el equilibrio refleja solo los costos privados: reducir producción y consumo por debajo del equilibrio aumenta el bienestar total. El planificador podría gravar cada tonelada vendida: el impuesto desplaza la oferta hacia arriba y, si reflejara el costo externo, coincidiría con la curva de costo social. Es **internalizar la externalidad**: cambiar los incentivos para que las personas tomen en cuenta los efectos externos de sus acciones. Los productores considerarían el costo de contaminar y los consumidores usarían menos aluminio. Se basa en el principio de que las personas responden a los incentivos.\n\n**Las externalidades positivas.** El beneficio de la educación es en gran medida privado (un trabajador más productivo con mejor salario), pero también produce externalidades positivas: electores más informados y mejor gobierno, menores tasas de delincuencia, y desarrollo y divulgación de avances tecnológicos con mayor productividad y salarios para todos. El análisis es similar: la curva de valor social está por encima de la demanda, el óptimo está donde el valor social corta la oferta, y la cantidad socialmente óptima es mayor que la del mercado. La respuesta es lo contrario que en el caso negativo: un subsidio, que es lo que hace el gobierno con escuelas públicas y becas.\n\n**En resumen:** las externalidades negativas llevan a producir más de lo socialmente deseable y las positivas, menos. El gobierno puede internalizarlas gravando los bienes con externalidades negativas y subsidiando los que generan positivas.\n\n**En las noticias: las externalidades de la vida en el campo** (Edward Glaeser, «El Lórax estaba equivocado: los rascacielos son ecológicos», *New York Times*, 2009). En la fábula del Dr. Seuss, el Once-ler tala los árboles de Trúfula hasta destruir la fuente de sus ingresos. Algunas lecciones son correctas: mata la gallina de los huevos de oro, y cosas malas suceden cuando se pesca de más en un estanque común. Pero presenta la urbanización como algo terrible, cuando vivir en ciudades es ecológico y vivir rodeado de bosques no. Glaeser y Matthew Kahn calcularon las emisiones de carbono de una nueva casa en distintas zonas: los habitantes de las zonas centrales emiten menos que los suburbanos (en Nueva York y San Francisco, más de dos toneladas menos al año; en Nashville, más de tres). La densidad significa distancias más cortas; los autos explican solo un tercio de la diferencia, y la electricidad y la calefacción el resto (en total, siete toneladas entre Manhattan y Westchester). Los ambientalistas deberían abogar por más rascacielos: el ideal ecológico es un departamento en el centro de San Francisco y no un rancho en Marin County. Thoreau, que exaltó la vida en el bosque, quemó 121 hectáreas de bosque en Concord preparando una sopa.\n\n**Caso de estudio: derrama tecnológica, política industrial y protección de patentes.** La **derrama tecnológica** es el efecto de la investigación y producción de una empresa sobre el acceso de otras a los adelantos tecnológicos. Al construir un robot industrial puede descubrirse un mejor diseño que pasa a la reserva común de conocimientos: una externalidad positiva. El gobierno puede subsidiar la producción de robots; el subsidio desplaza la oferta hacia abajo y debe igualar el valor del excedente tecnológico. ¿De qué magnitud son las derramas? Es importante, porque el progreso tecnológico es la clave del aumento de los niveles de vida, pero los economistas no se ponen de acuerdo. Algunos creen que son generales y que el gobierno debe incentivar las industrias con mayores derramas (más chips que papas fritas); Estados Unidos lo hace en forma limitada con deducciones para investigación y desarrollo, y algunos países subsidian industrias específicas: es la **política industrial**. Otros tienen reservas: requiere medir el tamaño de las derramas, algo difícil, y sin mediciones precisas el sistema político puede subsidiar a las industrias con más influencia política. Otra forma es la protección de patentes, que da derechos de propiedad sobre el invento: otras empresas deben pedir autorización y pagar regalías, lo que incentiva la investigación.\n\n### Políticas públicas dirigidas a las externalidades\n\nTodas las soluciones buscan acercar la distribución de los recursos al óptimo social. El gobierno responde de dos formas: las **políticas de orden y control** regulan directamente el comportamiento; las **políticas basadas en el mercado** dan incentivos para que los particulares resuelvan el problema.\n\n**Las políticas de orden y control: la regulación.** El gobierno puede exigir o prohibir conductas: verter químicos venenosos en el agua es delito, porque los costos externos exceden por mucho los beneficios. Pero en la mayoría de los casos de contaminación no es tan sencillo: sería imposible prohibir toda actividad contaminante (casi todo transporte, incluso los caballos, contamina). La sociedad debe ponderar costos y beneficios para decidir qué tipo y cantidad permitir. En Estados Unidos lo hace la Agencia de Protección Ambiental (EPA), que fija niveles máximos u obliga a adoptar tecnologías. Para diseñar buenas reglas, los reguladores deben conocer los detalles de cada industria y sus tecnologías alternas, información a menudo difícil de obtener.\n\n**Política basada en el mercado 1: impuestos correctivos y subsidios.** El gobierno puede alinear los incentivos privados con la eficiencia social gravando las actividades con externalidades negativas y subsidiando las positivas. Los **impuestos correctivos** (o **pigouvianos**, por Arthur Pigou, 1877–1959) buscan inducir a considerar el costo social de una externalidad negativa; el ideal sería igual al costo externo, y el subsidio ideal, al beneficio externo. Los economistas los prefieren a las regulaciones porque reducen la contaminación con menor costo social. Ejemplo: una papelera y una acería vierten cada una 500 toneladas de basura al río; la EPA puede ordenar reducir a 300 toneladas o cobrar $50.000 por tonelada. El impuesto es tan eficaz como la regulación para reducir el total (cuanto mayor, mayor la reducción; si es muy alto, las fábricas cierran), pero más eficiente: la regulación exige igual reducción a cada una, mientras que con el impuesto la que reduce a menor costo (la papelera) reduce mucho y la otra reduce menos y paga. El impuesto correctivo asigna un precio al derecho de contaminar y distribuye la contaminación entre las fábricas con mayores costos para reducirla: logra cualquier nivel con el menor costo total. Además es mejor para el ambiente: con la regulación no hay motivo para reducir más allá de las 300 toneladas; el impuesto incentiva tecnologías más limpias. Los impuestos correctivos son diferentes a otros: casi todos distorsionan los incentivos y generan pérdida de peso muerto (capítulo 8), pero estos acercan los recursos al óptimo social: recaudan y además aumentan la eficiencia.\n\n**Caso de estudio: ¿por qué es tan alto el impuesto a la gasolina?** Es un impuesto correctivo contra tres externalidades negativas del uso de vehículos:\n\n• **Congestionamiento vial:** estimula el transporte público, compartir el auto y vivir más cerca del trabajo.\n• **Accidentes:** los autos grandes y las SUV aumentan la seguridad propia pero ponen en riesgo a otros (quien maneja un auto típico tiene cinco veces más probabilidades de morir si choca con una SUV); el impuesto hace pagar ese riesgo.\n• **Contaminación:** smog y, según se cree comúnmente, calentamiento global; los expertos discrepan sobre el peligro, pero el impuesto reduce el consumo.\n\nEn lugar de causar pérdidas de peso muerto, hace que la economía funcione mejor. Los países europeos lo fijan mucho más alto que Estados Unidos; un estudio de 2007 en el *Journal of Economic Literature* estimó el óptimo en $2,10 por galón, frente a 40 centavos vigentes. Lo recaudado podría reducir impuestos distorsionantes como el de la renta y haría innecesarias regulaciones sobre eficiencia de combustible. La idea nunca ha sido políticamente popular.\n\n**Política basada en el mercado 2: los permisos negociables para contaminar.** Si la EPA adopta la regulación de 300 toneladas y luego la acería quiere aumentar 100 toneladas y la papelera reducirlas a cambio de $5 millones, dejar hacer el trato es buena política: es voluntario, ambas mejoran y la contaminación total no cambia. Permitir esas transferencias crea un nuevo recurso escaso, los permisos para contaminar; se desarrollará un mercado regido por oferta y demanda, y la mano invisible los asignará a las empresas que más los valoran, según su disposición a pagar, que depende del costo de reducir la contaminación. La distribución inicial no importa para la eficiencia: las que reducen a menor costo venden y las de mayor costo compran. Permisos e impuestos tienen mucho en común: en ambos las empresas pagan por contaminar (incluso las que ya tienen permisos enfrentan el costo de oportunidad de no venderlos) y ambos internalizan la externalidad. En el mercado de la contaminación (figura 4), con el impuesto la EPA fija el precio (oferta perfectamente elástica) y la demanda determina la cantidad; con permisos fija la cantidad (oferta perfectamente inelástica) y la demanda determina el precio: puede lograr cualquier punto de la curva. Los permisos pueden ser mejores si la EPA no conoce la curva de demanda: si quiere no más de 600 toneladas, subasta 600 permisos y el precio de subasta da el tamaño apropiado del impuesto. El caso del dióxido de azufre (SO2), causa de la lluvia ácida, es un éxito notable: las reformas de 1990 a la Ley de Aire Limpio obligaron a reducir emisiones y permitieron vender las asignaciones; pese al escepticismo inicial de industria y ambientalistas, redujo la contaminación con distorsión mínima.\n\n**Objeciones al análisis económico de la contaminación.** «No podemos dar a nadie la opción de contaminar a cambio de un pago» (senador Edmund Muskie): para algunos ambientalistas, el aire y el agua limpios son derechos humanos fundamentales que no deben ponerse en términos económicos, y el ambiente debe protegerse sin importar el costo. Los economistas no se dejan conmover: las personas enfrentan disyuntivas, y el valor del aire y el agua limpios debe compararse con su costo de oportunidad. Eliminar toda la contaminación es imposible y daría marcha atrás a avances que sostienen el nivel de vida; pocos aceptarían desnutrición, mala atención médica o vivienda pésima a cambio del ambiente más limpio posible. Algunos activistas van contra su propia causa por no pensar en términos económicos: un ambiente limpio es otro bien normal, con elasticidad ingreso positiva (los países ricos pueden permitirse más protección), y obedece la ley de la demanda: cuanto más barata la protección, más la querrá el público. Permisos e impuestos reducen su costo y deberían aumentar esa demanda.\n\n**En las noticias: fijación de límites máximos y negociación** (N. Gregory Mankiw, «Una oportunidad perdida para el cambio climático», *New York Times*, 2009). Las emisiones de dióxido de carbono son una externalidad negativa; la solución de libro de texto es gravarlas y usar lo recaudado para reducir otros impuestos, con apoyo de una mayoría aplastante de economistas. Obama propuso en campaña un sistema de límites máximos y negociación con todas las asignaciones subastadas, equivalente a un impuesto: el precio de subasta es un impuesto sobre el carbono y lo recaudado permite reducir impuestos distorsionantes. Pero la ley de la Cámara regala los derechos a intereses especiales: si se subastaran todos, se recaudarían 989.000 millones de dólares en diez años; con la ley, solo 276.000 millones. Obama mismo había advertido en 2007 que el peligro era regalar los permisos, como hicieron los europeos. Para la eficiencia en la distribución de los derechos no importa, porque la parte «comercial» se ocupa del resto; el problema es la interacción con el sistema impositivo: el precio de los derechos se trasladará a los consumidores, y sin recursos para reducir otros impuestos subirán las tasas efectivas, con menor ingreso disponible, menores incentivos laborales y menor actividad. Para unos, una ley imperfecta es mejor que nada; para otros, un paso en la dirección equivocada. Todos deberían coincidir en que es una oportunidad perdida.\n\n### Soluciones privadas a las externalidades\n\nLa acción gubernamental no siempre es necesaria: a veces las personas llegan a soluciones privadas.\n\n**Los tipos de soluciones privadas.**\n\n• **Códigos morales y sanciones sociales:** la mayoría no arroja basura porque no es lo que se debe hacer. La regla de oro («trata a los demás como quisieras que te trataran») enseña a internalizar las externalidades.\n• **Instituciones de beneficencia:** el Sierra Club protege el ambiente con donativos; las universidades reciben donaciones en parte porque la educación tiene externalidades positivas. El gobierno lo incentiva haciendo deducibles los donativos.\n• **Integración de empresas:** un productor de manzanas y un apicultor vecinos se confieren externalidades positivas (las abejas polinizan; el néctar produce miel), pero al decidir no las consideran y hay pocos árboles y pocas abejas. Si uno comprara el negocio del otro, la misma empresa decidiría el número óptimo. Internalizar externalidades es una razón por la que algunas empresas tienen distintos negocios.\n• **Contratos** entre las partes, que fijen el número de árboles y de abejas y quizás un pago.\n\n**El teorema de Coase.** Si los particulares pueden negociar sin costo la asignación de recursos, el mercado privado resolverá siempre el problema de las externalidades y asignará eficientemente los recursos. El perro Spot de Dick ladra y molesta a Jane. El resultado eficiente compara el beneficio de Dick con el costo de Jane. Si Dick obtiene $500 y a Jane le cuesta $800, Jane puede ofrecer $600 para que se deshaga del perro, y ambos mejoran. Si Dick obtiene $1000, rechazará cualquier oferta menor y Jane no ofrecerá más de $800: Dick se queda con el perro, lo cual también es eficiente. La distribución inicial de los derechos no afecta la capacidad de llegar al resultado eficiente: si Jane tuviera derecho a la tranquilidad, Dick podría pagarle para quedarse con el perro si su beneficio supera el costo de ella. Pero sí determina la distribución del bienestar: quién le paga a quién. **En resumen:** los actores privados pueden resolver entre ellos las externalidades; sin importar la distribución inicial de los derechos, pueden llegar a un acuerdo en el que todos estén mejor y el resultado sea eficiente.\n\n**Por qué las soluciones privadas no siempre funcionan.** El teorema solo se aplica si las partes pueden llegar a un acuerdo y hacerlo cumplir sin problemas. Obstáculos: los **costos de transacción**, en los que se incurre para negociar y cumplir un acuerdo (un traductor si hablan idiomas diferentes; en casos reales, los abogados); las negociaciones que se rompen, porque cada parte espera un mejor trato (Dick pide $750, Jane ofrece $550 y mientras regatean el perro sigue ladrando), como muestran las guerras y las huelgas; y el número de partes: si una fábrica contamina un lago, coordinar a muchos pescadores es casi imposible. Cuando la negociación privada no funciona, el gobierno, institución diseñada para la acción colectiva, puede actuar en nombre de los afectados.\n\n### Conclusión\n\nLa mano invisible es poderosa, pero no omnipotente. El equilibrio maximiza la suma de excedentes, y es eficiente cuando solo participan compradores y vendedores; con efectos externos hay que considerar a terceros y el mercado puede no asignar eficientemente. A veces las personas lo resuelven solas (teorema de Coase), pero no siempre, por ejemplo cuando hay muchas partes. Cuando interviene, el gobierno no debe abandonar las fuerzas del mercado: puede obligar a los decisores a cargar con los costos totales de sus acciones mediante impuestos correctivos y permisos de contaminación, cada vez más preferidos por quienes quieren proteger el ambiente. Las fuerzas del mercado, reorientadas correctamente, son con frecuencia el mejor remedio para las fallas del mercado.\n\n**Conceptos clave:** externalidad, internalizar la externalidad, impuesto correctivo, teorema de Coase, costos de transacción.\n\n## Capítulo 11. Bienes públicos y recursos comunes\n\nUna vieja canción decía que «las mejores cosas de la vida son gratis»: la naturaleza ofrece ríos, montañas, playas, lagos y océanos; el gobierno, parques y desfiles. Los bienes sin precio son un reto especial para el análisis económico. La mayoría de los bienes se distribuye por mercados, donde los precios guían las decisiones y producen una distribución eficiente; pero cuando los bienes están disponibles sin costo, esas fuerzas están ausentes. El capítulo examina los problemas de distribución cuando hay bienes sin precio de mercado, y aclara el principio de que algunas veces el gobierno puede mejorar los resultados del mercado.\n\n### Los diferentes tipos de bienes\n\nEl mercado provee la cantidad eficiente de helado, pero no evita que los productores de aluminio contaminen: funciona bien con el helado y mal con el aire limpio. Conviene agrupar los bienes según dos características: **exclusión** (se puede impedir que una persona lo use) y **rivalidad en el consumo** (el uso de una persona disminuye el uso que otra pueda darle). Resultan cuatro categorías (figura 1):\n\n1. **Bienes privados:** excluyentes y rivales (un vaso de helado, ropa, autopistas de cuota congestionadas). La mayoría de los bienes; en los capítulos 4 a 9 se supuso implícitamente este tipo.\n2. **Bienes públicos:** ni excluyentes ni rivales (alarma de tornados, defensa nacional, autopistas libres sin congestionamiento): no se puede impedir oír la alarma y el beneficio de uno no reduce el de otro.\n3. **Recursos comunes:** rivales pero no excluyentes (peces en el océano, el ambiente, autopistas libres congestionadas): quien pesca deja menos peces, pero dada la vastedad del océano es difícil excluir.\n4. **Bienes reservados:** excluyentes pero no rivales (protección contra incendios en un pueblo pequeño, televisión por cable, autopistas de cuota no congestionadas): se puede dejar arder una casa, pero proteger una más cuesta muy poco. Son un tipo de monopolio natural (capítulo 15).\n\nLos límites son a veces confusos y es cuestión de grado: una guardia costera grande haría excluyentes en alguna medida a los peces, y estos serían menos rivales si los pescadores fueran pocos (antes de los colonizadores europeos). El capítulo examina los bienes no excluyentes, públicos y recursos comunes, disponibles para todos sin cargo. Su estudio se relaciona con las externalidades, que surgen porque algo de valor no tiene precio: quien provee un bien público beneficia a otros que no pagan (externalidad positiva); quien usa un recurso común deja peor a otros sin compensarlos (externalidad negativa). Por eso las decisiones privadas pueden ser ineficientes y la intervención del gobierno puede aumentar el bienestar.\n\n### Bienes públicos\n\nUn espectáculo de fuegos artificiales no es excluyente (es imposible impedir verlo) ni rival (el disfrute de uno no reduce el de otro).\n\n**El problema del parásito (free rider).** Los 500 habitantes de Smalltown valoran los fuegos del 4 de julio en $10 cada uno: $5000 de beneficio, frente a $1000 de costo; es eficiente hacerlos. Pero si Ellen, una empresaria, los monta, tendrá problemas para vender boletos: los clientes se darán cuenta de que pueden verlos sin pagar. Un **parásito** es quien recibe el beneficio de un bien pero evade el pago. La falla surge de una externalidad: Ellen otorga un beneficio externo que no toma en cuenta, y su decisión de no montar el espectáculo es privadamente racional pero socialmente ineficiente. La solución: el gobierno local sube $2 los impuestos a cada uno y contrata a Ellen; cada residente gana $8. Lección general: como los bienes públicos no son excluyentes, el problema del parásito impide que el mercado privado los ofrezca; si los beneficios totales superan los costos, el gobierno puede proveerlos con impuestos y hacer que todos estén mejor.\n\n**Algunos bienes públicos importantes.**\n\n• **Defensa nacional:** ejemplo clásico, ni excluyente ni rival. Es de los más caros: en 2009 Estados Unidos gastó 661.000 millones de dólares, más de $2150 por persona. No hay consenso sobre el monto, pero casi nadie duda de la necesidad; incluso quienes abogan por un gobierno pequeño coinciden en que el gobierno debe proveerla.\n• **Investigación básica:** el conocimiento tecnológico específico (baterías de larga duración, microchips) puede patentarse, lo que lo hace excluyente; el conocimiento general es un bien público: un matemático no puede patentar un teorema, que pasa al acervo común y tampoco es rival. Las empresas gastan en investigación patentable pero poco en investigación básica, y aprovechan gratis la de otros; sin políticas públicas se dedicarían muy pocos recursos. El gobierno la subsidia (National Institutes of Health, National Science Foundation); algunos justifican así el programa espacial, aunque hay científicos escépticos sobre los viajes tripulados. Es difícil determinar el nivel apropiado: los beneficios son difíciles de medir y los legisladores tienen poco conocimiento científico; no debe sorprender que no se pague el monto y el tipo adecuados.\n• **Combate a la pobreza:** programas como la asistencia social (TANF), los vales de comida y la vivienda asequible se financian con impuestos a las familias más exitosas. Los economistas discrepan sobre el papel del gobierno (capítulo 20), pero sus defensores sostienen que combatir la pobreza es un bien público: vivir en una sociedad sin pobreza no es rival ni excluyente, de modo que las personas tenderían a aprovechar la generosidad de otros. La beneficencia privada probablemente no funcionaría; gravando a los ricos para elevar el nivel de vida de los pobres, todos pueden estar mejor.\n\n**Caso de estudio: ¿los faros son bienes públicos?** Algunos bienes alternan según las circunstancias: los fuegos artificiales son públicos en una ciudad y casi privados en Walt Disney World, donde se paga entrada. Los faros se usan desde hace mucho como ejemplo de bien público: cada capitán tiene incentivo a ser parásito, y por eso hoy los gobiernos operan la mayoría. Pero en la Inglaterra del siglo XIX algunos eran privados y cobraban al dueño del puerto cercano; si no pagaba, se apagaba la luz y los barcos evitaban el puerto. Para decidir si algo es un bien público hay que ver quiénes son los beneficiarios y si pueden ser excluidos: el problema del parásito surge cuando son muchos y es imposible excluirlos.\n\n**El difícil trabajo del análisis costo-beneficio.** Decidir que el gobierno intervenga es el primer paso; luego debe determinar qué bienes públicos ofrecer y en qué cantidad. Para una nueva autopista, el **análisis costo-beneficio** compara los costos y beneficios totales para la sociedad. Es difícil: no hay precio con el cual evaluar el valor; las encuestas no son confiables, porque los beneficios son difíciles de cuantificar y los encuestados no tienen incentivo a decir la verdad (los usuarios exageran los beneficios y los perjudicados, los costos). La provisión eficiente de bienes públicos es intrínsecamente más difícil que la de bienes privados: en un mercado los compradores revelan su valoración y los vendedores sus costos a través de los precios, y el equilibrio refleja esa información; los analistas no observan señales de precio y sus conclusiones son, en el mejor de los casos, aproximaciones vagas.\n\n**Caso de estudio: ¿cuánto vale una vida?** Un semáforo de $10.000 reduciría el riesgo de accidentes mortales en una intersección de 1,6% a 1,1%. Costos y beneficios deben medirse en las mismas unidades, y hay que asignar un valor monetario a la vida. La tentación es decir que es infinito, pero eso produciría resultados sin sentido: habría semáforos en cada esquina y todos conducirían autos con la máxima seguridad; en las decisiones públicas y privadas a veces se arriesga la vida para ahorrar dinero. Un método, usado en tribunales, es calcular lo que la persona habría ganado; los economistas lo critican porque implica que la vida de un jubilado o discapacitado no tiene valor. Mejor es analizar los riesgos que las personas asumen voluntariamente y cuánto se les paga por ello: comparando salarios entre ocupaciones más y menos riesgosas, con otros determinantes constantes, se estima el valor de una vida en unos $10 millones. El semáforo reduce el riesgo 0,5%: beneficio esperado de 0,005 × $10 millones = $50.000, mayor que el costo; debería aprobarse.\n\n### Recursos comunes\n\nComo los bienes públicos, no son excluyentes; pero son rivales, lo que crea un nuevo problema: una vez provisto el bien, hay que vigilar cuánto se usa. Se entiende mejor con la **tragedia de los comunes**, parábola que ilustra por qué los recursos comunes se usan más de lo socialmente deseable.\n\n**La tragedia de los comunes.** En un pueblo medieval muchas familias crían ovejas y viven de la lana. Las ovejas pastan en Town Common, tierra de propiedad colectiva; mientras la tierra es abundante no es rival y no hay problemas. Con los años crecen la población y las ovejas; la tierra pierde capacidad de recuperarse y se vuelve estéril; la industria de la lana desaparece y muchas familias pierden su sustento. La causa es que los incentivos sociales y privados difieren: impedir la destrucción depende de la acción colectiva, pero ninguna familia tenía incentivo a reducir su rebaño, que era solo una parte del problema. Es una externalidad: el rebaño de una familia reduce la calidad de la tierra para las demás, y al ignorarlo resultan demasiadas ovejas. El pueblo podría haber regulado el número de ovejas, gravado cada oveja o subastado permisos, como la sociedad moderna trata la contaminación. Pero en el caso de la tierra hay una solución más sencilla: dividirla entre las familias y cercarla, convirtiéndola en bien privado, como ocurrió con los cercamientos en la Inglaterra del siglo XVII. Moraleja: quien usa un recurso común disminuye el disfrute de otros, y por esa externalidad negativa los recursos comunes se usan en exceso; el gobierno puede regular, gravar o transformarlos en bienes privados. Aristóteles ya lo señalaba: «Lo que es común a muchos es a lo que se le pone menos cuidado».\n\n**Algunos recursos comunes importantes.** En casi todos surge el mismo problema, y los gobiernos regulan o imponen cuotas.\n\n• **Aire y agua limpios:** son recursos comunes como la tierra de pastoreo, y la contaminación excesiva equivale al pastoreo excesivo. La degradación ambiental es la moderna tragedia de los comunes.\n• **Autopistas congestionadas:** una autopista sin congestión es un bien público; congestionada, cada usuario reduce la velocidad de los demás y se vuelve un recurso común. El peaje es en esencia un impuesto correctivo sobre la externalidad del congestionamiento; en avenidas locales no es práctico por el costo de cobrarlo, pero en Londres y Estocolmo ha sido muy eficaz. Si el problema es solo en horas pico, conviene cobrar más en esos horarios. El impuesto a la gasolina, complementaria del automóvil, también reduce el tránsito, pero es imperfecto porque desincentiva el uso de autopistas no congestionadas, donde no hay externalidad.\n• **Peces, ballenas y otra fauna silvestre:** tienen valor comercial y cualquiera puede pescar; nadie tiene incentivo a conservarlos para el año siguiente. Los océanos son de los recursos comunes menos regulados, por dos problemas: muchos países tienen acceso, lo que exige cooperación internacional entre países con valores diferentes, y su inmensidad dificulta hacer cumplir los acuerdos; los derechos de pesca causan tensiones aun entre naciones amigas. En Estados Unidos se cobran licencias, se limitan las temporadas, se exige devolver los peces pequeños y se limita el número de presas.\n\n**En las noticias: el caso de las autopistas** (Eric A. Morris, blog *Freakonomics*, 2009). Julio César prohibió las carretas de día en Roma y el congestionamiento pasó a la noche. En 2005 el viajero urbano típico de Estados Unidos perdió 38 horas en el tránsito (14 en 1982). Existe una solución viable, la «fijación de precios del congestionamiento» o peaje variable: cuanto más tránsito, más alta la cuota, hasta que el congestionamiento desaparezca. Las objeciones (pagar por caminos ya pagados con impuestos, congestión en las vías libres, «carriles para Lexus» que perjudican a los pobres) merecen consideración, pero son exageradas. Cuando se da algo valioso por menos de su valor, el resultado es la escasez: se paga con tiempo y esfuerzo, como los compradores soviéticos en filas interminables. La tardanza es una externalidad que los conductores se imponen entre sí; internalizarla con peajes desplazaría algunos viajes a otras horas y rutas o los eliminaría. No evita los accidentes, pero puede eliminar el congestionamiento crónico: siempre existe un peaje que mantiene fluida la circulación, si el precio es justo. Lo mejor es variarlo en tiempo real con sensores (I-394 en Minnesota, I-15 en California), con precios actualizados cada pocos minutos. Lo realista es cobrar solo en algunos carriles y dejar elegir entre esperar o pagar. En la ruta 167 de Washington la cuota máxima fue de $5,75 y ahorró 27 minutos; su valor depende de lo que cada uno tenga que hacer ese día.\n\n**Caso de estudio: ¿por qué no se han extinguido las vacas?** Más de 60 millones de búfalos habitaban América del Norte, y para 1900 quedaban 400; hoy los cazadores furtivos matan elefantes africanos por el marfil. Pero a nadie le preocupa la extinción de la vaca: la demanda de carne asegura que prospere. La razón es que los elefantes son un recurso común y las vacas un bien privado: cada cazador furtivo tiene incentivo a matar cuantos pueda, mientras que cada ranchero cosecha los beneficios de cuidar su ganado. Kenia, Tanzania y Uganda prohibieron la caza y la venta de marfil, pero ha sido difícil hacer cumplir la ley y la población siguió bajando; Botsuana, Malaui, Namibia y Zimbabue convirtieron a los elefantes en bien privado, permitiendo matar solo los propios, y las poblaciones comenzaron a aumentar.\n\n### Conclusión: la importancia de los derechos de propiedad\n\nHay «bienes» que el mercado no proporciona adecuadamente, como el aire limpio o la defensa nacional, y la sociedad los confía al gobierno. Todos estos problemas tienen algo en común: el mercado no distribuye con eficiencia porque los **derechos de propiedad** no están bien establecidos; algún objeto de valor no tiene un dueño con autoridad legal para controlarlo. Nadie tiene derecho a fijar un precio al aire limpio o a la defensa: una fábrica contamina demasiado porque nadie le cobra, y el mercado no provee defensa porque nadie puede cobrar a los defendidos. Cuando la ausencia de derechos de propiedad provoca una falla, el gobierno puede resolverla: a veces ayudando a definirlos y liberando las fuerzas del mercado (permisos de contaminación); a veces regulando la conducta privada (temporadas de caza); a veces usando impuestos para ofrecer lo que el mercado no puede (defensa nacional). Si la política se planea y aplica correctamente, puede hacer más eficiente la distribución de los recursos y aumentar el bienestar económico.\n\n**Conceptos clave:** exclusión, rivalidad en el consumo, bienes privados, bienes públicos, recursos comunes, bienes reservados, parásito, análisis costo-beneficio, tragedia de los comunes."}, "2": {"ejercicios": [], "leido": false, "resumen": "## Los bienes públicos globales y regionales: una herramienta para la gestión de la globalización\n\n### I. Introducción\n\nEn el mundo actual muchas de las crisis que sufre el planeta son consecuencia de la insuficiente provisión de **Bienes Públicos Globales (BPG)**. Desde las desastrosas crisis financieras y cambiarias, los «Tsunamis Financieros», hasta la silente y bochornosa crisis de la pobreza extrema y el peligroso «calentamiento global», son fenómenos que reflejan la importancia estratégica de entender, analizar y utilizar esta poderosa herramienta de la política económica en la globalización.\n\nLa contribución de **Paul Samuelson** (MIT) en 1954, «The Pure Theory of Public Expenditure», que formula sistemáticamente la teoría de los bienes públicos, seguida en 1971 por **Mancur Olson**, «The Logic of Collective Action», que estudia los problemas de la acción colectiva y la provisión de bienes públicos, marcaron el inicio de los análisis económicos sobre esta problemática. La aplicación del concepto a los problemas internacionales tiene como precursores a **Garrett Hardin** (1968), «The Tragedy of the Commons», y a **Charles Kindleberger**, quien en «The World in Depression 1929‑1939» (1986) caracterizó la crisis de los años 30 como una incapacidad para proporcionar bienes públicos clave (Kaul et al., 2001).\n\nEn la última década del siglo XX y la primera del XXI, un grupo selecto de autores de países desarrollados generó innumerables estudios sobre los BPG, también llamados Bienes Públicos Mundiales o Transnacionales. Destaca **Todd Sandler** (Universidad del Sur de California), con grandes contribuciones sobre los bienes públicos intergeneracionales, la cooperación y el financiamiento internacional de los BPG, la lucha antiterrorista, la prevención de la guerra nuclear y la seguridad mundial como BPG, y sobre los **Bienes Públicos Regionales (BPR)**. Dos libros colectivos coordinados por funcionarios del PNUD tuvieron un tremendo impacto sobre políticos y académicos: Kaul, Grunberg y Stern (1999), *Global Public Goods: International Cooperation in the 21st Century*, y Kaul, Conceição, Le Goulven y Mendoza (2003), *Providing Global Public Goods: Managing Globalization*. En español se destaca Marín Quemada y García‑Verdugo (UNED, 2003), *Bienes Públicos Globales, Política Económica y Globalización*.\n\nEstos estudios responden a una nueva realidad global: la demanda de bienes públicos internacionales se ha incrementado a medida que se expande y profundiza la globalización, pero la oferta no crece al mismo ritmo. La decisión de suministrarlos o no es lo que convierte la globalización en oportunidad o amenaza (Kaul et al., 2003).\n\n### II. Características de los BPG\n\nSamuelson (1954) identificó dos características definitorias de un bien público que lo distinguen de los privados:\n\n• **No exclusividad:** una vez producido, sus beneficios están al alcance de todos, y quienes no contribuyeron a proveerlo no pueden ser excluidos de su consumo.\n• **No rivalidad:** el consumo de una cantidad por un individuo o agente no reduce la oferta disponible para otros; la cantidad adicional que consume otra persona no genera costo.\n\nAdemás, un BPG debe cumplir tres criterios adicionales (Marín Quemada y García‑Verdugo, 2003; Kaul et al., 2001): sus beneficios deben ser universales en términos de países (más de un grupo de países); deben extenderse, preferiblemente, a todos los grupos de la población; y deben satisfacer las necesidades de las generaciones presentes sin impedir las opciones de desarrollo de las futuras.\n\nLa no exclusividad conlleva el concepto de **externalidad**: «Las externalidades surgen cuando una persona emprende una acción pero no sufraga todos sus costos (externalidad negativa) o todos los beneficios (externalidad positiva) de la acción» (Stiglitz, 1997). Las positivas pueden internalizarse cuando el valor agregado generado por un agente queda bajo su control. La no rivalidad se logra cuando el costo marginal de una unidad adicional de consumo es igual a cero: cualquiera puede consumir el bien sin límite, a diferencia del bien privado, cuyo consumo adicional tiene costo marginal superior a cero.\n\n### III. Dificultades para proveer los BPG\n\nLa provisión enfrenta graves dificultades por dos características del comportamiento colectivo de los países:\n\n• **El beneficio gratuito (free‑riding)**, cuando una persona o país disfruta del beneficio de un bien público sin aportar una contribución igual para su producción. Es un fenómeno social generalizado: «la tentación de recibir un beneficio gratuito, ser un parásito o sencillamente no expresar las preferencias propias, envía la señal errónea a los proveedores» (Kaul et al., 2001). El resultado es una provisión insuficiente, que hace necesario diseñar estrategias de acción colectiva para lograr la cooperación entre países.\n• **El dilema del prisionero**, de la teoría de juegos, en el que la falta de información impide la colaboración entre dos prisioneros. Representa muchas situaciones reales en que dos o más partes tienen incentivos similares para «desertar» de la cooperación, a menos que se creen mecanismos que faciliten la comunicación y generen confianza. La incapacidad de acordar una estrategia común puede conducir a una estrategia subóptima aun cuando cada individuo, empresa o país actúe racionalmente, con falta de provisión o provisión insuficiente (Martin, 2001). El modelo de intereses estatales de la nueva bibliografía sobre cooperación capta esta lógica de motivos mixtos: los Estados pueden obtener provecho de los acuerdos, pero también tienen incentivos para incumplirlos; en juegos con una conclusión definida y previsible, la lógica conduce inexorablemente a la defección. Por eso deben diseñarse estrategias de acción colectiva adecuadas, tomando en cuenta las **tecnologías de producción** del BPG, es decir, las formas en que los países se organizan para proveerlo: sumatoria o agregación, el agente más capaz, el agente menos capaz y la suma ponderada.\n\nEl grupo de trabajo internacional sobre BPG creado por Francia y Suecia señaló **seis áreas** de desafío planetario. Las tres primeras conforman la seguridad física del mundo: paz y seguridad, control de enfermedades y bienes internacionales comunes. Las tres restantes, la seguridad económica y la prosperidad: estabilidad financiera, libre comercio y acceso público al conocimiento. Están unidas por fuertes sinergias, que deben tomarse en cuenta para un enfoque coherente y holístico.\n\n### IV. Los «males públicos»\n\nSe usa la denominación **«mal público»** para reflejar las inconveniencias públicas y las externalidades negativas del bien: por ejemplo, el BPG de la estabilidad financiera puede analizarse desde el mal público de la inestabilidad financiera mundial. El bien suele ser impalpable y se da por sentado hasta que falta; los males son más concretos: la buena salud es una condición general; la enfermedad, un hecho concreto (Kaul et al., 2001). Ejemplos (Marín Quemada y García‑Verdugo, 2003):\n\n• **BPG naturales:** capa de ozono (destrucción y radiación); clima (riesgo de calentamiento global); biodiversidad (extinción de especies); bosques tropicales (agotamiento).\n• **BPG de producción humana:** conocimiento (falta de acceso y disparidades); internet (exclusión y disparidades); normas y estándares universales (fragmentación de uso); derechos humanos (represión); espectro electromagnético, satélites de transmisión y pasillos aéreos y náuticos (uso insuficiente o congestión); normas de supervisión bancaria (uso insuficiente).\n• **BPG como objetivos de política global:** paz (guerra y conflictos); control de enfermedades infecciosas (mala salud); estabilidad financiera (crisis financieras y cambiarias); libre comercio (fragmentación de mercados); sostenibilidad medioambiental (ecosistemas amenazados); liberación de la pobreza (crimen, violencia y conflicto social); equidad y justicia (tensiones sociales y no cooperación); reducción de la lluvia ácida (falta de provisión del bien).\n\n### V. Externalidades y efectos de derrame transfronterizos\n\nEn las últimas décadas se incrementaron notablemente los **efectos de derrame transfronterizos**: enfermedades infectocontagiosas, lluvia ácida, calentamiento global, terrorismo transnacional, inestabilidad financiera, virus informáticos. En parte es consecuencia de la globalización y de los avances tecnológicos, que han fracturado los límites de las fronteras nacionales y multiplicado las interacciones transfronterizas. Se dan entre países desarrollados, entre países en desarrollo, o entre unos y otros.\n\nEn la estabilidad financiera, los mercados no distinguen fronteras, en especial los financieros y cambiarios, altamente digitalizados y virtualizados: las variaciones excesivas de precios de acciones, instrumentos y divisas no quedan limitadas dentro de las fronteras, y los cambios bruscos en los flujos de capital pueden ser motivados por hechos muy distantes y disímiles. Muchas de estas externalidades son pecuniarias, pero su valoración enfrenta la información asimétrica; otras no son pecuniarias, aún más difíciles de valorar por la **selección adversa**, que potencia el contagio entre países. En este campo las fallas de mercado son evidentes, de ahí la gran necesidad de proveer BPG y BPR.\n\nEstos problemas son **externalidades transnacionales**, en las que uno o más agentes (empresas multinacionales, naciones, ONG, grupos poblacionales) crean costos o beneficios para otros que no participan en la transacción. «Cuando un bien o mal público tiene efectos no excluibles o solo en parte excluibles, lleva los costos o beneficios a espectadores inocentes, por lo que la no excluibilidad es una forma extrema de externalidad.» Los bienes y males públicos mundiales tienen dos fuentes: los derrames positivos o negativos de una acción en un país, o los efectos sistémicos mundiales. Las externalidades pueden ser directas, que viajan de un país a otro o de una persona a otra (enfermedades contagiosas), o indirectas, que afectan a otros a través de los bienes comunales mundiales (el cáncer de piel por la reducción de la capa de ozono) (Kaul et al.). La globalización incrementa los flujos de bienes, servicios, capital y recursos humanos, y la tecnología estimula el comercio, la inversión, los viajes y las comunicaciones: «las actividades económicas internacionales actúan como cintas de transmisión de externalidades, en forma cada vez más poderosa» (Wyplosz, 2001). Se requiere acción colectiva más allá de los Estados nación.\n\n### VI. Los Bienes Públicos Regionales (BPR)\n\nAlgunos bienes proveen beneficios no rivales y no exclusivos a los habitantes de dos o más países (BPR); otros los extienden a toda la humanidad (BPG), como los esfuerzos por mejorar la capa de ozono. Cuando los beneficios se confinan a dos o más países en una localización dada y sus derrames están más concentrados espacialmente, se trata de un BPR (Sandler, 2006), con efectos sobre una región bien delimitada (Devlin y Estevadeordal, 2001; Stalgren, 2000).\n\nEl grupo internacional sobre BPG usó el **principio de subsidiariedad** para distinguir responsabilidades nacionales de internacionales y globales de regionales: aun con acuerdos internacionales, casi todas las acciones en las seis áreas deben implementarse inicialmente en el plano nacional o local, por el sector público, el privado o entidades mixtas, tanto para BPG como para BPR. La línea entre ámbitos globales y regionales es menos clara que el papel central del Estado nación, aunque hay más oportunidades de coordinación regional para BPR bien identificados, sobre todo por sus externalidades transfronterizas.\n\nEl estudio de los BPR está en etapas incipientes frente al de los bienes públicos nacionales y globales, aunque la demanda crece, sobre todo con los acuerdos de integración regional y subregional. El éxito de la **Unión Europea** y el aumento del bienestar de sus miembros impactaron al resto del mundo, principalmente a los países en desarrollo. Los cambios en el concepto de soberanía nacional y las demandas por el principio de subsidiariedad potenciaron el concepto de **gobernanza**. Es cada vez más evidente la necesidad de resolver la **«brecha jurisdiccional»**, haciendo coincidir el ámbito de toma de decisiones con el rango espacial de derrame de los bienes públicos. El nuevo regionalismo lleva a una acción colectiva transnacional para proveer BPR e internalizar los efectos derrame.\n\nEn América Latina, pese a vaivenes y desacuerdos políticos, funcionan la Comunidad Andina, el MERCOSUR y el Mercado Común Centroamericano, con la noción de complementariedad: las políticas regionales son complementos, no sustitutos, de l
