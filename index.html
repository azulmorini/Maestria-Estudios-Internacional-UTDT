as nacionales. El BID aprobó subsidios por más de 10 millones de dólares anuales para proyectos que apoyen BPR en la región. Los BPR involucran menos países que los BPG, lo que favorece la acción colectiva; la proximidad cultural y espacial limita la incertidumbre. Los bloques regionales de comercio proporcionan la infraestructura e institucionalidad necesarias, y los BPR se adecuan a arreglos tipo **clubes**, que disminuyen los costos de transacción de la acción colectiva.\n\n### VII. El Bien Público Global y Regional de Estabilidad Financiera y Cambiaria\n\nEs necesario investigar y cooperar para estabilizar y regular los mercados cambiarios y financieros, introduciendo el concepto de BPR como instrumento analítico para prevenir las crisis y el contagio financiero. Dados los antecedentes de las crisis mexicana y asiática y sus efectos sobre economías latinoamericanas (**efecto samba** y **efecto tango**), hay que asegurar la estabilidad cambiaria, monetaria y financiera regional ante perturbaciones exógenas, mediante intervenciones colectivas coordinadas, nacionales y regionales, que construyan una institucionalidad regional que refuerce los esquemas nacionales y compense las deficiencias de la institucionalidad económica y financiera mundial (Guarnieri, 2005). Siguiendo a Ocampo (2001), hay que evitar o atenuar el contagio con vigilancia apropiada e instrumentos de financiación oportunos que estabilicen los mercados regionales como **primera línea de defensa**, dejando a instituciones globales como el FMI la función de **prestamista de última instancia**. Ante las **«paradas súbitas»** (sudden stops) que azotan a las economías emergentes, América Latina necesita mecanismos de cooperación financiera regional frente a la excesiva volatilidad de los flujos de capital. Una vía es crear un BPR intermedio: los **Fondos Monetarios Regionales**."}}}, "EI03-c4": {"extras": [], "textos": {"0": {"ejercicios": [], "leido": false, "resumen": "## La OMC y la economía del comercio: teoría y práctica (OMC E‑Learning, 2013)\n\n### Introducción\n\nCurso multimedia compuesto por este texto explicativo, preguntas frecuentes, juegos de autoevaluación y el vídeo «La OMC: fundamentos económicos».\n\n**Propósito:** ofrecer antecedentes teóricos para entender los efectos de la **liberalización del comercio** y los de la **protección**, y por qué los países aplican en la OMC políticas de liberalización, es decir, por qué negocian entre sí y se comprometen a consolidar los aranceles en lugar de liberalizarlos unilateralmente. Cuatro partes:\n\n• **I. Ganancias del comercio:** desde los países que comercian por distinto nivel tecnológico hasta los que se diferencian por su dotación de factores (capital, mano de obra o tierra), y dos situaciones en que comercian aunque sean semejantes.\n• **II. Efectos de distribución de los ingresos:** el comercio produce ganancias, pero dentro de cada país algunos grupos ganan y otros pierden; la liberalización trae costos de ajuste, y se examina qué pueden hacer los gobiernos para reducirlos.\n• **III. Política comercial y desarrollo:** los hechos probados sobre la importancia de la liberalización para el desarrollo.\n• **IV. Necesidad de un compromiso multilateral:** los motivos para negociar multilateralmente y confiar la liberalización a un acuerdo internacional.\n\n### I. Ganancias del comercio\n\n#### I.A. Las tres conclusiones más importantes de la teoría del comercio internacional\n\n1. **El comercio produce ganancias.**\n2. **El comercio es mutuamente benéfico:** cuando dos países se venden bienes o servicios, el intercambio es siempre benéfico, incluso aunque uno sea más eficaz que el otro en la producción de cualquier cosa. Al mismo tiempo, es posible que dañe a grupos particulares de una nación.\n3. **El comercio tiene efectos de distribución de los ingresos, pero las ganancias superan a las pérdidas.** Es muy probable que los grupos perdedores presionen al gobierno para aplicar políticas proteccionistas.\n\n#### I.B. ¿De dónde vienen estas ganancias?\n\n**Ganancias por una utilización mejor de los recursos**, gracias a la **especialización** (cada país produce lo que puede producir con relativa mayor eficacia e importa lo que produce con menor eficacia) y gracias a la **explotación de las economías de escala** (al eliminarse los obstáculos, las empresas enfrentan un mercado mayor, eligen un nivel más eficaz de producción y ahorran costos, lo que beneficia al país en su conjunto).\n\n**Beneficios de la especialización.** Se entiende que un país eficaz en computadoras y otro eficaz en rosas se beneficien mutuamente. Pero ¿y si un país es más eficaz en ambas? El resultado teórico es que el comercio produce beneficios y **ambos países se benefician**, cada uno especializándose en la mercancía en que tiene **ventaja comparativa**.\n\n• **Ventaja comparativa:** un país la tiene en una mercancía si el costo de oportunidad de producirla en lugar de otras es menor que en otro país.\n• **Costo de oportunidad:** el número de rosas que se pudo haber producido con los recursos usados para cierto número de computadoras. Difiere entre países por las diferencias tecnológicas.\n• **Teoría de la ventaja comparativa:** cuando dos países se especializan según su ventaja comparativa, ambos se benefician aunque uno tenga ventaja absoluta en ambas mercancías; cada país exporta la mercancía en que tiene ventaja comparativa.\n\n**1. Especialización por diferencias tecnológicas: el modelo de Ricardo.** David Ricardo introdujo a principios del siglo XIX el modelo de ventaja comparativa basado en las diferencias de productividad del trabajo. Dos países y dos sectores: un trabajador produce 5 millones de rosas o 200 computadoras en el país A, y 8 millones de rosas o 1.000 computadoras en el país B. B tiene **ventaja absoluta** en ambas. Para producir 1.000 computadoras, B renuncia a 8 millones de rosas; A necesita cinco trabajadores y renuncia a 25 millones. Como el costo de oportunidad de las computadoras es menor en B, B tiene ventaja comparativa en computadoras y A en rosas. Si A pasa dos trabajadores a rosas (+10 millones de rosas, –400 computadoras) y B uno a computadoras (–8 millones de rosas, +1.000 computadoras), la producción mundial aumenta en 2 millones de rosas y 600 computadoras: **la especialización aumenta la producción mundial de ambas mercancías** y todos pueden beneficiarse. El modelo es muy simplificado, pero aporta dos perspectivas sólidas: la diferencia de productividad del trabajo es muy importante para explicar el comercio, y lo que importa es la ventaja comparativa, no la absoluta. Con un solo factor, la mano de obra, las ventajas derivan solo de diferencias de productividad, que a su vez derivan de diferencias tecnológicas.\n\n**2. Especialización derivada de las diferencias de dotación: la teoría de la proporción de los factores (modelo Heckscher‑Ohlin).** El comercio también refleja las diferencias de dotación de recursos: Canadá exporta productos forestales no porque sus trabajadores sean más eficaces, sino porque tiene más bosques. Heckscher y Ohlin explican el comercio por la interacción entre la **abundancia relativa de factores** y la **intensidad relativa** con que se usan para producir distintas mercancías.\n\n• **La ventaja comparativa depende de la dotación relativa de factores:** el país relativamente abundante en mano de obra tiene ventaja en mercancías intensivas en mano de obra; el abundante en capital, en las intensivas en capital (A la tiene en las intensivas en capital si su coeficiente capital/trabajo es mayor que el de B).\n• **En una economía cerrada, la mercancía que usa intensivamente el factor abundante es más barata:** con abundancia de capital, el capital es barato y también lo son los bienes intensivos en capital; con abundancia de mano de obra, los salarios son bajos. Las diferencias de precios relativos llevan a comerciar.\n• **Gracias al comercio**, los precios de las mercancías comerciadas tienden a igualarse entre países (sube, por ejemplo, el precio del bien intensivo en trabajo en el país abundante en trabajo), y cada país se especializa y exporta la mercancía intensiva en su factor abundante. Como en Ricardo, la producción mundial puede aumentar y ambos países pueden consumir más.\n\n### II. Efecto de distribución de los ingresos\n\n**El comercio influye en la distribución de los ingresos.** En el modelo de Ricardo, con la mano de obra como único factor que se mueve libremente y sin costos entre sectores, ganan todos los países y también **todas las personas**. En Heckscher‑Ohlin, los sectores se diferencian por la combinación de factores: especializarse en el bien intensivo en capital aumenta la demanda de capital y reduce la de mano de obra. No toda persona se beneficia: hay grupos que ganan y grupos que pierden.\n\n**¿Quién gana y quién pierde? El teorema de Stolper‑Samuelson.** La libertad de comercio aumenta las ganancias del factor **relativamente abundante** y reduce las del **relativamente escaso**. En un país abundante en capital, los recursos se reasignan hacia bienes intensivos en capital, sube el precio del capital y ganan sus propietarios; baja la demanda de mano de obra y bajan los salarios. En la práctica, moverse de un sector a otro tiene costos, y los recursos del sector que compite con las importaciones sufren al reducirse sus restricciones: por eso, en los países industrializados, cuando se liberaliza un sector intensivo en mano de obra como el textil, se oponen tanto los capitalistas como los trabajadores de ese sector. Pero el resultado teórico es que el país en general gana: **las ganancias superan a las pérdidas**.\n\n#### II.A. El comercio entre países semejantes\n\n**Los países semejantes comercian con mercancías semejantes.** Ricardo y Heckscher‑Ohlin explican el comercio entre países distintos (por tecnología o por dotación). Pero en la realidad la mayoría del comercio se produce entre países semejantes, y entre un cuarto y la mitad del comercio mundial es **comercio dentro de una misma rama de producción** (intraindustrial), mayoritario entre países desarrollados y en manufacturas. Esos modelos no lo explican.\n\n**Se basa en las economías de escala.** En muchas ramas, cuanto mayor es la escala, más eficiente es la producción: al duplicar los trabajadores, el producto se duplica con creces (si 10 trabajadores hacen 5 bicicletas, 20 hacen 15).\n\n**Ganancias debidas a las economías de escala.** Dos países idénticos, con la mano de obra como única dotación. Sin comercio, cada uno emplea 10 trabajadores en cámaras de vídeo (10 cámaras) y 10 en bicicletas (5 bicicletas): el mundo produce 20 cámaras y 10 bicicletas. Si A concentra toda la producción de cámaras (20 trabajadores, 25 cámaras) y B la de bicicletas (15 bicicletas), el mundo dispone de 25 cámaras y 15 bicicletas: ambos pueden estar mejor con comercio.\n\n**Ganancias debidas al acceso a una mayor variedad.** Cada rama tiene variedades (bicicletas por estilo, color, comodidad; cámaras por calidad o memoria). La liberalización puede reducir las variedades producidas en cada país, pero los consumidores acceden a una **mayor variedad**, internas y extranjeras; los países comercian distintas variedades de la misma mercancía.\n\n**No se producen efectos de distribución de los ingresos.** El comercio intraindustrial genera efectos distributivos muy pequeños. Por eso, socialmente, es más fácil liberalizar entre países semejantes que entre distintos, donde el comercio se mueve por ventaja comparativa, daña a algunos grupos y estos presionan contra la liberalización.\n\n**Ganancias debidas a una innovación más rápida y a la transferencia de tecnología.** Además de las ganancias estáticas, hay **ganancias dinámicas**. El comercio amplía los incentivos para innovar, base del crecimiento, por el **efecto de competencia** (aumenta la «amenaza de la competencia», la diferencia entre los beneficios de innovar y los de que otro innove primero, y con ella las pérdidas de no innovar) y por el **efecto de escala** (un mercado mayor aumenta los beneficios de innovar e invertir en I+D). También favorece la **transferencia de tecnología** por la **ingeniería inversa** (contemplar una mercancía permite captar parte del conocimiento que encarna), los **contactos personales** entre importadores y exportadores y la mayor **inversión extranjera directa**, cuya presencia incentiva a las empresas nacionales a actualizarse y transfiere tecnología mediante capacitación o normas de calidad para proveedores y distribuidores. Todo ello puede desencadenar crecimiento.\n\n#### II.B. Costos del reajuste\n\nLas ganancias del comercio son consecuencia de redistribuir recursos hacia los sectores relativamente más eficaces, y esa redistribución tiene **costos del reajuste**: los de los trabajadores desplazados del sector que compite con las importaciones, que deben buscar otro trabajo, y los de las empresas que deben invertir para adaptarse. Son inevitables, pero su cuantía depende de:\n\n• **El funcionamiento del mercado de crédito:** si funciona bien, los desplazados financian más fácilmente sus períodos sin ingresos y las empresas obtienen dinero para invertir.\n• **El funcionamiento del mercado laboral:** determina la duración del desempleo; cuanto más eficaz, mejor información sobre vacantes, salarios más adaptables y tendencia al pleno empleo.\n• **La calidad de las infraestructuras y los servicios**, por ejemplo en sectores donde pesan las telecomunicaciones.\n• **La credibilidad de la reforma y la calidad de las instituciones:** cuanto más creíbles, más rápido reacciona el mercado y encuentra un nuevo equilibrio.\n\nComo estos mercados e infraestructuras son peores en los países en desarrollo, sus costos pueden ser mayores, y por eso se benefician de **períodos más largos de aplicación** de los acuerdos multilaterales.\n\n**El papel de los gobiernos nacionales.** Pueden aplicar políticas para **facilitar el reajuste**: información sobre puestos vacantes, regímenes salariales más flexibles, garantías de crédito, un ritmo adecuado de reformas y su anclaje en compromisos internacionales para darles credibilidad. Pueden usar **planes de promoción de las exportaciones**, justificados por insuficiencias del mercado: el reajuste supone trasladar recursos del sector en decadencia al exportador, cuya expansión exige inversiones con riesgos difíciles de medir; si los mercados financieros son ineficaces, el exportador no obtiene crédito ni cobertura. Y pueden aplicar políticas para **compensar a quienes pierden**: **redes de seguridad social** durante la transición y un **sistema adecuado de impuestos redistributivos** para las pérdidas a largo plazo.\n\n### III. Políticas comerciales y desarrollo\n\n**La liberalización del comercio y el desarrollo.** El desarrollo es un proceso complejo que permite a la gente asegurarse sus necesidades básicas: educación, salud, niveles de vida confortables y libertad; para ello necesita capacidad económica, y un nivel adecuado de ingresos es la base. La liberalización ayuda a usar mejor los recursos por la especialización y las economías de escala, e incentiva la innovación y la difusión de tecnología; un uso más eficaz de los recursos posibilita más ingresos y más desarrollo. Existe en general una **relación positiva entre apertura e ingresos**: los países abiertos y orientados a la exportación han tenido éxito; los muy protegidos y volcados sobre sí mismos, no.\n\n**Las políticas proteccionistas también se han usado para «favorecer» el desarrollo.** Se analizan sus instrumentos, efectos, justificación y resultados.\n\n#### III.A. ¿Cuáles son los instrumentos de la política comercial?\n\n• **Aranceles:** específicos (gravamen fijo por unidad importada) o ad valorem (porcentaje del valor).\n• **Contingentes:** el obstáculo no arancelario más conocido; fijan la cantidad máxima importable.\n• **Subvenciones a la exportación**, que distorsionan el comercio.\n• **Cualquier otro costo comercial inducido por las políticas:** una norma técnica que encarezca a los productores extranjeros, procedimientos aduaneros largos, altos costos de transporte por conductas anticompetitivas o mala infraestructura.\n\nEl análisis es similar en todos los casos; se examinan los aranceles.\n\n#### III.B. ¿Qué impacto tiene un arancel a la importación?\n\n**País pequeño** (no puede influir en el precio mundial). Sin aranceles, los consumidores pagan el precio mundial. Un arancel al arroz sube el precio interno: los consumidores empeoran, los productores nacionales ganan y el gobierno recauda. En conjunto, **el país pierde y el bienestar nacional se reduce**.\n\n**País grande** (no geográficamente, sino cuya demanda de importaciones influye en el precio mundial). El arancel sube el precio interno, reduce la demanda de importaciones y **baja el precio mundial**: el país influye en el precio en su propia ventaja. Es la **ganancia en la relación de intercambio** (TOT). Por eso el impacto sobre el bienestar de un país grande es ambiguo; en un país pequeño es sin ambigüedades negativo.\n\n#### III.C. ¿Por qué los gobiernos imponen aranceles a la importación?\n\nLa teoría afirma los beneficios del libre comercio, pero muy pocos países lo han adoptado totalmente (probablemente solo Hong Kong). A menudo es cuestión de **economía política**: la defensa activa de las ramas que compiten con las importaciones. También hay argumentos teóricos: 1) la **relación de intercambio**, con un nivel óptimo de arancel que maximiza el bienestar nacional; 2) la **industria naciente**, que puede necesitar protección temporal para desarrollar una ventaja comparativa; 3) la **política comercial estratégica**, en que una subvención disuade a empresas extranjeras y da beneficios de monopolio a la nacional; 4) **otros**: los aranceles como fuente de ingresos fiscales o como instrumento de redistribución.\n\n**III.C.1. Relación de intercambio.** Un país grande puede encontrar un arancel cuyas ganancias de intercambio compensen sus distorsiones. **Pero** tiene grandes limitaciones prácticas: solo vale para países grandes, y aun así es una política **basada en la buena voluntad del vecino** (empobrecer al vecino): las ganancias se logran a costa de los exportadores extranjeros, que pueden tomar represalias e iniciar una **guerra comercial** que deje a todos peor.\n\n**III.C.2. Industria naciente.** La protección temporal puede ser necesaria para desarrollar una ventaja comparativa cuando los mercados no cumplen su función: por ineficiencias financieras, un empresario puede no conseguir fondos para una actividad rentable, y los recursos no se mueven del agro tradicional a la manufactura porque los bancos son pequeños, poco diversificados o sin información para gestionar riesgos. **Hechos probados:** tras la Segunda Guerra muchos países en desarrollo adoptaron la **sustitución de importaciones**; el sector protegido se desarrolló, pero la producción se estancó largo tiempo y siguió necesitando intervención; no surgió una rama competitiva internacionalmente ni las ventajas comparativas que se suponía. Además, es muy difícil para los gobiernos identificar las industrias con ventaja comparativa.\n\n**III.C.3. Política comercial estratégica.** Algunos mercados tienen **competencia imperfecta**: costos fijos muy elevados, pocas empresas y beneficios por encima de lo normal, que los países pueden competir por captar. En ciertas rutas aéreas solo puede sobrevivir una empresa: si entran dos, ambas pierden; si una sola, obtiene beneficios de monopolio. Una subvención suficientemente grande a la empresa nacional la incentiva a entrar y disuade a la extranjera; si los beneficios monopólicos superan la subvención, el bienestar del país aumenta. **¿Es deseable?** Depende de que la subvención realmente disuada a las extranjeras (si no, los beneficios pueden no cubrir su costo), y es también una política basada en la buena voluntad del vecino, sujeta a represalias y a guerras comerciales.\n\n**III.C.4. Otros argumentos.** **Ingresos fiscales:** en muchos países en desarrollo los impuestos son más difíciles de cobrar que los aranceles, porque las importaciones cruzan una frontera; pero la simplificación de los sistemas fiscal y arancelario ha aumentado la recaudación aun con aranceles medios menores, porque es más fácil de controlar, se entiende mejor y propicia menos la evasión. **Distribución de los ingresos:** mantener la protección evita los reajustes de la liberalización, pero la política comercial no es el único instrumento, y los economistas sostienen que la **política fiscal** es más eficaz para redistribuir.\n\n### IV. Necesidad de un compromiso multilateral\n\n#### IV.A. ¿Hay motivos para comprometerse con una liberalización multilateral?\n\nLa liberalización produce ganancias aun siendo unilateral, pero históricamente los aranceles se redujeron mediante **rondas de negociaciones internacionales**. Hay al menos tres motivos por los que es más fácil eliminarlos multilateralmente:\n\n1. **El intercambio recíproco de acceso a los mercados permite movilizar a los grupos favorables a la exportación** para contrapesar a los que compiten con las importaciones, que presionarían contra una liberalización unilateral. Es más fácil reducir aranceles si los interlocutores hacen lo mismo.\n2. **Los compromisos internacionales evitan las represalias:** si cada país fijara su política aisladamente, lo óptimo para los grandes sería el «arancel óptimo», sujeto a represalias; la mejor opción es cooperar.\n3. **El compromiso multilateral aumenta la credibilidad** y evita problemas de **incoherencia temporal**.\n\n**IV.A.1. Incoherencia temporal.** Un gobierno anuncia que en un año abrirá a la competencia extranjera un sector financiero ineficaz y con créditos improductivos. Si los bancos le creen, se reajustan; si no, no lo hacen, y un año después liberalizar provocaría una crisis, por lo que el gobierno probablemente no lo haría. Hay **incoherencia temporal** cuando una medida anunciada en un momento ya no es políticamente óptima cuando llega el momento de aplicarla; conscientes de ello, los bancos no se reajustan y el gobierno queda obligado a no liberalizar o arriesgar una crisis total. **Los compromisos internacionales** dan credibilidad al anuncio y los bancos se reajustan.\n\n**IV.A.2. Otros motivos.** Evitar la **desviación de las corrientes comerciales** de los acuerdos regionales. Las políticas descritas no son discriminatorias; pero los países pueden reducir aranceles en forma **preferencial**, liberalizando el comercio intrarregional y manteniendo obstáculos al resto. Podría parecer bueno, pero la desviación ocurre cuando las importaciones de un socio sustituyen a las del resto del mundo aunque el socio no sea el productor más eficiente. Perjudica a los exportadores de fuera del área; para el importador miembro, los consumidores ganan por pagar menos, pero el gobierno pierde ingresos arancelarios, y como el socio no es el más eficaz, la pérdida puede superar la ganancia. Además, los acuerdos internacionales aumentan la **transparencia y la previsibilidad**: reducen el costo de informarse sobre los aranceles aplicados y equilibran el terreno de juego.\n\n### V. Conclusiones\n\nCuatro mensajes principales:\n\n1. **El régimen óptimo de política comercial es la libertad de comercio o un régimen que reduzca e iguale la protección;** una protección escasa solo es justificable para un país grande.\n2. **Aunque se han aducido razones para apartarse de esta receta (industria naciente, política comercial estratégica), hay pocas pruebas de que hayan producido resultados demostrablemente mejores:** los sectores protegidos al inicio siguieron protegidos y nunca se volvieron competitivos.\n3. **La liberalización unilateral es buena, pero la multilateral produce mayores ganancias** y es políticamente más sostenible y creíble.\n4. **La política comercial es solo una parte de una historia mucho más amplia de crecimiento y desarrollo:** la liberalización puede no tener el efecto deseado si los mercados no funcionan bien o las instituciones son débiles.\n\n### Preguntas frecuentes\n\n1. **¿Por qué comercian los países?** Porque son distintos (tecnologías o dotaciones de capital y mano de obra), y el comercio les permite especializarse; o porque producen distintas variedades de una misma mercancía, y la gente ama la variedad.\n2. **¿Por qué el comercio es beneficioso para todos los países?** Porque al especializarse en lo que producen con relativa mayor eficiencia aumenta la producción global y se puede consumir más que sin comercio.\n3. **¿Qué determina las características del comercio?** Entre países distintos, cada uno exporta según su ventaja comparativa; entre países similares, se comercian variedades y las características son aleatorias: la teoría solo predice el volumen.\n4. **¿Puede un país tener ventaja comparativa en todas las mercancías?** Puede tener ventaja absoluta en todas, pero no comparativa: siempre habrá una en que el socio la tenga.\n5. **¿Se benefician todas las personas?** No: el sector que compite con las importaciones pierde y el exportador gana.\n6. **¿Qué políticas para el reajuste?** Información sobre vacantes, créditos y capacitación para los trabajadores, un ritmo adecuado (reformas lentas que liberen pocos trabajadores por etapa), promoción de exportaciones, redes de seguridad social, fiscalidad redistributiva y compromisos internacionales que den credibilidad y anticipen el reajuste.\n7. **¿Qué efectos tiene un arancel?** Sube el precio interno y reduce las importaciones; en un país grande puede bajar el precio mundial y, con un arancel suficientemente bajo, aumentar el bienestar; en uno pequeño genera sin duda pérdidas.\n8. **¿Riesgos del «arancel óptimo»?** Es difícil determinar empíricamente el nivel adecuado, solo vale para países grandes y, al basarse en la buena voluntad del vecino, puede provocar represalias y una guerra comercial.\n9. **¿Qué es la industria naciente?** Una industria con ventaja potencial pero demasiado joven, que recibe protección «temporal» por una insuficiencia del mercado. Puntos débiles: es difícil identificar las ramas con potencial (centrarse en las de más valor añadido no es necesariamente mejor si pesan poco en la producción) y sería más adecuado atacar directamente la falla, por ejemplo la financiera, que usar la política comercial.\n10. **¿Pruebas de su eficacia?** Las industrias protegidas se desarrollaron pero nunca fueron competitivas y siguieron pidiendo intervención.\n11. **¿Es aconsejable apoyar una rama frente a la competencia extranjera?** Es arriesgado: la subvención debe disuadir realmente a las extranjeras, los beneficios deben superarla (cálculo que exige información difícil de obtener) y empeora a otros países, que pueden tomar represalias.\n12. **¿Por qué los países se unen a la OMC?** Por credibilidad frente a la incoherencia temporal, por economía política (movilizar a los exportadores frente a los que compiten con importaciones) y para evitar represalias y aranceles óptimos cruzados que generan pérdidas en todo el mundo.\n13. **¿Es siempre mejor un acuerdo preferencial?** No. Si A firma libre comercio con B y reduce sus aranceles a los textiles de B, que no es el productor más eficiente (lo es C), el comercio se desvía de C a B. C pierde; en A los consumidores ganan pero el fisco pierde ingresos, y los efectos son ambiguos: A tiene más probabilidad de perder cuanto mayor sea la diferencia de eficiencia entre B y C y mayor el arancel externo aplicado a C."}, "1": {"ejercicios": [], "leido": false, "resumen": "## Entrevista a Octavio Rodríguez: la evolución del pensamiento estructuralista latinoamericano\n\n*Puente@Europa, diciembre de 2008. Entrevista realizada en Montevideo, el 13 de octubre de 2008, a uno de los grandes exégetas del estructuralismo latinoamericano.*\n\n### ¿Cómo surgió la corriente estructuralista?\n\nHay dos períodos de especial relevancia: la situación interna argentina de los años 30 y la situación internacional de América Latina desde los 40.\n\n**Argentina en los 30.** Prebisch dirigió el Banco Central entre 1935 y 1943 y fue el gran artífice y reformador de la conducción económica. Una política destacable fue el **control de cambios**, que según el propio Prebisch obedeció a una imposición de las circunstancias y fue complejísima de manejar. Uno de sus objetivos fue apoyar actividades compensatorias de la intensa recesión, en especial ciertas ramas industriales. Se acentuó así la industrialización, y en 1942 y 1943 el gobierno adoptó una decisión considerada definitiva: **la industrialización habría de ser la base del desarrollo argentino**.\n\n**La Segunda Guerra y la posguerra**, cuando surge la **idea del desarrollo**. Su antecedente es la **Carta del Atlántico** (1941): el único fundamento cierto de la paz es que todos los hombres libres puedan disfrutar de prosperidad económica y seguridad social. En las reuniones de Churchill, Stalin y Roosevelt, sobre todo en Yalta, se enfatizó buscar el desarrollo como bienestar para todos y forma de evitar la guerra. Se consolida en la **Carta de San Francisco** (1945), que da origen a las Naciones Unidas: promover el progreso social y elevar el nivel de vida, emplear las instituciones internacionales para el avance económico y social de todos los pueblos, y lograr la cooperación internacional y el respeto a los derechos humanos. Se crean organismos y dos comisiones regionales, la de Europa y la de Asia, que en realidad eran para la reconstrucción; por iniciativa de Chile se funda la **CEPAL**, en principio por dos años. Surge así una posición pro‑desarrollo.\n\nLuego se definen dos posiciones: una sostiene que las nuevas instituciones deben favorecer el desarrollo sobre la base del **libre mercado**; otra, **industrialista**, típica de América Latina, tiene su base en el documento fundacional de Prebisch de 1949, «El desarrollo económico de la América Latina y algunos de sus principales problemas».\n\n### Base empírica y teórica: el sistema centro‑periferia\n\nLas percepciones de ese **«manifiesto de los periféricos»** reaparecen en los cinco primeros capítulos del *Informe económico para América Latina* de la CEPAL (1950). De ambos se extrae el **contenido** de una teoría del subdesarrollo: ideas generales, sin total precisión analítica pero armónicas y complementarias; las **formas** posteriores son su articulación lógica, y al formalizarse el contenido cambia y se enriquece. Ese contenido es la **«concepción del sistema centro‑periferia»**, cuya cuestión clave es que entre centro y periferia tienden a reproducirse diferencias en los niveles de ingreso y en la complejidad de las estructuras ocupacionales y productivas.\n\nEl sistema se constituye desde el último cuarto del siglo XIX, durante el **«desarrollo hacia afuera»**, que culmina con la crisis de los 30: aumentar el producto exportando bienes primarios, con muy poca industria. Surgen dos diferencias estructurales:\n\n• **Especialización frente a diversificación:** la periferia se concentra en producir y exportar ciertos primarios; los centros tienen industrias en muchas ramas.\n• **Heterogeneidad frente a homogeneidad:** en la periferia coexiste mano de obra de productividad normal con mano de obra de productividad sumamente baja (subempleada); esa coexistencia define la **heterogeneidad estructural**. Hay particularidades: Uruguay, un espacio vacío, tiene poco subempleo; la Argentina es similar, aunque con trabajo de muy baja productividad en el norte. El subempleo urbano se origina en la disgregación de la agricultura y la expulsión de mano de obra hacia la ciudad (Brasil, México); en el Río de la Plata parece más reciente, por crisis que degradan el empleo urbano ya constituido.\n\n### Por qué persisten las diferencias (Gráfico 1)\n\nEl **atraso de la estructura productiva** (especialización y heterogeneidad) implica: (1) menos progreso técnico en la periferia, (2) menor crecimiento de la productividad, fuente de (5) la diferenciación de ingresos. Además genera (3) sobreabundancia de mano de obra, que según Prebisch es la causa principal del (4) **deterioro de los términos de intercambio**: los precios de las materias primas suben menos que los de las manufacturas porque hay abundante mano de obra barata por el subempleo estructural; es otra fuente de (5). La diferenciación de ingresos provoca (7) restricciones al ahorro y la acumulación, que repercuten sobre la especialización. Esta no permanece incambiada: surgen industrias, pero sin la complementariedad intersectorial ni la integración vertical de los centros.\n\nPor crisis y guerras surge el **«desarrollo hacia adentro»**, con base en la industria, pero la complementariedad y la integración vertical siguen siendo insuficientes: muchos bienes industriales deben importarse. Este patrón cambiante pero reiterado de especialización es la causa principal del (6) **desequilibrio externo**: tiende a demandar muchos bienes importados mientras las exportaciones primarias crecen con limitaciones. El desequilibrio se liga también al deterioro de los términos de intercambio y restringe el ahorro, y así se repite la **«condición periférica»**. El progreso técnico diferencial es la hipótesis de base; la sobreabundancia de fuerza de trabajo, el deterioro de los términos de intercambio y el desequilibrio externo son **tres teorías formalizadas** en los 50, ligadas al contenido estructural.\n\nComo de fondo hay una cuestión de **estructura, los mercados no pueden corregirla**. Para industrializarse, que es la forma de escapar de la condición periférica, no hay que ir de lo más sencillo a lo más complejo, sino **avanzar simultáneamente en varias ramas** para lograr complementariedades e integraciones que eviten el desequilibrio externo y favorezcan el progreso técnico. Se requiere una **política industrial articulada**; de ahí el énfasis de la CEPAL en la **planificación** para la «industrialización sustitutiva».\n\n### Los años 60: lo sociológico y lo político\n\nCoexisten razones económicas y políticas. Desde mediados de los 50 surgen las **teorías estructurales de la inflación** (Juan Noyola, luego ministro en Cuba, y Osvaldo Sunkel): la inflación no resulta de exceso de emisión o mala conducción macroeconómica, sino de **desequilibrios estructurales**, como latifundistas que controlan mercados e industrias monopólicas u oligopólicas. Prebisch las niega, pero aparecen condiciones de la estructura económica y social que no pueden ignorarse en el largo plazo.\n\nSurge la necesidad de **reformas estructurales**. La CEPAL habla con timidez de reforma agraria hasta que la reunión del Consejo Interamericano Económico y Social de la OEA en Punta del Este (1961) crea la **Alianza para el Progreso**, que la propugna abiertamente; la experiencia de Cuba induce a pensar que, sin reformas, las circunstancias pueden ponerse muy difíciles. Prebisch, decidido y hábil para llegar al límite de lo posible en las condiciones de dominación imperantes, escribe en 1963 *Hacia una dinámica del desarrollo latinoamericano*, que incluye argumentos sociológicos: el Estado debe promover transformaciones sociales que hagan más competitiva la industria, que debía nacer con una protección mínima por el menor plazo posible (posición reiteradamente ignorada), y propone la reforma agraria.\n\nSe identifican las trabas al desarrollo en el plano sociopolítico. **José Medina Echavarría** (1963) analiza el desarrollo desde 1875 con un modelo de **«sociedad tradicional»**, basada en el latifundio, el poder político ligado a él e industriales florecientes pero monopólicos; al modernizarse, la sociedad tradicional se desvanece pero nada la sustituye, de ahí una propensión a la inestabilidad por falta de un orden social capaz. Medina sostiene además que el método debe ser **abstracto‑deductivo**, lo que los estructuralistas no reconocían (se consideraban puramente **histórico‑estructurales**). Ese carácter permite al estructuralismo acceder al carácter científico de las teorías formalizadas sin dejar de apoyarse en condiciones históricas que cambian: el subempleo es cada vez más chico y urbano, con gran peso sobre los salarios; hay más industria y más diversificada, pero con defectos de complementariedad que reiteran la gran demanda de importaciones. La forma de integrarse al mundo y el papel de **las elites internas**, que construyen una industria ineficiente, demasiado monopólica y protegida, sin incentivo a diversificarse, hacen persistir los límites económicos del desarrollo.\n\n### La dependencia\n\nTiene dos vertientes. Una supuestamente **marxista** (Andre Gunder Frank, Ruy Mauro Marini, Theotonio Dos Santos, Roberto Pizarro), vinculada directa o indirectamente a la revolución armada: la dependencia no admitiría salida salvo la lucha armada (Régis Débray, *Revolución en la revolución*). Otra, más amplia, la de **Cardoso y Faletto**: la dependencia se funda en una **relación estructural interno‑externa**, una alianza interna de clases que delinea el contexto hegemónico (en términos de Gramsci) con nexos con grupos foráneos, que condiciona la constitución del poder del Estado en menoscabo de un poder capaz de llevar el desarrollo. Como todo el estructuralismo, no piensa en una única salida: puede haber relaciones de dependencia que permiten crecer y otras que lo inhiben, según cómo jueguen las relaciones políticas. Terminan *Desarrollo y dependencia en América Latina* hablando de casos de **«heteronomía»**, que impiden el desarrollo, y de **«autonomía»**, ligada a algún grado de desarrollo. Después Cardoso habla del **«trípode»** brasileño: gran industria extranjera, de capital nacional y estatal, que en los 70 indujo un desarrollo industrial considerable, hasta que se achicó la pata nacional.\n\n**Furtado** sostiene una fuerte tendencia a la concentración del ingreso que compromete la demanda y conduce al **estancamiento**. Contra ella surge la breve corriente de los **«estilos de desarrollo»** de **Aníbal Pinto**: hay estilos más o menos concentradores y, sin cambio de sistema, con cambio de estilo es posible el desarrollo. **Maria da Conceição Tavares y José Serra** combaten a Furtado: los estilos concentradores y excluyentes pueden ser dinámicos, como Brasil.\n\n### Del énfasis económico al político\n\nEn los 50 predomina lo económico, aunque se habla de reforma agraria y latifundio. En los 60, lo social y lo político (Medina y Prebisch; Cardoso y Faletto), y lo distributivo en Pinto. En los 70, los trabajos de la **Universidad de Campinas**, sobre todo de Tavares, mezclan lo económico, lo social y lo político con elementos marxistas y kaleckianos. Furtado enfoca el desarrollo como atinente a **sistemas culturales globales**, con tres ámbitos: la **cultura material** (aspectos técnicos y económicos); el **ámbito sociopolítico**, con ideas, valores, acción de clases y grupos y el papel del Estado, que puede usar sus márgenes de autonomía (una estrategia conducente supone un Estado relevante y cierta autonomía); y las **ideas y valores** referidos a los más altos fines de la existencia (filosofía, ciencia, arte, mística). Lo inhibido es el **desarrollo integral de la cultura**: puede haber desarrollos parciales, pero la totalidad se ve inhibida por falta de una identidad cultural; en lo sociopolítico el contagio fue relativo por los largos períodos de dictadura.\n\nLuego vienen los trabajos de **Fernando Fajnzylber**, que ve la industrialización latinoamericana llena de defectos y propugna una nueva, más competitiva y con una clase empresarial dinámica. De allí sale **Transformación productiva con equidad** (CEPAL, 1990), alternativa al enfoque neoliberal de los 90, profundizada en informes bienales. A fines de los 90 y comienzos de siglo se trabaja más en lo macroeconómico, poco elaborado antes en la CEPAL (**Ricardo Ffrench‑Davis**, **José Antonio Ocampo**).\n\n### Vigencia del centro‑periferia\n\nSigue vigente: las condiciones cambiaron, pero la embestida liberal no es conducente por el subempleo estructural, el atraso industrial y el tecnológico, en plena revolución tecnológica; hace falta una política que contemple a fondo esos tres ámbitos. Ya no se habla de planificación sino de **regionalismo abierto**: hay vaivenes. En los trabajos macroeconómicos de la segunda mitad de los 90 se habla de una macroeconomía para países con condiciones diferentes, orientada al aumento sostenido de la producción, vinculada al centro‑periferia por la necesidad de una **«conducción deliberada»**. En los 50 se creció; a fines de esa década y comienzos de los 60 muy poco, y surgió la idea de una tendencia al **estancamiento**, que Prebisch y Medina justifican por razones sociales (falta de clases que vuelquen ahorros a lo productivo) y Furtado formaliza a mediados de los 60, frente al enfoque de los estilos de Pinto. Brasil volvió a crecer; en los 80, la crisis de México y bajo crecimiento regional.\n\n### La cooperación internacional\n\nEstá desde el principio. Prebisch sostiene en los 50 que el centro **copa la capacidad de industrializarse** y no la abre a la periferia. Sería mejor que colaborara con ahorro o transmisión de tecnología, en una **«industrialización mancomunada»**: los centros cederían ramas para que la periferia exportara manufacturas, lo que a la vez permitiría al centro exportarle más; convendría a ambas partes. No se da porque la periferia no hace una política lúcida para identificar industrias exportables y porque los centros se mantienen cerrados en muchos sectores y no aportan ahorro, quizás porque no vislumbran un desenvolvimiento mundial más favorable. Además, en la posguerra los recursos se dirigieron a la reconstrucción. La CEPAL pidió no limitar el desarrollo de productos con patentes; en 1967 se funda la **OMPI** para dar facilidades a los países de menor desarrollo. Desde 1989 Estados Unidos lleva la propiedad intelectual al **GATT**, y con la **OMC** (1994) impulsa una legislación muy restrictiva sobre patentes; la cláusula de ayuda a los menos desarrollados es escasa. Ilustra el enfoque del centro: el desarrollo de la periferia llegaría adoptando principios liberales.\n\n### ¿Una propuesta alternativa latinoamericana?\n\n*El regionalismo abierto de América Latina* parecía portar una preocupación excesiva, tal vez «liberalizante», por los vínculos con el resto del mundo. Rodríguez pone el énfasis en la **cooperación al interior de la región** para mejorar sus condiciones industriales y productivas, acompañada de una **geopolítica incisiva** que altere las condiciones de negociación con los centros. Una dificultad: Brasil aspira a integrar el G‑8, busca ampliar su mercado en América del Sur y su geopolítica propia, y prescinde de una relación positiva con México, muy ligado a Estados Unidos y cuyo tamaño podría debilitarlo; eso lo inhibe de una política para toda América Latina. La región tiene especificidades que la hacen única: es el **único continente mestizo**, racial y culturalmente, base posible para una geopolítica mancomunada que niegue la barbarie del mundo actual y asuma un liderazgo decidido en pro de la **paz mundial**."}, "2": {"ejercicios": [], "leido": false, "resumen": "## Ficha didáctica: «La estructura productiva desequilibrada» y los dilemas del desarrollo argentino\n\n**Objetivo:** facilitar la lectura de Amico, Fabián y Fiorito, Alejandro (2011), «“La estructura productiva desequilibrada” y los dilemas del desarrollo argentino», en homenaje a Marcelo Diamand. Las explicaciones se centran en las secciones I y II y marginalmente en la III y la IV del texto, y refieren a temas y ejemplos de clases anteriores.\n\n### Introducción y elementos claves de las Estructuras Productivas Desequilibradas (EPD)\n\nAntes de leer conviene repasar el modelo de **ventajas comparativas de Ricardo**, primera referencia para explicar el planteo de Diamand. Como se vio en la crítica a los mercantilistas, ningún país puede tener siempre saldos positivos ni negativos, y los ajustes «automáticos» de la cantidad de dinero, los precios y el tipo de cambio garantizan el equilibrio comercial (uno de los siete supuestos generales de varias teorías, «los 7 Samurais»).\n\nEn el ejemplo de clase, el **tipo de cambio** debe «acomodarse» para encontrar el equilibrio comercial: el queso debe ser más barato en el país local, para que el extranjero lo importe, y el vino más barato en el extranjero, para que el local lo importe. Para simplificar, el tipo de cambio es el **salario relativo** entre los países: un tipo de cambio alto equivale a salarios bajos, al menos en poder de compra de bienes transables. Como el país extranjero tarda 3 horas en hacer vino y el local solo 2, la única manera de que lo haga más barato es que su salario sea menor: su tipo de cambio debe subir lo necesario para darle competitividad al vino; en reflejo, el tipo de cambio local se aprecia y el vino local, medido en dólares, queda más caro que el extranjero, **a pesar de que la vitivinicultura local es más eficiente**. Un sector sin problemas de eficiencia queda desplazado por precios. Lo que condena a la vitivinicultura local es el modelo de ventajas comparativas y, en particular, la altísima productividad del país local en queso (6 veces más: 1 hora contra 6).\n\nTraducido al modelo de Diamand en la Argentina: la productividad de la tierra es tan alta respecto de la media mundial que el tipo de cambio de equilibrio, el **«Tipo de Cambio Pampeano»**, condena a la industria a ser más cara que la extranjera, incluso si fuese más eficiente. La industria local sería la vitivinicultura del modelo de Ricardo. El desequilibrio que observa Diamand está en las **productividades relativas**: la producción de alimentos en la Argentina es muy superior a la del resto del mundo y allí están las ventajas comparativas. El tipo de cambio pampeano que permite exportar alimentos no alcanza para que la industria sea competitiva (dados sus costos en pesos, necesitaría uno más alto), y el país debe abastecerse de manufacturas importadas: la inserción por ventajas comparativas lleva a exportar alimentos e importar manufacturas.\n\nPor eso Diamand habla de **tipos de cambio múltiples** para devolver competitividad a la industria: un tipo de cambio más alto para la industria desalienta las importaciones (como el dólar turista o solidario) y favorece las exportaciones. Otro modo es subsidiar la industria con **retenciones** a las exportaciones primarias, combinación de efecto relativamente similar.\n\n### 1. La determinación del tipo de cambio exclusivamente con transacciones de bienes\n\nLas ventajas comparativas determinan el patrón de especialización, que se deriva de los costos de oportunidad calculados mediante los costos o precios relativos. El modelo permite comercio mutuamente beneficioso aunque un país tenga ventaja absoluta en ambos bienes. Con costos de oportunidad constantes, el país extranjero requería más trabajo que el local tanto para el vino (3 horas contra 2) como para el queso (6 contra 1), pero tenía ventaja comparativa en vino. ¿Cómo lograba que su vino fuera más barato? Solo con un salario menor, lo que puede expresarse en el tipo de cambio: los salarios pueden ser nominalmente iguales en moneda nacional, pero un tipo de cambio favorable al país local hace que, en una misma moneda, el extranjero sea menor (ejemplo: 100 pesos, 100 rupias y 0,5 pesos por rupia).\n\nEl tipo de cambio es el que permite que se «concreten» las posibilidades de aprovechar las ventajas comparativas entre economías capitalistas. ¿Qué garantiza que alcance ese valor? Si los salarios son iguales y el tipo de cambio es 1, los productos locales serán todos más baratos y el comercio irá en una sola dirección: déficit y pérdida de reservas para el extranjero y lo contrario para el local. Esos movimientos de reservas modificarán el tipo de cambio hasta lograr el equilibrio comercial: su función es que las productividades relativas traducidas a precios permitan a cada país especializarse en su ventaja comparativa. Con el vino (2 horas local, 3 extranjero), un tipo de cambio de 1,5 iguala los precios; para que el extranjero exporte vino debe ser al menos 1,6. Con el queso (1 contra 6), los precios se igualan a 6. El tipo de cambio debe situarse entre 1,6 y 5,9, dentro del intervalo de las ventajas absolutas del país local.\n\n**Salario, ventaja comparativa y tipo de cambio.** Ese intervalo coincide con aquel en que debían estar los salarios relativos, porque con libre comercio los precios de los transables tienden a igualarse en una misma moneda y lo que no se iguala son los no transables, básicamente el salario. Por eso Amico y Fiorito expresan que **toda devaluación es una caída del salario** en términos internacionales y reales.\n\n### 2. El tipo de cambio en estructuras productivas desequilibradas (EPD)\n\nEl tipo de cambio en un modelo de ventajas comparativas compensa las diferencias de productividades y equilibra la balanza comercial. Ahora, un caso en que un país debe dejar de producir en un sector **pese a tener la misma eficiencia** que el otro, a causa de la alta productividad de otro sector. Dos países, dos productos: manufacturas y alimentos; igual productividad en manufacturas, pero el país local más productivo en alimentos, por lo que se especializa en ellos. El tipo de cambio debe hacer que las manufacturas extranjeras sean más baratas que las locales: es el tipo de cambio el que encareció las manufacturas locales, no su productividad. El país local queda «condenado a importar y no producir manufacturas» por la alta productividad relativa de su sector de alimentos.\n\nEsta es la explicación de **Diamand (1972)** sobre las EPD: un país con un sector de productividad claramente mayor que la mundial, basada en la abundancia y calidad de recursos naturales, cuyo tipo de cambio de equilibrio lleva a exportar bienes primarios e importar manufacturas aunque estas se hagan con la misma productividad que en el resto del mundo. Amico y Fiorito (2011) actualizan estas ideas (sus puntos V, sobre la Ley de Thirlwall, y VI exceden el curso y quedan como optativos). Diamand señala que el problema se aplica a cualquier país en desarrollo con ventajas comparativas estáticas o naturales, aunque su inspiración fue el caso argentino, donde el equilibrio externo se logra con un tipo de cambio pampeano relativamente bajo (apreciado), ligado a la gran ventaja en productos de clima templado.\n\n**Reflexión:** no implica que Diamand sostuviera que en los años 60 la industria argentina tenía la productividad de los países desarrollados; indica que el tipo de cambio de equilibrio la haría más cara aun con la misma productividad. La brecha de precios de los años 60 y 70 en contra de la manufactura argentina se componía en parte de menor productividad y en parte del tipo de cambio pampeano.\n\nAsí, la Argentina pudo por muchos años tener un tipo de cambio bajo con el que las exportaciones de alimentos obtenían divisas suficientes para comprar manufacturas importadas: el comportamiento estilizado del **modelo agroexportador**. ¿Por qué no integrarse al mundo y obtener los beneficios de la especialización? La postura de Diamand de no acoplarse pasivamente al mercado internacional se relaciona con el vínculo inexorable entre **industrialización y desarrollo**: todos los países desarrollados son industrializados, y ningún país sin un importante componente industrial logró desarrollarse.\n\nAgotado el modelo agroexportador, la Argentina y la región emprendieron la **industrialización por sustitución de importaciones (ISI)**, sustentada en las ideas de la CEPAL sobre el deterioro de los términos de intercambio. Diamand escribe desde mediados de los 60, con escasez cíclica de divisas y ciclos de **stop and go**: cuando no alcanzaban las divisas se devaluaba y se inducía una recesión que bajaba las importaciones y liberaba saldos exportables. Esta dinámica rigió entre los 50 y mediados de los 70, con relaciones externas centradas en el comercio y la inversión extranjera y poca relevancia de los flujos financieros.\n\nEn libre comercio, sin costos de transporte, los precios relativos domésticos de los transables son iguales en todos los países e iguales a los internacionales; cada país asigna sus recursos según esos precios. Para la Argentina indicarían una clara especialización (no necesariamente total) en alimentos y primarios, como en el modelo agroexportador.\n\nUna solución al sesgo antimanufactura sería un **tipo de cambio alto** (que iguale los precios de las manufacturas de igual productividad), pero presenta dos problemas:\n\nI. **Problemas redistributivos** (salarios bajos y rentas extraordinarias en primarios), que se acentúan cuanto más concentrada esté la propiedad del recurso y menos encadenamientos tenga: a) en el extremo de mayor impacto social negativo, los **enclaves mineros** con bajos encadenamientos y poca apropiación pública de la renta, además de recursos no renovables con efectos intergeneracionales; b) en el opuesto, un modelo agrario con distribución equitativa de la tierra, donde los altos precios primarios darían altos ingresos a toda la población; c) escenarios intermedios, con menor concentración y mayores encadenamientos: desde una mirada optimista, el **modelo sojero argentino**, con menor concentración que la minería, encadenamientos en maquinaria agrícola, agroquímicos y servicios, y cierta apropiación estatal de la renta mediante retenciones.\n\nII. Con ese tipo de cambio las manufacturas serían competitivas y habría **superávit comercial permanente**, difícil de sostener por razones cambiarias y monetarias (más allá de la crítica de Hume a los mercantilistas y de la tendencia del tipo de cambio al equilibrio).\n\nAdemás, algunas teorías indican que en el mediano y largo plazo el tipo de cambio real tiende al equilibrio y no modifica en forma permanente la estructura dentro de los transables, sino la composición entre transables y no transables. (Si se devalúa desde un tipo de cambio de desequilibrio, como el de los 90, hacia uno de equilibrio, la transformación sí es permanente; si la devaluación es excesiva, el superávit y la acumulación de reservas pueden generar inflación que baje el tipo de cambio real, o, con tipo flotante, una apreciación nominal de vuelta al equilibrio.) En los 90, con tipo de cambio bajo, los transables no eran competitivos salvo los primarios y gran parte de la inversión fue a servicios. Para alterar un patrón productivo en una economía capitalista hay que modificar los incentivos y la **tasa de ganancia** para que los agentes reasignen factores: **distorsionar los precios relativos** respecto del vector internacional, con tipos de cambio diferenciados (entre primarios y manufacturas en exportaciones, o entre consumo, insumos y capital en importaciones) o con política comercial en frontera (impuestos a importaciones y exportaciones; en la ISI, incluso prohibición de importar lo producido localmente). Encareciendo las manufacturas con aranceles y abaratando los alimentos con retenciones mejora la ganancia industrial. Pero como el agro es relativamente más productivo, el grueso de las exportaciones seguirá siendo suyo: un serio problema entre los 50 y los 70, con producción ligada a la frontera agrícola, y luego, pese a una fuerte expansión, sin superar la falta de divisas para un crecimiento continuo (aunque desde los 80 se exportaron commodities industriales).\n\n### 3. Debatiendo el enfoque EPD: Argentina en la primera década del siglo XXI\n\nPeríodo apto para pensar desde las EPD por la baja vinculación financiera con el mundo y el intento de industrializar. La expansión se ligó a una **alta elasticidad de las importaciones respecto del PBI**: pese a los altos precios de las materias primas el saldo comercial disminuyó y reapareció la **restricción externa**. Diamand (1972), bibliografía opcional, define la EPD como una estructura de dos sectores con niveles de precios diferentes: el primario, que trabaja a precios internacionales, y el industrial, a costos y precios considerablemente superiores. Da lugar a un modelo caracterizado por la crónica limitación del sector externo sobre el crecimiento: el crecimiento industrial requiere cada vez más divisas, pero el alto nivel de precios impide que la industria exporte; a diferencia de los países industriales, donde la industria autofinancia sus divisas, aquí su abastecimiento queda a cargo del agro, limitado por la producción o por la demanda mundial. Al principio la sustitución ahorra divisas; luego se hace más lenta y apenas neutraliza las importaciones de nuevos productos (automóviles, televisión, hilados sintéticos). Se abre una divergencia entre una industria consumidora de divisas y un agro proveedor de crecimiento lento: es la causa de las crisis de balanza de pagos y el principal limitador del crecimiento; cada expansión hace crecer las importaciones y, agotadas las reservas, se devalúa.\n\nComo la Argentina optó por desendeudarse y minimizar el capital financiero, su fuente de divisas depende del comercio; no es casual que se reeditaran los libros de Diamand y volvieran a circular los tipos de cambio diferenciales (de hecho, aranceles y retenciones ya lo son).\n\n**Visión ortodoxa:** liberalizando el comercio con un tipo de cambio único y de equilibrio, nos especializaríamos en las ventajas comparativas, obtendríamos manufacturas a precios internacionales y aumentaría el bienestar; ante un crecimiento incompatible con las divisas, se devalúa para aumentar exportaciones y bajar importaciones. La restricción externa aparece por tener una economía semicerrada que quiere crecer con tipo de cambio apreciado (salarios reales altos). Pero en los países en desarrollo las **devaluaciones suelen ser contractivas**: los efectos redistributivos pesan más que los expansivos, y el equilibrio se logra por caída del consumo e importaciones y aparición de saldos exportables, como en el stop and go, aunque en libre comercio (en el extremo, con libre comercio y tipo flotante nunca habría restricción externa).\n\n**Diamand** se opone al libre comercio: para evitar devaluaciones contractivas hay que operar sobre **incentivos de precios** (reintegros, aranceles, retenciones) y **políticas activas** (tecnológicas, de capacitación, de infraestructura) que profundicen la sustitución de importaciones y logren exportar manufacturas. Desde la heterodoxia, apertura y tipo de cambio de equilibrio condenan a una estructura primarizada, con salarios bajos y alta exclusión; la evidencia de que los sectores más innovadores pagan mejores salarios corrobora que la industrialización y la diversificación son el camino del desarrollo. La restricción externa se enfrenta reduciendo el coeficiente importaciones/PBI, con mayor restricción de importaciones si hace falta, y aumentando las exportaciones industriales; su implementación es compleja porque la protección introduce un **sesgo antiexportador** y la inversión no siempre responde en los plazos necesarios. De fondo está el debate protección‑libre comercio: la ortodoxia recomienda asignar recursos según precios internacionales; la heterodoxia, que una precondición del desarrollo es alterar esa señal para volcar recursos a la industria (en palabras de Aldo Ferrer, que el campo sea un motor del desarrollo local proveyendo divisas, y no un segmento de la economía internacional que nos coloque como proveedor de alimentos).\n\n### 4. Más allá de las políticas cambiarias\n\nAlterar los precios relativos es solo una **condición necesaria**: el cambio estructural requiere políticas activas complejas, sectoriales y horizontales, con fuerte interacción público‑privada e institucional. Lleva a la discusión sobre políticas comerciales, industriales y de innovación, en las que divergieron América Latina y Asia. Énfasis especial en las políticas tecnológicas, el **Sistema Nacional** de List: la producción de conocimiento está sujeta a muchas fallas de mercado (bien público, externalidades, información asimétrica, economías de escala, patentes y monopolios, incertidumbre), por lo que los precios no llevan a resultados socialmente deseables y se necesita intervención. La disputa por las ramas más sofisticadas se da entre **Sistemas Nacionales de Innovación**, y serán cruciales los recursos, el diseño de políticas y la articulación de agentes, junto con precios relativos y condiciones macroeconómicas adecuadas. En síntesis, el cambio estructural y el desarrollo no se garantizan con **macroprecios** (tipo de cambio o precios relativos vía política comercial): requieren un complejo andamiaje, una estrategia coherente en diversos planos y persistencia en el tiempo."}}}, "EI03-c7": {"extras": [{"ejercicios": [], "leido": false, "resumen": "## Capítulo 9. Los instrumentos de la política comercial\n\nEn los capítulos anteriores se respondió «¿por qué comercian las naciones?». Esa respuesta es más interesante si ayuda a responder «¿cómo debería ser la política comercial de una nación?»: ¿debería Estados Unidos aplicar un arancel o una cuota para proteger su industria automovilística frente a Japón y Corea del Sur? ¿Quién gana y quién pierde? ¿Compensan los beneficios a los costes? El capítulo analiza las políticas de los gobiernos respecto del comercio (impuestos sobre algunas transacciones, subsidios a otras, límites legales al valor o volumen de importaciones, entre otras) y proporciona un marco para entender los efectos de sus instrumentos más importantes.\n\n**Objetivos de aprendizaje:** evaluar costes y beneficios de los aranceles, sus efectos sobre el bienestar y sus ganadores y perdedores; analizar los subsidios a la agricultura y a la exportación y su efecto sobre el comercio agrícola de Estados Unidos y la Unión Europea; reconocer el efecto de las restricciones voluntarias a la exportación (RVE) sobre importadores y exportadores y compararlas con aranceles y cuotas.\n\n### El análisis básico del arancel\n\nUn **arancel** es un impuesto aplicado cuando se importa un bien. Los **aranceles fijos** son una cantidad por unidad (tres dólares por barril de petróleo); los **ad valorem**, un porcentaje del valor (el 25 % del valor de los camiones importados a Estados Unidos). En ambos casos aumentan el coste de llevar los bienes a un país.\n\nSon la forma más antigua de política comercial y fueron tradicionalmente una fuente de ingresos (hasta el impuesto sobre la renta, el Gobierno de Estados Unidos obtenía de ellos la mayor parte de sus ingresos). Pero su verdadera finalidad ha sido proteger sectores concretos: a principios del siglo XIX el Reino Unido protegía su agricultura con las **Leyes de Cereales** (*Corn Laws*); a fines del siglo, Alemania y Estados Unidos protegían sus nuevas industrias. Su importancia disminuyó porque hoy los Estados prefieren **barreras no arancelarias**, como las **cuotas de importación** (límites a la cantidad importada) y las **restricciones a la exportación** (límites a lo exportado, impuestos normalmente por el exportador a pedido del importador). Aun así, entender el arancel es la base para entender las demás políticas.\n\nEn los capítulos 3 a 8 se usó el **equilibrio general**; pero en muchos casos las políticas dirigidas a un sector pueden entenderse sin detallar sus repercusiones en el resto de la economía, con un análisis de **equilibrio parcial**.\n\n**Oferta, demanda y comercio en una sola industria.** Dos países, nuestro país y el extranjero, producen y consumen trigo, transportable sin coste, en industrias competitivas; se supone que el tipo de cambio no se ve afectado y se expresan los precios en moneda nacional. Si sin comercio el trigo es más caro en nuestro país, al abrirse el comercio el trigo fluye desde el extranjero, lo que sube su precio allí y lo baja aquí hasta eliminar la diferencia. Se definen dos curvas: la **demanda de importaciones** de nuestro país, exceso de lo que demandan los consumidores sobre lo que ofrecen los productores nacionales, y la **oferta de exportaciones** del extranjero, exceso de lo que ofrecen sus productores sobre lo que demandan sus consumidores. La demanda de importaciones tiene pendiente negativa (al subir el precio, los consumidores demandan menos y los productores ofrecen más) y corta el eje de precios en el precio sin comercio (Figura 9.1). La oferta de exportaciones tiene pendiente positiva y corta el eje en el precio extranjero sin comercio (Figura 9.2). El **equilibrio mundial** se da donde la demanda de importaciones iguala la oferta de exportaciones (Figura 9.3): demanda nacional – oferta nacional = oferta extranjera – demanda extranjera, es decir, demanda mundial = oferta mundial.\n\n**Efectos de un arancel.** Para quien comercia, un arancel es como un coste de transporte: con un impuesto de dos dólares por tonelada, no se transportará trigo salvo que la diferencia de precios sea de al menos dos dólares. Con un arancel fijo *t* (Figura 9.4), si no se envía trigo hay exceso de demanda en nuestro país y exceso de oferta en el extranjero; el precio sube aquí y baja allí hasta que la diferencia es *t*. El arancel eleva el precio nacional hasta P_T y reduce el extranjero hasta P*_T = P_T – t. Aquí los productores ofrecen más y los consumidores demandan menos, por lo que se importa menos; allí la oferta cae y la demanda sube, y se exporta menos. El volumen comerciado cae de Q_W (libre comercio) a Q_T. El aumento del precio nacional es menor que el arancel, porque parte se refleja en una reducción del precio de exportación extranjero. En la práctica ese efecto suele ser muy pequeño: un **país pequeño** tiene una cuota de mercado menor y su reducción de importaciones casi no afecta al precio mundial. En ese caso (Figura 9.5) el arancel aumenta el precio en la totalidad del arancel, de P_W a P_W + t; la producción sube de S¹ a S², el consumo cae de D¹ a D² y las importaciones disminuyen.\n\n**Medición de la magnitud de la protección.** Un arancel aumenta el precio recibido por los productores nacionales, a menudo su principal objetivo. La protección se expresa en porcentaje del precio con libre comercio (una cuota sobre el azúcar podría subir un 35 % el precio que reciben los productores estadounidenses). Parece inmediato: el tipo ad valorem mide la protección, y un arancel fijo dividido por el precio sin arancel da su equivalente. Pero hay dos problemas. Primero, si el supuesto de país pequeño no se cumple, parte del efecto reduce los precios extranjeros. Segundo, los aranceles pueden tener efectos muy diferentes en las distintas **fases de producción**. Un automóvil cuesta 8.000 dólares en el mercado mundial y sus componentes 6.000. Un país que quiere desarrollar el ensamblaje pone un arancel del 25 % a los autos importados: los ensambladores pueden cobrar 10.000; antes solo operarían si ensamblaban por 2.000 o menos, ahora aun si cuesta 4.000. El arancel del 25 % da una **tasa de protección efectiva del 100 %**. Otro país, que ya ensambla, pone un arancel del 10 % a los componentes (de 6.000 a 6.600): el ensamblaje solo conviene si se hace por 1.400; los fabricantes de componentes reciben protección positiva, pero los ensambladores, **protección negativa** del –30 % (–600/2.000). Así se mide la protección efectiva real; las políticas para promover el desarrollo (capítulo 11) generan a menudo tasas mucho mayores que los propios aranceles. (Formalmente, la tasa de protección efectiva es (V_T – V_W)/V_W, siendo V_W el valor añadido a precios mundiales y V_T el valor añadido con las políticas comerciales.)\n\n### Los costes y los beneficios de un arancel\n\nUn arancel sube el precio en el país importador y lo baja en el exportador: los consumidores pierden en el importador y ganan en el exportador; los productores ganan en el importador y pierden en el exportador; el Estado que lo impone obtiene ingresos. Para cuantificarlos se usan el excedente del consumidor y del productor.\n\n**El excedente del consumidor y del productor.** El **excedente del consumidor** es la diferencia entre el precio que se paga y el que se habría estado dispuesto a pagar (dispuesto a pagar 8 dólares por un quintal que cuesta 3: excedente de 5). Se obtiene de la curva de demanda: si el precio máximo para comprar 10 unidades es 10 dólares, la décima unidad vale 10; si para vender 11 hay que bajar a 9, la undécima vale 9. A 9 dólares, la undécima no da excedente, la décima da 1 y la novena (valorada en 12) da 3 (Figura 9.6). En general, es el área bajo la curva de demanda y por encima del precio; si el precio sube de P¹ a P², el excedente cae en el área *b* y queda en *a* (Figura 9.7). El **excedente del productor** es análogo: quien podría vender a 2 y vende a 5 gana 3; es el área sobre la curva de oferta y bajo el precio; si el precio sube, aumenta en el área *d* (Figura 9.8). Más importante que las dificultades técnicas es si estos excedentes miden exactamente la ganancia social; los beneficios y costes adicionales no contenidos en ellos están en el centro de la justificación de la política comercial activa (capítulo 10).\n\n**Medición de los costes y beneficios.** El arancel sube el precio nacional de P_W a P_T y baja el extranjero a P*_T; la producción sube de S¹ a S² y el consumo baja de D¹ a D² (Figura 9.9). Los **productores** ganan el área *a*. Los **consumidores** pierden *a + b + c + d*. El **Estado** recauda el arancel por las importaciones, *c + e*. Como afectan a personas distintas, la evaluación depende del peso que se dé a un dólar de cada grupo: no es lo mismo si los productores son ricos propietarios y los consumidores más pobres, o si el bien es un lujo de los acomodados producido por trabajadores de bajos salarios; y el Estado puede financiar servicios vitales o derrocharlos «en tapas de retrete a mil dólares cada una». Aun así, es habitual suponer que, en el margen, un dólar vale lo mismo para todos. El **coste neto** es: pérdida de los consumidores – ganancia de los productores – ingresos del Estado = (a + b + c + d) – a – (c + e) = **b + d – e**.\n\nHay dos **triángulos** de pérdida y un **rectángulo** de ganancia. Los triángulos representan la **pérdida de eficiencia**, porque el arancel distorsiona los incentivos a consumir y producir: *b* es la **pérdida por distorsión de la producción** (se produce demasiado) y *d* la **pérdida por distorsión del consumo** (se consume demasiado poco). El rectángulo *e* es la **ganancia de la relación de intercambio**, porque el arancel reduce los precios de exportación extranjeros. Esta ganancia depende de la capacidad de bajar el precio extranjero; en el país pequeño desaparece y el arancel reduce claramente el bienestar: induce a actuar como si las importaciones fueran más caras de lo que son, de modo que se reduce el consumo hasta que la unidad marginal vale el precio con arancel y se produce en el país lo que podría comprarse más barato afuera (Figura 9.10). En el país pequeño, los costes exceden sin ambigüedad a los beneficios.\n\n**Aranceles a larga distancia.** Además, los aranceles tienen costes indirectos: provocan represalias que perjudican a los exportadores del país que los impuso; son difíciles de eliminar aunque las condiciones cambien, porque organizan políticamente a pequeños grupos protegidos; y animan a eludirlos de formas creativas pero inútiles. El **«impuesto del pollo»**, en vigor desde hace 47 años, fue la represalia de la administración Johnson contra un arancel europeo al pollo estadounidense a principios de los 60: un arancel del 25 % a los vehículos comerciales ligeros, dirigido a Alemania (Volkswagen exportaba muchos). Se eliminaron casi todos los aranceles iniciales salvo estos dos; Volkswagen dejó de producir esos vehículos, pero los «tres grandes» estadounidenses presionaron para mantenerlo frente a los camiones japoneses, que pasaron a fabricarse en Estados Unidos (Subaru, antes, atornillaba dos asientos de plástico a la caja de su pickup BRAT). Al final, la afectada es **Ford**: produce en Europa la furgoneta Transit Connect, cuya demanda creció en ciudades estadounidenses con el petróleo caro; para evitar el 25 % le instala ventanillas, asientos traseros y cinturones, de modo que entra como vehículo de pasajeros con un arancel del 2,5 %, y en Baltimore los retira y pone paneles de metal antes de entregarla.\n\n### Otros instrumentos de la política comercial\n\nMuchas intervenciones adoptan otras formas: subsidios a la exportación, cuotas de importación, restricciones voluntarias de exportación y exigencias de contenido nacional. Entendidos los aranceles, no es difícil entenderlos.\n\n**Los subsidios a la exportación: teoría.** Un **subsidio a la exportación** es un pago a quien vende un bien en el extranjero; puede ser fijo o ad valorem. Los vendedores exportan hasta que el precio nacional excede al extranjero en el monto del subsidio. Sus efectos sobre los precios son opuestos a los del arancel (Figura 9.11): el precio sube en el país exportador de P_W a P_S y baja en el importador a P*_S, por lo que la suba es menor que el subsidio. En el exportador, los consumidores pierden *a + b*, los productores ganan *a + b + c* y el Estado gasta *b + c + d + e + f + g*. La pérdida neta es *b + d + e + f + g*: *b* y *d* son distorsiones de producción y consumo como las del arancel; y, a diferencia del arancel, el subsidio **empeora la relación de intercambio** al bajar el precio de exportación, con pérdidas *e + f + g*. Un subsidio a la exportación conlleva, sin ambigüedad, un coste que supera sus beneficios.\n\n**Caso de estudio: la Política Agrícola Común de la Unión Europea.** En 1957 Alemania, Francia, Italia, Bélgica, Holanda y Luxemburgo crearon la Comunidad Económica Europea, hoy Unión Europea. Sus dos mayores efectos en política comercial fueron eliminar los aranceles entre sus miembros (una unión aduanera) y convertir su política agrícola en un gigantesco programa de subsidios a la exportación. La **PAC** comenzó garantizando precios elevados a los agricultores mediante compras cuando los precios caían bajo niveles de apoyo, con aranceles que compensaban la diferencia con los precios mundiales. Pero desde 1970 los precios de apoyo fueron tan altos que Europa, que con libre comercio sería importadora neta de muchos productos, producía más de lo que se consumía; a fines de 1985 había almacenado 780.000 toneladas de ternera, 1,2 millones de mantequilla y 12 millones de trigo. Para no acumular stocks sin límite pasó a subsidiar exportaciones. El precio de apoyo se fija por encima del mundial y del que igualaría oferta y demanda sin importaciones; las exportaciones subsidiadas bajan el precio mundial y aumentan el subsidio necesario (Figura 9.12). Se estimó que el coste para los consumidores excedía las ventajas de los productores en casi 30.000 millones de dólares en 2007. Por la fuerza política de los agricultores, la PAC encontró pocos desafíos internos; la presión vino de Estados Unidos y otros exportadores de alimentos, cuyas exportaciones bajaban de precio. En 2009 costó a los contribuyentes casi 76.000 millones de dólares, sin contar lo que pagan los consumidores; los subsidios representan cerca del 36 % del valor de la producción agrícola europea, el doble que en Estados Unidos. Las reformas recientes buscan pagos directos no vinculados a la cantidad producida, que deberían reducir precios y producción.\n\n**Las cuotas de importación: teoría.** Una **cuota de importación** es una restricción directa de la cantidad importable, impuesta normalmente con licencias (Estados Unidos tiene una cuota de queso: solo algunas compañías pueden importar un máximo según lo importado en el pasado; en el azúcar y la ropa, el derecho se da a los gobiernos exportadores). Es un error creer que limitan las importaciones sin subir los precios: al precio inicial, la demanda excede la oferta nacional más las importaciones y el precio sube hasta equilibrar. Una cuota aumenta el precio en lo mismo que un arancel que limite las importaciones al mismo nivel (salvo con monopolio nacional, ver apéndice). La diferencia es que **el Estado no recibe ingresos**: lo que sería recaudación lo obtienen quienes reciben las licencias, que compran importaciones y las revenden más caras: las **rentas de la cuota**. Es crucial saber quién las obtiene: si se asignan a gobiernos exportadores, la transferencia al exterior hace la cuota sustancialmente más costosa que el arancel equivalente.\n\n**Caso de estudio: la cuota del azúcar en Estados Unidos.** Como en Europa, un precio garantizado por el Gobierno Federal mantiene los precios por encima del mercado mundial, pero aquí la oferta nacional no excede la demanda, y se alcanza el precio objetivo con una cuota. Los derechos de vender se asignan a gobiernos extranjeros, de modo que las rentas van a extranjeros. Previsión para 2013 (Figura 9.13), suponiendo país pequeño: la cuota limita las importaciones a unos 3 millones de toneladas y el precio interno (426 dólares por tonelada) es un 35 % superior al mundial (275); con libre comercio las importaciones crecerían un 66 %. Los consumidores pierden *a + b + c + d* = 884 millones de dólares; los productores ganan *a* = 272 millones; la distorsión de la producción *b* es de 68 millones y la del consumo *d* de 91; las rentas para gobiernos extranjeros *c*, de 453 millones. La pérdida neta es *b + c + d* = 612 millones anuales, la mayor parte porque los extranjeros obtienen los derechos. Ilustra la tendencia de la protección a beneficiar mucho a pocos a costa de muchos que pagan poco: unos 8 dólares por persona, poco más de 30 por familia; el votante medio no sabe que la cuota existe. Para los productores es de vida o muerte: la industria emplea unos 6.500 trabajadores, y la cuota equivale a un subsidio implícito de unos 42.000 dólares por trabajador. Los críticos hablan del coste por empleo «salvado»: sin la cuota se perdería el 32 % de esos empleos, lo que da 432.000 dólares por puesto salvado. Considerando la refinación y los dulces, los costes son aún mayores, y el azúcar caro reduce el empleo de las industrias que lo usan: según el Departamento de Comercio, por cada empleo salvado en producción y procesamiento se pierden tres en la confitería. La cuota **pierde** empleos.\n\n**Restricciones voluntarias de la exportación.** Una **RVE** o acuerdo de restricción voluntaria (ARV) es una cuota impuesta por el país exportador en vez del importador («bienvenidos al burocrático mundo de la política comercial, donde todo tiene siglas de tres letras»). El ejemplo más famoso es el límite de Japón a sus exportaciones de autos a Estados Unidos desde 1981. Se imponen a pedido del importador y el exportador las acepta para evitar otras restricciones. Por sus ventajas políticas y legales han sido a veces preferidas, pero económicamente equivalen a una cuota con licencias asignadas a gobiernos extranjeros: **siempre son más caras** para el importador que un arancel equivalente, porque lo que serían ingresos se convierte en rentas de extranjeros. Un estudio de las tres principales RVE de Estados Unidos (textiles y confección, acero y automóviles) concluyó que las rentas de los extranjeros eran unos dos tercios del coste para los consumidores: el grueso es transferencia más que pérdida de eficiencia. El acuerdo multilateral más famoso fue el **Acuerdo Multifibras**, que limitó las exportaciones textiles de 22 países hasta 2005; estos acuerdos se llaman **AOM** (acuerdos de ordenación de mercado).\n\n**Caso de estudio: los automóviles japoneses.** En los 60 y 70 la industria estadounidense estaba aislada porque sus consumidores, en un país grande y con gasolina barata, preferían autos más grandes. En 1979 el alza del petróleo y la escasez de gasolina desplazaron la demanda a autos pequeños, y los japoneses, con costes en descenso, la abastecieron. Ante la presión política, Estados Unidos,
